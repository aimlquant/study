<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img"><title>분기 말·공시·결정 시각과 EPS의 이용 가능 구간</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#173b70"/></marker></defs><style>text{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', NanumGothic, Inter, system-ui, sans-serif;fill:#173b70;font-size:19px}.small{font-size:16px}.mid{text-anchor:middle}.end{text-anchor:end}</style><rect width="1000" height="430" fill="white"/><text x="15" y="75" class="small">사건 시각</text><path d="M150 70 L960 70" stroke="#173b70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="15" y="215" class="small">공개 시각</text><path d="M150 210 L960 210" stroke="#173b70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="15" y="345" class="small">결정 시각</text><path d="M150 340 L960 340" stroke="#173b70" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="170" y="165" width="370" height="80" rx="7" fill="#eff5fb" stroke="#173b70"/><rect x="540" y="165" width="320" height="80" rx="7" fill="#dce8f5" stroke="#173b70"/><text x="355" y="212" class="mid">이전 EPS $4.00</text><text x="700" y="212" class="mid">새 EPS $4.40</text><path d="M540 100 L540 320" stroke="#173b70" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M860 150 L860 280" stroke="#173b70" stroke-width="2" fill="none" stroke-dasharray="5 4"/><path d="M185 90 L540 155" stroke="#173b70" stroke-width="2" fill="none" stroke-dasharray="5 4"/><text x="355" y="116" class="small mid">보고 지연</text><circle cx="185" cy="70" r="7" fill="#173b70"/><text x="185" y="40" class="small mid">3/31 Q1 말</text><text x="540" y="135" class="small mid">5/7 10-Q 공시</text><text x="860" y="135" class="small mid">6/12 수정</text><circle cx="330" cy="340" r="7" fill="#173b70"/><path d="M330 250 L330 332" stroke="#173b70" stroke-width="2" fill="none" stroke-dasharray="3 4"/><text x="330" y="376" class="small mid">4/15 결정</text><text x="330" y="410" class="small mid">4.00 / 50 = 8.0%</text><circle cx="690" cy="340" r="7" fill="#173b70"/><path d="M690 250 L690 332" stroke="#173b70" stroke-width="2" fill="none" stroke-dasharray="3 4"/><text x="690" y="376" class="small mid">5/10 결정</text><text x="690" y="410" class="small mid">4.40 / 50 = 8.8%</text></svg>
