<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 510" role="img" aria-label="체결 흐름과 호가 대기량의 구분"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f2c59"/></marker></defs><style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f2c59;font-size:23px;text-anchor:middle}.node{fill:#f1f5f9;stroke:#0f2c59;stroke-width:1.5}.a{fill:none;stroke:#0f2c59;stroke-width:2;marker-end:url(#ar)}</style><rect class="node" x="15" y="25" width="300" height="150" rx="8"/><text x="165.0" y="74.0" style="font-size:23px">이미 체결</text><text x="165.0" y="108.0" style="font-size:23px">매수 주도 100주</text><text x="165.0" y="142.0" style="font-size:23px">매도 주도 60주</text><rect class="node" x="420" y="25" width="270" height="150" rx="8"/><text x="555.0" y="91.0" style="font-size:23px">부호 거래량 40주</text><text x="555.0" y="125.0" style="font-size:23px">총 거래량 160주</text><rect class="node" x="790" y="25" width="245" height="150" rx="8"/><text x="912.5" y="91.0" style="font-size:23px">정규화 OFI</text><text x="912.5" y="125.0" style="font-size:23px">40 ÷ 160 = 0.25</text><path class="a" d="M315 100L418 100"/><path class="a" d="M690 100L788 100"/><rect class="node" x="15" y="315" width="300" height="150" rx="8"/><text x="165.0" y="364.0" style="font-size:23px">호가창에 대기</text><text x="165.0" y="398.0" style="font-size:23px">매수 100주</text><text x="165.0" y="432.0" style="font-size:23px">매도 50주</text><rect class="node" x="420" y="315" width="270" height="150" rx="8"/><text x="555.0" y="381.0" style="font-size:23px">대기량 차이 50주</text><text x="555.0" y="415.0" style="font-size:23px">대기량 합 150주</text><rect class="node" x="790" y="315" width="245" height="150" rx="8"/><text x="912.5" y="381.0" style="font-size:23px">대기열 불균형</text><text x="912.5" y="415.0" style="font-size:23px">50 ÷ 150 = 1/3</text><path class="a" d="M315 390L418 390"/><path class="a" d="M690 390L788 390"/></svg>