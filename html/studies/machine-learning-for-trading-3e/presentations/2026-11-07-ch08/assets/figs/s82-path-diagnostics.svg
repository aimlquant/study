<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" role="img" aria-label="분산비와 프랙털 효율의 작은 계산"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f2c59"/></marker></defs><style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f2c59;font-size:23px;text-anchor:middle}.node{fill:#f1f5f9;stroke:#0f2c59;stroke-width:1.5}.a{fill:none;stroke:#0f2c59;stroke-width:2;marker-end:url(#ar)}</style><rect class="node" x="15" y="20" width="460" height="140" rx="8"/><text x="245.0" y="64.0" style="font-size:23px">하루 분산 1 → 이틀 독립 기준 2</text><text x="245.0" y="98.0" style="font-size:23px">실제 이틀 분산 3 → 분산비 1.5</text><text x="245.0" y="132.0" style="font-size:23px">실제 이틀 분산 1 → 분산비 0.5</text><rect class="node" x="555" y="20" width="470" height="140" rx="8"/><text x="790.0" y="81.0" style="font-size:23px">분산비는 분산의 시간 집계 비교</text><text x="790.0" y="115.0" style="font-size:23px">프랙털 효율은 순이동 ÷ 경로 길이</text><polyline points="80,350 240,285 400,220" fill="none" stroke="#2563eb" stroke-width="3"/><text x="80" y="332" style="font-size:21px">100</text><text x="240" y="267" style="font-size:21px">101</text><text x="400" y="202" style="font-size:21px">102</text><text x="240" y="414" style="font-size:22px">순이동 2 ÷ 거리 2 = 1</text><polyline points="610,350 770,220 930,350" fill="none" stroke="#2563eb" stroke-width="3"/><text x="610" y="332" style="font-size:21px">100</text><text x="770" y="202" style="font-size:21px">102</text><text x="930" y="332" style="font-size:21px">100</text><text x="770" y="414" style="font-size:22px">순이동 0 ÷ 거리 4 = 0</text></svg>