<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1100" role="img" aria-labelledby="t d"><title id="t">세 단계 필터</title><desc id="d">원본의 모든 블록·라벨·연결을 유지하고 세로로 배치했다. 레이블에서 기간 정렬·동인 가설·역할 분리를 거쳐 특성 명세로 가며, 공통 설계 손잡이는 세 필터 모두에 적용된다.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f2c59"/></marker></defs><style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f2c59;text-anchor:middle;font-size:24px}.box{fill:#f1f5f9;stroke:#0f2c59;stroke-width:1.5}.a{fill:none;stroke:#0f2c59;stroke-width:2;marker-end:url(#arr)}.dash{stroke-dasharray:6 5}</style><rect class="box" x="10" y="10" width="480" height="155" rx="8"/><text x="250" y="55" style="font-size:27px">입력 · 레이블 명세</text><text x="250" y="94" style="font-size:24px">의사결정 시점 · 기간 · 경제적 의미</text><text x="250" y="134" style="font-size:23px">7장에서</text><rect class="box" x="10" y="210" width="480" height="180" rx="8"/><text x="250" y="255" style="font-size:27px">필터 1 · 기간 정렬</text><text x="250" y="299" style="font-size:24px">룩백 ≤ 레이블 기간</text><text x="250" y="343" style="font-size:24px">표본추출 주기를 실행과 맞춘다</text><rect class="box" x="10" y="450" width="480" height="170" rx="8"/><text x="250" y="495" style="font-size:27px">필터 2 · 동인 가설</text><text x="250" y="539" style="font-size:24px">어떤 경제적 메커니즘인가?</text><text x="250" y="583" style="font-size:24px">추세 · 캐리 · 가치 · 사건 · …</text><rect class="box" x="10" y="680" width="480" height="170" rx="8"/><text x="250" y="725" style="font-size:27px">필터 3 · 역할 분리</text><text x="250" y="769" style="font-size:24px">신호: 방향·크기 예측</text><text x="250" y="813" style="font-size:24px">상태: 신호가 작동하는 조건</text><rect class="box" x="10" y="910" width="480" height="175" rx="8"/><text x="250" y="955" style="font-size:27px">출력 · 특성 명세</text><text x="250" y="999" style="font-size:24px">문서화된 후보 · 알려진 실패 양상</text><text x="250" y="1043" style="font-size:24px">7장 선별 프로토콜로</text><path class="a" d="M250 165V208"/><path class="a" d="M250 390V448"/><path class="a" d="M250 620V678"/><path class="a" d="M250 850V908"/><rect class="box dash" x="560" y="210" width="350" height="640" rx="8"/><text x="735" y="254" style="font-size:25px">세 가지 설계 손잡이</text><text x="735" y="294" style="font-size:23px">모든 단계에 적용</text><text x="735" y="378" style="font-size:25px">기준 프레임</text><text x="735" y="422" style="font-size:23px">절대 · 상대 · 잔차</text><text x="735" y="518" style="font-size:25px">표현</text><text x="735" y="562" style="font-size:23px">수준 · 변화 · 순위</text><text x="735" y="602" style="font-size:23px">z-점수</text><text x="735" y="718" style="font-size:25px">집계</text><text x="735" y="762" style="font-size:23px">룩백 창 · 가중 · 기간</text><path class="a dash" d="M560 310H492"/><path class="a dash" d="M560 535H492"/><path class="a dash" d="M560 765H492"/></svg>