<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .an-s{text-anchor:start} .an-m{text-anchor:middle} .an-e{text-anchor:end}
    .h{font-size:16px;font-weight:900;fill:#0F0F10}
    .b{font-size:14px;font-weight:800;fill:#0F0F10}
    .s{font-size:13px;font-weight:700;fill:#0F0F10}
    .xs{font-size:12px;font-weight:700;fill:#475569}
    .num{font-size:15px;font-weight:900;fill:#0F2C59}
    .inv{fill:#FFFFFF}
    .box{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxa{fill:#E8EDF5;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxd{fill:#0F2C59;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxw{fill:#FDF0E6;stroke:#C2703A;stroke-width:2;rx:10}
    .chip{fill:#0F2C59;stroke:none;rx:9}
    .chipw{fill:#C2703A;stroke:none;rx:9}
    .chipl{fill:#E8EDF5;stroke:#0F2C59;stroke-width:1.5;rx:9}
    .band{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.5;rx:14}
    .bandw{fill:#FBEAE0;stroke:#E2B79B;stroke-width:1.5;rx:14}
    .conn{fill:none;stroke:#0F2C59;stroke-width:2.2}
    .connw{fill:none;stroke:#C2703A;stroke-width:2.2}
    .thin{fill:none;stroke:#94A3B8;stroke-width:1.6}
    .dash{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:7 5}
    .dashw{fill:none;stroke:#C2703A;stroke-width:2;stroke-dasharray:7 5}
    .axis{fill:none;stroke:#94A3B8;stroke-width:1.5}
    .grid{fill:none;stroke:#E2E8F0;stroke-width:1}
    .nd{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2}
    .nda{fill:#0F2C59;stroke:#0F2C59;stroke-width:2}
    .ndw{fill:#C2703A;stroke:#C2703A;stroke-width:2}
    .dot{fill:#0F2C59}
    .dotw{fill:#C2703A}
    .bar{fill:#0F2C59}
    .barw{fill:#C2703A}
    .barl{fill:#9DB2CE}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2703A"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
  </defs>
  <title id="t">칼만 필터 한 걸음이 관측 하나를 네 특성으로 바꾸는 계산 순서</title>
  <desc id="d">왼쪽의 어제 상태와 분산이 예측 단계를 거치고, 가운데에서 오늘 관측과 비교해 혁신과 이득이 계산되고, 오른쪽에서 갱신 수준과 분산, 표준화 혁신이 나와 네 특성 칩으로 이어진다.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#FAFAF9"/>

  <rect class="band" x="20" y="26" width="272" height="202"/>
  <rect class="chip" x="32" y="34" width="150" height="24"/>
  <text class="t xs an-m inv" x="107" y="51">① 예측 단계</text>
  <rect class="box" x="40" y="70" width="232" height="44"/>
  <text class="t s an-m" x="156" y="88">어제 수준 100</text>
  <text class="t xs an-m" x="156" y="107">사후 분산 1.2</text>
  <rect class="box" x="40" y="126" width="232" height="38"/>
  <text class="t s an-m" x="156" y="150">과정 분산 0.3</text>
  <rect class="boxa" x="40" y="176" width="232" height="40"/>
  <text class="t s an-m" x="156" y="194">예측 분산 Rt = 1.5</text>
  <text class="t xs an-m" x="156" y="211">1.2 + 0.3</text>
  <path class="conn" marker-end="url(#ar)" d="M156 164 V176"/>

  <path class="conn" marker-end="url(#ar)" d="M292 127 H338"/>

  <rect class="band" x="344" y="26" width="272" height="202"/>
  <rect class="chip" x="356" y="34" width="150" height="24"/>
  <text class="t xs an-m inv" x="431" y="51">② 비교 단계</text>
  <rect class="box" x="364" y="70" width="232" height="44"/>
  <text class="t s an-m" x="480" y="88">오늘 관측 101.8</text>
  <text class="t xs an-m" x="480" y="107">관측 잡음 분산 2.5</text>
  <rect class="boxa" x="364" y="126" width="232" height="38"/>
  <text class="t s an-m" x="480" y="150">혁신 et = 1.8</text>
  <rect class="boxa" x="364" y="176" width="232" height="40"/>
  <text class="t s an-m" x="480" y="194">혁신 분산 St = 4.0</text>
  <text class="t xs an-m" x="480" y="211">이득 Kt = 0.375</text>
  <path class="conn" marker-end="url(#ar)" d="M480 164 V176"/>

  <path class="conn" marker-end="url(#ar)" d="M616 127 H662"/>

  <rect class="band" x="668" y="26" width="272" height="202"/>
  <rect class="chip" x="680" y="34" width="150" height="24"/>
  <text class="t xs an-m inv" x="755" y="51">③ 갱신 단계</text>
  <rect class="boxd" x="688" y="70" width="232" height="44"/>
  <text class="t s an-m inv" x="804" y="88">갱신 수준 100.675</text>
  <text class="t xs an-m inv" x="804" y="107">100 + 0.375 × 1.8</text>
  <rect class="boxd" x="688" y="126" width="232" height="38"/>
  <text class="t s an-m inv" x="804" y="150">갱신 분산 0.9375</text>
  <rect class="boxd" x="688" y="176" width="232" height="40"/>
  <text class="t s an-m inv" x="804" y="194">표준화 혁신 0.9</text>
  <text class="t xs an-m inv" x="804" y="211">1.8 ÷ √4.0</text>

  <path class="dash" marker-end="url(#arg)" d="M804 228 V266"/>
  <rect class="band" x="80" y="272" width="800" height="102"/>
  <rect class="chipl" x="100" y="296" width="178" height="58"/>
  <text class="t s an-m" x="189" y="320">필터링 수준</text>
  <text class="t xs an-m" x="189" y="340">방향</text>
  <rect class="chipl" x="292" y="296" width="178" height="58"/>
  <text class="t s an-m" x="381" y="320">혁신</text>
  <text class="t xs an-m" x="381" y="340">놀라움</text>
  <rect class="chipl" x="484" y="296" width="178" height="58"/>
  <text class="t s an-m" x="573" y="320">표준화 혁신</text>
  <text class="t xs an-m" x="573" y="340">척도 조정된 놀라움</text>
  <rect class="chipl" x="676" y="296" width="178" height="58"/>
  <text class="t s an-m" x="765" y="320">사후 분산</text>
  <text class="t xs an-m" x="765" y="340">확신</text>
  <rect class="chip" x="80" y="272" width="150" height="26"/>
  <text class="t xs an-m inv" x="155" y="290">네 특성</text>
</svg>
