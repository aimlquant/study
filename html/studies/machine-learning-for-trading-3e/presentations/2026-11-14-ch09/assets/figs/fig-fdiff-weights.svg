  <rect class="barl" x="128" y="104" width="14" height="96"/>
  <text class="t xs an-m" x="119" y="222">0</text>
  <rect class="bar" x="166" y="200" width="14" height="20"/>
  <rect class="barw" x="182" y="200" width="14" height="38"/>
  <rect class="barl" x="198" y="200" width="14" height="77"/>
  <text class="t xs an-m" x="189" y="296">1</text>
  <rect class="bar" x="236" y="200" width="14" height="8"/>
  <rect class="barw" x="252" y="200" width="14" height="12"/>
  <rect class="barl" x="268" y="200" width="14" height="8"/>
  <text class="t xs an-m" x="259" y="296">2</text>
  <rect class="bar" x="306" y="200" width="14" height="5"/>
  <rect class="barw" x="322" y="200" width="14" height="7"/>
  <rect class="barl" x="338" y="200" width="14" height="3"/>
  <text class="t xs an-m" x="329" y="296">3</text>
  <rect class="bar" x="376" y="200" width="14" height="4"/>
  <rect class="barw" x="392" y="200" width="14" height="5"/>
  <rect class="barl" x="408" y="200" width="14" height="2"/>
  <text class="t xs an-m" x="399" y="296">4</text>
  <text class="t xs an-m" x="270" y="330">시차 k</text>
  <rect class="boxa" x="96" y="312" width="326" height="48"/>
  <text class="t xs an-m" x="259" y="331">작은 d는 꼬리가 길게 남고</text>
  <text class="t xs an-m" x="259" y="350">d=1에서는 두 항만 남는다</text>

  <rect class="band" x="492" y="26" width="444" height="348"/>
  <rect class="chip" x="504" y="34" width="248" height="24"/>
  <text class="t xs an-m inv" x="628" y="51">사용 가능 표본 비율 · %</text>
