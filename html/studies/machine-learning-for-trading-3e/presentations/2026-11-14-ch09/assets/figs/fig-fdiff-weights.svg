  <text class="t xs an-m inv" x="256" y="51">d=0.2</text>
  <rect class="chipw" x="298" y="34" width="68" height="24"/>
  <text class="t xs an-m inv" x="332" y="51">d=0.4</text>
  <rect class="chipl" x="374" y="34" width="68" height="24"/>
  <text class="t xs an-m" x="408" y="51">d=0.8</text>

