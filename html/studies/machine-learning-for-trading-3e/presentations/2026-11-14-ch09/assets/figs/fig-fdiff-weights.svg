  <title id="t">차분 차수별 시차 가중치와 절단 임계값에 따른 사용 가능 표본 비율</title>
  <desc id="d">왼쪽은 d가 0.2, 0.4, 0.8일 때 시차 0부터 6까지의 가중치 막대이고, 오른쪽은 절단 임계값이 엄격해질수록 필요한 룩백이 길어져 사용 가능 표본 비율이 줄어드는 관계다.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#FAFAF9"/>

