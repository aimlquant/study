  <title id="t">같은 점예측의 좁은 구간과 넓은 구간, 그리고 필터링과 평활 불확실성 경로</title>
  <desc id="d">왼쪽은 같은 1.8퍼센트 점예측에 좁은 90퍼센트 구간과 넓은 구간을 나란히 두고 상대 너비를 표시하며, 오른쪽은 필터링 불확실성 경로와 미래 관측으로 수정된 평활 경로를 겹쳐 보인다.</desc>
