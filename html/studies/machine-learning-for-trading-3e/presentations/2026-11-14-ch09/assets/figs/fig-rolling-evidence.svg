  <title id="t">국면이 바뀌는 스프레드의 롤링 ADF·KPSS 통계량</title>
  <desc id="d">위 칸은 전반부가 안정적이고 후반부에 표류가 생기는 스프레드이고, 아래 칸은 같은 기간의 롤링 ADF와 KPSS 통계량이 넓은 전이 구간에 걸쳐 서서히 바뀌는 모습이다.</desc>
