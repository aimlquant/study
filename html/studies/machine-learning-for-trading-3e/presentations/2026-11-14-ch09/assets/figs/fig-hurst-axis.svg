  <title id="t">허스트 지수 축 위의 수익률과 로그 변동성 증분 위치</title>
  <desc id="d">0에서 1까지의 허스트 지수 축에서 0.5 왼쪽이 반지속 영역, 0.5가 브라운 스케일링, 오른쪽이 지속 영역이고, SPY 수익률은 0.5 근처, SPY 로그 변동성 증분은 0.12에서 0.23 구간에 놓인다.</desc>
