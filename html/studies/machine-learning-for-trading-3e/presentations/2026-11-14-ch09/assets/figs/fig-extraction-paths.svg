  <title id="t">적합 절차 하나가 다섯 종류의 특성을 낳고 공통 시점 기준 게이트를 통과하는 흐름</title>
  <desc id="d">학습 창에서 적합한 절차가 구조적 수량과 갱신 출력으로 갈라지고, 거기서 다섯 종류의 특성이 나온 뒤 아래쪽 게이트의 세 조건을 함께 통과한다.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#FAFAF9"/>

  <rect class="band" x="28" y="40" width="190" height="186"/>
  <rect class="boxa" x="44" y="62" width="158" height="52"/>
  <text class="t b an-m" x="123" y="84">학습 창</text>
