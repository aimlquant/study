  <rect class="boxd" x="44" y="140" width="158" height="62"/>
  <text class="t b an-m inv" x="123" y="166">적합 절차</text>
  <text class="t xs an-m inv" x="123" y="186">추정·선택·검증</text>

  <path class="conn" marker-end="url(#ar)" d="M218 133 H274"/>

  <rect class="box" x="284" y="52" width="196" height="68"/>
  <text class="t b an-m" x="382" y="78">구조적 수량</text>
  <text class="t xs an-m" x="382" y="99">한 번 추정, 느리게 변함</text>
  <rect class="box" x="284" y="146" width="196" height="68"/>
  <text class="t b an-m" x="382" y="172">갱신 출력</text>
  <text class="t xs an-m" x="382" y="193">관측마다 다시 계산됨</text>
  <path class="thin" marker-end="url(#arg)" d="M246 120 V86 H284"/>
  <path class="thin" marker-end="url(#arg)" d="M246 146 V180 H284"/>

  <rect class="chipl" x="534" y="34" width="394" height="32"/>
  <text class="t s an-m" x="731" y="55">계수 · 지속성 측도</text>
  <rect class="chipl" x="534" y="74" width="394" height="32"/>
  <text class="t s an-m" x="731" y="95">잠재 상태 · 필터링 추정치</text>
  <rect class="chipl" x="534" y="114" width="394" height="32"/>
  <text class="t s an-m" x="731" y="135">잔차 · 혁신</text>
  <rect class="chipl" x="534" y="154" width="394" height="32"/>
  <text class="t s an-m" x="731" y="175">예측 · 조건부 분산</text>
  <rect class="chipl" x="534" y="194" width="394" height="32"/>
  <text class="t s an-m" x="731" y="215">국면 확률 · 사후 불확실성</text>

  <path class="conn" marker-end="url(#ar)" d="M480 86 H520 V50 H534"/>
  <path class="conn" marker-end="url(#ar)" d="M480 180 H510 V90 H534"/>
  <path class="conn" marker-end="url(#ar)" d="M480 180 H510 V130 H534"/>
  <path class="conn" marker-end="url(#ar)" d="M480 180 H510 V170 H534"/>
  <path class="conn" marker-end="url(#ar)" d="M480 180 H510 V210 H534"/>

  <path class="dash" marker-end="url(#arg)" d="M731 226 V268"/>

  <rect class="bandw" x="150" y="276" width="660" height="98"/>
  <rect class="boxw" x="172" y="300" width="196" height="54"/>
  <text class="t s an-m" x="270" y="322">필터링 출력만 사용</text>
  <text class="t xs an-m" x="270" y="341">평활 출력은 회고 분석용</text>
  <rect class="boxw" x="382" y="300" width="196" height="54"/>
  <text class="t s an-m" x="480" y="322">학습 창 안에서 선택</text>
  <text class="t xs an-m" x="480" y="341">모수 · 차수 · 창 길이</text>
  <rect class="boxw" x="592" y="300" width="196" height="54"/>
  <text class="t s an-m" x="690" y="322">워크포워드 재추정</text>
  <text class="t xs an-m" x="690" y="341">특성과 함께 버전 관리</text>
  <rect class="chipw" x="150" y="276" width="168" height="26"/>
  <text class="t xs an-m inv" x="234" y="294">시점 기준 게이트</text>
