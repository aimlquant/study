  <title id="t">두 상태 은닉 마르코프 모델의 전이·방출 구조와 과거·미래 경계</title>
  <desc id="d">위층의 저변동성 상태와 고변동성 상태가 자기 고리와 교차 화살표로 연결되고, 아래층의 관측 수익률로 점선 방출이 내려오며, 가운데 세로 점선이 이용 가능한 과거와 이용 불가능한 미래를 가른다.</desc>
