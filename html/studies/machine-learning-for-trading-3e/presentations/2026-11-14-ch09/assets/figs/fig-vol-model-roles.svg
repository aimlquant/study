  <text class="t xs an-m" x="305" y="177">부호를 구별하지 않음</text>
  <rect class="boxd" x="204" y="196" width="202" height="82"/>
  <text class="t xs an-m inv" x="305" y="218">cond_vol</text>
  <text class="t xs an-m inv" x="305" y="240">shock_impact</text>
  <text class="t xs an-m inv" x="305" y="262">vol_persistence</text>

  <rect class="band" x="438" y="22" width="230" height="266"/>
  <rect class="chip" x="450" y="30" width="206" height="28"/>
  <text class="t xs an-m inv" x="553" y="49">EGARCH</text>
  <rect class="box" x="452" y="70" width="202" height="34"/>
  <text class="t s an-m" x="553" y="92">수익률</text>
  <rect class="boxa" x="452" y="112" width="202" height="76"/>
  <text class="t s an-m" x="553" y="136">로그 분산에서</text>
