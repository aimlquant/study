  <text class="t xs an-m" x="553" y="177">비음 제약 불필요</text>
  <rect class="boxd" x="452" y="196" width="202" height="82"/>
  <text class="t xs an-m inv" x="553" y="218">cond_vol</text>
  <text class="t xs an-m inv" x="553" y="240">leverage_effect (γ)</text>
  <text class="t xs an-m inv" x="553" y="262">γ &lt; 0 이면 하락 비대칭</text>

  <rect class="band" x="686" y="22" width="250" height="266"/>
  <rect class="chip" x="698" y="30" width="226" height="28"/>
  <text class="t xs an-m inv" x="811" y="49">HAR</text>
  <rect class="boxw" x="700" y="70" width="222" height="34"/>
  <text class="t s an-m" x="811" y="92">일별 실현 변동성</text>
