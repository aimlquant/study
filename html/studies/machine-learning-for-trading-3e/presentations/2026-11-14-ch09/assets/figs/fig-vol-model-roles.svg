  <title id="t">GARCH, EGARCH, HAR의 입력과 출력 대상 비교</title>
  <desc id="d">세 열이 각각 입력, 모델이 다루는 대상, 출력 특성을 차례로 보이고 맨 아래 공통 띠에서만 평가 손실로 비교 가능하다는 구조다.</desc>
  <rect x="0" y="0" width="960" height="400" fill="#FAFAF9"/>

  <rect class="chip" x="24" y="30" width="146" height="28"/>
  <text class="t xs an-m inv" x="97" y="49">입력</text>
