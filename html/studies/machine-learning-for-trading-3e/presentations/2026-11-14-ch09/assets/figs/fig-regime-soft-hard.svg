  <title id="t">같은 필터링 스트레스 확률 경로를 하드 레이블과 연속 조건이 다르게 쓰는 모습</title>
  <desc id="d">위 칸은 네 날에 걸쳐 0.08, 0.22, 0.47, 0.74로 올라가는 필터링 스트레스 확률 막대와 0.5 문턱선이고, 아래 두 칸은 같은 경로를 계단식 하드 레이블과 네 단계 연속 노출로 각각 변환한 결과다.</desc>
