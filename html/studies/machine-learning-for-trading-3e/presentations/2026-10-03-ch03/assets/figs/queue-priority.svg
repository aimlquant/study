<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">가격 시간 우선순위와 내 앞 수량</title><desc id="desc">같은 매도호가에서 앞선 주문이 줄고 뒤 주문이 추가되어도 내 앞 수량은 총 심도와 다르게 움직인다.</desc>
  <style>text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",NanumGothic,Inter,system-ui,sans-serif;fill:#0F172A}.h{font-size:28px;font-weight:800}.b{font-size:23px}.num{font-size:25px;font-weight:800}.box{stroke:#0F2C59;stroke-width:3}.ahead{fill:#CADCED}.mine{fill:#0F2C59}.behind{fill:#EDEDED}.w{fill:#fff}.line{stroke:#94A3B8;stroke-width:2}</style>
  <rect width="1200" height="600" fill="#FAFAF9"/>
  <text class="h" x="100" y="70">매도호가 100.10달러</text>
  <text class="b" x="100" y="120">시작</text><rect class="box ahead" x="210" y="88" width="210" height="70"/><rect class="box ahead" x="420" y="88" width="170" height="70"/><rect class="box mine" x="590" y="88" width="130" height="70"/><text class="num" x="315" y="132" text-anchor="middle">A1 · 200</text><text class="num" x="505" y="132" text-anchor="middle">A2 · 150</text><text class="num w" x="655" y="132" text-anchor="middle">나 · 100</text><text class="b" x="820" y="132">내 앞 350주</text>
  <line class="line" x1="100" y1="205" x2="1110" y2="205"/>
  <text class="b" x="100" y="260">체결 120</text><rect class="box ahead" x="210" y="228" width="150" height="70"/><rect class="box ahead" x="360" y="228" width="170" height="70"/><rect class="box mine" x="530" y="228" width="130" height="70"/><text class="num" x="285" y="272" text-anchor="middle">A1 · 80</text><text class="num" x="445" y="272" text-anchor="middle">A2 · 150</text><text class="num w" x="595" y="272" text-anchor="middle">나 · 100</text><text class="b" x="820" y="272">내 앞 230주</text>
  <line class="line" x1="100" y1="345" x2="1110" y2="345"/>
  <text class="b" x="100" y="400">A2 취소 50</text><rect class="box ahead" x="210" y="368" width="150" height="70"/><rect class="box ahead" x="360" y="368" width="120" height="70"/><rect class="box mine" x="480" y="368" width="130" height="70"/><text class="num" x="285" y="412" text-anchor="middle">A1 · 80</text><text class="num" x="420" y="412" text-anchor="middle">A2 · 100</text><text class="num w" x="545" y="412" text-anchor="middle">나 · 100</text><text class="b" x="820" y="412">내 앞 180주</text>
  <line class="line" x1="100" y1="485" x2="1110" y2="485"/>
  <text class="b" x="100" y="540">A3 추가 300</text><rect class="box ahead" x="210" y="508" width="150" height="70"/><rect class="box ahead" x="360" y="508" width="120" height="70"/><rect class="box mine" x="480" y="508" width="130" height="70"/><rect class="box behind" x="610" y="508" width="250" height="70"/><text class="num" x="285" y="552" text-anchor="middle">80</text><text class="num" x="420" y="552" text-anchor="middle">100</text><text class="num w" x="545" y="552" text-anchor="middle">나 · 100</text><text class="num" x="735" y="552" text-anchor="middle">A3 · 300</text><text class="b" x="900" y="552">내 앞 180주</text>
</svg>
