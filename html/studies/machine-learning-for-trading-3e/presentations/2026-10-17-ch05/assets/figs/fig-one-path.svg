  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2703A"/></marker></defs>
  <title id="t">실현된 한 경로와 그 뒤에 있었을 수 있는 경로 분포의 대비</title>
  <desc id="d">왼쪽은 우리가 실제로 관측한 단 하나의 가격 경로이고 오른쪽은 같은 생성 모델에서 뽑은 여러 대안 경로다. 전략 성과를 점추정치 하나가 아니라 분포로 보게 된다.</desc>
  <rect x="0" y="0" width="960" height="350" fill="#FAFAF9"/>
  <rect class="band" x="40" y="70" width="400" height="200"/>
  <text class="t b an-m" x="240" y="98">실현된 역사 — 단 하나</text>
  <path class="axis" d="M80 240 H410"/>
  <path class="conn" d="M80 215 L120 205 L160 220 L200 180 L240 190 L280 150 L320 165 L360 130 L400 120"/>
  <circle class="dot" cx="400" cy="120" r="5"/>
  <rect class="chip" x="130" y="248" width="220" height="24"/>
  <text class="t xs an-m inv" x="240" y="265">성과 점추정치 하나</text>

  <rect class="bandw" x="520" y="70" width="400" height="200"/>
  <text class="t b an-m" x="720" y="98">생성 모델에서 뽑은 대안들</text>
  <path class="axis" d="M560 240 H890"/>
  <path class="thin" d="M560 215 L600 198 L640 212 L680 170 L720 186 L760 142 L800 158 L840 126 L880 112"/>
  <path class="thin" d="M560 215 L600 212 L640 196 L680 206 L720 160 L760 178 L800 136 L840 150 L880 136"/>
  <path class="thin" d="M560 215 L600 190 L640 205 L680 162 L720 200 L760 166 L800 182 L840 144 L880 160"/>
  <path class="connw" d="M560 215 L600 206 L640 224 L680 190 L720 174 L760 196 L800 152 L840 170 L880 128"/>
  <rect class="chipw" x="610" y="248" width="220" height="24"/>
  <text class="t xs an-m inv" x="720" y="265">성과의 분포</text>
  <path class="dash" marker-end="url(#ar)" d="M440 170 H520"/>
  <text class="t xs an-m" x="480" y="160">적합</text>

