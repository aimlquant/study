<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="t d">
  <title id="t">VAE의 학습과 새 자료 생성 플로우</title>
  <desc id="d">위쪽 학습 흐름은 실제 자료, 인코더, 입력별 잠재분포, 잠재 표본, 디코더, 복원 결과로 이어진다. 복원 손실과 잠재분포의 KL 차이를 이용해 인코더와 디코더를 함께 갱신한다. 아래쪽 새 자료 생성은 사전분포에서 잠재 표본을 뽑아 학습한 디코더에 넣는다. 정규 잠재분포를 쓰는 표준 VAE의 설명용 도식이다.</desc>
  <style>
    text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;text-anchor:middle;fill:#0F0F10;font-size:14px}
    .h{font-size:16px;font-weight:800}.s{font-size:12px;fill:#475569}.inv{fill:white}
    .box{fill:white;stroke:#0F2C59;stroke-width:2;rx:10}.blue{fill:#E8EDF5;stroke:#0F2C59;stroke-width:2;rx:10}.orange{fill:#FDF0E6;stroke:#C2703A;stroke-width:2;rx:10}
    .arrow{fill:none;stroke:#0F2C59;stroke-width:2;marker-end:url(#ar)}
    .update{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#ar)}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0F2C59"/></marker></defs>
  <rect width="1080" height="430" fill="#FAFAF9"/>
  <rect x="15" y="12" width="1050" height="280" rx="14" fill="#f1f5f9" stroke="#CBD5E1"/>
  <text x="540" y="40" class="h">① 학습: 입력 복원 + 잠재분포 조정</text>
  <rect x="30" y="72" width="140" height="76" class="box"/>
  <text x="100" y="103" class="h">실제 자료 x</text><text x="100" y="128" class="s">예: ETF 수익률 기록</text>
  <rect x="210" y="72" width="145" height="76" class="blue"/>
  <text x="282" y="103" class="h">인코더</text><text x="282" y="128" class="s">입력별 잠재분포 추정</text>
  <rect x="395" y="72" width="175" height="76" class="box"/>
  <text x="482" y="99" class="h">잠재분포 q(z|x)</text><text x="482" y="124" class="s">평균 μ · 표준편차 σ</text>
  <rect x="650" y="72" width="145" height="76" class="orange"/>
  <text x="722" y="103" class="h">디코더</text><text x="722" y="128" class="s">잠재 표본에서 복원</text>
  <rect x="850" y="72" width="195" height="76" class="box"/>
  <text x="947" y="103" class="h">복원 자료 x̂</text><text x="947" y="128" class="s">입력과 얼마나 다른지 확인</text>
  <path d="M170 110 H210" class="arrow"/><path d="M355 110 H395" class="arrow"/>
  <path d="M570 110 H650" class="arrow"/><text x="610" y="87" class="s">z 추출</text>
  <path d="M795 110 H850" class="arrow"/>
  <rect x="345" y="201" width="390" height="68" class="blue"/>
  <text x="540" y="226" class="h">학습 손실</text>
  <text x="540" y="251" class="s">입력 복원 손실 + q(z|x)와 사전분포 p(z)의 KL 차이</text>
  <path d="M100 148 V174 H405 V201" class="arrow"/>
  <path d="M947 148 V174 H675 V201" class="arrow"/>
  <path d="M482 148 V201" class="arrow"/>
  <path d="M345 236 H282 V148" class="update"/>
  <path d="M735 236 H810 V160 H722 V148" class="update"/>
  <rect x="15" y="309" width="1050" height="106" rx="14" fill="#f1f5f9" stroke="#CBD5E1"/>
  <text x="540" y="335" class="h">② 새 자료 생성: 사전분포에서 추출 → 학습한 디코더 사용</text>
  <rect x="65" y="350" width="260" height="50" class="box"/>
  <text x="195" y="371">사전분포 p(z)에서 z 추출</text><text x="195" y="390" class="s">예: 표준 정규분포 N(0,I)</text>
  <rect x="455" y="350" width="185" height="50" class="orange"/>
  <text x="547" y="381" class="h">학습한 디코더</text>
  <rect x="785" y="350" width="230" height="50" class="box"/>
  <text x="900" y="371" class="h">새 합성 자료</text><text x="900" y="390" class="s">예: 가상의 ETF 수익률 기록</text>
  <path d="M325 375 H455" class="arrow"/><path d="M640 375 H785" class="arrow"/>
</svg>
