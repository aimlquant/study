<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 960 230" role="img" aria-labelledby="t d">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .an-s{text-anchor:start} .an-m{text-anchor:middle} .an-e{text-anchor:end}
    .h{font-size:16px;font-weight:900;fill:#0F0F10}
    .b{font-size:14px;font-weight:800;fill:#0F0F10}
    .s{font-size:13px;font-weight:700;fill:#0F0F10}
    .xs{font-size:12px;font-weight:700;fill:#475569}
    .num{font-size:15px;font-weight:900;fill:#0F2C59}
    .inv{fill:#FFFFFF}
    .box{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxa{fill:#E8EDF5;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxd{fill:#0F2C59;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxw{fill:#FDF0E6;stroke:#C2703A;stroke-width:2;rx:10}
    .chip{fill:#0F2C59;stroke:none;rx:9}
    .chipw{fill:#C2703A;stroke:none;rx:9}
    .band{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.5;rx:14}
    .bandw{fill:#FBEAE0;stroke:#E2B79B;stroke-width:1.5;rx:14}
    .conn{fill:none;stroke:#0F2C59;stroke-width:2.2}
    .connw{fill:none;stroke:#C2703A;stroke-width:2.2}
    .thin{fill:none;stroke:#94A3B8;stroke-width:1.6}
    .dash{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:7 5}
    .axis{fill:none;stroke:#94A3B8;stroke-width:1.5}
    .nd{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2}
    .nda{fill:#0F2C59;stroke:#0F2C59;stroke-width:2}
    .ndw{fill:#C2703A;stroke:#C2703A;stroke-width:2}
    .dot{fill:#0F2C59}
    .dotw{fill:#C2703A}
    .bar{fill:#0F2C59}
    .barw{fill:#C2703A}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2703A"/></marker></defs>
  <title id="t">DDPM 순방향 잡음 추가 세 단계와 역방향 잡음 제거 세 단계</title>
  <desc id="d">순방향은 실제 데이터에 1단계, 2단계, 3단계 잡음을 차례로 더해 거의 순수한 잡음으로 만든다. 역방향은 순수 잡음에서 출발해 같은 가중치의 잡음 제거 네트워크를 반복 적용하며 3단계, 2단계, 1단계 잡음 제거를 거쳐 깨끗한 표본에 도달한다.</desc>
  <rect x="0" y="0" width="960" height="340" fill="#FAFAF9"/>
  <text class="t s an-s" x="110" y="74">순방향 — 잡음 추가</text>
  <rect class="boxd" x="110" y="86" width="128" height="52"/>
  <text class="t xs an-m inv" x="174" y="117">실제 데이터</text>
  <rect class="boxa" x="274" y="86" width="128" height="52"/>
  <text class="t xs an-m" x="338" y="117">1단계 잡음</text>
  <rect class="boxa" x="438" y="86" width="128" height="52"/>
  <text class="t xs an-m" x="502" y="117">2단계 잡음</text>
  <rect class="box" x="602" y="86" width="128" height="52"/>
  <text class="t xs an-m" x="666" y="117">3단계 잡음</text>
  <rect class="boxw" x="766" y="86" width="128" height="52"/>
  <text class="t xs an-m" x="830" y="117">거의 순수 잡음</text>
  <path class="conn" marker-end="url(#ar)" d="M238 112 H274"/>
  <path class="conn" marker-end="url(#ar)" d="M402 112 H438"/>
  <path class="conn" marker-end="url(#ar)" d="M566 112 H602"/>
  <path class="conn" marker-end="url(#ar)" d="M730 112 H766"/>

  <rect class="chip" x="330" y="156" width="300" height="24"/>
  <text class="t xs an-m inv" x="480" y="173">공유 잡음 제거 네트워크</text>

  <text class="t s an-s" x="110" y="208">역방향 — 잡음 제거</text>
  <rect class="boxd" x="110" y="220" width="128" height="52"/>
  <text class="t xs an-m inv" x="174" y="251">깨끗한 표본</text>
  <rect class="boxw" x="274" y="220" width="128" height="52"/>
  <text class="t xs an-m" x="338" y="251">1단계 제거</text>
  <rect class="boxw" x="438" y="220" width="128" height="52"/>
  <text class="t xs an-m" x="502" y="251">2단계 제거</text>
  <rect class="boxw" x="602" y="220" width="128" height="52"/>
  <text class="t xs an-m" x="666" y="251">3단계 제거</text>
  <rect class="boxw" x="766" y="220" width="128" height="52"/>
  <text class="t xs an-m" x="830" y="251">순수 잡음</text>
  <path class="connw" marker-end="url(#arw)" d="M766 246 H730"/>
  <path class="connw" marker-end="url(#arw)" d="M602 246 H566"/>
  <path class="connw" marker-end="url(#arw)" d="M438 246 H402"/>
  <path class="connw" marker-end="url(#arw)" d="M274 246 H238"/>
  <path class="dash" d="M830 138 V220"/>
</svg>
