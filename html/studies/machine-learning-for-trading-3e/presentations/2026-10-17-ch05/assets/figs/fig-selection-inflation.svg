<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 960 300" role="img" aria-labelledby="t d">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .an-s{text-anchor:start} .an-m{text-anchor:middle} .an-e{text-anchor:end}
    .h{font-size:16px;font-weight:900;fill:#0F0F10}
    .b{font-size:14px;font-weight:800;fill:#0F0F10}
    .s{font-size:13px;font-weight:700;fill:#0F0F10}
    .xs{font-size:12px;font-weight:700;fill:#475569}
    .num{font-size:15px;font-weight:900;fill:#0F2C59}
    .inv{fill:#FFFFFF}
    .box{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxa{fill:#E8EDF5;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxd{fill:#0F2C59;stroke:#0F2C59;stroke-width:2;rx:10}
    .boxw{fill:#FDF0E6;stroke:#C2703A;stroke-width:2;rx:10}
    .chip{fill:#0F2C59;stroke:none;rx:9}
    .chipw{fill:#C2703A;stroke:none;rx:9}
    .band{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1.5;rx:14}
    .bandw{fill:#FBEAE0;stroke:#E2B79B;stroke-width:1.5;rx:14}
    .conn{fill:none;stroke:#0F2C59;stroke-width:2.2}
    .connw{fill:none;stroke:#C2703A;stroke-width:2.2}
    .thin{fill:none;stroke:#94A3B8;stroke-width:1.6}
    .dash{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:7 5}
    .axis{fill:none;stroke:#94A3B8;stroke-width:1.5}
    .nd{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2}
    .nda{fill:#0F2C59;stroke:#0F2C59;stroke-width:2}
    .ndw{fill:#C2703A;stroke:#C2703A;stroke-width:2}
    .dot{fill:#0F2C59}
    .dotw{fill:#C2703A}
    .bar{fill:#0F2C59}
    .barw{fill:#C2703A}
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2703A"/></marker></defs>
  <title id="t">실제 샤프가 모두 0인 후보만 있어도 시행 횟수가 늘면 기대 최대 표본 내 샤프가 올라가는 모습</title>
  <desc id="d">독립성과 정규오차를 가정한 근사에서 10회 시행의 기대 최대 표본 내 샤프는 1.57이고 100회 시행에서는 2.5를 넘는다.</desc>
  <rect x="0" y="0" width="960" height="340" fill="#FAFAF9"/>
  <text class="t xs an-m" x="480" y="70">세로축 = 기대 최대 표본 내 샤프</text>
  <path class="axis" d="M300 100 V290 H700"/>
  <path class="dash" d="M300 100 H700"/>
  <text class="t xs an-e" x="292" y="104">2.5</text>
  <text class="t xs an-e" x="292" y="294">0.0</text>
  <rect class="bar" x="360" y="171" width="110" height="119"/>
  <text class="t num an-m" x="415" y="162">1.57</text>
  <text class="t s an-m" x="415" y="312">10회 시행</text>
  <rect class="barw" x="530" y="100" width="110" height="190"/>
  <text class="t num an-m" x="585" y="92">2.5 초과</text>
  <text class="t s an-m" x="585" y="312">100회 시행</text>
  <text class="t xs an-m" x="500" y="334">모든 후보의 실제 샤프 = 0</text>
</svg>
