  <title id="t">세 부트스트랩이 연속한 급락 구간을 어떻게 다르게 다루는지의 대비</title>
  <desc id="d">IID는 연속한 변동성 높은 날들을 흩뿌려 시간 의존성을 파괴하고, 블록은 고정 길이 덩어리로 보존하되 경계에 단절을 남기며, 정상 부트스트랩은 무작위 길이로 그 경계 자국을 줄인다.</desc>
  <rect x="0" y="0" width="960" height="360" fill="#FAFAF9"/>
  <text class="t xs an-m" x="480" y="60">짙은 칸 = 변동성이 높았던 거래일</text>

