  <title id="t">PCA와 t-SNE 투영에서 실제 표본과 합성 표본이 겹치는 정도</title>
  <desc id="d">두 투영 모두에서 실제 표본과 합성 표본이 큰 궤적과 군집은 공유하지만 일부 끝단과 국소 구간에서 분리된다. 겹침이 완전하지 않다는 점이 판별 정확도 68퍼센트와 일치한다.</desc>
