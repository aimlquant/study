  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2703A"/></marker></defs>
  <title id="t">충실도 효용 프라이버시 세 축과 각 축에서 묻는 질문</title>
  <desc id="d">충실도는 구조를 재현했는지, 효용은 후속 과제를 지원하는지, 프라이버시는 학습 레코드를 흘리는지를 각각 따로 묻는다. 세 축은 서로 충돌할 수 있다.</desc>
  <rect x="0" y="0" width="960" height="350" fill="#FAFAF9"/>
  <rect class="boxa" x="40" y="72" width="276" height="152"/>
  <text class="t b an-m" x="178" y="104">충실도</text>
  <text class="t xs an-m" x="178" y="132">주변분포가 맞는가</text>
  <text class="t xs an-m" x="178" y="154">의존성이 남았는가</text>
  <text class="t xs an-m" x="178" y="176">시계열 동학이 사는가</text>
  <text class="t xs an-m" x="178" y="204">KS, 상관 거리, ACF 오차</text>

  <rect class="boxa" x="342" y="72" width="276" height="152"/>
  <text class="t b an-m" x="480" y="104">효용</text>
  <text class="t xs an-m" x="480" y="132">후속 과제를 지원하는가</text>
  <text class="t xs an-m" x="480" y="154">합성으로 배워 실제로 평가</text>
  <text class="t xs an-m" x="480" y="176">같은 설정으로 비교</text>
  <text class="t xs an-m" x="480" y="204">TSTR 대 TRTR</text>

  <rect class="boxw" x="644" y="72" width="276" height="152"/>
  <text class="t b an-m" x="782" y="104">프라이버시</text>
  <text class="t xs an-m" x="782" y="132">학습 레코드가 새는가</text>
  <text class="t xs an-m" x="782" y="154">중복과 최근접 이웃</text>
  <text class="t xs an-m" x="782" y="176">멤버십 추론 검정</text>
  <text class="t xs an-m" x="782" y="204">DP 예산</text>

  <path class="dash" d="M316 148 H342"/>
  <path class="dash" d="M618 148 H644"/>
