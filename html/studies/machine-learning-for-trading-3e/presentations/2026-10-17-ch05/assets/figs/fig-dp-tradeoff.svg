  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2C59"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2703A"/></marker></defs>
  <title id="t">프라이버시 예산을 키울수록 효용이 좋아지지만 단조롭지는 않은 상충관계</title>
  <desc id="d">엡실론 1에서 평균 절대 차이가 8.02로 효용이 낮고, 50에서 1.68로 가장 좋지만 보호는 약하다. 상관 거리는 0.12 0.15 0.06 0.11로 단조롭지 않아 중간 구간이 실용적이다.</desc>
  <rect x="0" y="0" width="960" height="350" fill="#FAFAF9"/>
  <text class="t xs an-m" x="480" y="60">막대 = 평균 절대 차이</text>
  <path class="axis" d="M180 90 V272 H840"/>

  <rect class="barw" x="230" y="96" width="90" height="176"/>
  <text class="t num an-m" x="275" y="88">8.02</text>
  <text class="t s an-m" x="275" y="294">1.0</text>
  <text class="t xs an-m" x="275" y="316">강한 보호</text>

  <rect class="bar" x="380" y="220" width="90" height="52"/>
  <text class="t num an-m" x="425" y="212">2.40</text>
  <text class="t s an-m" x="425" y="294">5.0</text>
  <text class="t xs an-m" x="425" y="316">좋은 균형</text>

  <rect class="bar" x="530" y="214" width="90" height="58"/>
  <text class="t num an-m" x="575" y="206">2.67</text>
  <text class="t s an-m" x="575" y="294">10.0</text>
  <text class="t xs an-m" x="575" y="316">좋은 효용</text>

  <rect class="barw" x="680" y="236" width="90" height="36"/>
  <text class="t num an-m" x="725" y="228">1.68</text>
  <text class="t s an-m" x="725" y="294">50.0</text>
  <text class="t xs an-m" x="725" y="316">약한 보호</text>

  <path class="dash" d="M380 160 H620"/>
  <rect class="chip" x="380" y="130" width="240" height="26"/>
  <text class="t xs an-m inv" x="500" y="148">ε 5–10 중간 구간</text>
  <text class="t xs an-e" x="172" y="96">높음</text>
  <text class="t xs an-e" x="172" y="276">낮음</text>
  <text class="t s an-m" x="500" y="340">프라이버시 예산 ε</text>
