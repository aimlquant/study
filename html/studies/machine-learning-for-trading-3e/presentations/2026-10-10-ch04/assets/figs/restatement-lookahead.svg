<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">재작성된 펀더멘털로 인한 선견 편향</title><desc id="desc">위 줄 최신 값 데이터베이스는 2월 15일부터 매출 1억 달러를 평평하게 보여 주고, 아래 줄 특정 시점 값은 원래 보고 9,500만 달러에서 5월 20일 9,800만 달러, 8월 10일 1억 달러로 올라가는 계단이다. 2월 15일부터 8월 10일까지가 누출 구간이다.</desc>
  <defs><pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#B45309" stroke-width="3" opacity="0.35"/></pattern></defs>
  <style>text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",NanumGothic,Inter,system-ui,sans-serif;fill:#0F172A}.h{font-size:25px;font-weight:800}.b{font-size:22px}.s{font-size:20px;fill:#475569}.num{font-size:24px;font-weight:800}.flat{stroke:#B45309;stroke-width:5;fill:none}.step{stroke:#0F2C59;stroke-width:5;fill:none}.guide{stroke:#94A3B8;stroke-width:2;stroke-dasharray:6 6}.axis{stroke:#475569;stroke-width:2}.dotA{fill:#fff;stroke:#B45309;stroke-width:4}.dotB{fill:#fff;stroke:#0F2C59;stroke-width:4}.leak{fill:#B45309;font-weight:800;font-size:22px}.an-s{text-anchor:start}.an-m{text-anchor:middle}.an-e{text-anchor:end}</style>
  <rect width="1200" height="600" fill="#FAFAF9"/>
  <rect x="320" y="185" width="464" height="250" fill="url(#hatch)"/>
  <text class="leak an-m" x="552" y="260">누출 구간</text>
  <text class="h an-s" x="30" y="160">백테스트가</text>
  <text class="h an-s" x="30" y="192">보는 값</text>
  <text class="s an-s" x="30" y="222">최신 값 DB</text>
  <text class="h an-s" x="30" y="350">실제로 쓸 수</text>
  <text class="h an-s" x="30" y="382">있던 값</text>
  <text class="s an-s" x="30" y="412">특정 시점</text>
  <path class="flat" d="M320 170 H1150"/>
  <circle class="dotA" cx="320" cy="170" r="10"/><circle class="dotA" cx="570" cy="170" r="10"/><circle class="dotA" cx="784" cy="170" r="10"/>
  <text class="num an-m" x="320" y="140">$100M</text><text class="num an-m" x="570" y="140">$100M</text><text class="num an-m" x="784" y="140">$100M</text>
  <path class="step" d="M320 420 H570 V380 H784 V330 H1150"/>
  <circle class="dotB" cx="320" cy="420" r="10"/><circle class="dotB" cx="570" cy="380" r="10"/><circle class="dotB" cx="784" cy="330" r="10"/>
  <text class="num an-s" x="336" y="458">$95M 원래 보고</text>
  <text class="num an-s" x="586" y="418">$98M 재작성</text>
  <text class="num an-s" x="800" y="368">$100M 재작성</text>
  <line class="guide" x1="320" y1="440" x2="320" y2="474"/><line class="guide" x1="570" y1="440" x2="570" y2="474"/><line class="guide" x1="784" y1="440" x2="784" y2="474"/>
  <text class="b an-m" x="320" y="500" dy="0">2/15 10-K</text>
  <text class="b an-m" x="570" y="500">5/20 8-K 재작성</text>
  <text class="b an-m" x="800" y="500">8/10 10-Q 정정</text>
  <line class="axis" x1="200" y1="540" x2="1160" y2="540"/>
  <text class="s an-s" x="200" y="572">4Q 공시</text><text class="s an-m" x="360" y="572">3월</text><text class="s an-m" x="600" y="572">6월</text><text class="s an-m" x="840" y="572">9월</text><text class="s an-m" x="1080" y="572">12월</text>
</svg>
