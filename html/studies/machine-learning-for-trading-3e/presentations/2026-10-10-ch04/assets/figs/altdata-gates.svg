<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">대체 데이터 평가의 탈락 관문과 점수 비교</title><desc id="desc">후보 데이터셋 A부터 D가 법적 위험 관문과 특정 시점 재구성 관문을 차례로 통과한다. D는 첫 관문에서, C는 둘째 관문에서 탈락하고, 통과한 A와 B만 신호·품질·상업 차원의 점수로 비교한다.</desc>
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto"><path d="M0,0 L18,8 L0,16 Z" fill="#0F2C59"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",NanumGothic,Inter,system-ui,sans-serif;fill:#0F172A}.h{font-size:24px;font-weight:800}.b{font-size:21px}.s{font-size:19px;fill:#475569}.w{fill:#fff}.cand{fill:#fff;stroke:#0F2C59;stroke-width:4}.gate{fill:#0F2C59}.score{fill:#EEF3F8;stroke:#0F2C59;stroke-width:3}.arrow{stroke:#0F2C59;stroke-width:3.5;fill:none;marker-end:url(#a)}.stop{fill:#9A3412;font-size:22px;font-weight:800}.an-s{text-anchor:start}.an-m{text-anchor:middle}.an-e{text-anchor:end}</style>
  <rect width="1200" height="560" fill="#FAFAF9"/>
  <text class="b an-m" x="90" y="92">후보</text>
  <circle class="cand" cx="90" cy="160" r="28"/><text class="h an-m" x="90" y="169">A</text>
  <circle class="cand" cx="90" cy="260" r="28"/><text class="h an-m" x="90" y="269">B</text>
  <circle class="cand" cx="90" cy="360" r="28"/><text class="h an-m" x="90" y="369">C</text>
  <circle class="cand" cx="90" cy="460" r="28"/><text class="h an-m" x="90" y="469">D</text>
  <rect class="gate" x="230" y="110" width="190" height="400" rx="12"/>
  <text class="h w an-m" x="325" y="160">관문 1</text><text class="h w an-m" x="325" y="220">법적 위험</text><text class="b w an-m" x="325" y="262">권리·허용 범위</text><text class="b w an-m" x="325" y="298">MNPI</text><text class="b w an-m" x="325" y="334">개인정보 연결</text>
  <rect class="gate" x="520" y="110" width="190" height="400" rx="12"/>
  <text class="h w an-m" x="615" y="160">관문 2</text><text class="h w an-m" x="615" y="220">특정 시점</text><text class="h w an-m" x="615" y="252">재구성</text><text class="b w an-m" x="615" y="298">최초 관측 시점</text><text class="b w an-m" x="615" y="334">수정·백필 이력</text>
  <path class="arrow" d="M118 160 H226"/><path class="arrow" d="M118 260 H226"/><path class="arrow" d="M118 360 H226"/><path class="arrow" d="M118 460 H226"/>
  <path class="arrow" d="M420 160 H516"/><path class="arrow" d="M420 260 H516"/><path class="arrow" d="M420 360 H516"/>
  <text class="stop an-s" x="436" y="468">× D 탈락</text>
  <path class="arrow" d="M710 200 H836"/><path class="arrow" d="M710 290 H836"/>
  <text class="stop an-s" x="726" y="368">× C 탈락</text>
  <rect class="score" x="840" y="140" width="330" height="300" rx="12"/>
  <text class="h an-m" x="1005" y="186">A·B 점수 비교</text>
  <text class="b an-s" x="866" y="246">신호 · 고유성·감쇠</text>
  <text class="b an-s" x="866" y="300">품질 · 안정성·지연</text>
  <text class="b an-s" x="866" y="354">상업 · 총소유비용</text>
  <text class="b an-s" x="866" y="408">운영 · 용량·유지보수</text>
</svg>
