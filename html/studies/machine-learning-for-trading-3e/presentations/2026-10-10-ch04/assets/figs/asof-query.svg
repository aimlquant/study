  <text class="b an-s" x="730" y="232">② 당시 최신 버전</text>
  <text class="b an-e" x="852" y="392">공개 순 마지막 행</text>
  <text class="s an-m" x="975" y="244">t 이후 공개</text>
  <line class="axis" x1="190" y1="470" x2="1130" y2="470"/>
  <line class="tick" x1="249" y1="462" x2="249" y2="478"/><text class="s an-m" x="249" y="506">2/15</text>
  <line class="tick" x1="699" y1="462" x2="699" y2="478"/><text class="s an-m" x="699" y="506">5/10</text>
