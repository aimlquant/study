<svg xmlns="http://www.w3.org/2000/svg" width="980" height="450" viewBox="0 0 980 450" role="img" aria-labelledby="desc"><desc id="desc">예측과 경제적 이유의 두 출발점이 공통 검증을 거쳐 거래 신호 또는 측정 결과로 연결됨. 경로와 결과가 일대일 대응이라는 뜻은 아님.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#17375e"/></marker></defs><style>text{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'NanumGothic', 'Inter', system-ui, sans-serif;}</style><g font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect x="70" y="25" width="360" height="80" rx="10" fill="#e8eef5" stroke="#59728d" stroke-width="2"/><text x="250.0" y="73.0" font-size="24" fill="#17375e" text-anchor="middle">예측할 대상부터</text><rect x="550" y="25" width="360" height="80" rx="10" fill="#e8eef5" stroke="#59728d" stroke-width="2"/><text x="730.0" y="73.0" font-size="24" fill="#17375e" text-anchor="middle">경제적 이유부터</text><text x="250" y="144" font-size="24" fill="#17375e" text-anchor="middle">입력·모델을 비교</text><text x="730" y="144" font-size="24" fill="#17375e" text-anchor="middle">시험할 가정을 좁힘</text><path d="M250 159 V205" fill="none" stroke="#17375e" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 159 V205" fill="none" stroke="#17375e" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="205" width="840" height="85" rx="10" fill="#dde8f2" stroke="#59728d" stroke-width="2"/><text x="490.0" y="255.5" font-size="24" fill="#17375e" text-anchor="middle">같은 검증: 정보 시점 · 새 기간 · 비용</text><path d="M250 290 V345" fill="none" stroke="#17375e" stroke-width="3" marker-end="url(#arrow)"/><path d="M730 290 V345" fill="none" stroke="#17375e" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="345" width="360" height="80" rx="10" fill="#edf2f7" stroke="#59728d" stroke-width="2"/><text x="250.0" y="393.0" font-size="24" fill="#17375e" text-anchor="middle">거래 신호</text><rect x="550" y="345" width="360" height="80" rx="10" fill="#edf2f7" stroke="#59728d" stroke-width="2"/><text x="730.0" y="393.0" font-size="24" fill="#17375e" text-anchor="middle">위험·수익 기여 측정</text></g></svg>