<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-labelledby="desc"><desc id="desc">원서 본문이 보고한 1927–2024년 사후 국면별 연율 변동성: Risk-On 8.6%, Risk-Off 19.1%. 동일 척도의 막대. 원서 그림 범례 9.8%/12.7%와는 별도 집계.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#17375e"/></marker></defs><style>text{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'NanumGothic', 'Inter', system-ui, sans-serif;}</style><g font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><text x="250" y="38" font-size="28" fill="#17375e" text-anchor="middle">Risk-On</text><text x="715" y="38" font-size="28" fill="#17375e" text-anchor="middle">Risk-Off</text><rect x="155" y="186.0" width="190" height="86.0" rx="3" fill="#31577e"/><text x="250" y="171.0" font-size="30" fill="#17375e" text-anchor="middle">8.6%</text><rect x="620" y="81.0" width="190" height="191.0" rx="3" fill="#31577e"/><text x="715" y="66.0" font-size="30" fill="#17375e" text-anchor="middle">19.1%</text><path d="M70 272 H445 M535 272 H910" stroke="#59728d" stroke-width="2" fill="none"/></g></svg>