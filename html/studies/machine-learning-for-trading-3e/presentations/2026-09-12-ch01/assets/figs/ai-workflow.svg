<svg xmlns="http://www.w3.org/2000/svg" width="980" height="550" viewBox="0 0 980 550" role="img" aria-labelledby="desc"><desc id="desc">연구의 일곱 단계에서 수치 분석과 생성형 AI가 돕는 작업 예시. 원서 그림 1.4의 단계별 취지를 자체 정리한 표이며 원서 ML열 행 배치를 그대로 옮기지 않음.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#17375e"/></marker></defs><style>text{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'NanumGothic', 'Inter', system-ui, sans-serif;}</style><g font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect x="20" y="12" width="250" height="56" rx="10" fill="#dde8f2" stroke="#59728d" stroke-width="2"/><text x="145.0" y="48.0" font-size="24" fill="#17375e" text-anchor="middle">연구 단계</text><rect x="285" y="12" width="310" height="56" rx="10" fill="#dde8f2" stroke="#59728d" stroke-width="2"/><text x="440.0" y="48.0" font-size="24" fill="#17375e" text-anchor="middle">수치 분석의 예</text><rect x="610" y="12" width="350" height="56" rx="10" fill="#dde8f2" stroke="#59728d" stroke-width="2"/><text x="785.0" y="48.0" font-size="24" fill="#17375e" text-anchor="middle">생성형 AI의 예</text><rect x="20" y="84" width="250" height="51" rx="10" fill="#f6f8fb" stroke="#59728d" stroke-width="2"/><text x="145.0" y="117.5" font-size="24" fill="#17375e" text-anchor="middle">가설</text><rect x="285" y="84" width="310" height="51" rx="10" fill="#f6f8fb" stroke="#59728d" stroke-width="2"/><text x="440.0" y="117.5" font-size="24" fill="#17375e" text-anchor="middle">패턴 탐색</text><rect x="610" y="84" width="350" height="51" rx="10" fill="#f6f8fb" stroke="#59728d" stroke-width="2"/><text x="785.0" y="117.5" font-size="24" fill="#17375e" text-anchor="middle">자료·가설 정리</text><rect x="20" y="149" width="250" height="51" rx="10" fill="#f6f8fb" stroke="#59728d" stroke-width="2"/><text x="145.0" y="182.5" font-size="24" fill="#