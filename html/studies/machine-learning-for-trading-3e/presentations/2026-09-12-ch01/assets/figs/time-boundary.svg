<svg xmlns="http://www.w3.org/2000/svg" width="980" height="205" viewBox="0 0 980 205" role="img" aria-labelledby="desc"><desc id="desc">앞 기간에서 규칙을 비교하고 평가 조건을 고정한 뒤 처음 보는 뒤 기간에 시험함.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 Z" fill="#17375e"/></marker></defs><style>text{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'NanumGothic', 'Inter', system-ui, sans-serif;}</style><g font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"><rect x="30" y="48" width="260" height="80" rx="10" fill="#edf2f7" stroke="#59728d" stroke-width="2"/><text x="160.0" y="96.0" font-size="24" fill="#17375e" text-anchor="middle">앞 기간</text><text x="160" y="174" font-size="25" fill="#17375e" text-anchor="middle">규칙 비교·수정</text><rect x="360" y="48" width="260" height="80" rx="10" fill="#edf2f7" stroke="#59728d" stroke-width="2"/><text x="490.0" y="96.0" font-size="24" fill="#17375e" text-anchor="middle">규칙 고정</text><text x="490" y="174" font-size="25" fill="#17375e" text-anchor="middle">평가 조건 확정</text><rect x="690" y="48" width="260" height="80" rx="10" fill="#edf2f7" stroke="#59728d" stroke-width="2"/><text x="820.0" y="96.0" font-size="24" fill="#17375e" text-anchor="middle">뒤 기간</text><text x="820" y="174" font-size="25" fill="#17375e" text-anchor="middle">처음 보는 자료</text><path d="M290 88 H360" fill="none" stroke="#17375e" stroke-width="3" marker-end="url(#arrow)"/><path d="M620 88 H690" fill="none" stroke="#17375e" stroke-width="3" marker-end="url(#arrow)"/></g></svg>