<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif">
  <title id="title">배깅이 학습 표본에 따른 예측 차이를 줄이는 원리</title>
  <desc id="desc">같은 관측값에 대해 서로 다른 부트스트랩 표본으로 학습한 다섯 트리의 예측이 흩어져 있고, 그 평균을 초록 다이아몬드로 표시한다.</desc>
  <defs><style>
    .head{fill:#101828;font-size:15px;font-weight:700}.small{fill:#606978;font-size:11px}.axis{stroke:#818895;stroke-width:1.5}.grid{stroke:#e5e8ec;stroke-width:1}.range{stroke:#9aa2ad;stroke-width:5;stroke-linecap:round}.dot{fill:#697586;stroke:#fff;stroke-width:1}.mean{fill:#1f7042;stroke:#fff;stroke-width:1.5}.label{fill:#1f7042;font-size:12px;font-weight:700}.card{fill:#f7f8fa;stroke:#d3d7de;stroke-width:1.3}.note{fill:#173b67;font-size:12px;font-weight:700}.pill{fill:#e8f4ec;stroke:#1f7042;stroke-width:1.4}
  </style></defs>
  <text x="38" y="73" class="small">예측</text>
  <line x1="88" y1="64" x2="88" y2="285" class="axis"/><line x1="88" y1="285" x2="590" y2="285" class="axis"/>
  <line x1="88" y1="100" x2="590" y2="100" class="grid"/><line x1="88" y1="160" x2="590" y2="160" class="grid"/><line x1="88" y1="220" x2="590" y2="220" class="grid"/>
  <text x="78" y="104" text-anchor="end" class="small">+1%</text><text x="78" y="164" text-anchor="end" class="small">0%</text><text x="78" y="224" text-anchor="end" class="small">−1%</text>

  <line x1="190" y1="91" x2="190" y2="199" class="range"/>
  <circle cx="182" cy="91" r="6" class="dot"/><circle cx="196" cy="119" r="6" class="dot"/><circle cx="184" cy="145" r="6" class="dot"/><circle cx="198" cy="173" r="6" class="dot"/><circle cx="188" cy="199" r="6" class="dot"/>
  <path d="M190 129l9 9-9 9-9-9z" class="mean"/><text x="209" y="142" class="label">평균 +0.4%</text>
  <text x="190" y="307" text-anchor="middle" class="small">관측 A</text>

  <line x1="340" y1="132" x2="340" y2="238" class="range"/>
  <circle cx="332" cy="132" r="6" class="dot"/><circle cx="348" cy="154" r="6" class="dot"/><circle cx="334" cy="178" r="6" class="dot"/><circle cx="348" cy="209" r="6" class="dot"/><circle cx="336" cy="238" r="6" class="dot"/>
  <path d="M340 173l9 9-9 9-9-9z" class="mean"/><text x="359" y="186" class="label">평균 −0.4%</text>
  <text x="340" y="307" text-anchor="middle" class="small">관측 B</text>

  <line x1="490" y1="79" x2="490" y2="174" class="range"/>
  <circle cx="482" cy="79" r="6" class="dot"/><circle cx="498" cy="101" r="6" class="dot"/><circle cx="484" cy="119" r="6" class="dot"/><circle cx="498" cy="147" r="6" class="dot"/><circle cx="486" cy="174" r="6" class="dot"/>
  <path d="M490 114l9 9-9 9-9-9z" class="mean"/><text x="509" y="127" class="label">평균 +0.6%</text>
  <text x="490" y="307" text-anchor="middle" class="small">관측 C</text>

  <rect x="634" y="64" width="230" height="69" rx="12" class="card"/>
  <text x="749" y="88" text-anchor="middle" class="note">회색 점 5개</text>
  <text x="749" y="109" text-anchor="middle" class="small">서로 다른 표본으로 학습한</text><text x="749" y="125" text-anchor="middle" class="small">트리 5개의 개별 예측</text>
  <rect x="634" y="148" width="230" height="69" rx="12" class="pill"/>
  <text x="749" y="173" text-anchor="middle" class="label">초록 다이아몬드</text>
  <text x="749" y="194" text-anchor="middle" class="small">다섯 예측의 평균을</text><text x="749" y="210" text-anchor="middle" class="small">최종 예측으로 사용</text>
  <rect x="634" y="232" width="230" height="72" rx="12" fill="#fff7ed" stroke="#c85b2a" stroke-width="1.4"/>
  <text x="749" y="256" text-anchor="middle" fill="#9b3f1d" font-size="12" font-weight="700">무엇이 줄어드나?</text>
  <text x="749" y="278" text-anchor="middle" class="small">학습 표본을 다시 뽑을 때마다</text><text x="749" y="294" text-anchor="middle" class="small">최종 예측이 바뀌는 정도</text>
</svg>
