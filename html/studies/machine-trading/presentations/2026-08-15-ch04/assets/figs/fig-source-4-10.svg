      .muted{fill:#F3F1EC;stroke:#8A8377;stroke-width:1.3}
      .mutedt{fill:#6B6357;font-size:10.5px;font-weight:700;text-anchor:middle}
      .a{stroke:#0F2C59;stroke-width:1.4;fill:none;marker-end:url(#ah)}
      .ar{stroke:#A3341F;stroke-width:1.4;fill:none;marker-end:url(#ahr)}
      .ag{stroke:#1B6B3A;stroke-width:1.4;fill:none;marker-end:url(#ahg)}
      .plain{stroke:#0F2C59;stroke-width:1.3;fill:none}
      .axis{stroke:#8A8377;stroke-width:1.1;fill:none}
      .grid{stroke:#E7E5E4;stroke-width:1;fill:none}
      .ln{stroke:#0F2C59;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
      .lnr{stroke:#A3341F;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
      .lng{stroke:#1B6B3A;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
      .lnthin{stroke:#9AA9C4;stroke-width:1.1;fill:none;stroke-linejoin:round}
      .dash{stroke:#8A8377;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
      .band{fill:#0F2C59;opacity:.07}
      .bandr{fill:#A3341F;opacity:.09}
      .edge{fill:none;stroke:#0F2C59;stroke-width:1.3}
      .halo{paint-order:stroke fill;stroke:#FAFAF9;stroke-width:3.5px;stroke-linejoin:round}
