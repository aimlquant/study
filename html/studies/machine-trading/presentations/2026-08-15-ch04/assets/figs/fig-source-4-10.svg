<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif">
  <title id="title">두 상태 HMM의 전이 확률</title>
  <desc id="desc">강세 상태에서 강세로 남을 확률은 0.60, 약세로 바뀔 확률은 0.40이다. 약세 상태에서 강세로 바뀔 확률은 0.75, 약세로 남을 확률은 0.25다. 화살표 굵기는 확률에 비례한다.</desc>
  <defs>
    <marker id="blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#173b67"/></marker>
    <marker id="green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#1f7042"/></marker>
    <marker id="red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#b54724"/></marker>
    <style>.state1{fill:#e8f4ec;stroke:#1f7042;stroke-width:2.5}.state2{fill:#fde8df;stroke:#b54724;stroke-width:2.5}.name1{fill:#1f7042;font-size:17px;font-weight:700}.name2{fill:#b54724;font-size:17px;font-weight:700}.prob{fill:#101828;font-size:13px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5}.small{fill:#606978;font-size:11px}.sum{fill:#173b67;font-size:12px;font-weight:700}.loop1{fill:none;stroke:#1f7042;stroke-width:4.2;marker-end:url(#green)}.loop2{fill:none;stroke:#b54724;stroke-width:2.3;marker-end:url(#red)}.to2{fill:none;stroke:#173b67;stroke-width:3.3;marker-end:url(#blue)}.to1{fill:none;stroke:#173b67;stroke-width:5.2;marker-end:url(#blue)}</style>
  </defs>
  <circle cx="250" cy="177" r="76" class="state1"/><text x="250" y="169" text-anchor="middle" class="name1">상태 1</text><text x="250" y="194" text-anchor="middle" class="name1">강세</text>
  <circle cx="650" cy="177" r="76" class="state2"/><text x="650" y="169" text-anchor="middle" class="name2">상태 2</text><text x="650" y="194" text-anchor="middle" class="name2">약세</text>
  <path d="M326 157C430 107 525 107 574 157" class="to2"/><text x="450" y="112" text-anchor="middle" class="prob">0.40 · 약세로 전환</text>
  <path d="M574 205C505 270 395 270 326 205" class="to1"/><text x="450" y="277" text-anchor="middle" class="prob">0.75 · 강세로 전환</text>
  <path d="M214 110C170 55 205 24 250 24C297 24 332 57 287 111" class="loop1"/><text x="250" y="20" text-anchor="middle" class="prob">0.60 · 유지</text>
  <path d="M614 110C570 55 605 24 650 24C697 24 732 57 687 111" class="loop2"/><text x="650" y="20" text-anchor="middle" class="prob">0.25 · 유지</text>
  <rect x="130" y="302" width="240" height="24" rx="7" fill="#e8f4ec"/><text x="250" y="319" text-anchor="middle" class="sum">강세에서 나감: 0.60 + 0.40 = 1</text>
  <rect x="530" y="302" width="240" height="24" rx="7" fill="#fde8df"/><text x="650" y="319" text-anchor="middle" class="sum">약세에서 나감: 0.75 + 0.25 = 1</text>
</svg>
