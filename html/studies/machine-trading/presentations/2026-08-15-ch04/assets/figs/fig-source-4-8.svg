<text class="lab an-s" x="56" y="46">플러스 라벨</text>
<text class="lab an-e" x="464" y="46" fill="#A3341F">마이너스 라벨</text>
<text class="s an-m halo" x="252" y="176" transform="rotate(-63 252 176)">분리 초평면</text>
<path class="ag" d="M258,330 H186" />
<path class="ag" d="M186,330 H258" />
<path class="axis" d="M186,318 V342 M258,318 V342" stroke="#1B6B3A"/>
<text class="goodt an-m halo" x="222" y="356">마진</text>
<path class="a" d="M512,112 L396,100"/>
<text class="labl" x="502" y="88">서포트 벡터</text>
<text class="sl" x="502" y="130">초평면에 가장 가까운 점들.</text>
<text class="sl" x="502" y="148">이들만이 경계 위치를 정한다.</text>
<text class="labl" x="502" y="192" fill="#1B6B3A">마진을 넓게 잡는 이유</text>
<text class="sl" x="502" y="214">한쪽에 아슬아슬하게 붙은 선은</text>
<text class="sl" x="502" y="232">새 데이터가 조금만 달라져도</text>
<text class="sl" x="502" y="250">반대편으로 넘어가 오분류된다.</text>
<text class="sl" x="502" y="274">가장 멀찍이 떨어진 선을 고르면</text>
<text class="sl" x="502" y="292">데이터가 흔들려도 올바른 쪽에</text>
<text class="sl" x="502" y="310">남는다 — 표본 외 안전 여유다.</text>
<text class="sl" x="40" y="380">m차원 공간의 한 점이 표본 하나다(m 은 예측변수의 수). 실제 데이터는 이렇게 순순히 갈라지지 않으므로,</text>
<text class="sl" x="40" y="398">마진을 최대화하는 동시에 오분류된 점에 벌점을 매기는 항을 함께 최소화해 최선의 초평면을 찾는다.</text>
</svg>
