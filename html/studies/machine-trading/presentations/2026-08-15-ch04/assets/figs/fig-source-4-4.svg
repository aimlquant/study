<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif">
  <title id="title">시간 순서를 지키는 다섯 겹 교차 검증</title>
  <desc id="desc">각 폴드에서 과거만 학습하고 바로 다음 구간을 검증한다. 다섯 검증 오차를 평균해 설정을 고르고 전체 학습 기간으로 최종 모델을 다시 적합한다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#173b67"/></marker><style>
    .head{fill:#101828;font-size:15px;font-weight:700}.label{fill:#394150;font-size:12px;font-weight:700}.small{fill:#606978;font-size:11px}.train{fill:#dce8f5;stroke:#173b67;stroke-width:1.4}.valid{fill:#fde8df;stroke:#b54724;stroke-width:1.5}.future{fill:#f2f3f5;stroke:#c6cbd2;stroke-width:1}.avg{fill:#173b67}.avgtext{fill:#fff;font-size:13px;font-weight:700}.final{fill:#e8f4ec;stroke:#1f7042;stroke-width:1.8}.finaltext{fill:#1f7042;font-size:13px;font-weight:700}.arrow{fill:none;stroke:#173b67;stroke-width:2;marker-end:url(#arrow)}.merge{fill:none;stroke:#8b93a0;stroke-width:1.4}
  </style></defs>
  <rect x="610" y="18" width="20" height="14" rx="3" class="train"/><text x="638" y="30" class="small">학습</text>
  <rect x="690" y="18" width="20" height="14" rx="3" class="valid"/><text x="718" y="30" class="small">검증</text>
  <rect x="780" y="18" width="20" height="14" rx="3" class="future"/><text x="808" y="30" class="small">아직 보지 않음</text>

  <g transform="translate(0 0)">
    <text x="72" y="89" text-anchor="end" class="label">폴드 1</text>
    <rect x="92" y="64" width="150" height="34" rx="6" class="train"/><text x="167" y="86" text-anchor="middle" class="small">과거 학습</text>
    <rect x="246" y="64" width="74" height="34" rx="6" class="valid"/><text x="283" y="86" text-anchor="middle" class="small">검증 1</text>
    <rect x="324" y="64" width="386" height="34" rx="6" class="future"/>
    <text x="750" y="86" class="small">RMSE 0.0067</text>

    <text x="72" y="137" text-anchor="end" class="label">폴드 2</text>
    <rect x="92" y="112" width="228" height="34" rx="6" class="train"/><text x="206" y="134" text-anchor="middle" class="small">학습 구간 확장</text>
    <rect x="324" y="112" width="74" height="34" rx="6" class="valid"/><text x="361" y="134" text-anchor="middle" class="small">검증 2</text>
    <rect x="402" y="112" width="308" height="34" rx="6" class="future"/>
    <text x="750" y="134" class="small">RMSE 0.0059</text>

    <text x="72" y="185" text-anchor="end" class="label">폴드 3</text>
    <rect x="92" y="160" width="306" height="34" rx="6" class="train"/><text x="245" y="182" text-anchor="middle" class="small">학습 구간 확장</text>
    <rect x="402" y="160" width="74" height="34" rx="6" class="valid"/><text x="439" y="182" text-anchor="middle" class="small">검증 3</text>
    <rect x="480" y="160" width="230" height="34" rx="6" class="future"/>
    <text x="750" y="182" class="small">RMSE 0.0119</text>

    <text x="72" y="233" text-anchor="end" class="label">폴드 4</text>
    <rect x="92" y="208" width="384" height="34" rx="6" class="train"/><text x="284" y="230" text-anchor="middle" class="small">학습 구간 확장</text>
    <rect x="480" y="208" width="74" height="34" rx="6" class="valid"/><text x="517" y="230" text-anchor="middle" class="small">검증 4</text>
    <rect x="558" y="208" width="152" height="34" rx="6" class="future"/>
    <text x="750" y="230" class="small">RMSE 0.0271</text>

    <text x="72" y="281" text-anchor="end" class="label">폴드 5</text>
    <rect x="92" y="256" width="462" height="34" rx="6" class="train"/><text x="323" y="278" text-anchor="middle" class="small">학습 구간 확장</text>
    <rect x="558" y="256" width="74" height="34" rx="6" class="valid"/><text x="595" y="278" text-anchor="middle" class="small">검증 5</text>
    <rect x="636" y="256" width="74" height="34" rx="6" class="future"/>
    <text x="750" y="278" class="small">RMSE 0.0194</text>
  </g>

  <path d="M826 81H842V273M826 129H842M826 177H842M826 225H842M826 273H842" class="merge"/>
  <path d="M842 177V334H662" class="arrow"/>
  <rect x="432" y="310" width="230" height="48" rx="11" class="avg"/>
  <text x="547" y="331" text-anchor="middle" class="avgtext">검증 오차 평균 = 0.0142</text>
  <text x="547" y="349" text-anchor="middle" fill="#d8e4f2" font-size="11">테스트셋은 아직 열지 않는다</text>
  <path d="M432 334H384" class="arrow"/>
  <rect x="86" y="306" width="298" height="56" rx="11" class="final"/>
  <text x="235" y="329" text-anchor="middle" class="finaltext">설정을 고른 뒤 전체 학습 구간으로 재학습</text>
  <text x="235" y="350" text-anchor="middle" class="small">그 다음에만 테스트셋을 한 번 평가</text>
  <line x1="92" y1="394" x2="710" y2="394" stroke="#9aa2ad" stroke-width="1.5"/>
  <line x1="92" y1="388" x2="92" y2="400" stroke="#9aa2ad"/><line x1="710" y1="388" x2="710" y2="400" stroke="#9aa2ad"/>
  <text x="92" y="418" class="small">과거</text><text x="710" y="418" text-anchor="end" class="small">미래</text>
</svg>
