<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif">
  <title id="title">뉴런의 가중합과 시그모이드 함수</title>
  <desc id="desc">ret1 ret2 ret5에 가중치를 곱해 더하고 편향을 더해 z를 만든 뒤 시그모이드 함수에 넣는다. 함수는 z가 마이너스 2일 때 0.12, 0일 때 0.5, 2일 때 0.88을 출력한다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#173b67"/></marker><style>.head{fill:#101828;font-size:16px;font-weight:700}.input{fill:#fff;stroke:#173b67;stroke-width:1.6}.sum{fill:#eaf1f9;stroke:#173b67;stroke-width:2}.activation{fill:#e8f4ec;stroke:#1f7042;stroke-width:2}.title{fill:#173b67;font-size:13px;font-weight:700}.green{fill:#1f7042;font-size:13px;font-weight:700}.body{fill:#4f5866;font-size:11px}.arrow{fill:none;stroke:#173b67;stroke-width:2;marker-end:url(#arrow)}.axis{stroke:#818895;stroke-width:1.3}.grid{stroke:#e5e8ec;stroke-width:1}.curve{fill:none;stroke:#1f7042;stroke-width:3}.dot{fill:#b54724;stroke:#fff;stroke-width:1.4}.small{fill:#606978;font-size:10.5px}</style></defs>
  <rect x="32" y="75" width="112" height="40" rx="9" class="input"/><text x="88" y="100" text-anchor="middle" class="title">ret1 × w₁</text>
  <rect x="32" y="137" width="112" height="40" rx="9" class="input"/><text x="88" y="162" text-anchor="middle" class="title">ret2 × w₂</text>
  <rect x="32" y="199" width="112" height="40" rx="9" class="input"/><text x="88" y="224" text-anchor="middle" class="title">ret5 × w₃</text>
  <path d="M144 95H190V133H218" class="arrow"/><path d="M144 157H218" class="arrow"/><path d="M144 219H190V181H218" class="arrow"/>
  <circle cx="278" cy="157" r="60" class="sum"/><text x="278" y="145" text-anchor="middle" class="title">가중합</text><text x="278" y="168" text-anchor="middle" class="body">z = Σwᵢxᵢ + b</text><text x="278" y="188" text-anchor="middle" class="small">편향 b는 한 번만 더한다</text>
  <path d="M338 157H383" class="arrow"/>
  <rect x="391" y="112" width="130" height="90" rx="13" class="activation"/><text x="456" y="143" text-anchor="middle" class="green">시그모이드</text><text x="456" y="166" text-anchor="middle" class="body">σ(z)=1/(1+e⁻ᶻ)</text><text x="456" y="187" text-anchor="middle" class="small">출력 범위 0~1</text>
  <path d="M521 157H562" class="arrow"/>
  <line x1="606" y1="265" x2="860" y2="265" class="axis"/><line x1="733" y1="63" x2="733" y2="290" class="axis"/>
  <line x1="606" y1="164" x2="860" y2="164" class="grid"/><text x="596" y="168" text-anchor="end" class="small">0.5</text><text x="596" y="73" text-anchor="end" class="small">1.0</text><text x="596" y="269" text-anchor="end" class="small">0</text>
  <path d="M606 256C650 251 681 226 704 192C719 171 730 164 733 164C752 164 767 119 790 94C811 71 835 68 860 67" class="curve"/>
  <circle cx="669" cy="235" r="5.5" class="dot"/><circle cx="733" cy="164" r="5.5" class="dot"/><circle cx="797" cy="89" r="5.5" class="dot"/>
  <text x="654" y="253" text-anchor="end" class="small">z=−2 → 0.12</text><text x="733" y="151" text-anchor="middle" class="small">z=0 → 0.50</text><text x="811" y="83" class="small">z=2 → 0.88</text>
</svg>
