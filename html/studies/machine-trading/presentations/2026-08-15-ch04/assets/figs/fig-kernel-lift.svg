<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 6 700 192" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif" role="img">
