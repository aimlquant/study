<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif">
  <title id="title">실적 발표 예측을 63일 보유 전략으로 바꾸는 과정</title><desc id="desc">각 실적 발표에서 계산한 63일 예상 수익률의 부호로 매수 또는 공매도를 정하고 다음 거래일부터 63일간 유지한다. 서로 다른 날 시작한 포지션이 오늘 세 개 겹치면 오늘 손익을 세 포지션의 총 절대 노출 3으로 나눠 포트폴리오 일수익률을 계산한다.</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#173b67"/></marker><style>.head{fill:#101828;font-size:16px;font-weight:700}.box{fill:#fff;stroke:#173b67;stroke-width:1.8}.step{fill:#173b67;font-size:13px;font-weight:700}.body{fill:#4f5866;font-size:11px}.label{fill:#394150;font-size:11px;font-weight:700}.buy{fill:#d8efe0;stroke:#1f7042;stroke-width:1.5}.short{fill:#fde1d7;stroke:#b54724;stroke-width:1.5}.buytext{fill:#1f7042;font-size:11px;font-weight:700}.shorttext{fill:#b54724;font-size:11px;font-weight:700}.axis{stroke:#818895;stroke-width:1.4}.today{stroke:#c85b2a;stroke-width:2;stroke-dasharray:5 4}.arrow{fill:none;stroke:#173b67;stroke-width:2.4;marker-end:url(#arrow)}.formula{fill:#eaf1f9;stroke:#173b67;stroke-width:1.5}.metric{fill:#173b67}.white{fill:#fff;font-size:14px;font-weight:700}.pale{fill:#d8e4f2;font-size:11px}.note{fill:#fff7ed;stroke:#c85b2a;stroke-width:1.4}.notetext{fill:#9b3f1d;font-size:11px;font-weight:700}</style></defs>

  <rect x="24" y="64" width="244" height="310" rx="14" class="box"/>
  <text x="44" y="92" class="step">1 · 발표일에 예측</text>
  <text x="146" y="119" text-anchor="middle" class="body">모델 출력 = 이후 63일 예상 수익률</text>
  <rect x="46" y="143" width="200" height="58" rx="10" class="buy"/><text x="64" y="166" class="buytext">종목 A · 1월 3일</text><text x="64" y="187" class="body">예상 +8% → 매수 +1</text>
  <rect x="46" y="215" width="200" height="58" rx="10" class="short"/><text x="64" y="238" class="shorttext">종목 B · 1월 20일</text><text x="64" y="259" class="body">예상 −3% → 공매도 −1</text>
  <rect x="46" y="287" width="200" height="58" rx="10" class="buy"/><text x="64" y="310" class="buytext">종목 C · 2월 2일</text><text x="64" y="331" class="body">예상 +5% → 매수 +1</text>
  <text x="146" y="360" text-anchor="middle" class="body">다음 거래 시점에 진입</text>

  <path d="M268 219H308" class="arrow"/>
  <rect x="316" y="64" width="350" height="310" rx="14" class="box"/>
  <text x="336" y="92" class="step">2 · 각 포지션을 63일 유지</text>
  <line x1="370" y1="326" x2="636" y2="326" class="axis"/><text x="370" y="346" class="body">진입일</text><text x="636" y="346" text-anchor="end" class="body">63일 뒤</text>
  <text x="352" y="151" text-anchor="end" class="label">A 매수</text><rect x="370" y="132" width="226" height="32" rx="7" class="buy"/><text x="483" y="153" text-anchor="middle" class="buytext">+1 포지션 · 63거래일</text>
  <text x="352" y="218" text-anchor="end" class="label">B 공매도</text><rect x="410" y="199" width="226" height="32" rx="7" class="short"/><text x="523" y="220" text-anchor="middle" class="shorttext">−1 포지션 · 63거래일</text>
  <text x="352" y="285" text-anchor="end" class="label">C 매수</text><rect x="448" y="266" width="188" height="32" rx="7" class="buy"/><text x="542" y="287" text-anchor="middle" class="buytext">+1 · 아직 보유 중</text>
  <line x1="548" y1="111" x2="548" y2="315" class="today"/><rect x="516" y="105" width="64" height="22" rx="6" fill="#fff7ed"/><text x="548" y="120" text-anchor="middle" class="shorttext">오늘 t</text>
  <text x="491" y="360" text-anchor="middle" class="body">오늘 세 포지션이 동시에 활성</text>

  <path d="M666 219H706" class="arrow"/>
  <rect x="714" y="64" width="222" height="310" rx="14" class="box"/>
  <text x="734" y="92" class="step">3 · 오늘 수익률 계산</text>
  <rect x="734" y="119" width="182" height="83" rx="10" class="formula"/>
  <text x="825" y="143" text-anchor="middle" class="label">활성 포지션의 오늘 손익</text>
  <text x="825" y="168" text-anchor="middle" class="step">rA − rB + rC</text>
  <line x1="770" y1="176" x2="880" y2="176" stroke="#173b67"/>
  <text x="825" y="194" text-anchor="middle" class="body">|+1| + |−1| + |+1| = 3</text>
  <text x="825" y="226" text-anchor="middle" class="body">총 절대 노출로 나눠</text><text x="825" y="244" text-anchor="middle" class="body">종목 수가 많은 날에도</text><text x="825" y="262" text-anchor="middle" class="body">위험 규모를 맞춘다</text>
  <rect x="734" y="286" width="182" height="66" rx="10" class="metric"/>
  <text x="825" y="311" text-anchor="middle" class="pale">교재 보고값</text><text x="825" y="336" text-anchor="middle" class="white">CAGR 4.0% · 샤프 1.1</text>

  <rect x="112" y="409" width="736" height="38" rx="9" class="note"/>
  <text x="480" y="433" text-anchor="middle" class="notetext">예상 63일 수익률은 포지션의 방향만 정한다. 매일의 전략 수익률은 그날 실제로 열린 포지션들의 하루 손익으로 계산한다.</text>
</svg>
