<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 355" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif">
  <title id="title">실적 발표가 있는 종목과 날짜만 학습 사례로 만들기</title><desc id="desc">날짜와 종목 표 대부분은 발표가 없어 비어 있다. 종목 A의 1월 3일, 종목 C의 1월 4일, 종목 B의 1월 5일 발표 칸만 펀더멘털 변수와 이후 63일 수익률을 가진 사건 목록으로 옮긴다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#173b67"/></marker><style>.head{fill:#101828;font-size:16px;font-weight:700}.cell{fill:#f5f6f7;stroke:#d2d6dc;stroke-width:1}.event{fill:#e8f4ec;stroke:#1f7042;stroke-width:1.5}.label{fill:#394150;font-size:11px;font-weight:700}.small{fill:#606978;font-size:10.5px}.green{fill:#1f7042;font-size:11px;font-weight:700}.title{fill:#173b67;font-size:13px;font-weight:700}.arrow{fill:none;stroke:#173b67;stroke-width:2.2;marker-end:url(#arrow)}.table{fill:#fff;stroke:#173b67;stroke-width:1.5}.row{stroke:#d7dbe1;stroke-width:1}.header{fill:#173b67}.white{fill:#fff;font-size:10.5px;font-weight:700}</style></defs>
  <text x="36" y="72" class="title">날짜 × 종목 달력</text>
  <text x="144" y="98" text-anchor="middle" class="label">종목 A</text><text x="224" y="98" text-anchor="middle" class="label">종목 B</text><text x="304" y="98" text-anchor="middle" class="label">종목 C</text>
  <text x="90" y="131" text-anchor="end" class="label">1/3</text><text x="90" y="181" text-anchor="end" class="label">1/4</text><text x="90" y="231" text-anchor="end" class="label">1/5</text><text x="90" y="281" text-anchor="end" class="label">1/6</text>
  <rect x="104" y="108" width="80" height="40" class="event"/><text x="144" y="133" text-anchor="middle" class="green">발표</text><rect x="184" y="108" width="80" height="40" class="cell"/><rect x="264" y="108" width="80" height="40" class="cell"/>
  <rect x="104" y="148" width="80" height="40" class="cell"/><rect x="184" y="148" width="80" height="40" class="cell"/><rect x="264" y="148" width="80" height="40" class="event"/><text x="304" y="173" text-anchor="middle" class="green">발표</text>
  <rect x="104" y="188" width="80" height="40" class="cell"/><rect x="184" y="188" width="80" height="40" class="event"/><text x="224" y="213" text-anchor="middle" class="green">발표</text><rect x="264" y="188" width="80" height="40" class="cell"/>
  <rect x="104" y="228" width="80" height="40" class="cell"/><rect x="184" y="228" width="80" height="40" class="cell"/><rect x="264" y="228" width="80" height="40" class="cell"/>
  <text x="224" y="303" text-anchor="middle" class="small">회색 = 발표 없음 · 결측 오류가 아님</text>
  <path d="M360 188H426" class="arrow"/><text x="393" y="170" text-anchor="middle" class="small">발표 칸만 추출</text>
  <text x="450" y="72" class="title">사건 목록 · 회귀모형에 넣는 실제 행</text>
  <rect x="450" y="88" width="440" height="208" rx="10" class="table"/>
  <path d="M450 126H890" class="header"/><rect x="450" y="88" width="440" height="38" rx="10" class="header"/>
  <text x="493" y="112" text-anchor="middle" class="white">날짜</text><text x="559" y="112" text-anchor="middle" class="white">종목</text><text x="685" y="112" text-anchor="middle" class="white">발표 시점 요인 7개</text><text x="822" y="112" text-anchor="middle" class="white">이후 63일 수익률</text>
  <line x1="450" y1="182" x2="890" y2="182" class="row"/><line x1="450" y1="238" x2="890" y2="238" class="row"/>
  <text x="493" y="157" text-anchor="middle" class="small">1/3</text><text x="559" y="157" text-anchor="middle" class="small">A</text><text x="685" y="157" text-anchor="middle" class="small">유동비율 · ROA · …</text><text x="822" y="157" text-anchor="middle" class="small">+8.0%</text>
  <text x="493" y="213" text-anchor="middle" class="small">1/4</text><text x="559" y="213" text-anchor="middle" class="small">C</text><text x="685" y="213" text-anchor="middle" class="small">유동비율 · ROA · …</text><text x="822" y="213" text-anchor="middle" class="small">−3.0%</text>
  <text x="493" y="269" text-anchor="middle" class="small">1/5</text><text x="559" y="269" text-anchor="middle" class="small">B</text><text x="685" y="269" text-anchor="middle" class="small">유동비율 · ROA · …</text><text x="822" y="269" text-anchor="middle" class="small">+5.0%</text>
  <rect x="176" y="320" width="568" height="26" rx="7" fill="#fff7ed" stroke="#c85b2a"/><text x="460" y="338" text-anchor="middle" fill="#9b3f1d" font-size="11" font-weight="700">요인은 발표 당시 알 수 있는 값, 목표값은 그 뒤 63거래일 동안 실제로 난 수익률이다.</text>
</svg>
