<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" role="img" aria-labelledby="title desc" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif">
  <title id="title">검증 구간으로 신경망 하나를 선택하는 방법</title><desc id="desc">같은 학습 구간에서 초기값이 다른 모델 세 개를 학습하고, 바로 뒤 검증 구간의 오차를 비교해 모델 2 하나를 선택한 뒤 테스트셋에 한 번 적용한다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#173b67"/></marker><style>.head{fill:#101828;font-size:16px;font-weight:700}.box{fill:#fff;stroke:#173b67;stroke-width:1.7}.winner{fill:#e8f4ec;stroke:#1f7042;stroke-width:2}.test{fill:#173b67}.title{fill:#173b67;font-size:13px;font-weight:700}.green{fill:#1f7042;font-size:13px;font-weight:700}.body{fill:#56606e;font-size:11px}.white{fill:#fff;font-size:13px;font-weight:700}.arrow{fill:none;stroke:#173b67;stroke-width:2.2;marker-end:url(#arrow)}.time{fill:#f2f3f5;stroke:#c7ccd3}.train{fill:#dce8f5}.valid{fill:#fde8df}</style></defs>
  <text x="28" y="30" class="head">방법 A · 검증 성과로 하나를 고른다</text>
  <rect x="28" y="54" width="332" height="34" rx="7" class="time"/><rect x="28" y="54" width="236" height="34" rx="7" class="train"/><rect x="264" y="54" width="96" height="34" rx="7" class="valid"/>
  <text x="146" y="76" text-anchor="middle" class="body">학습 구간</text><text x="312" y="76" text-anchor="middle" class="body">검증 구간</text>
  <rect x="28" y="112" width="168" height="54" rx="10" class="box"/><text x="112" y="135" text-anchor="middle" class="title">모델 1 · 시드 A</text><text x="112" y="155" text-anchor="middle" class="body">검증 오차 0.14</text>
  <rect x="28" y="178" width="168" height="54" rx="10" class="winner"/><text x="112" y="201" text-anchor="middle" class="green">모델 2 · 시드 B</text><text x="112" y="221" text-anchor="middle" class="body">검증 오차 0.09 · 최저</text>
  <rect x="212" y="112" width="148" height="54" rx="10" class="box"/><text x="286" y="135" text-anchor="middle" class="title">모델 3 · 시드 C</text><text x="286" y="155" text-anchor="middle" class="body">검증 오차 0.17</text>
  <path d="M196 205H438" class="arrow"/>
  <rect x="438" y="154" width="184" height="102" rx="12" class="winner"/><text x="530" y="185" text-anchor="middle" class="green">모델 2 선택</text><text x="530" y="211" text-anchor="middle" class="body">규칙을 여기서 고정</text><text x="530" y="231" text-anchor="middle" class="body">테스트 재선택 금지</text>
  <path d="M622 205H674" class="arrow"/>
  <rect x="674" y="154" width="198" height="102" rx="12" class="test"/><text x="773" y="185" text-anchor="middle" class="white">테스트셋 1회 평가</text><text x="773" y="212" text-anchor="middle" fill="#d8e4f2" font-size="11">선택에 쓰지 않은 미래 구간</text><text x="773" y="232" text-anchor="middle" fill="#d8e4f2" font-size="11">최종 일반화 성능만 측정</text>
</svg>
