<text class="sl" x="20" y="296">평균회귀 규칙은 테스트셋 전반부까지만 통했다. 극단 잎 두 개만 쓰므로 조건에 맞지 않는 날은 포지션이 없다.</text>
<text class="sl" x="20" y="314">모든 잎을 다 쓰면 표본 내 CAGR 은 73% 까지 오르지만 표본 외는 −7.2% 로 무너진다.</text>
