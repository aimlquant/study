<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 700 280" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif" role="img">
  <defs>
