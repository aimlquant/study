<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 36 706 292" font-family="Noto Sans CJK KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,NanumGothic,Inter,system-ui,sans-serif" role="img">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0F2C59"/></marker>
    <marker id="ahr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#A3341F"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1B6B3A"/></marker>
    <style>
      .t{fill:#0F0F10;font-size:13px;font-weight:700;text-anchor:middle}
      .tl{fill:#0F0F10;font-size:12.5px;font-weight:700;text-anchor:start}
      .s{fill:#57534E;font-size:10.5px;text-anchor:middle}
      .sl{fill:#57534E;font-size:10.5px;text-anchor:start}
      .sr{fill:#57534E;font-size:10.5px;text-anchor:end}
      .lab{fill:#0F2C59;font-size:11.5px;font-weight:700;text-anchor:middle}
      .labl{fill:#0F2C59;font-size:11.5px;font-weight:700;text-anchor:start}
      .box{fill:#fff;stroke:#0F2C59;stroke-width:1.4}
      .key{fill:#0F2C59;stroke:#0F2C59}
      .tk{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
      .sk{fill:#C7D2E6;font-size:10.5px;text-anchor:middle}
      .good{fill:#E8F1EA;stroke:#1B6B3A;stroke-width:1.4}
      .goodt{fill:#1B6B3A;font-size:11px;font-weight:700;text-anchor:middle}
      .warn{fill:#FBEFEA;stroke:#A3341F;stroke-width:1.4}
      .warnt{fill:#A3341F;font-size:11px;font-weight:700;text-anchor:middle}
      .muted{fill:#F3F1EC;stroke:#8A8377;stroke-width:1.3}
      .mutedt{fill:#6B6357;font-size:10.5px;font-weight:700;text-anchor:middle}
      .a{stroke:#0F2C59;stroke-width:1.4;fill:none;marker-end:url(#ah)}
      .ar{stroke:#A3341F;stroke-width:1.4;fill:none;marker-end:url(#ahr)}
      .ag{stroke:#1B6B3A;stroke-width:1.4;fill:none;marker-end:url(#ahg)}
      .plain{stroke:#0F2C59;stroke-width:1.3;fill:none}
      .axis{stroke:#8A8377;stroke-width:1.1;fill:none}
      .grid{stroke:#E7E5E4;stroke-width:1;fill:none}
      .ln{stroke:#0F2C59;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
      .lnr{stroke:#A3341F;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
      .lng{stroke:#1B6B3A;stroke-width:2.2;fill:none;stroke-linejoin:round;stroke-linecap:round}
      .lnthin{stroke:#9AA9C4;stroke-width:1.1;fill:none;stroke-linejoin:round}
      .dash{stroke:#8A8377;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
      .band{fill:#0F2C59;opacity:.07}
      .bandr{fill:#A3341F;opacity:.09}
      .edge{fill:none;stroke:#0F2C59;stroke-width:1.3}
      .halo{paint-order:stroke fill;stroke:#FAFAF9;stroke-width:3.5px;stroke-linejoin:round}
      .an-s{text-anchor:start}
      .an-m{text-anchor:middle}
      .an-e{text-anchor:end}
    </style>
  </defs>
<rect class="box" x="16" y="46" width="206" height="214" rx="12"/>
<text class="lab an-m" x="119" y="70">① 약한 학습기</text>
<text class="s an-m" x="119" y="88">혼자서는 표본 외에 약하다</text>
<rect x="30" y="104" width="178" height="20" rx="6" fill="#E8EEF7" stroke="#0F2C59" stroke-width="1"/>
<text class="s an-s" x="40" y="118" style="font-size:10.5px">단계적 회귀</text>
<text class="s an-e" x="200" y="118" style="font-size:9.5px;fill:#0F2C59">§4.1</text>
<rect x="30" y="129" width="178" height="20" rx="6" fill="#E8EEF7" stroke="#0F2C59" stroke-width="1"/>
<text class="s an-s" x="40" y="143" style="font-size:10.5px">회귀 트리</text>
<text class="s an-e" x="200" y="143" style="font-size:9.5px;fill:#0F2C59">§4.2</text>
<rect x="30" y="154" width="178" height="20" rx="6" fill="#E8EEF7" stroke="#0F2C59" stroke-width="1"/>
<text class="s an-s" x="40" y="168" style="font-size:10.5px">분류 트리</text>
<text class="s an-e" x="200" y="168" style="font-size:9.5px;fill:#0F2C59">§4.7</text>
<rect x="30" y="179" width="178" height="20" rx="6" fill="#E8EEF7" stroke="#0F2C59" stroke-width="1"/>
<text class="s an-s" x="40" y="193" style="font-size:10.5px">서포트 벡터 머신</text>
<text class="s an-e" x="200" y="193" style="font-size:9.5px;fill:#0F2C59">§4.8</text>
<rect x="30" y="204" width="178" height="20" rx="6" fill="#E8EEF7" stroke="#0F2C59" stroke-width="1"/>
<text class="s an-s" x="40" y="218" style="font-size:10.5px">은닉 마르코프 모델</text>
<text class="s an-e" x="200" y="218" style="font-size:9.5px;fill:#0F2C59">§4.9</text>
<rect x="30" y="229" width="178" height="20" rx="6" fill="#E8EEF7" stroke="#0F2C59" stroke-width="1"/>
<text class="s an-s" x="40" y="243" style="font-size:10.5px">신경망</text>
<text class="s an-e" x="200" y="243" style="font-size:9.5px;fill:#0F2C59">§4.10</text>
<path class="a" d="M224,152 L250,152"/>
<rect class="box" x="254" y="46" width="206" height="168" rx="12"/>
<text class="lab an-m" x="357" y="70">② 무작위성과 검증</text>
<text class="s an-m" x="357" y="88">과적합을 줄이는 장치</text>
<rect x="268" y="104" width="178" height="18" rx="6" fill="#E8F1EA" stroke="#1B6B3A" stroke-width="1"/>
<text class="s an-m" x="357" y="117" style="font-size:10.5px">교차 검증 §4.3</text>
<rect x="268" y="126" width="178" height="18" rx="6" fill="#E8F1EA" stroke="#1B6B3A" stroke-width="1"/>
<text class="s an-m" x="357" y="139" style="font-size:10.5px">배깅 §4.4</text>
<rect x="268" y="148" width="178" height="18" rx="6" fill="#E8F1EA" stroke="#1B6B3A" stroke-width="1"/>
<text class="s an-m" x="357" y="161" style="font-size:10.5px">무작위 부분공간 §4.5</text>
<rect x="268" y="170" width="178" height="18" rx="6" fill="#E8F1EA" stroke="#1B6B3A" stroke-width="1"/>
<text class="s an-m" x="357" y="183" style="font-size:10.5px">랜덤 포레스트 §4.5</text>
<rect x="268" y="192" width="178" height="18" rx="6" fill="#E8F1EA" stroke="#1B6B3A" stroke-width="1"/>
<text class="s an-m" x="357" y="205" style="font-size:10.5px">재학습과 평균화 §4.10</text>
<rect class="warn" x="254" y="222" width="206" height="56" rx="12"/>
<text class="warnt an-m" x="357" y="242">부스팅 §4.6 — 결이 다르다</text>
<text class="s an-m" x="357" y="260">잔차를 파고들어 편향을 줄인다.</text>
<text class="s an-m" x="357" y="274" style="font-size:9.5px">과적합은 완화되지 않는다.</text>
<path class="a" d="M462,130 L488,130"/>
<rect class="box key" x="492" y="46" width="216" height="168" rx="12"/>
<text class="tk an-m" x="600" y="70">③ 표본 외 성적</text>
<text class="sk an-m" x="600" y="88">SPY · 예측변수 4개 · 약 1,000행</text>
<text class="tk an-s" x="508" y="117" style="font-size:11px;font-weight:400">서포트 벡터 머신</text>
<text class="tk an-e" x="692" y="117" style="font-size:11.5px">13.3%</text>
<text class="tk an-s" x="508" y="139" style="font-size:11px;font-weight:400">단계적 회귀</text>
<text class="tk an-e" x="692" y="139" style="font-size:11.5px">10.6%</text>
<text class="tk an-s" x="508" y="161" style="font-size:11px;font-weight:400">배깅 회귀 트리</text>
<text class="tk an-e" x="692" y="161" style="font-size:11.5px">7.2%</text>
<text class="tk an-s" x="508" y="183" style="font-size:11px;font-weight:400">분류 트리</text>
<text class="tk an-e" x="692" y="183" style="font-size:11.5px">4.8%</text>
<text class="tk an-s" x="508" y="205" style="font-size:11px;font-weight:400">교차 검증 트리</text>
<text class="tk an-e" x="692" y="205" style="font-size:11.5px">0.6%</text>
<rect class="good" x="492" y="222" width="216" height="56" rx="12"/>
<text class="goodt an-m" x="600" y="242">샤프 1을 넘은 유일한 예</text>
<text class="s an-m" x="600" y="260">펀더멘털 요인 · SPX 집계</text>
<text class="s an-m" x="600" y="274" style="font-size:9.5px">CAGR 4% · 샤프 1.1 §4.12</text>
<text class="sl" x="16" y="300">가로축은 실행 순서가 아니라 책임의 이동이다 — 어떤 학습기를 고르느냐보다,</text>
<text class="sl" x="16" y="318">그것을 어떻게 흔들고 무엇으로 검증하느냐가 표본 외 성적을 만든다.</text>
</svg>
