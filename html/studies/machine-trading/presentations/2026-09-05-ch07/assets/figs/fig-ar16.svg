<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">BTC.USD에 적용한 AR(16) 트레이딩 전략</title>
  <desc id="desc">AR(16) 예측 방향대로 매매한 테스트 구간 자산 곡선으로, 후반부로 갈수록 지수적으로 폭발해 누적 약 202배, 연율 약 4만에 이르지만 이는 중간가 즉시 체결이라는 비현실적 가정에서만 성립한다.</desc>
  <defs>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .axis{fill:none;stroke:#9A9AA2;stroke-width:1.5}
      .grid{fill:none;stroke:#E4E4E1;stroke-width:1}
      .curve{fill:none;stroke:#0F2C59;stroke-width:3}
      .head{font-size:16px;font-weight:800;text-anchor:middle;fill:#0F0F10}
      .lab{font-size:13px;font-weight:700;fill:#0F2C59}
      .meta{font-size:12px;fill:#6B6B72}
      .caveat{fill:#FDF3F3;stroke:#B4232A;stroke-width:1.5}
      .cavtext{font-size:12.5px;fill:#B4232A;font-weight:700}
    </style>
  </defs>
  <rect width="900" height="360" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <line class="grid" x1="80" y1="80" x2="840" y2="80"/>
    <line class="grid" x1="80" y1="160" x2="840" y2="160"/>
    <line class="grid" x1="80" y1="240" x2="840" y2="240"/>
    <line class="axis" x1="80" y1="300" x2="840" y2="300"/>
    <line class="axis" x1="80" y1="56" x2="80" y2="300"/>
    <text class="meta" x="46" y="304">1배</text>
    <text class="meta" x="34" y="164">100배</text>
    <text class="meta" x="30" y="84">200배</text>
    <path class="curve" d="M80 299 L220 296 L340 290 L440 279 L520 262 L590 236 L650 202 L705 160 L760 112 L810 74 L840 60"/>
    <circle cx="840" cy="60" r="4" fill="#0F2C59"/>
    <text class="lab" x="712" y="120">누적 ≈ 202배</text>
    <text class="lab" x="712" y="138">연율(CAGR) ≈ 40,000</text>
    <text class="meta" x="120" y="288">초기에는 완만, 후반부 지수적 폭발</text>
    <rect class="caveat" x="96" y="196" width="330" height="72" rx="8"/>
    <text class="cavtext" x="112" y="222">비현실적 가정</text>
    <text class="meta" x="112" y="244">중간가 지정가가 항상 즉시 체결된다고 가정</text>
    <text class="meta" x="112" y="262">→ 단순 AR(p)도 예측력은 있으나 수익은 환상</text>
  </g>
</svg>
