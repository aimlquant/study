<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">재현 스냅숏 — 비용을 넣으면 무너지는 초과수익</title>
  <desc id="desc">AIML Quant 파이썬 재현에서 화려한 총수익은 거래비용을 넣으면 대부분 사라진다. AR(16)과 볼린저와 배깅 트리는 10bp 비용에서 크게 마이너스로 돌아서고, 주문 흐름만 편도 0.097달러 이익이 스프레드 비용 언저리에 걸쳐 겨우 살아남을 여지가 있다.</desc>
  <defs>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .zero{stroke:#0F0F10;stroke-width:1.5}
      .grid{stroke:#E4E4E1;stroke-width:1}
      .gross{fill:#127A3E}
      .net{fill:#B4232A}
      .marg{fill:#C58A1B}
      .head{font-size:16px;font-weight:800;fill:#0F0F10;text-anchor:middle}
      .grp{font-size:13px;font-weight:800;fill:#0F0F10;text-anchor:middle}
      .val{font-size:11.5px;font-weight:700;text-anchor:middle}
      .meta{font-size:11.5px;fill:#6B6B72;text-anchor:middle}
      .legend{font-size:12px;font-weight:700}
    </style>
  </defs>
  <rect width="900" height="340" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <text class="head" x="450" y="32">총수익(비용 0) 대 순수익(비용 반영)</text>
    <rect class="gross" x="600" y="44" width="16" height="12"/>
    <text class="legend" x="622" y="54" fill="#127A3E">총수익</text>
    <rect class="net" x="686" y="44" width="16" height="12"/>
    <text class="legend" x="708" y="54" fill="#B4232A">비용 반영 손실</text>
    <rect class="marg" x="800" y="44" width="16" height="12"/>
    <text class="legend" x="822" y="54" fill="#C58A1B">경계</text>

    <line class="grid" x1="70" y1="110" x2="840" y2="110"/>
    <line class="zero" x1="70" y1="190" x2="840" y2="190"/>
    <line class="grid" x1="70" y1="270" x2="840" y2="270"/>
    <text class="meta" x="52" y="114" text-anchor="end">이익</text>
    <text class="meta" x="52" y="194" text-anchor="end">0</text>
    <text class="meta" x="52" y="274" text-anchor="end">손실</text>

    <!-- AR(16) -->
    <rect class="gross" x="120" y="112" width="46" height="78"/>
    <text class="val" x="143" y="106" fill="#127A3E">≫ 연 4만</text>
    <rect class="net" x="120" y="190" width="46" height="76"/>
    <text class="val" x="143" y="282" fill="#B4232A">≈ −100%</text>
    <text class="grp" x="143" y="304">AR(16)</text>

    <!-- Bollinger -->
    <rect class="gross" x="300" y="150" width="46" height="40"/>
    <text class="val" x="323" y="144" fill="#127A3E">+42%</text>
    <rect class="net" x="300" y="190" width="46" height="76"/>
    <text class="val" x="323" y="282" fill="#B4232A">−99.49%</text>
    <text class="grp" x="323" y="304">볼린저 밴드</text>

    <!-- Bagged trees -->
    <rect class="gross" x="480" y="112" width="46" height="78"/>
    <text class="val" x="503" y="106" fill="#127A3E">≫ 2.9e7</text>
    <rect class="net" x="480" y="190" width="46" height="72"/>
    <text class="val" x="503" y="278" fill="#B4232A">로그 −198</text>
    <text class="grp" x="503" y="304">배깅 트리</text>

    <!-- Order flow -->
    <rect class="gross" x="660" y="168" width="46" height="22"/>
    <text class="val" x="683" y="162" fill="#127A3E">+$0.097</text>
    <rect class="marg" x="660" y="190" width="46" height="18"/>
    <text class="val" x="683" y="224" fill="#C58A1B">−비용 $0.06</text>
    <text class="grp" x="683" y="304">주문 흐름</text>
    <text class="val" x="683" y="250" fill="#C58A1B">≈ 손익 경계</text>

    <text class="meta" x="450" y="330">숫자가 클수록 예측력이 아니라 체결 가정이 크다 — 순위를 가르는 것은 model score가 아니라 비용이다</text>
  </g>
</svg>
