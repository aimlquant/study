<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">주문 흐름: 부호 있는 거래량에서 신호까지</title>
  <desc id="desc">공격자 태그로 매수 체결은 플러스, 매도 체결은 마이너스 규모로 기록하고, 누적한 뒤 현재값에서 1분 전 누적값을 빼 최근 1분 순주문 흐름을 얻어 임계값과 비교해 진입·청산 신호를 만든다.</desc>
  <defs>
    <marker id="of-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6B6B72"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .box{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .flow{fill:none;stroke:#6B6B72;stroke-width:2.5;marker-end:url(#of-arrow)}
      .step{font-size:12px;font-weight:800;fill:#0F2C59;text-anchor:middle}
      .body{font-size:12px;fill:#0F0F10;text-anchor:middle}
      .meta{font-size:11.5px;fill:#6B6B72;text-anchor:middle}
      .sig{fill:#fff;stroke:#127A3E;stroke-width:2}
    </style>
  </defs>
  <rect width="900" height="300" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="box" x="24" y="70" width="180" height="120" rx="9"/>
    <text class="step" x="114" y="96">① 체결 틱 부호화</text>
    <text class="body" x="114" y="122">매수 시장가 → +s</text>
    <text class="body" x="114" y="142">매도 시장가 → −s</text>
    <text class="meta" x="114" y="170">공격자 태그로 방향 판정</text>

    <path class="flow" d="M206 130 H236"/>
    <rect class="box" x="240" y="70" width="180" height="120" rx="9"/>
    <text class="step" x="330" y="96">② 누적 주문 흐름</text>
    <text class="body" x="330" y="124">cumsum(ordflow)</text>
    <text class="meta" x="330" y="152">틱은 시간상 불균등</text>
    <text class="meta" x="330" y="170">datenum으로 시각 추적</text>

    <path class="flow" d="M422 130 H452"/>
    <rect class="box" x="456" y="70" width="196" height="120" rx="9"/>
    <text class="step" x="554" y="96">③ 최근 1분 순흐름</text>
    <text class="body" x="554" y="124">cum(t) − cum(1분 전)</text>
    <text class="meta" x="554" y="152">누적값의 차이로</text>
    <text class="meta" x="554" y="170">구간 합을 계산</text>

    <path class="flow" d="M654 130 H684"/>
    <rect class="sig" x="688" y="70" width="188" height="120" rx="9"/>
    <text class="step" x="782" y="96" fill="#127A3E">④ 신호</text>
    <text class="body" x="782" y="122">&gt; +90 → 매수 진입</text>
    <text class="body" x="782" y="142">&lt; −90 → 매도 진입</text>
    <text class="body" x="782" y="162">0 부근·부호 반전 → 청산</text>

    <text class="meta" x="450" y="232">이벤트 기반 단순화 — 거래가 있는 순간에만 계산·매매 (틱 없는 시간은 건너뜀)</text>
    <text class="meta" x="450" y="254">백테스트: 편도 거래당 +US$0.097 · 2014-12 총 336건 · 코인당 +US$32.54 (연율 ≈ 100%)</text>
  </g>
</svg>
