<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">거래소 간 차익거래의 비용 사다리</title>
  <desc id="desc">2015년 2월 2일 Bitfinex 매수호가 239.19가 btc-e 매도호가 233.546보다 높은 교차 시장에서 코인당 총이익 5.644달러가 나오지만, 수수료 1달러와 인출 2달러를 빼면 순이익은 2.6달러로 줄고, 남은 신용 위험은 정량화되지 않는다.</desc>
  <defs>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .q{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .head{font-size:15px;font-weight:800;fill:#0F0F10;text-anchor:middle}
      .qh{font-size:13px;font-weight:800;fill:#0F2C59;text-anchor:middle}
      .qv{font-size:13px;fill:#0F0F10;text-anchor:middle}
      .gross{fill:#127A3E}
      .cost{fill:#B4232A}
      .net{fill:#0F2C59}
      .bl{font-size:13px;font-weight:800;fill:#fff;text-anchor:middle}
      .meta{font-size:11.5px;fill:#6B6B72;text-anchor:middle}
      .warn{fill:#FDF3F3;stroke:#B4232A;stroke-width:1.5}
    </style>
  </defs>
  <rect width="900" height="340" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="q" x="40" y="52" width="180" height="72" rx="9"/>
    <text class="qh" x="130" y="78">Bitfinex</text>
    <text class="qv" x="130" y="102">bid 239.19 / ask 239.48</text>
    <rect class="q" x="240" y="52" width="180" height="72" rx="9"/>
    <text class="qh" x="330" y="78">btc-e</text>
    <text class="qv" x="330" y="102">bid 233.232 / ask 233.546</text>

    <text class="head" x="230" y="196">비용 사다리 (코인당)</text>
    <rect class="gross" x="40" y="212" width="380" height="30" rx="6"/>
    <text class="bl" x="230" y="232">총이익  +$5.644</text>
    <rect class="cost" x="40" y="248" width="150" height="26" rx="6"/>
    <text class="bl" x="115" y="266">− 수수료 $1</text>
    <rect class="cost" x="196" y="248" width="150" height="26" rx="6"/>
    <text class="bl" x="271" y="266">− 인출 $2</text>
    <rect class="net" x="40" y="280" width="230" height="30" rx="6"/>
    <text class="bl" x="155" y="300">순이익  ≈ +$2.6</text>

    <rect class="warn" x="470" y="60" width="390" height="250" rx="10"/>
    <text x="665" y="92" font-size="15" font-weight="800" fill="#B4232A" text-anchor="middle">마지막 함정 — 왜 btc-e가 더 쌀까</text>
    <text class="meta" x="665" y="126">시장이 btc-e의 신용등급을 더 낮게 본다</text>
    <text class="meta" x="665" y="150">→ 그곳에서 코인을 사서 보유(롱)하는 동안</text>
    <text class="meta" x="665" y="172">거래소가 무너지면 코인을 잃는 신용 위험에 노출</text>
    <text x="665" y="212" font-size="14" font-weight="800" fill="#0F0F10" text-anchor="middle">이 위험이 $2.6보다 큰지 작은지</text>
    <text x="665" y="234" font-size="14" font-weight="800" fill="#0F0F10" text-anchor="middle">딱 잘라 계산할 방법은 없다</text>
    <text class="meta" x="665" y="272">"공짜 점심"은 실은 위험의 대가일 수 있다</text>
    <text class="meta" x="665" y="294">(주석 8: Bitfinex는 2016-08 해킹으로 20% 급락)</text>
  </g>
</svg>
