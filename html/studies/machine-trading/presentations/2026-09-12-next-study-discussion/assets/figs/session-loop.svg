<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">한 발표자의 60분 회차 운영 루프</title>
  <desc id="desc">한 발표자가 한 장을 준비하고 60분 동안 도입, 장의 논리, 코드와 사례, 한계와 검증, 질의와 다음 장을 진행한 뒤 공개 자산과 다음 장 질문을 남긴다.</desc>
  <defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/></marker><marker id="b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#0f2c59"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.step{font-size:16px;font-weight:900;fill:#2563eb;letter-spacing:2px}.h{font-size:27px;font-weight:900;fill:#101114}.b{font-size:17px;fill:#505866}.chip{font-size:16px;font-weight:800;fill:#0f2c59}.time{font-size:17px;font-weight:900;fill:#fff}.foot{font-size:18px;font-weight:800;fill:#0f2c59}</style>
  <rect width="1200" height="560" rx="28" fill="#f7f9fc"/><g stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#a)"><line x1="375" y1="245" x2="405" y2="245"/><line x1="795" y1="245" x2="825" y2="245"/></g>
  <g transform="translate(45 105)"><rect width="330" height="280" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="28" y="44" class="step">BEFORE · ONE OWNER</text><text x="28" y="86" class="h">한 장 준비</text><text x="28" y="130" class="b">교재 해설 + 가이드</text><text x="28" y="166" class="b">선택 앵커 0~1개</text><text x="28" y="202" class="b">보충자료 합계 0~1편</text><rect x="28" y="228" width="274" height="34" rx="17" fill="#e8eef8"/><text x="165" y="251" text-anchor="middle" class="chip">한 발표자가 모두 준비</text></g>
  <g transform="translate(405 70)"><rect width="390" height="350" rx="22" fill="#fff" stroke="#0f2c59" stroke-width="3"/><text x="28" y="44" class="step">DURING · 60 MIN</text><text x="28" y="86" class="h">한 사람의 발표</text><g transform="translate(28 112)"><rect width="28" height="178" rx="14" fill="#0f2c59"/><rect x="38" width="110" height="178" rx="14" fill="#2563eb"/><rect x="158" width="110" height="178" rx="14" fill="#7c3aed"/><rect x="278" width="55" height="178" rx="14" fill="#d97706"/><text x="14" y="88" text-anchor="middle" class="time" transform="rotate(-90 14 88)">5 · 질문</text><text x="93" y="78" text-anchor="middle" class="time">20</text><text x="93" y="104" text-anchor="middle" class="time">장 논리</text><text x="213" y="78" text-anchor="middle" class="time">20</text><text x="213" y="104" text-anchor="middle" class="time">코드·사례</text><text x="305" y="88" text-anchor="middle" class="time" transform="rotate(-90 305 88)">10 · 한계</text></g><rect x="28" y="302" width="334" height="32" rx="16" fill="#e8eef8"/><text x="195" y="324" text-anchor="middle" class="chip">마지막 5분 · 질의와 다음 장</text></g>
  <g transform="translate(825 105)"><rect width="330" height="280" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="28" y="44" class="step">AFTER · HANDOFF</text><text x="28" y="86" class="h">사후 자산화</text><text x="28" y="130" class="b">리포트·슬라이드 확정</text><text x="28" y="166" class="b">YouTube·시간표시 연결</text><text x="28" y="202" class="b">남은 질문·앞뒤 장 연결</text><rect x="28" y="228" width="274" height="34" rx="17" fill="#e8eef8"/><text x="165" y="251" text-anchor="middle" class="chip">다음 발표자에게 질문 인계</text></g>
  <path d="M990 385 V458 Q990 495 953 495 H210 Q173 495 173 458 V385" fill="none" stroke="#0f2c59" stroke-width="5" marker-end="url(#b)"/><rect x="398" y="455" width="404" height="50" rx="25" fill="#fff" stroke="#0f2c59" stroke-width="2"/><text x="600" y="487" text-anchor="middle" class="foot">발표자는 바뀌어도 한 장·60분 계약은 유지</text>
</svg>
