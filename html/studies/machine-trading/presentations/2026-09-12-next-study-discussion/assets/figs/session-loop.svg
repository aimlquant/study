<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">한 장의 질문을 닫는 익숙한 회차 리듬</title>
  <desc id="desc">맥락, 장의 논리, 실행 증거, 적용 경계, 다음 질문을 다섯 단계로 이어 발표한다.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.tag{font-size:14px;font-weight:900;fill:#2563eb;letter-spacing:1.6px}.h{font-size:23px;font-weight:900;fill:#101114}.b{font-size:16px;fill:#596273}.time{font-size:15px;font-weight:900;fill:#fff}.foot{font-size:17px;font-weight:850;fill:#0f2c59}</style>
  <rect width="1200" height="560" rx="28" fill="#f7f9fc"/><text x="58" y="54" class="tag">FAMILIAR SESSION RHYTHM</text><text x="58" y="94" class="h">한 장의 판단을 증거와 반론까지 잇는다</text>
  <g transform="translate(58 132)"><rect width="200" height="264" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect width="200" height="44" rx="20" fill="#0f2c59"/><rect y="22" width="200" height="22" fill="#0f2c59"/><text x="100" y="29" text-anchor="middle" class="time">0–5분</text><text x="22" y="88" class="tag">CONTEXT</text><text x="22" y="126" class="h">맥락</text><text x="22" y="164" class="b">이전 장과</text><text x="22" y="190" class="b">오늘의 질문</text><text x="22" y="232" class="tag">WHERE?</text></g>
  <g transform="translate(280 132)"><rect width="200" height="264" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect width="200" height="44" rx="20" fill="#2563eb"/><rect y="22" width="200" height="22" fill="#2563eb"/><text x="100" y="29" text-anchor="middle" class="time">5–25분</text><text x="22" y="88" class="tag">LOGIC</text><text x="22" y="126" class="h">장 논리</text><text x="22" y="164" class="b">핵심 가정과</text><text x="22" y="190" class="b">판단 기준</text><text x="22" y="232" class="tag">WHY?</text></g>
  <g transform="translate(502 132)"><rect width="200" height="264" rx="20" fill="#eef4ff" stroke="#2563eb" stroke-width="3"/><rect width="200" height="44" rx="20" fill="#7c3aed"/><rect y="22" width="200" height="22" fill="#7c3aed"/><text x="100" y="29" text-anchor="middle" class="time">25–45분</text><text x="22" y="88" class="tag">EVIDENCE</text><text x="22" y="126" class="h">실행 증거</text><text x="22" y="164" class="b">가이드와</text><text x="22" y="190" class="b">선택 앵커</text><text x="22" y="232" class="tag">SHOW.</text></g>
  <g transform="translate(724 132)"><rect width="200" height="264" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect width="200" height="44" rx="20" fill="#d97706"/><rect y="22" width="200" height="22" fill="#d97706"/><text x="100" y="29" text-anchor="middle" class="time">45–55분</text><text x="22" y="88" class="tag">BOUNDARY</text><text x="22" y="126" class="h">적용 경계</text><text x="22" y="164" class="b">누수·비용·</text><text x="22" y="190" class="b">실패 조건</text><text x="22" y="232" class="tag">BUT?</text></g>
  <g transform="translate(946 132)"><rect width="196" height="264" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect width="196" height="44" rx="20" fill="#0f2c59"/><rect y="22" width="196" height="22" fill="#0f2c59"/><text x="98" y="29" text-anchor="middle" class="time">55–60분</text><text x="22" y="88" class="tag">HANDOFF</text><text x="22" y="126" class="h">다음 질문</text><text x="22" y="164" class="b">질의와</text><text x="22" y="190" class="b">다음 장 인계</text><text x="22" y="232" class="tag">NEXT.</text></g>
  <g fill="none" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"><line x1="258" y1="264" x2="278" y2="264"/><line x1="480" y1="264" x2="500" y2="264"/><line x1="702" y1="264" x2="722" y2="264"/><line x1="924" y1="264" x2="944" y2="264"/></g>
  <g transform="translate(58 430)"><rect width="1084" height="70" rx="18" fill="#fff" stroke="#dbe3ef" stroke-width="2"/><text x="28" y="29" class="tag">ONE CHAPTER · ONE JUDGMENT</text><text x="28" y="54" class="foot">맥락 → 논리 → 증거 → 경계 → 인계</text></g>
</svg>
