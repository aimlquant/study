<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">스터디 회차 운영 루프</title><desc id="desc">사전 준비, 120분 세션, 사후 자산화가 이어지고 결정 로그가 다음 회차로 돌아간다.</desc>
  <defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/></marker><marker id="b" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#0f2c59"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.step{font-size:16px;font-weight:900;fill:#2563eb;letter-spacing:2px}.h{font-size:28px;font-weight:900;fill:#101114}.b{font-size:18px;fill:#505866}.chip{font-size:16px;font-weight:800;fill:#0f2c59}.foot{font-size:18px;font-weight:800;fill:#0f2c59}</style>
  <rect width="1200" height="560" rx="28" fill="#f7f9fc"/><g stroke="#2563eb" stroke-width="6" fill="none" marker-end="url(#a)"><line x1="390" y1="245" x2="420" y2="245"/><line x1="780" y1="245" x2="810" y2="245"/></g>
  <g transform="translate(60 105)"><rect width="330" height="280" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="28" y="44" class="step">BEFORE</text><text x="28" y="88" class="h">사전 준비</text><text x="28" y="132" class="b">해설·리포트 초안</text><text x="28" y="170" class="b">가이드 + 앵커 1개</text><text x="28" y="208" class="b">검증 질문 3개</text><rect x="28" y="230" width="274" height="32" rx="16" fill="#e8eef8"/><text x="165" y="252" text-anchor="middle" class="chip">입력·버전·역할 고정</text></g>
  <g transform="translate(420 75)"><rect width="360" height="340" rx="22" fill="#fff" stroke="#0f2c59" stroke-width="3"/><text x="28" y="44" class="step">DURING · 120 MIN</text><text x="28" y="88" class="h">검증 세션</text><text x="28" y="134" class="b">10분 · 이전 gate</text><text x="28" y="170" class="b">35분 · 개념과 메커니즘</text><text x="28" y="206" class="b">25분 · 앵커 재현</text><text x="28" y="242" class="b">25분 · ETF 연결</text><text x="28" y="278" class="b">15분 · red-team</text><rect x="28" y="294" width="304" height="32" rx="16" fill="#e8eef8"/><text x="180" y="316" text-anchor="middle" class="chip">10분 · 결정과 다음 행동</text></g>
  <g transform="translate(810 105)"><rect width="330" height="280" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="28" y="44" class="step">AFTER</text><text x="28" y="88" class="h">사후 자산화</text><text x="28" y="132" class="b">리포트·슬라이드 확정</text><text x="28" y="170" class="b">YouTube·시간표시 연결</text><text x="28" y="208" class="b">결정·실패·후속 로그</text><rect x="28" y="230" width="274" height="32" rx="16" fill="#e8eef8"/><text x="165" y="252" text-anchor="middle" class="chip">다음 회차 gate 생성</text></g>
  <path d="M975 385 V460 Q975 495 940 495 H225 Q190 495 190 460 V385" fill="none" stroke="#0f2c59" stroke-width="5" marker-end="url(#b)"/><rect x="400" y="455" width="400" height="50" rx="25" fill="#fff" stroke="#0f2c59"/><text x="600" y="487" text-anchor="middle" class="foot">결정 로그와 실패 증거가 다음 준비로</text>
</svg>
