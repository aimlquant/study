<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 396" role="img" aria-labelledby="title desc">
  <title id="title">ML4T 3판 학습 자원의 여섯 층</title>
  <desc id="desc">교재 27장, 공식 코드 468개 노트북, 연구 사례 9개, 프라이머 112편, 라이브러리 6개, 에이전트 스킬 61편을 같은 크기의 카드로 배열했다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.label{font-size:22px;font-weight:800;fill:#0f2c59}.value{font-size:50px;font-weight:900;fill:#101114}.body{font-size:18px;fill:#5b6270}.an-s{text-anchor:start}.an-m{text-anchor:middle}.an-e{text-anchor:end}</style>
  <rect width="1200" height="396" rx="28" fill="#f7f9fc"/>
  <g transform="translate(60 24)"><rect x="0" y="0" width="340" height="168" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="0" y="0" width="8" height="168" rx="4" fill="#0f2c59"/><text class="label an-s" x="30" y="44">교재</text><text class="value an-s" x="30" y="106">27장</text><text class="body an-s" x="30" y="142">함께 읽는 개념과 논리</text></g>
  <g transform="translate(430 24)"><rect x="0" y="0" width="340" height="168" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="0" y="0" width="8" height="168" rx="4" fill="#2563eb"/><text class="label an-s" x="30" y="44">공식 코드</text><text class="value an-s" x="30" y="106">468</text><text class="body an-s" x="30" y="142">구현 패턴과 확장 실험</text></g>
  <g transform="translate(800 24)"><rect x="0" y="0" width="340" height="168" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="0" y="0" width="8" height="168" rx="4" fill="#059669"/><text class="label an-s" x="30" y="44">연구 사례</text><text class="value an-s" x="30" y="106">9개</text><text class="body an-s" x="30" y="142">아이디어에서 검증까지 연결</text></g>
  <g transform="translate(60 210)"><rect x="0" y="0" width="340" height="168" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="0" y="0" width="8" height="168" rx="4" fill="#7c3aed"/><text class="label an-s" x="30" y="44">프라이머</text><text class="value an-s" x="30" y="106">112</text><text class="body an-s" x="30" y="142">기초 20 · 중급 66 · 고급 26</text></g>
  <g transform="translate(430 210)"><rect x="0" y="0" width="340" height="168" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="0" y="0" width="8" height="168" rx="4" fill="#d97706"/><text class="label an-s" x="30" y="44">라이브러리</text><text class="value an-s" x="30" y="106">6개</text><text class="body an-s" x="30" y="142">실무 코드의 재사용 단위</text></g>
  <g transform="translate(800 210)"><rect x="0" y="0" width="340" height="168" rx="18" fill="#fff" stroke="#cbd5e1"/><rect x="0" y="0" width="8" height="168" rx="4" fill="#e11d48"/><text class="label an-s" x="30" y="44">에이전트 스킬</text><text class="value an-s" x="30" y="106">61</text><text class="body an-s" x="30" y="142">반복 연구 체크리스트</text></g>
