<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ML4T 3판 학습 자원의 여섯 층</title><desc id="desc">교재, 코드, 사례, 프라이머, 라이브러리, 에이전트 스킬을 같은 크기의 카드로 배열했다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.label{font-size:22px;font-weight:800;fill:#0f2c59}.value{font-size:54px;font-weight:900;fill:#101114}.body{font-size:19px;fill:#5b6270}.tag{font-size:15px;font-weight:800;fill:#2563eb;letter-spacing:2px}</style>
  <rect width="1200" height="620" rx="28" fill="#f7f9fc"/>
  <g transform="translate(60 100)"><rect width="340" height="205" rx="18" fill="#fff" stroke="#cbd5e1"/><rect width="8" height="205" rx="4" fill="#0f2c59"/><text x="30" y="48" class="label">교재</text><text x="30" y="112" class="value">27장</text><text x="30" y="153" class="body">논리·개념의 공통 정본</text><text x="30" y="184" class="body">6단계 연구 흐름</text></g>
  <g transform="translate(430 100)"><rect width="340" height="205" rx="18" fill="#fff" stroke="#cbd5e1"/><rect width="8" height="205" rx="4" fill="#2563eb"/><text x="30" y="48" class="label">공식 코드</text><text x="30" y="112" class="value">468</text><text x="30" y="153" class="body">로컬 ipynb 실측</text><text x="30" y="184" class="body">회차당 앵커 1개 선택</text></g>
  <g transform="translate(800 100)"><rect width="340" height="205" rx="18" fill="#fff" stroke="#cbd5e1"/><rect width="8" height="205" rx="4" fill="#059669"/><text x="30" y="48" class="label">종단 사례</text><text x="30" y="112" class="value">9개</text><text x="30" y="153" class="body">아이디어→검증 연결</text><text x="30" y="184" class="body">ETF를 공통 척추로</text></g>
  <g transform="translate(60 335)"><rect width="340" height="205" rx="18" fill="#fff" stroke="#cbd5e1"/><rect width="8" height="205" rx="4" fill="#7c3aed"/><text x="30" y="48" class="label">프라이머</text><text x="30" y="112" class="value">112</text><text x="30" y="153" class="body">기초 20 · 중급 66</text><text x="30" y="184" class="body">고급 26 · 선별 읽기</text></g>
  <g transform="translate(430 335)"><rect width="340" height="205" rx="18" fill="#fff" stroke="#cbd5e1"/><rect width="8" height="205" rx="4" fill="#d97706"/><text x="30" y="48" class="label">라이브러리</text><text x="30" y="112" class="value">6개</text><text x="30" y="153" class="body">생산 코드의 재사용 단위</text><text x="30" y="184" class="body">필요한 장에서만 확장</text></g>
  <g transform="translate(800 335)"><rect width="340" height="205" rx="18" fill="#fff" stroke="#cbd5e1"/><rect width="8" height="205" rx="4" fill="#e11d48"/><text x="30" y="48" class="label">에이전트 스킬</text><text x="30" y="112" class="value">61</text><text x="30" y="153" class="body">반복 연구 체크리스트</text><text x="30" y="184" class="body">Ch24 · Lab D에서 감사</text></g>
</svg>
