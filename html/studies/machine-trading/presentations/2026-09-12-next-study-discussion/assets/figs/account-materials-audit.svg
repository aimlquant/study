<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">계정 전용 프라이머와 에이전트 스킬 감사 결과</title>
  <desc id="desc">프라이머 112편의 난이도 분포와 장 연결, 도식 수, 에이전트 스킬 61편의 범주 분포, 계정별 원문에서 공개 요약으로 이어지는 사용 경계를 두 패널과 세 단계 흐름으로 나타낸다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.title{font-size:28px;font-weight:900;fill:#101114}.panel-title{font-size:22px;font-weight:900;fill:#0f2c59}.label{font-size:18px;font-weight:800;fill:#20242c}.value{font-size:38px;font-weight:900;fill:#101114}.note{font-size:16px;fill:#5f6673}.bar-label{font-size:15px;font-weight:800;fill:#fff}.flow{font-size:17px;font-weight:800;fill:#0f2c59}.flow-note{font-size:14px;fill:#5f6673}</style>
  <rect width="1200" height="680" rx="28" fill="#f7f9fc"/>
  <rect x="42" y="20" width="1116" height="54" rx="14" fill="#fff" stroke="#dbe3ee"/>
  <text x="60" y="58" class="title">로그인 후 확인한 173개 보충 자료: 전수 진도가 아니라 선택 지도</text>

  <g transform="translate(60 92)">
    <rect width="520" height="410" rx="20" fill="#fff" stroke="#cbd5e1"/>
    <rect width="8" height="410" rx="4" fill="#7c3aed"/>
    <text x="32" y="44" class="panel-title">Primer · 112편</text>
    <text x="32" y="92" class="label">난이도 분포</text>
    <g transform="translate(32 112)">
      <rect width="137" height="48" rx="8" fill="#2563eb"/><text x="68.5" y="31" text-anchor="middle" class="bar-label">기초 20</text>
      <rect x="137" width="283" height="48" fill="#7c3aed"/><text x="278.5" y="31" text-anchor="middle" class="bar-label">중급 66</text>
      <rect x="420" width="68" height="48" rx="8" fill="#0f2c59"/><text x="454" y="31" text-anchor="middle" class="bar-label">26</text>
    </g>
    <text x="32" y="205" class="value">84</text><text x="102" y="199" class="label">편에 설명 도식</text><text x="102" y="225" class="note">전체의 75% · 시각 보충 후보</text>
    <text x="32" y="285" class="value">25/27</text><text x="170" y="279" class="label">개 장에 직접 연결</text><text x="170" y="305" class="note">장–프라이머 연결 232건</text>
    <rect x="24" y="330" width="472" height="66" rx="12" fill="#f7f9fc" stroke="#dbe3ee"/>
    <text x="32" y="357" class="note">집중 구간 · Ch9 29편 · Ch17 21편 · Ch14 19편</text>
    <text x="32" y="383" class="note">→ 특징·포트폴리오·잠재요인 회차의 읽기 예산을 먼저 제한</text>
  </g>

  <g transform="translate(620 92)">
    <rect width="520" height="410" rx="20" fill="#fff" stroke="#cbd5e1"/>
    <rect width="8" height="410" rx="4" fill="#e11d48"/>
    <text x="32" y="44" class="panel-title">Agent Skills · 61편 / 10범주</text>
    <g transform="translate(32 82)">
      <text x="0" y="26" class="label">개념</text><rect x="112" y="4" width="300" height="30" rx="6" fill="#dbeafe"/><rect x="112" y="4" width="300" height="30" rx="6" fill="#0f2c59"/><text x="430" y="27" class="label">10</text>
      <text x="0" y="82" class="label">특징</text><rect x="112" y="60" width="300" height="30" rx="6" fill="#dbeafe"/><rect x="112" y="60" width="300" height="30" rx="6" fill="#2563eb"/><text x="430" y="83" class="label">10</text>
      <text x="0" y="138" class="label">검증</text><rect x="112" y="116" width="300" height="30" rx="6" fill="#dbeafe"/><rect x="112" y="116" width="240" height="30" rx="6" fill="#7c3aed"/><text x="370" y="139" class="label">8</text>
      <text x="0" y="194" class="label">데이터</text><rect x="112" y="172" width="300" height="30" rx="6" fill="#dbeafe"/><rect x="112" y="172" width="210" height="30" rx="6" fill="#059669"/><text x="340" y="195" class="label">7</text>
      <text x="0" y="250" class="label">그 밖</text><rect x="112" y="228" width="300" height="30" rx="6" fill="#dbeafe"/><rect x="112" y="228" width="260" height="30" rx="6" fill="#d97706"/><text x="390" y="251" class="label">26</text>
    </g>
    <rect x="24" y="338" width="472" height="64" rx="12" fill="#f7f9fc" stroke="#dbe3ee"/>
    <text x="32" y="365" class="note">백테스트·포트폴리오·워크플로·인프라·생산·고급 AI</text>
    <text x="32" y="390" class="note">→ 별도 완독 대신 해당 회차의 검증 질문으로 1~2개 선택</text>
  </g>

  <g transform="translate(60 545)">
    <rect width="310" height="82" rx="16" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="155" y="34" text-anchor="middle" class="flow">계정별 원문 열람</text><text x="155" y="59" text-anchor="middle" class="flow-note">개별 계정 · 재배포 금지</text>
  </g>
  <line x1="370" y1="586" x2="430" y2="586" stroke="#64748b" stroke-width="4"/><polygon points="445,586 430,576 430,596" fill="#64748b"/>
  <g transform="translate(445 545)">
    <rect width="310" height="82" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="155" y="34" text-anchor="middle" class="flow">회차별 선별·개인 메모</text><text x="155" y="59" text-anchor="middle" class="flow-note">필수 1 · 선택 최대 2</text>
  </g>
  <line x1="755" y1="586" x2="815" y2="586" stroke="#64748b" stroke-width="4"/><polygon points="830,586 815,576 815,596" fill="#64748b"/>
  <g transform="translate(830 545)">
    <rect width="310" height="82" rx="16" fill="#fff" stroke="#059669" stroke-width="2"/>
    <text x="155" y="34" text-anchor="middle" class="flow">공개 요약·출처·우리 해석</text><text x="155" y="59" text-anchor="middle" class="flow-note">직접 인용 최소화 · 경계 표시</text>
  </g>
</svg>
