  <path d="M378 431 H445" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#fl)"/>
  <g transform="translate(445 390)"><rect x="0" y="0" width="310" height="82" rx="16" fill="#fff" stroke="#2563eb" stroke-width="2"/><text class="flow an-m" x="155" y="48">회차별 선별·개인 메모</text></g>
  <path d="M763 431 H830" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#fl)"/>
  <g transform="translate(830 390)"><rect x="0" y="0" width="310" height="82" rx="16" fill="#fff" stroke="#059669" stroke-width="2"/><text class="flow an-m" x="155" y="48">공개 요약·출처·우리 해석</text></g>
</svg>
