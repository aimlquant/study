<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" role="img" aria-labelledby="title desc">
  <title id="title">계정 전용 프라이머와 에이전트 스킬의 분포와 사용 경계</title>
  <desc id="desc">왼쪽 패널은 프라이머 112편의 난이도 구성과 장 연결, 오른쪽 패널은 에이전트 스킬 61편의 범주별 편수, 아래 세 단계는 계정 원문에서 공개 요약으로 가는 경계다. 막대 길이는 편수에 비례한다.</desc>
  <defs><marker id="fl" markerUnits="userSpaceOnUse" viewBox="0 0 13 12" refX="12" refY="6" markerWidth="13" markerHeight="12" orient="auto"><path d="M0 0.5 L12.5 6 L0 11.5 Z" fill="#64748b"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.pt{font-size:21px;font-weight:900;fill:#0f2c59}.k{font-size:13px;font-weight:800;fill:#7b8493;letter-spacing:1px}.label{font-size:17px;font-weight:800;fill:#20242c}.value{font-size:34px;font-weight:900;fill:#101114}.note{font-size:15px;fill:#5f6673}.seg{font-size:14px;font-weight:800;fill:#fff}.num{font-size:16px;font-weight:900;fill:#0f2c59}.flow{font-size:17px;font-weight:800;fill:#0f2c59}.fnote{font-size:14px;fill:#5f6673}.an-s{text-anchor:start}.an-m{text-anchor:middle}.an-e{text-anchor:end}</style>
  <rect width="1200" height="496" rx="28" fill="#f7f9fc"/>
  <g transform="translate(60 24)"><rect x="0" y="0" width="520" height="330" rx="20" fill="#fff" stroke="#cbd5e1"/><rect x="0" y="0" width="8" height="330" rx="4" fill="#7c3aed"/><text class="pt an-s" x="32" y="42">Primer · 112편</text><text class="k an-s" x="32" y="76">난이도</text>
    <clipPath id="stack"><rect x="32" y="88" width="456" height="44" rx="6"/></clipPath>
    <g clip-path="url(#stack)">
      <rect x="32" y="88" width="81" height="44" fill="#2563eb"/>
      <rect x="113" y="88" width="269" height="44" fill="#7c3aed"/>
      <rect x="382" y="88" width="106" height="44" fill="#0f2c59"/>
    </g>
    <text class="seg an-m" x="72" y="116">기초 20</text>
    <text class="seg an-m" x="247" y="116">중급 66</text>
    <text class="seg an-m" x="435" y="116">고급 26</text>
    <text class="value an-s" x="32" y="196">84</text><text class="label an-s" x="96" y="190">편에 설명 도식</text><text class="note an-s" x="96" y="214">전체의 75%</text>
    <text class="value an-s" x="32" y="264">25/27</text><text class="label an-s" x="160" y="258">개 장에 직접 연결</text><text class="note an-s" x="160" y="282">연결 232건</text></g>
  <g transform="translate(620 24)"><rect x="0" y="0" width="520" height="330" rx="20" fill="#fff" stroke="#cbd5e1"/><rect x="0" y="0" width="8" height="330" rx="4" fill="#e11d48"/><text class="pt an-s" x="32" y="42">Agent Skills · 61편</text><text class="k an-s" x="32" y="76">범주별 편수</text>
    <text class="label an-s" x="32" y="113">개념</text><rect x="124" y="90" width="286" height="32" rx="6" fill="#e8eef7"/><rect x="124" y="90" width="110" height="32" rx="6" fill="#0f2c59"/><text class="num an-e" x="488" y="112">10</text>
    <text class="label an-s" x="32" y="159">특징</text><rect x="124" y="136" width="286" height="32" rx="6" fill="#e8eef7"/><rect x="124" y="136" width="110" height="32" rx="6" fill="#2563eb"/><text class="num an-e" x="488" y="158">10</text>
    <text class="label an-s" x="32" y="205">검증</text><rect x="124" y="182" width="286" height="32" rx="6" fill="#e8eef7"/><rect x="124" y="182" width="88" height="32" rx="6" fill="#7c3aed"/><text class="num an-e" x="488" y="204">8</text>
    <text class="label an-s" x="32" y="251">데이터</text><rect x="124" y="228" width="286" height="32" rx="6" fill="#e8eef7"/><rect x="124" y="228" width="77" height="32" rx="6" fill="#059669"/><text class="num an-e" x="488" y="250">7</text>
    <text class="label an-s" x="32" y="297">그 밖</text><rect x="124" y="274" width="286" height="32" rx="6" fill="#e8eef7"/><rect x="124" y="274" width="286" height="32" rx="6" fill="#d97706"/><text class="num an-e" x="488" y="296">26</text>
  </g>
