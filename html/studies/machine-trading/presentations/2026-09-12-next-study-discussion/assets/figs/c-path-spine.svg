<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 544" role="img" aria-labelledby="title desc">
<title id="title">전략구축형 16회의 누적 산출물 사슬</title><desc id="desc">오리엔테이션에서 연구 질문을 고정한 뒤 데이터 계약, 학습 과제와 특징, 기준선과 모델, 백테스트와 비중, 비용과 위험, 모의거래 운영으로 회차가 이어지고 마지막 회차에서 결과를 종합한다.</desc>
<style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.turn{font-size:18px;font-weight:800;fill:#ffffff}.chap{font-size:18px;font-weight:700}.gain{font-size:17px;font-weight:600;fill:#101114}.flow{fill:none;stroke:#94a3b8;stroke-width:2.4}.spine{fill:none;stroke:#cbd5e1;stroke-width:3}.tick{stroke:#cbd5e1;stroke-width:2}.an-s{text-anchor:start}.an-m{text-anchor:middle}</style>
<defs><marker id="arw" markerUnits="userSpaceOnUse" viewBox="0 0 13 12" refX="12" refY="6" markerWidth="13" markerHeight="12" orient="auto"><path d="M0 0.5 L12.5 6 L0 11.5 Z" fill="#94a3b8"/></marker><marker id="arwSpine" markerUnits="userSpaceOnUse" viewBox="0 0 13 12" refX="12" refY="6" markerWidth="13" markerHeight="12" orient="auto"><path d="M0 0.5 L12.5 6 L0 11.5 Z" fill="#cbd5e1"/></marker></defs>
