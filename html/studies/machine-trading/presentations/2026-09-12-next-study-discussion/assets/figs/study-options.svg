<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">세 제약에서 29회 장별 과정으로</title>
  <desc id="desc">한 사람 발표, 60분, 한 장 이하라는 세 제약이 오리엔테이션 1회, 장별 발표 27회, 회고 1회의 29회 과정으로 이어진다.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/></marker></defs>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.tag{font-size:16px;font-weight:900;fill:#2563eb;letter-spacing:2px}.h{font-size:27px;font-weight:900;fill:#101114}.sub{font-size:18px;fill:#5f6673}.num{font-size:48px;font-weight:900;fill:#0f2c59}.small{font-size:16px;font-weight:800;fill:#0f2c59}.phase{font-size:18px;font-weight:900;fill:#fff}.phaseSub{font-size:15px;font-weight:700;fill:#dbeafe}</style>
  <rect width="1200" height="610" rx="28" fill="#f7f9fc"/><text x="60" y="56" class="tag">FIXED CONSTRAINTS</text>
  <g transform="translate(60 90)">
    <g><rect width="300" height="128" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="24" y="40" class="tag">01 · PEOPLE</text><text x="24" y="78" class="h">발표자 1명</text><text x="24" y="106" class="sub">준비·설명·데모 단일 책임</text></g>
    <g transform="translate(0 150)"><rect width="300" height="128" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="24" y="40" class="tag">02 · TIME</text><text x="24" y="78" class="h">질의 포함 60분</text><text x="24" y="106" class="sub">별도 2시간 세션 없음</text></g>
    <g transform="translate(0 300)"><rect width="300" height="128" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="24" y="40" class="tag">03 · SCOPE</text><text x="24" y="78" class="h">회차당 최대 1장</text><text x="24" y="106" class="sub">장 묶음·통합 진도 없음</text></g>
  </g>
  <path d="M380 304 H470" fill="none" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow)"/>
  <g transform="translate(500 78)">
    <rect width="640" height="454" rx="24" fill="#fff" stroke="#0f2c59" stroke-width="4"/><text x="34" y="54" class="tag">ONE VIABLE ROADMAP</text><text x="34" y="112" class="num">29회</text><text x="176" y="106" class="h">장별 완주 과정</text><text x="34" y="146" class="sub">1회 시작 + 27회 장별 발표 + 1회 회고</text>
    <g transform="translate(34 188)"><rect width="90" height="104" rx="16" fill="#0f2c59"/><text x="45" y="43" text-anchor="middle" class="phase">01</text><text x="45" y="73" text-anchor="middle" class="phaseSub">시작</text><rect x="108" width="396" height="104" rx="16" fill="#2563eb"/><text x="306" y="43" text-anchor="middle" class="phase">02–28</text><text x="306" y="73" text-anchor="middle" class="phaseSub">Ch1–27 · 한 회차에 한 장</text><rect x="522" width="50" height="104" rx="16" fill="#0f2c59"/><text x="547" y="43" text-anchor="middle" class="phase">29</text><text x="547" y="73" text-anchor="middle" class="phaseSub">회고</text></g>
    <g transform="translate(34 330)"><rect width="176" height="82" rx="16" fill="#eef4ff"/><text x="88" y="32" text-anchor="middle" class="small">바꾸지 않음</text><text x="88" y="58" text-anchor="middle" class="sub">한 명 · 60분 · 한 장</text><rect x="198" width="176" height="82" rx="16" fill="#eef4ff"/><text x="286" y="32" text-anchor="middle" class="small">회의에서 결정</text><text x="286" y="58" text-anchor="middle" class="sub">주간 · 격주 · 휴회</text><rect x="396" width="176" height="82" rx="16" fill="#eef4ff"/><text x="484" y="32" text-anchor="middle" class="small">네 회 뒤 조정</text><text x="484" y="58" text-anchor="middle" class="sub">자료 상한 · 빈도</text></g>
  </g>
</svg>
