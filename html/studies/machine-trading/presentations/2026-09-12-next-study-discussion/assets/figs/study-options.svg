<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 276" role="img" aria-labelledby="title desc">
  <title id="title">세 가지 스터디 진행 경로</title>
  <desc id="desc">전권 순차형 29회는 27개 장 전체, 핵심선택형 22회는 핵심 20개 장, 전략구축형 16회는 연결된 14개 장을 공통 진도로 둔다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.tag{font-size:15px;font-weight:900;letter-spacing:2px}.n{font-size:52px;font-weight:900;fill:#101114}.h{font-size:26px;font-weight:900;fill:#101114}.k{font-size:13px;font-weight:800;fill:#7b8493;letter-spacing:1px}.v{font-size:19px;font-weight:750;fill:#303846}.an-s{text-anchor:start}.an-m{text-anchor:middle}.an-e{text-anchor:end}</style>
  <rect width="1200" height="276" rx="28" fill="#f7f9fc"/>
  <g transform="translate(60 24)"><rect x="0" y="0" width="340" height="228" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="0" y="0" width="340" height="8" rx="4" fill="#0f2c59"/><text class="tag an-s" x="26" y="48" fill="#0f2c59">A · COMPLETE</text><text class="n an-s" x="26" y="112">29회</text><text class="h an-s" x="26" y="152">전권 순차형</text><line x1="26" y1="174" x2="314" y2="174" stroke="#dbe3ee" stroke-width="1.5"/><text class="k an-s" x="26" y="196">공통 진도</text><text class="v an-s" x="26" y="218">27개 장 전체</text></g>
  <g transform="translate(435 24)"><rect x="0" y="0" width="340" height="228" rx="22" fill="#eef4ff" stroke="#2563eb" stroke-width="4"/><rect x="0" y="0" width="340" height="8" rx="4" fill="#2563eb"/><text class="tag an-s" x="26" y="48" fill="#2563eb">B · CORE</text><text class="n an-s" x="26" y="112">22회</text><text class="h an-s" x="26" y="152">핵심선택형</text><line x1="26" y1="174" x2="314" y2="174" stroke="#dbe3ee" stroke-width="1.5"/><text class="k an-s" x="26" y="196">공통 진도</text><text class="v an-s" x="26" y="218">핵심 20개 장</text></g>
  <g transform="translate(810 24)"><rect x="0" y="0" width="340" height="228" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="0" y="0" width="340" height="8" rx="4" fill="#7c3aed"/><text class="tag an-s" x="26" y="48" fill="#7c3aed">C · STRATEGY</text><text class="n an-s" x="26" y="112">16회</text><text class="h an-s" x="26" y="152">전략구축형</text><line x1="26" y1="174" x2="314" y2="174" stroke="#dbe3ee" stroke-width="1.5"/><text class="k an-s" x="26" y="196">공통 진도</text><text class="v an-s" x="26" y="218">연결된 14개 장</text></g>
</svg>
