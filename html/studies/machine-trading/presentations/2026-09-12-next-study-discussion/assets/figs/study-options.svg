<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">세 가지 스터디 운영안 비교</title><desc id="desc">완독형, 균형형, 프로젝트형의 기간, 장 커버리지, 사례 연결을 카드와 막대로 비교한다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.tag{font-size:16px;font-weight:900;fill:#2563eb;letter-spacing:2px}.h{font-size:27px;font-weight:900;fill:#101114}.sub{font-size:18px;fill:#5f6673}.lab{font-size:17px;font-weight:800;fill:#101114}.num{font-size:44px;font-weight:900;fill:#0f2c59}.pick{font-size:17px;font-weight:900;fill:#fff}</style>
  <rect width="1200" height="610" rx="28" fill="#f7f9fc"/>
  <g transform="translate(55 95)"><rect width="340" height="450" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="28" y="48" class="tag">A · CHAPTER COMPLETE</text><text x="28" y="96" class="h">완독형</text><text x="28" y="148" class="num">32–36회</text><text x="28" y="185" class="sub">장별 깊이 · 장기 일정</text><text x="28" y="240" class="lab">장 커버리지</text><rect x="28" y="258" width="284" height="18" rx="9" fill="#dbeafe"/><rect x="28" y="258" width="284" height="18" rx="9" fill="#0f2c59"/><text x="28" y="320" class="lab">사례 연결</text><rect x="28" y="338" width="284" height="18" rx="9" fill="#dbeafe"/><rect x="28" y="338" width="128" height="18" rx="9" fill="#2563eb"/><text x="28" y="401" class="sub">위험: 제작 피로와</text><text x="28" y="430" class="sub">회차 간 단절</text></g>
  <g transform="translate(430 75)"><rect width="340" height="490" rx="22" fill="#fff" stroke="#0f2c59" stroke-width="4"/><rect x="206" y="-18" width="112" height="38" rx="19" fill="#0f2c59"/><text x="262" y="7" text-anchor="middle" class="pick">기본 제안</text><text x="28" y="68" class="tag">B · WORKFLOW SPIRAL</text><text x="28" y="116" class="h">균형형</text><text x="28" y="168" class="num">20회</text><text x="28" y="205" class="sub">전체 지도 · 4개 통합 랩</text><text x="28" y="260" class="lab">장 커버리지</text><rect x="28" y="278" width="284" height="18" rx="9" fill="#dbeafe"/><rect x="28" y="278" width="255" height="18" rx="9" fill="#0f2c59"/><text x="28" y="340" class="lab">사례 연결</text><rect x="28" y="358" width="284" height="18" rx="9" fill="#dbeafe"/><rect x="28" y="358" width="248" height="18" rx="9" fill="#2563eb"/><text x="28" y="421" class="sub">위험: 장 묶음과</text><text x="28" y="450" class="sub">3역 조율 필요</text></g>
  <g transform="translate(805 95)"><rect width="340" height="450" rx="22" fill="#fff" stroke="#cbd5e1"/><text x="28" y="48" class="tag">C · PROJECT FIRST</text><text x="28" y="96" class="h">프로젝트형</text><text x="28" y="148" class="num">12회</text><text x="28" y="185" class="sub">빠른 결과 · ETF 중심</text><text x="28" y="240" class="lab">장 커버리지</text><rect x="28" y="258" width="284" height="18" rx="9" fill="#dbeafe"/><rect x="28" y="258" width="170" height="18" rx="9" fill="#0f2c59"/><text x="28" y="320" class="lab">사례 연결</text><rect x="28" y="338" width="284" height="18" rx="9" fill="#dbeafe"/><rect x="28" y="338" width="284" height="18" rx="9" fill="#2563eb"/><text x="28" y="401" class="sub">위험: 선택 읽기와</text><text x="28" y="430" class="sub">개념 공백</text></g>
</svg>
