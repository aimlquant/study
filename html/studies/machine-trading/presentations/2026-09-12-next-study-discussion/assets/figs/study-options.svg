<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">세 가지 스터디 진행 경로</title>
  <desc id="desc">전권 순차형 29회, 핵심선택형 22회, 전략구축형 16회를 공통 진도, 강점, 잘 맞는 목표로 비교한다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.tag{font-size:15px;font-weight:900;fill:#2563eb;letter-spacing:2px}.h{font-size:28px;font-weight:900;fill:#101114}.n{font-size:50px;font-weight:950;fill:#0f2c59}.sub{font-size:17px;fill:#596273}.label{font-size:14px;font-weight:900;fill:#0f2c59}.body{font-size:16px;font-weight:700;fill:#303846}.foot{font-size:17px;font-weight:850;fill:#0f2c59}</style>
  <rect width="1200" height="610" rx="28" fill="#f7f9fc"/>
  <text x="60" y="54" class="tag">THREE STUDY PATHS</text>
  <text x="60" y="94" class="h">무엇을 공통 진도로 둘 것인가?</text>
  <g transform="translate(60 126)"><rect width="330" height="342" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect width="330" height="8" rx="4" fill="#0f2c59"/><text x="26" y="48" class="tag">A · COMPLETE</text><text x="26" y="104" class="n">29회</text><text x="26" y="144" class="h">전권 순차형</text><text x="26" y="184" class="label">공통 진도</text><text x="26" y="211" class="body">27개 장 전체</text><text x="26" y="250" class="label">강점</text><text x="26" y="277" class="body">책의 설계를 빠짐없이 경험</text><text x="26" y="316" class="sub">전체를 공통 언어로 만들 때</text></g>
  <g transform="translate(435 126)"><rect width="330" height="342" rx="22" fill="#eef4ff" stroke="#2563eb" stroke-width="4"/><rect width="330" height="8" rx="4" fill="#2563eb"/><text x="26" y="48" class="tag">B · CORE</text><text x="26" y="104" class="n">22회</text><text x="26" y="144" class="h">핵심선택형</text><text x="26" y="184" class="label">공통 진도</text><text x="26" y="211" class="body">핵심 20개 장</text><text x="26" y="250" class="label">강점</text><text x="26" y="277" class="body">전체 루프와 기간의 균형</text><text x="26" y="316" class="sub">깊이와 폭을 함께 지킬 때</text></g>
  <g transform="translate(810 126)"><rect width="330" height="342" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect width="330" height="8" rx="4" fill="#7c3aed"/><text x="26" y="48" class="tag">C · STRATEGY</text><text x="26" y="104" class="n">16회</text><text x="26" y="144" class="h">전략구축형</text><text x="26" y="184" class="label">공통 진도</text><text x="26" y="211" class="body">연결된 14개 장</text><text x="26" y="250" class="label">강점</text><text x="26" y="277" class="body">한 질문을 운영까지 추적</text><text x="26" y="316" class="sub">실행 흐름 완성이 우선일 때</text></g>
</svg>
