<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">파트별 장 전용 공식 노트북 수</title><desc id="desc">기초 64, 특징 44, 모델 52, 전략 62, 고급 AI 39, 운영 20개를 가로 막대로 비교한다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.title{font-size:28px;font-weight:900;fill:#101114}.label{font-size:20px;font-weight:800;fill:#101114}.value{font-size:20px;font-weight:900;fill:#0f2c59}.note{font-size:17px;fill:#5f6673}</style>
  <rect width="1200" height="600" rx="28" fill="#f7f9fc"/><text x="70" y="64" class="title">장 디렉터리 안 공식 노트북 281개</text><text x="1130" y="64" text-anchor="end" class="note">전체 로컬 스냅샷 468개</text>
  <g transform="translate(70 110)"><text x="0" y="36" class="label">기초·데이터</text><rect x="190" y="8" width="768" height="42" rx="8" fill="#dbeafe"/><rect x="190" y="8" width="768" height="42" rx="8" fill="#0f2c59"/><text x="980" y="38" class="value">64</text></g>
  <g transform="translate(70 185)"><text x="0" y="36" class="label">특징</text><rect x="190" y="8" width="768" height="42" rx="8" fill="#dbeafe"/><rect x="190" y="8" width="528" height="42" rx="8" fill="#2563eb"/><text x="740" y="38" class="value">44</text></g>
  <g transform="translate(70 260)"><text x="0" y="36" class="label">모델</text><rect x="190" y="8" width="768" height="42" rx="8" fill="#dbeafe"/><rect x="190" y="8" width="624" height="42" rx="8" fill="#2563eb"/><text x="836" y="38" class="value">52</text></g>
  <g transform="translate(70 335)"><text x="0" y="36" class="label">전략</text><rect x="190" y="8" width="768" height="42" rx="8" fill="#dbeafe"/><rect x="190" y="8" width="744" height="42" rx="8" fill="#0f2c59"/><text x="956" y="38" class="value">62</text></g>
  <g transform="translate(70 410)"><text x="0" y="36" class="label">고급 AI</text><rect x="190" y="8" width="768" height="42" rx="8" fill="#dbeafe"/><rect x="190" y="8" width="468" height="42" rx="8" fill="#7c3aed"/><text x="680" y="38" class="value">39</text></g>
  <g transform="translate(70 485)"><text x="0" y="36" class="label">운영</text><rect x="190" y="8" width="768" height="42" rx="8" fill="#dbeafe"/><rect x="190" y="8" width="240" height="42" rx="8" fill="#059669"/><text x="452" y="38" class="value">20</text></g>
</svg>
