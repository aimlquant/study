<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="상태공간 모형의 두 방정식 구조. 위쪽 점선 영역은 관측되지 않는 은닉 상태 층으로 상태가 x(t-1)에서 x(t)로 넘어가는 상태 전이 방정식 x(t)=A x(t-1)+B u(t)를 나타낸다. 아래쪽 실선 영역은 관측 층으로 측정 방정식 y(t)=C(t) x(t)+D 엡실론(t)에 따라 은닉 상태가 관측 가격으로 드러난다. 오른쪽에는 같은 구조의 두 적용 사례가 있다. 첫째 이동평균 해석에서는 A와 C가 항등행렬이고 은닉 상태가 필터링된 가격이다. 둘째 헤지비율 해석에서는 관측값이 EWC이고 측정행렬이 EWA와 1로 구성되며 은닉 상태가 헤지비율과 오프셋이다.">
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}</style>

  <defs>

    <marker id="ssArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0F2C59"/>
    </marker>
    <marker id="ssArrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A9CBB"/>
    </marker>
  </defs>
  <rect width="920" height="420" fill="#FAFAF9"/>
  <g font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif">

    <text x="32" y="34" font-size="15" font-weight="700" fill="#0F0F10">상태공간 모형 — 두 방정식이 은닉 층과 관측 층을 잇는다</text>

    <!-- hidden layer -->
    <rect x="32" y="56" width="536" height="128" rx="10" fill="#EDF1F7" stroke="#0F2C59" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="52" y="82" font-size="11.5" font-weight="700" fill="#0F2C59" letter-spacing="0.6">HIDDEN · 관측되지 않는 상태</text>

    <rect x="76" y="98" width="132" height="60" rx="6" fill="#FFFFFF" stroke="#0F2C59"/>
    <text x="142" y="134" font-size="15" text-anchor="middle" fill="#0F0F10">x(t−1)</text>

    <path d="M212 128H288" stroke="#0F2C59" stroke-width="2" fill="none" marker-end="url(#ssArrow)"/>
    <text x="250" y="118" font-size="11" text-anchor="middle" fill="#0F2C59">A</text>

    <rect x="292" y="98" width="132" height="60" rx="6" fill="#0F2C59"/>
    <text x="358" y="134" font-size="15" text-anchor="middle" fill="#FFFFFF">x(t)</text>

    <path d="M488 98V122" stroke="#8A9CBB" stroke-width="2" fill="none" marker-end="url(#ssArrowLight)"/>
    <text x="488" y="146" font-size="12" text-anchor="middle" fill="#6B6B72">B · u(t)</text>
    <text x="488" y="162" font-size="10.5" text-anchor="middle" fill="#9A9893">상태 잡음</text>
    <path d="M424 128H466" stroke="#8A9CBB" stroke-width="1.4" fill="none" stroke-dasharray="3 3"/>

    <!-- transition equation label -->
    <rect x="588" y="56" width="300" height="128" rx="10" fill="#FFFFFF" stroke="#B9C6DA"/>
    <text x="608" y="82" font-size="11.5" font-weight="700" fill="#0F2C59">식 3.6 · 상태 전이 방정식</text>
    <text x="608" y="112" font-size="15" fill="#0F0F10">x(t) = A · x(t−1) + B · u(t)</text>
    <text x="608" y="140" font-size="11.5" fill="#6B6B72">상태가 어떻게 흘러가는가</text>
    <text x="608" y="160" font-size="11.5" fill="#6B6B72">B 는 매 시점 갱신되지 않고 MLE 로 추정</text>

    <!-- measurement arrow -->
    <path d="M358 190V232" stroke="#0F2C59" stroke-width="2.4" fill="none" marker-end="url(#ssArrow)"/>
    <text x="374" y="216" font-size="12" fill="#0F2C59">C(t)</text>

    <!-- observed layer -->
    <rect x="32" y="240" width="536" height="112" rx="10" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.4"/>
    <text x="52" y="266" font-size="11.5" font-weight="700" fill="#0F2C59" letter-spacing="0.6">OBSERVED · 우리가 보는 값</text>

    <rect x="292" y="282" width="132" height="52" rx="6" fill="#EDF1F7" stroke="#0F2C59"/>
    <text x="358" y="314" font-size="15" text-anchor="middle" fill="#0F0F10">y(t)</text>

    <path d="M488 282V306" stroke="#8A9CBB" stroke-width="2" fill="none" marker-end="url(#ssArrowLight)"/>
    <text x="488" y="330" font-size="12" text-anchor="middle" fill="#6B6B72">D · ε(t)</text>
    <path d="M424 308H466" stroke="#8A9CBB" stroke-width="1.4" fill="none" stroke-dasharray="3 3"/>
    <text x="142" y="314" font-size="11.5" fill="#6B6B72">가격 · 스프레드 관측치</text>

    <rect x="588" y="240" width="300" height="112" rx="10" fill="#FFFFFF" stroke="#B9C6DA"/>
    <text x="608" y="266" font-size="11.5" font-weight="700" fill="#0F2C59">식 3.7 · 측정 방정식</text>
    <text x="608" y="296" font-size="15" fill="#0F0F10">y(t) = C(t) · x(t) + D · ε(t)</text>
    <text x="608" y="324" font-size="11.5" fill="#6B6B72">상태가 관측값에 어떻게 드러나는가</text>

    <line x1="32" y1="370" x2="888" y2="370" stroke="#D8D6D1" stroke-width="1"/>
    <text x="32" y="396" font-size="12.5" fill="#0F0F10"><tspan font-weight="700">같은 구조의 두 적용</tspan> — ① 이동평균: A = C = I, x 는 필터링된 가격 (식 3.8–3.9) · ② 헤지비율: y = EWC, C(t) = [ EWA(t), 1 ], x = [ β, α ] (식 3.10–3.11)</text>
  </g>
</svg>
