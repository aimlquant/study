<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">컴퓨터 하드웨어 주식 칼만 필터 전략 표본외 재구성</title><desc id="desc">표본외 구간에서 누적 자산이 흔들리고 끝내 개선되지 않아 과적합 위험을 드러낸다.</desc>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#111827}.h{font-size:22px;font-weight:900}.s{font-size:15px;fill:#475569}.axis{stroke:#334155;stroke-width:2}.g{stroke:#cbd5e1;stroke-width:1}</style>
  <rect width="1120" height="480" rx="24" fill="#fafaf9"/><text class="t h" x="70" y="56">같은 칼만 전략 · 표본외에서는 우위가 사라진다</text>
  <g transform="translate(90 90)"><line class="axis" x1="0" y1="300" x2="930" y2="300"/><line class="axis" x1="0" y1="25" x2="0" y2="300"/><line class="g" x1="0" y1="165" x2="930" y2="165"/><path d="M0 150L55 132L110 178L165 145L220 188L275 156L330 210L385 176L440 224L495 194L550 244L605 202L660 258L715 220L770 270L825 238L880 280L930 260" fill="none" stroke="#dc2626" stroke-width="6" stroke-linejoin="round"/></g>
  <rect x="760" y="95" width="280" height="82" rx="16" fill="#fee2e2" stroke="#0f2c59" stroke-width="2"/><text class="t h" x="900" y="130" text-anchor="middle">과적합 경고</text><text class="t s" x="900" y="155" text-anchor="middle">잡음 모수와 데이터 경계 재검토</text>
</svg>
