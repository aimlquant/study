<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">EWC EWA 칼만 필터 전략 표본외 재구성</title><desc id="desc">표본외 구간에서 동적 헤지 전략의 누적 자산이 거의 평평하고 약해져 레짐 변화와 과적합 가능성을 보여준다.</desc>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#111827}.h{font-size:22px;font-weight:900}.s{font-size:15px;fill:#475569}.axis{stroke:#334155;stroke-width:2}.g{stroke:#cbd5e1;stroke-width:1}</style>
  <rect width="1120" height="480" rx="24" fill="#fafaf9"/><text class="t h" x="70" y="56">같은 EWA–EWC 전략 · 표본외</text>
  <g transform="translate(90 90)"><line class="axis" x1="0" y1="300" x2="930" y2="300"/><line class="axis" x1="0" y1="25" x2="0" y2="300"/><line class="g" x1="0" y1="160" x2="930" y2="160"/><path d="M0 158L60 150L120 162L180 155L240 170L300 160L360 182L420 168L480 190L540 176L600 186L660 172L720 184L780 178L840 188L900 184L930 186" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="730" y="95" width="310" height="88" rx="16" fill="#fee2e2" stroke="#0f2c59" stroke-width="2"/><text class="t h" x="885" y="130" text-anchor="middle">평평해진 자산곡선</text><text class="t s" x="885" y="156" text-anchor="middle">레짐 변화 또는 임계값 과적합</text>
</svg>
