<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-label="BIC가 적합도와 복잡도 벌점의 합으로 최소점을 만드는 원리를 보여주는 도해. 왼쪽 막대 그래프에서 AR(1)은 적합도 210에 벌점 10을 더해 220, AR(2)는 200에 15를 더해 215로 가장 작고, AR(10)은 적합도가 180으로 가장 좋지만 벌점이 60이나 되어 합이 240이 된다. 오른쪽은 BIC 공식으로, 마이너스 2 로그 우도는 데이터를 잘 설명할수록 작아지고 k 로그 n은 파라미터가 많을수록 커지는 벌점이며, 데이터가 1000개일 때 AIC 벌점은 파라미터당 2인 반면 BIC 벌점은 약 6.9로 훨씬 보수적이다.">
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}</style>
  <rect width="920" height="400" fill="#FAFAF9"/>
  <g class="t" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif">

    <text x="32" y="34" font-size="15" font-weight="700" fill="#0F0F10">가장 잘 맞는 모델이 아니라, 잘 맞으면서 단순한 모델을 고른다</text>

    <!-- bars -->
    <rect x="32" y="54" width="500" height="300" rx="10" fill="#FFFFFF" stroke="#B9C6DA"/>
    <text x="52" y="80" font-size="12" font-weight="700" fill="#0F2C59">BIC = 적합도 + 복잡도 벌점 (작을수록 좋다)</text>

    <line x1="120" y1="300" x2="512" y2="300" stroke="#C9C7C2"/>

    <!-- AR(1) -->
    <rect x="150" y="160" width="70" height="140" fill="#0F2C59"/>
    <rect x="150" y="150" width="70" height="10" fill="#C0392B"/>
    <text x="185" y="140" font-size="13" font-weight="700" fill="#0F0F10" text-anchor="middle">220</text>
    <text x="185" y="318" font-size="12" fill="#0F0F10" text-anchor="middle">AR(1)</text>
    <text x="185" y="336" font-size="10.5" fill="#6B6B72" text-anchor="middle">210 + 10</text>

    <!-- AR(2) -->
    <rect x="280" y="167" width="70" height="133" fill="#0F2C59"/>
    <rect x="280" y="152" width="70" height="15" fill="#C0392B"/>
    <text x="315" y="142" font-size="13" font-weight="800" fill="#2E7D5B" text-anchor="middle">215</text>
    <text x="315" y="318" font-size="12" font-weight="700" fill="#2E7D5B" text-anchor="middle">AR(2) ✓</text>
    <text x="315" y="336" font-size="10.5" fill="#6B6B72" text-anchor="middle">200 + 15</text>

    <!-- AR(10) -->
    <rect x="410" y="180" width="70" height="120" fill="#0F2C59"/>
    <rect x="410" y="120" width="70" height="60" fill="#C0392B"/>
    <text x="445" y="110" font-size="13" font-weight="700" fill="#0F0F10" text-anchor="middle">240</text>
    <text x="445" y="318" font-size="12" fill="#0F0F10" text-anchor="middle">AR(10)</text>
    <text x="445" y="336" font-size="10.5" fill="#6B6B72" text-anchor="middle">180 + 60</text>

    <rect x="52" y="240" width="14" height="14" fill="#0F2C59"/>
    <text x="74" y="252" font-size="11" fill="#0F0F10">적합도 −2log(L)</text>
    <rect x="52" y="264" width="14" height="14" fill="#C0392B"/>
    <text x="74" y="276" font-size="11" fill="#0F0F10">벌점 k·log(n)</text>

    <text x="52" y="300" font-size="11" fill="#6B6B72">AR(10)이 가장</text>
    <text x="52" y="316" font-size="11" fill="#6B6B72">잘 맞지만(180)</text>
    <text x="52" y="332" font-size="11" fill="#C0392B">벌점이 커서 탈락</text>

    <!-- formula panel -->
    <rect x="556" y="54" width="332" height="300" rx="10" fill="#FFFFFF" stroke="#B9C6DA"/>
    <text x="576" y="80" font-size="12" font-weight="700" fill="#0F2C59">공식이 말하는 것</text>

    <rect x="576" y="94" width="292" height="46" rx="6" fill="#EDF1F7"/>
    <text x="722" y="124" font-size="15" font-weight="700" fill="#0F2C59" text-anchor="middle">BIC = −2 log(L) + k log(n)</text>

    <text x="576" y="166" font-size="12" fill="#0F0F10"><tspan font-weight="700">L</tspan> — 이 모델에서 실제 데이터가 나올 가능성</text>
    <text x="576" y="188" font-size="11.5" fill="#6B6B72">잘 설명할수록 −2log(L)이 작아진다</text>
    <text x="576" y="214" font-size="12" fill="#0F0F10"><tspan font-weight="700">k log(n)</tspan> — 파라미터가 많을수록 커지는 벌점</text>

    <line x1="576" y1="234" x2="868" y2="234" stroke="#E4E2DE"/>

    <text x="576" y="258" font-size="12" font-weight="700" fill="#0F2C59">데이터 1,000개일 때 벌점 비교</text>
    <rect x="576" y="272" width="292" height="30" rx="4" fill="#F5F4F2"/>
    <text x="590" y="292" font-size="11.5" fill="#0F0F10">AIC = 2 × k</text>
    <text x="854" y="292" font-size="11.5" font-weight="700" fill="#0F0F10" text-anchor="end">파라미터당 2</text>
    <rect x="576" y="306" width="292" height="30" rx="4" fill="#EDF1F7"/>
    <text x="590" y="326" font-size="11.5" fill="#0F2C59">BIC = log(1000) × k</text>
    <text x="854" y="326" font-size="11.5" font-weight="700" fill="#0F2C59" text-anchor="end">파라미터당 ≈ 6.9</text>

    <text x="32" y="380" font-size="12" fill="#6B6B72">BIC의 절대값은 의미가 없다. 같은 데이터로 비교한 후보들 중 가장 작은 값을 고르는 데만 쓴다.</text>
  </g>
</svg>
