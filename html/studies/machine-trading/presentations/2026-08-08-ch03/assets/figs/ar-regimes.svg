<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">AR(1) 계수로 읽는 평균회귀와 랜덤워크</title><desc id="desc">절대값 phi가 1보다 작으면 평균회귀, 1이면 랜덤워크, 1보다 크면 폭발적 추세다.</desc>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#111827}.h{font-size:24px;font-weight:900}.s{font-size:17px;fill:#475569}.axis{stroke:#0f2c59;stroke-width:4}</style>
  <rect width="1120" height="480" rx="24" fill="#fafaf9"/>
  <text class="t h" x="560" y="62" text-anchor="middle">φ는 ‘어제의 이탈’이 오늘까지 얼마나 남는지를 말한다</text>
  <line class="axis" x1="120" y1="250" x2="1000" y2="250"/>
  <rect x="120" y="170" width="570" height="160" rx="24" fill="#dcfce7"/><rect x="690" y="170" width="80" height="160" fill="#fef3c7"/><rect x="770" y="170" width="230" height="160" rx="24" fill="#fee2e2"/>
  <line x1="690" y1="145" x2="690" y2="350" stroke="#d97706" stroke-width="3" stroke-dasharray="7 7"/><line x1="770" y1="145" x2="770" y2="350" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 7"/>
  <g class="t"><text class="h" x="405" y="228" text-anchor="middle">|φ| &lt; 1 · 평균회귀</text><text class="s" x="405" y="278" text-anchor="middle">충격의 영향이 점차 사라진다</text><text class="h" x="730" y="220" text-anchor="middle">φ=1</text><text class="s" x="730" y="278" text-anchor="middle">랜덤</text><text class="s" x="730" y="302" text-anchor="middle">워크</text><text class="h" x="885" y="228" text-anchor="middle">|φ| &gt; 1 · 발산</text><text class="s" x="885" y="278" text-anchor="middle">충격이 증폭된다</text><text class="s" x="560" y="405" text-anchor="middle">AUD.USD 추정치 0.99997은 통계적으로 1보다 작아도 실질적으로 랜덤워크에 가깝다</text></g>
</svg>
