<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">예측을 거래 손익으로 바꾸는 정보 경계</title>
  <desc id="desc">학습 구간 고정, 한 단계 앞 예측, 지연 포지션, 체결비용, 표본외 평가가 순서대로 이어진다.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0f2c59"/></marker><style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#111827}.box{fill:#fff;stroke:#0f2c59;stroke-width:2}.n{font-size:16px;font-weight:900;fill:#fff}.h{font-size:19px;font-weight:800}.s{font-size:15px;fill:#475569}</style></defs>
  <rect width="1120" height="480" rx="24" fill="#fafaf9"/>
  <g class="t">
    <g transform="translate(45 150)"><circle cx="29" cy="-34" r="22" fill="#0f2c59"/><text class="n" x="29" y="-28" text-anchor="middle">1</text><rect class="box" width="170" height="120" rx="18"/><text class="h" x="85" y="48" text-anchor="middle">학습 창 고정</text><text class="s" x="85" y="80" text-anchor="middle">미래 데이터 차단</text></g>
    <path d="M215 210H251" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(265 150)"><circle cx="29" cy="-34" r="22" fill="#0f2c59"/><text class="n" x="29" y="-28" text-anchor="middle">2</text><rect class="box" width="170" height="120" rx="18"/><text class="h" x="85" y="48" text-anchor="middle">1-step 예측</text><text class="s" x="85" y="80" text-anchor="middle">t로 t+1 추정</text></g>
    <path d="M435 210H471" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(485 150)"><circle cx="29" cy="-34" r="22" fill="#0f2c59"/><text class="n" x="29" y="-28" text-anchor="middle">3</text><rect class="box" width="170" height="120" rx="18"/><text class="h" x="85" y="48" text-anchor="middle">포지션 지연</text><text class="s" x="85" y="80" text-anchor="middle">신호 뒤 손익 실현</text></g>
    <path d="M655 210H691" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(705 150)"><circle cx="29" cy="-34" r="22" fill="#0f2c59"/><text class="n" x="29" y="-28" text-anchor="middle">4</text><rect class="box" width="170" height="120" rx="18"/><text class="h" x="85" y="48" text-anchor="middle">체결비용</text><text class="s" x="85" y="80" text-anchor="middle">스프레드·회전율</text></g>
    <path d="M875 210H911" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <g transform="translate(925 150)"><circle cx="29" cy="-34" r="22" fill="#0f2c59"/><text class="n" x="29" y="-28" text-anchor="middle">5</text><rect class="box" width="150" height="120" rx="18" fill="#fef3c7"/><text class="h" x="75" y="48" text-anchor="middle">표본외 판정</text><text class="s" x="75" y="80" text-anchor="middle">성과·낙폭·붕괴</text></g>
  </g>
  <path d="M1000 300V372H130V300" stroke="#d97706" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
  <text class="t s" x="560" y="405" text-anchor="middle">실패하면 모델 이름이 아니라 데이터·시점·비용·분할 계약으로 돌아간다</text>
</svg>
