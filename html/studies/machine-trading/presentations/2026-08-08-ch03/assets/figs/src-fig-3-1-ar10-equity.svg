<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="AR(10) 모델로 AUD.USD 중간가격을 예측해 만든 거래 전략의 표본외 누적수익 개형. 곡선은 등락 없이 꾸준히 우상향하며 연율화 158퍼센트에 도달한다. 아래에는 이 수익이 중간가격 체결을 전제로 한다는 단서가 적혀 있다.">
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}</style>
  <rect width="880" height="410" fill="#FAFAF9"/>
  <g class="t" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif">
    <text x="32" y="34" font-size="15" font-weight="700" fill="#0F0F10">예측이 맞아서가 아니라, 체결 가정이 만들어 낸 곡선</text>
    <text x="32" y="56" font-size="12.5" fill="#6B6B72">AR(10) · AUD.USD 중간가격 · 표본외 구간 &#160;·&#160; 교재가 보고한 연율화 수익률 158%</text>
    <rect x="32" y="76" width="816" height="254" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.4"/>
    <text x="52" y="102" font-size="12" font-weight="700" fill="#2E7D5B">표본외 누적수익</text>
    <line x1="90.0" y1="122" x2="90.0" y2="272" stroke="#C9C7C2"/>
    <line x1="90.0" y1="260" x2="824" y2="260" stroke="#C9C7C2" stroke-dasharray="3 3"/>
    <text x="82.0" y="126" font-size="10" fill="#9A9893" text-anchor="end">높음</text>
    <text x="82.0" y="264" font-size="10" fill="#9A9893" text-anchor="end">0</text>
    <polyline points="90,260 146,254 203,251 259,243 316,236 372,224 429,217 485,203 542,194 598,181 655,171 711,157 768,147 824,135" fill="none" stroke="#2E7D5B" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="824" y="116" font-size="15" font-weight="800" fill="#2E7D5B" text-anchor="end">연율 158%</text>
    <text x="163" y="290" font-size="10" fill="#9A9893" text-anchor="middle">구간 초</text>
    <text x="457" y="290" font-size="10" fill="#9A9893" text-anchor="middle">중반</text>
    <text x="751" y="290" font-size="10" fill="#9A9893" text-anchor="middle">구간 말</text>
    <line x1="52" y1="302" x2="828" y2="302" stroke="#E4E2DE"/>
    <text x="52" y="320" font-size="10.5" fill="#2E7D5B">거의 되돌림 없이 오르는 모습 — 실전 곡선치고 지나치게 매끄럽다</text>
    <rect x="32" y="348" width="816" height="54" rx="8" fill="#EDF1F7"/>
    <text x="52" y="372" font-size="12.5" fill="#0F0F10">이 수익은 매수호가와 매도호가의 <tspan font-weight="700">중간가격에 체결된다</tspan>고 가정할 때만 성립한다.</text>
    <text x="52" y="394" font-size="11.5" fill="#6B6B72">지정가 주문을 관리하는 저지연 실행이 없으면 스프레드가 이 곡선을 대부분 먹는다. 발표자 재구성 · 개형만 전달한다.</text>
  </g>
</svg>
