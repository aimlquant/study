<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="섹터 중립 비중이 만들어지는 네 단계 도해. 1단계에서 VAR이 예측한 수익률은 AAPL 2퍼센트, HPQ 1퍼센트, NTAP 마이너스 1퍼센트다. 2단계에서 업종 평균은 0.667퍼센트다. 3단계에서 평균을 빼면 각각 플러스 1.333, 플러스 0.333, 마이너스 1.667퍼센트가 되고 이 셋의 합은 0이다. 4단계에서 절댓값 합 3.333으로 나누면 비중이 플러스 40퍼센트 매수, 플러스 10퍼센트 매수, 마이너스 50퍼센트 공매도가 되어 순노출이 0이 된다.">
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}</style>
  <rect width="920" height="420" fill="#FAFAF9"/>
  <g class="t" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif">

    <text x="32" y="34" font-size="15" font-weight="700" fill="#0F0F10">업종이 오를지에 걸지 않고, 업종 안에서 누가 더 잘할지에만 건다</text>

    <!-- step 1 -->
    <rect x="32" y="54" width="196" height="150" rx="8" fill="#FFFFFF" stroke="#B9C6DA"/>
    <text x="48" y="78" font-size="11" font-weight="700" fill="#0F2C59">STEP 1 · 예측수익률</text>
    <g font-size="12.5">
      <text x="48" y="106" fill="#0F0F10">AAPL</text><text x="212" y="106" fill="#0F0F10" text-anchor="end" font-weight="700">+2%</text>
      <text x="48" y="134" fill="#0F0F10">HPQ</text><text x="212" y="134" fill="#0F0F10" text-anchor="end" font-weight="700">+1%</text>
      <text x="48" y="162" fill="#0F0F10">NTAP</text><text x="212" y="162" fill="#0F0F10" text-anchor="end" font-weight="700">−1%</text>
    </g>
    <text x="48" y="188" font-size="10.5" fill="#6B6B72">VAR이 예측한 다음 날 수익률</text>

    <text x="240" y="134" font-size="20" fill="#0F2C59">→</text>

    <!-- step 2 -->
    <rect x="264" y="54" width="196" height="150" rx="8" fill="#EDF1F7" stroke="#B9C6DA"/>
    <text x="280" y="78" font-size="11" font-weight="700" fill="#0F2C59">STEP 2 · 업종 평균</text>
    <text x="362" y="126" font-size="13" fill="#0F0F10" text-anchor="middle">(2 + 1 − 1) / 3</text>
    <text x="362" y="160" font-size="20" font-weight="800" fill="#0F2C59" text-anchor="middle">0.667%</text>
    <text x="280" y="188" font-size="10.5" fill="#6B6B72">업종 전체가 오를 것으로 본 정도</text>

    <text x="472" y="134" font-size="20" fill="#0F2C59">→</text>

    <!-- step 3 -->
    <rect x="496" y="54" width="196" height="150" rx="8" fill="#FFFFFF" stroke="#B9C6DA"/>
    <text x="512" y="78" font-size="11" font-weight="700" fill="#0F2C59">STEP 3 · 평균 대비 이탈</text>
    <g font-size="12.5">
      <text x="512" y="106" fill="#0F0F10">AAPL</text><text x="676" y="106" fill="#2E7D5B" text-anchor="end" font-weight="700">+1.333</text>
      <text x="512" y="134" fill="#0F0F10">HPQ</text><text x="676" y="134" fill="#2E7D5B" text-anchor="end" font-weight="700">+0.333</text>
      <text x="512" y="162" fill="#0F0F10">NTAP</text><text x="676" y="162" fill="#C0392B" text-anchor="end" font-weight="700">−1.667</text>
    </g>
    <text x="512" y="188" font-size="10.5" fill="#0F2C59">세 값의 합 = 0 ← 여기서 중립이 생긴다</text>

    <text x="704" y="134" font-size="20" fill="#0F2C59">→</text>

    <!-- step 4 -->
    <rect x="728" y="54" width="160" height="150" rx="8" fill="#0F2C59"/>
    <text x="744" y="78" font-size="11" font-weight="700" fill="#9DB4D8">STEP 4 · 비중</text>
    <text x="744" y="100" font-size="10.5" fill="#D5DFEE">÷ |합| = 3.333</text>
    <g font-size="12.5" fill="#FFFFFF">
      <text x="744" y="128">AAPL</text><text x="872" y="128" text-anchor="end" font-weight="700">+40%</text>
      <text x="744" y="152">HPQ</text><text x="872" y="152" text-anchor="end" font-weight="700">+10%</text>
      <text x="744" y="176">NTAP</text><text x="872" y="176" text-anchor="end" font-weight="700">−50%</text>
    </g>

    <!-- balance -->
    <rect x="32" y="228" width="856" height="96" rx="10" fill="#FFFFFF" stroke="#B9C6DA"/>
    <text x="52" y="254" font-size="12" font-weight="700" fill="#0F2C59">1억 원이면 이렇게 잡힌다 — 매수 5,000만 · 공매도 5,000만 · 순투자 0</text>
    <rect x="52" y="266" width="330" height="34" rx="5" fill="#E9F4EE"/>
    <text x="68" y="288" font-size="12.5" fill="#2E7D5B">매수 &#160; AAPL 4,000만 &#160;+&#160; HPQ 1,000만</text>
    <text x="372" y="288" font-size="12.5" font-weight="700" fill="#2E7D5B" text-anchor="end">+50%</text>
    <rect x="396" y="266" width="330" height="34" rx="5" fill="#FDECEC"/>
    <text x="412" y="288" font-size="12.5" fill="#C0392B">공매도 &#160; NTAP 5,000만</text>
    <text x="716" y="288" font-size="12.5" font-weight="700" fill="#C0392B" text-anchor="end">−50%</text>
    <text x="742" y="288" font-size="14" fill="#0F2C59">=</text>
    <rect x="762" y="266" width="106" height="34" rx="5" fill="#EDF1F7"/>
    <text x="815" y="288" font-size="14" font-weight="800" fill="#0F2C59" text-anchor="middle">0</text>

    <!-- why -->
    <rect x="32" y="342" width="856" height="56" rx="8" fill="#EDF1F7"/>
    <text x="52" y="366" font-size="12.5" fill="#0F0F10">업종이 통째로 10% 올라도(AAPL +13, HPQ +11, NTAP +6), 통째로 내려도(−3, −4, −9) 수익은 <tspan font-weight="700">종목 간 격차</tspan>에서 나온다.</text>
    <text x="52" y="388" font-size="12" fill="#6B6B72">방향을 맞히는 전략이 아니라 순위를 맞히는 전략이다.</text>
  </g>
</svg>
