<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="EWC와 EWA 사이 기울기에 대한 칼만 필터 추정값의 시간 변화 개형. 2006년 초 큰 폭으로 출렁이는 초기 과도 구간을 지나면 값이 안정되지만, 이후에도 완만하게 오르내리며 한 값에 머물지 않는다.">
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}</style>
  <rect width="880" height="380" fill="#FAFAF9"/>
  <g class="t" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif">
    <text x="32" y="34" font-size="15" font-weight="700" fill="#0F0F10">헤지 비율은 상수가 아니라 매일 갱신되는 추정값이다</text>
    <text x="32" y="56" font-size="12.5" fill="#6B6B72">EWC = 기울기 × EWA + 오프셋 &#160;·&#160; 칼만 필터가 매일 새로 추정한 기울기</text>
    <rect x="32" y="76" width="816" height="212" rx="10" fill="#FFFFFF" stroke="#0F2C59" stroke-width="1.4"/>
    <text x="52" y="102" font-size="12" font-weight="700" fill="#0F2C59">그림 3.6 · 기울기 추정값의 시간 변화</text>
    <line x1="108" y1="120" x2="108" y2="258" stroke="#C9C7C2"/>
    <line x1="108" y1="258" x2="824" y2="258" stroke="#C9C7C2"/>
    <text x="100" y="124" font-size="10" fill="#9A9893" text-anchor="end">높음</text>
    <text x="100" y="262" font-size="10" fill="#9A9893" text-anchor="end">낮음</text>
    <rect x="108" y="120" width="86" height="138" fill="#FDECEC" opacity="0.65"/>
    <text x="151" y="138" font-size="10" fill="#C0392B" text-anchor="middle">초기 과도</text>
    <polyline points="108,251 150,127 192,219 234,159 276,189 319,178 361,186 403,174 445,182 487,167 529,175 571,159 613,170 656,161 698,178 740,186 782,192 824,197" fill="none" stroke="#0F2C59" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="108" y="278" font-size="10" fill="#9A9893">2006</text>
    <text x="466" y="278" font-size="10" fill="#9A9893" text-anchor="middle">2009</text>
    <text x="824" y="278" font-size="10" fill="#9A9893" text-anchor="end">2012</text>
    <rect x="32" y="304" width="816" height="60" rx="8" fill="#EDF1F7"/>
    <text x="52" y="328" font-size="12.5" fill="#0F0F10">초기 추정값을 아무렇게나 놓아도 며칠이면 <tspan font-weight="700">데이터가 밀어 넣은 값</tspan>으로 수렴한다.</text>
    <text x="52" y="350" font-size="11.5" fill="#6B6B72">수렴 뒤에도 값은 계속 움직인다. 회귀로 한 번 구한 상수 헤지 비율과 결정적으로 다른 점이다. 발표자 재구성 · 개형만 전달한다.</text>
  </g>
</svg>
