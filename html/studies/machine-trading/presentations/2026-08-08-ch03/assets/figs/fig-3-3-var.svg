<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">컴퓨터 하드웨어 주식 VAR(1) 거래 전략 재구성</title><desc id="desc">여러 종목의 예측 수익률에서 섹터 평균을 뺀 뒤 절대 노출을 1로 정규화해 누적 성과를 만든다.</desc>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#111827}.h{font-size:21px;font-weight:900}.s{font-size:15px;fill:#475569}.axis{stroke:#334155;stroke-width:2}.g{stroke:#cbd5e1;stroke-width:1}</style>
  <rect width="1120" height="480" rx="24" fill="#fafaf9"/><text class="t h" x="70" y="55">VAR(1) · 종목별 예측에서 섹터 공통 움직임을 제거</text>
  <g transform="translate(80 95)"><line class="axis" x1="0" y1="290" x2="650" y2="290"/><line class="axis" x1="0" y1="20" x2="0" y2="290"/><line class="g" x1="0" y1="200" x2="650" y2="200"/><line class="g" x1="0" y1="110" x2="650" y2="110"/><path d="M0 280L45 270L90 240L130 250L170 210L210 220L250 190L295 168L340 182L380 142L420 150L465 112L510 124L555 82L605 66L650 44" fill="none" stroke="#2563eb" stroke-width="6" stroke-linejoin="round"/></g>
  <g class="t" transform="translate(790 105)"><rect width="250" height="235" rx="18" fill="#e0f2fe" stroke="#0f2c59" stroke-width="2"/><text class="h" x="125" y="46" text-anchor="middle">섹터 중립 배분</text><text class="s" x="125" y="86" text-anchor="middle">종목 예측수익률</text><text class="h" x="125" y="120" text-anchor="middle">− 섹터 평균</text><line x1="45" y1="144" x2="205" y2="144" stroke="#0f2c59" stroke-width="2"/><text class="s" x="125" y="177" text-anchor="middle">절대 이탈 합으로 나눔</text><text class="s" x="125" y="208" text-anchor="middle">총 절대노출 = 1</text></g>
</svg>
