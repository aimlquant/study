<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">컴퓨터 하드웨어 주식 칼만 필터 전략 표본내 재구성</title><desc id="desc">학습 구간에서 칼만 필터 전략의 누적 자산은 큰 변동과 함께 상승해 적합도가 좋아 보인다.</desc>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#111827}.h{font-size:22px;font-weight:900}.s{font-size:15px;fill:#475569}.axis{stroke:#334155;stroke-width:2}.g{stroke:#cbd5e1;stroke-width:1}</style>
  <rect width="1120" height="480" rx="24" fill="#fafaf9"/><text class="t h" x="70" y="56">칼만 필터 · 표본내에서는 매끄러운 상태 추정이 강해 보인다</text>
  <g transform="translate(90 90)"><line class="axis" x1="0" y1="300" x2="930" y2="300"/><line class="axis" x1="0" y1="25" x2="0" y2="300"/><line class="g" x1="0" y1="210" x2="930" y2="210"/><line class="g" x1="0" y1="120" x2="930" y2="120"/><path d="M0 260L45 242L90 275L135 250L180 266L225 232L270 244L315 205L360 224L405 185L450 215L495 170L540 195L585 148L630 178L675 132L720 158L765 104L810 135L855 92L900 116L930 70" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linejoin="round"/></g>
  <rect x="760" y="95" width="280" height="82" rx="16" fill="#ede9fe" stroke="#0f2c59" stroke-width="2"/><text class="t h" x="900" y="130" text-anchor="middle">좋은 적합은 출발점</text><text class="t s" x="900" y="155" text-anchor="middle">표본외 성과를 보장하지 않는다</text>
</svg>
