<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">시계열 전략 검증 루프</title><desc id="desc">모델 선택, 적합, 예측, 실행, 표본외 관측, 재검증이 순환한다.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0f2c59"/></marker><style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#111827}.box{stroke:#0f2c59;stroke-width:2}.h{font-size:18px;font-weight:800}.s{font-size:14px;fill:#475569}</style></defs>
  <rect width="1120" height="480" rx="24" fill="#fafaf9"/>
  <g class="t">
    <rect class="box" x="455" y="42" width="210" height="78" rx="18" fill="#dbeafe"/><text class="h" x="560" y="76" text-anchor="middle">1. 차수·제약 선택</text><text class="s" x="560" y="100" text-anchor="middle">BIC와 경제적 가정</text>
    <rect class="box" x="790" y="150" width="210" height="78" rx="18" fill="#dcfce7"/><text class="h" x="895" y="184" text-anchor="middle">2. 학습 구간 적합</text><text class="s" x="895" y="208" text-anchor="middle">미래 데이터 금지</text>
    <rect class="box" x="715" y="330" width="210" height="78" rx="18" fill="#fef3c7"/><text class="h" x="820" y="364" text-anchor="middle">3. 예측·포지션</text><text class="s" x="820" y="388" text-anchor="middle">한 시점 지연</text>
    <rect class="box" x="195" y="330" width="210" height="78" rx="18" fill="#fee2e2"/><text class="h" x="300" y="364" text-anchor="middle">4. 비용·체결</text><text class="s" x="300" y="388" text-anchor="middle">스프레드와 회전율</text>
    <rect class="box" x="120" y="150" width="210" height="78" rx="18" fill="#ede9fe"/><text class="h" x="225" y="184" text-anchor="middle">5. 표본외 관측</text><text class="s" x="225" y="208" text-anchor="middle">수익·낙폭·레짐 변화</text>
  </g>
  <path d="M665 82C770 82 835 110 875 142" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M970 228C970 280 915 315 865 328" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M715 370H419" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M255 329C175 306 145 270 157 230" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M242 150C285 96 365 81 441 81" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <circle cx="560" cy="240" r="88" fill="#0f2c59"/><text class="t" x="560" y="227" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">재현 가능한</text><text class="t" x="560" y="260" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">검증 계약</text>
</svg>
