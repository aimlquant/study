<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="칼만 필터를 컴퓨터 하드웨어 주식에 적용한 섹터 중립 전략의 학습 구간 누적수익 개형. 곡선이 되돌림 없이 꾸준히 크게 상승한다. 이 그래프만 보면 훌륭한 전략처럼 보이지만 학습 구간의 결과라는 단서가 붙어 있다.">
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}</style>
  <rect width="880" height="410" fill="#FAFAF9"/>
  <g class="t" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif">
    <text x="32" y="34" font-size="15" font-weight="700" fill="#0F0F10">학습 구간만 보면 흠잡을 데 없는 곡선이다</text>
    <text x="32" y="56" font-size="12.5" fill="#6B6B72">상태공간 모델 · 컴퓨터 하드웨어 주식 · 학습 구간(표본내) &#160;·&#160; 그림 3.5와 반드시 함께 볼 것</text>
    <rect x="32" y="76" width="816" height="254" rx="10" fill="#FFFFFF" stroke="#2E7D5B" stroke-width="1.4"/>
    <text x="52" y="102" font-size="12" font-weight="700" fill="#2E7D5B">학습 구간 누적수익</text>
    <line x1="90.0" y1="122" x2="90.0" y2="272" stroke="#C9C7C2"/>
    <line x1="90.0" y1="254" x2="824" y2="254" stroke="#C9C7C2" stroke-dasharray="3 3"/>
    <text x="82.0" y="126" font-size="10" fill="#9A9893" text-anchor="end">높음</text>
    <text x="82.0" y="258" font-size="10" fill="#9A9893" text-anchor="end">0</text>
    <polyline points="90,254 146,249 203,246 259,238 316,231 372,220 429,213 485,200 542,192 598,178 655,169 711,156 768,146 824,134" fill="none" stroke="#2E7D5B" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="824" y="116" font-size="15" font-weight="800" fill="#2E7D5B" text-anchor="end">크게 상승</text>
    <text x="163" y="290" font-size="10" fill="#9A9893" text-anchor="middle">학습 초</text>
    <text x="457" y="290" font-size="10" fill="#9A9893" text-anchor="middle">중반</text>
    <text x="751" y="290" font-size="10" fill="#9A9893" text-anchor="middle">학습 말</text>
    <line x1="52" y1="302" x2="828" y2="302" stroke="#E4E2DE"/>
    <text x="52" y="320" font-size="10.5" fill="#2E7D5B">학습 구간에서 추정한 것은 상태 잡음과 측정 잡음의 분산, 단 두 개뿐이다</text>
    <rect x="32" y="348" width="816" height="54" rx="8" fill="#EDF1F7"/>
    <text x="52" y="372" font-size="12.5" fill="#0F0F10">여기서 멈추면 <tspan font-weight="700">모델이 시장을 이겼다</tspan>는 결론이 나온다.</text>
    <text x="52" y="394" font-size="11.5" fill="#6B6B72">그 결론이 성립하는지는 다음 그림에서 갈린다. 발표자 재구성 · 개형만 전달한다.</text>
  </g>
</svg>
