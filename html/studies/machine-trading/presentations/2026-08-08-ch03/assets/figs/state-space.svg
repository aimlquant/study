<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">상태공간 모델의 상태 전이와 측정</title><desc id="desc">이전 은닉 상태가 잡음과 함께 현재 상태로 전이되고, 현재 상태가 측정 잡음과 함께 관측 가격으로 나타난다.</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0f2c59"/></marker><style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#111827}.box{stroke:#0f2c59;stroke-width:2}.h{font-size:22px;font-weight:900}.s{font-size:16px;fill:#475569}</style></defs>
  <rect width="1120" height="480" rx="24" fill="#fafaf9"/>
  <g class="t">
    <rect class="box" x="90" y="165" width="230" height="130" rx="22" fill="#dbeafe"/><text class="h" x="205" y="220" text-anchor="middle">이전 상태 x(t−1)</text><text class="s" x="205" y="255" text-anchor="middle">직접 관측되지 않음</text>
    <path d="M320 230H466" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text class="s" x="393" y="205" text-anchor="middle">A(t) + 상태잡음</text>
    <rect class="box" x="480" y="165" width="230" height="130" rx="22" fill="#fef3c7"/><text class="h" x="595" y="220" text-anchor="middle">현재 상태 x(t)</text><text class="s" x="595" y="255" text-anchor="middle">이동평균·헤지비율</text>
    <path d="M710 230H856" stroke="#0f2c59" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text class="s" x="783" y="205" text-anchor="middle">C(t) + 측정잡음</text>
    <rect class="box" x="870" y="165" width="160" height="130" rx="22" fill="#dcfce7"/><text class="h" x="950" y="220" text-anchor="middle">관측 y(t)</text><text class="s" x="950" y="255" text-anchor="middle">가격·스프레드</text>
    <rect x="355" y="365" width="410" height="62" rx="16" fill="#0f2c59"/><text x="560" y="404" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">칼만 필터 = 예측과 새 관측을 순차 결합</text>
  </g>
</svg>
