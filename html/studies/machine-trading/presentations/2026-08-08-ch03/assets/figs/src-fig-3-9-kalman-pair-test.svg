<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="같은 EWC와 EWA 칼만 필터 전략의 테스트 구간 누적수익 개형. 곡선이 작게 오르내릴 뿐 거의 수평으로 이어져 학습 구간 후반부의 정체가 그대로 계속된다.">
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}</style>
  <rect width="880" height="410" fill="#FAFAF9"/>
  <g class="t" font-family="'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif">
    <text x="32" y="34" font-size="15" font-weight="700" fill="#0F0F10">짐작한 대로다 — 학습 후반의 정체가 그대로 이어진다</text>
    <text x="32" y="56" font-size="12.5" fill="#6B6B72">칼만 필터 페어 트레이딩 · EWC–EWA · 테스트 구간(표본외)</text>
    <rect x="32" y="76" width="816" height="254" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.4"/>
    <text x="52" y="102" font-size="12" font-weight="700" fill="#C0392B">테스트 구간 누적수익</text>
    <line x1="90.0" y1="122" x2="90.0" y2="272" stroke="#C9C7C2"/>
    <line x1="90.0" y1="228" x2="824" y2="228" stroke="#C9C7C2" stroke-dasharray="3 3"/>
    <text x="82.0" y="126" font-size="10" fill="#9A9893" text-anchor="end">소폭 +</text>
    <text x="82.0" y="232" font-size="10" fill="#9A9893" text-anchor="end">0</text>
    <text x="82.0" y="276" font-size="10" fill="#9A9893" text-anchor="end">−</text>
    <polyline points="90,228 146,217 203,224 259,212 316,221 372,210 429,219 485,208 542,217 598,207 655,216 711,208 768,214 824,212" fill="none" stroke="#C0392B" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="824" y="116" font-size="15" font-weight="800" fill="#C0392B" text-anchor="end">거의 수평</text>
    <text x="163" y="290" font-size="10" fill="#9A9893" text-anchor="middle">테스트 초</text>
    <text x="457" y="290" font-size="10" fill="#9A9893" text-anchor="middle">중반</text>
    <text x="751" y="290" font-size="10" fill="#9A9893" text-anchor="middle">테스트 말</text>
    <line x1="52" y1="302" x2="828" y2="302" stroke="#E4E2DE"/>
    <text x="52" y="320" font-size="10.5" fill="#6B6B72">연습문제 3.6은 같은 페어를 다른 가정으로 CAGR 26.2%까지 끌어올린다</text>
    <rect x="32" y="348" width="816" height="54" rx="8" fill="#EDF1F7"/>
    <text x="52" y="372" font-size="12.5" fill="#0F0F10">모델을 바꾼 게 아니라 <tspan font-weight="700">B를 대각행렬로 제약</tspan>했을 때 결과가 달라진다는 것이 연습문제 3.6의 요지다.</text>
    <text x="52" y="394" font-size="11.5" fill="#6B6B72">추정할 것을 줄이는 쪽이 이기는 이 장의 결론과 정확히 같은 방향이다. 발표자 재구성 · 개형만 전달한다.</text>
  </g>
</svg>
