<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 88 888 390" role="img" aria-labelledby="title desc">
  <title id="title">LLM과 지식 그래프의 강점과 약점 비교</title>
  <desc id="desc">LLM은 암묵 지식, 언어 처리, 일반화가 강점이고 환각, 블랙박스, 도메인 및 최신 지식 부족이 약점이다. 지식 그래프는 정확성, 해석 가능성, 도메인 및 진화하는 지식이 강점이고 불확실성, 언어 이해 부족, 복잡한 질의가 약점이다.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker>
    <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.h{font-size:19px;font-weight:800}.sh{font-size:16px;font-weight:800}.b{font-size:13px}.m{font-size:12px;fill:#6B6B72}.panel{fill:#fff;stroke:#B7C2D1;stroke-width:1.5}.llm{fill:#FFF7C7;stroke:#C8A500;stroke-width:2}.kg{fill:#E3F2D8;stroke:#5F8D45;stroke-width:2}.line{stroke:#6B6B72;stroke-width:2.2;fill:none;marker-end:url(#a)}.edge-label{paint-order:stroke fill;stroke:#FAFAF9;stroke-width:4px;stroke-linejoin:round}</style>
  </defs>
  <rect width="920" height="520" rx="12" fill="#FAFAF9"/>
  <rect class="llm" x="42" y="102" width="366" height="322" rx="14"/>
  <text class="t h" x="225" y="139" text-anchor="middle">LLM</text>
  <rect class="panel" x="66" y="160" width="318" height="104" rx="9"/>
  <text class="t sh" x="86" y="189">강점</text>
  <text class="t b" x="86" y="217">• 암묵 지식</text><text class="t b" x="226" y="217">• 언어 처리</text>
  <text class="t b" x="86" y="243">• 일반화</text>
  <rect class="panel" x="66" y="282" width="318" height="118" rx="9"/>
  <text class="t sh" x="86" y="311">약점</text>
  <text class="t b" x="86" y="339">• 환각</text><text class="t b" x="226" y="339">• 블랙박스</text>
  <text class="t b" x="86" y="365">• 도메인 지식 부족</text>
  <text class="t b" x="86" y="389">• 최신 지식 부족</text>

  <rect class="kg" x="512" y="102" width="366" height="322" rx="14"/>
  <text class="t h" x="695" y="139" text-anchor="middle">지식 그래프</text>
  <rect class="panel" x="536" y="160" width="318" height="118" rx="9"/>
  <text class="t sh" x="556" y="189">강점</text>
  <text class="t b" x="556" y="217">• 정확성</text><text class="t b" x="696" y="217">• 해석 가능성</text>
  <text class="t b" x="556" y="243">• 도메인 지식</text><text class="t b" x="696" y="243">• 진화하는 지식</text>
  <rect class="panel" x="536" y="296" width="318" height="104" rx="9"/>
  <text class="t sh" x="556" y="325">약점</text>
  <text class="t b" x="556" y="353">• 불확실성</text><text class="t b" x="696" y="353">• 언어 이해 부족</text>
  <text class="t b" x="556" y="379">• 복잡한 질의</text>

  <path class="line" d="M384 230C438 230 478 350 532 350"/>
  <path class="line" d="M854 220H900V438H420V341H388"/>
  <text class="t m edge-label" x="460" y="286" text-anchor="middle">언어·일반화</text>
  <text class="t m edge-label" x="658" y="458" text-anchor="middle">정확성·근거</text>
</svg>
