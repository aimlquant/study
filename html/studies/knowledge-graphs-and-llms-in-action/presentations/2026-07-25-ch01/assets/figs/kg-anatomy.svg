<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 110 828 310" role="img" aria-labelledby="title desc">
  <title id="title">지식 그래프의 노드, 관계, 속성 구조</title>
  <desc id="desc">약물, 질병, 증상, 단백질 노드와 치료한다, 유발한다, 표적한다 관계 및 속성의 연결을 보여준다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B6B72"/></marker><style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}.h{font-weight:800;font-size:19px}.b{font-size:15px}.m{font-size:13px;fill:#6B6B72}.node{fill:#fff;stroke:#0F2C59;stroke-width:2}.soft{fill:#F2F5F9;stroke:#B7C2D1;stroke-width:1.5}.edge{stroke:#6B6B72;stroke-width:2;marker-end:url(#arrow)}.pill{fill:#0F2C59}</style></defs>
  <rect width="920" height="470" rx="12" fill="#FAFAF9"/>
  <line class="edge" x1="250" y1="180" x2="404" y2="180"/><line class="edge" x1="568" y1="180" x2="724" y2="180"/>
  <line class="edge" x1="488" y1="230" x2="488" y2="306"/><path class="edge" fill="none" d="M170 230V270H350V354H404"/>
  <g><rect class="node" x="90" y="130" width="160" height="100" rx="8"/><rect class="pill" x="90" y="130" width="160" height="30" rx="8"/><rect class="pill" x="90" y="151" width="160" height="9"/><text x="170" y="151" text-anchor="middle" fill="#fff" class="t b" font-weight="800">약물 A</text><text class="t m" x="108" y="187">승인일 · 용량</text><text class="t m" x="108" y="210">출처 · 갱신 시각</text></g>
  <g><rect class="node" x="408" y="130" width="160" height="100" rx="8"/><rect class="pill" x="408" y="130" width="160" height="30" rx="8"/><rect class="pill" x="408" y="151" width="160" height="9"/><text x="488" y="151" text-anchor="middle" fill="#fff" class="t b" font-weight="800">질병 B</text><text class="t m" x="426" y="187">질병 분류 · 설명</text><text class="t m" x="426" y="210">동의어 · 코드</text></g>
  <g><rect class="node" x="728" y="130" width="150" height="100" rx="8"/><rect class="pill" x="728" y="130" width="150" height="30" rx="8"/><rect class="pill" x="728" y="151" width="150" height="9"/><text x="803" y="151" text-anchor="middle" fill="#fff" class="t b" font-weight="800">증상 C</text><text class="t m" x="746" y="187">중증도 · 빈도</text><text class="t m" x="746" y="210">관찰 조건</text></g>
  <g><rect class="node" x="408" y="310" width="160" height="88" rx="8"/><text x="488" y="345" text-anchor="middle" class="t h">단백질 D</text><text x="488" y="371" text-anchor="middle" class="t m">유전자 · 기능</text></g>
  <g><rect class="soft" x="282" y="151" width="90" height="24" rx="12"/><text x="327" y="168" text-anchor="middle" class="t m">치료한다</text><rect class="soft" x="615" y="151" width="90" height="24" rx="12"/><text x="660" y="168" text-anchor="middle" class="t m">유발한다</text><rect class="soft" x="505" y="266" width="82" height="24" rx="12"/><text x="546" y="283" text-anchor="middle" class="t m">연관된다</text><rect class="soft" x="224" y="258" width="78" height="24" rx="12"/><text x="263" y="275" text-anchor="middle" class="t m">표적한다</text></g>
</svg>
