<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="title desc">
  <title id="title">RandomLinkSplit이 만드는 메시지 전달 엣지와 감독 엣지</title>
  <desc id="desc">전체 평점 엣지 100,836개가 학습 80,670, 검증 10,083, 테스트 10,083개로 나뉜다. 학습 분할은 message passing 56,469개와 감독 24,201개로 겹치지 않게 나뉜다. 검증 분할은 학습 엣지 80,670개로 메시지를 전달하고 양성 10,083개와 음성 20,166개를 감독에 쓴다. 테스트 분할은 학습과 검증 엣지 90,753개로 메시지를 전달하고 같은 크기의 양성과 음성을 감독에 쓴다.</desc>
  <defs>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .tag{fill:#D9E2EF;stroke:#0F2C59;stroke-width:1.5}
      .tr{fill:#0F2C59}
      .va{fill:#FBE3D4;stroke:#C2410C;stroke-width:2}
      .te{fill:#DDF0E6;stroke:#1F7A5C;stroke-width:2}
      .mp{fill:#D9E2EF;stroke:#0F2C59;stroke-width:2}
      .sv{fill:#FBE3D4;stroke:#C2410C;stroke-width:2}
      .t{font-size:13px;font-weight:700;text-anchor:middle;fill:#1b1b1f}
      .w{font-size:13px;font-weight:800;text-anchor:middle;fill:#fff}
      .m{font-size:11px;text-anchor:middle;fill:#1b1b1f}
    </style>
  </defs>
  <rect width="900" height="290" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="tag" x="10" y="20" width="100" height="44"/><text class="t" x="60" y="47">전체 100,836</text>
    <rect class="tr" x="120" y="20" width="509" height="44"/><text class="w" x="374" y="47">학습 80,670 (80%)</text>
    <rect class="va" x="629" y="20" width="64" height="44"/><text class="t" x="661" y="39">검증</text><text class="m" x="661" y="55">10,083</text>
    <rect class="te" x="693" y="20" width="64" height="44"/><text class="t" x="725" y="39">테스트</text><text class="m" x="725" y="55">10,083</text>

    <rect class="tag" x="10" y="95" width="100" height="52"/><text class="t" x="60" y="126">학습</text>
    <rect class="mp" x="120" y="95" width="355" height="52"/><text class="t" x="297" y="118">message passing 56,469</text><text class="m" x="297" y="135">edge_index</text>
    <rect class="sv" x="475" y="95" width="152" height="52"/><text class="t" x="551" y="118">감독 24,201</text><text class="m" x="551" y="135">양성만 (음성은 로더)</text>

    <rect class="tag" x="10" y="160" width="100" height="52"/><text class="t" x="60" y="191">검증</text>
    <rect class="mp" x="120" y="160" width="508" height="52"/><text class="t" x="374" y="183">message passing 80,670 (학습 엣지 전체)</text><text class="m" x="374" y="200">edge_index</text>
    <rect class="sv" x="628" y="160" width="191" height="52"/><text class="t" x="723" y="183">감독 30,249</text><text class="m" x="723" y="200">양성 10,083 + 음성 20,166</text>

    <rect class="tag" x="10" y="225" width="100" height="52"/><text class="t" x="60" y="256">테스트</text>
    <rect class="mp" x="120" y="225" width="572" height="52"/><text class="t" x="406" y="248">message passing 90,753 (학습 80,670 + 검증 10,083)</text><text class="m" x="406" y="265">edge_index</text>
    <rect class="sv" x="692" y="225" width="191" height="52"/><text class="t" x="787" y="248">감독 30,249</text><text class="m" x="787" y="265">양성 10,083 + 음성 20,166</text>
  </g>
</svg>
