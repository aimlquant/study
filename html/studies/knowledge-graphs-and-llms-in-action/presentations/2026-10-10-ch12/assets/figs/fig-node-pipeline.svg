<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Elliptic CSV 세 파일에서 PyG Data 객체까지</title>
  <desc id="desc">features, edgelist, classes 세 CSV 파일이 각각 node_features, edge_index, node_labels 텐서로 바뀌고, 세 텐서가 하나의 PyG Data 객체에 담긴다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#6B6B72"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .box{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .ten{fill:#D9E2EF;stroke:#0F2C59;stroke-width:2}
      .out{fill:#0F2C59}
      .line{fill:none;stroke:#6B6B72;stroke-width:2.5;marker-end:url(#arrow)}
      .t{font-size:14px;font-weight:700;text-anchor:middle;fill:#1b1b1f}
      .m{font-size:12px;text-anchor:middle;fill:#6B6B72}
      .w{font-size:14px;font-weight:800;text-anchor:middle;fill:#fff}
      .wm{font-size:12px;text-anchor:middle;fill:#D9E2EF}
    </style>
  </defs>
  <rect width="960" height="300" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="box" x="20" y="20" width="260" height="70" rx="8"/><text class="t" x="150" y="48">elliptic_txs_features.csv</text><text class="m" x="150" y="70">203,769행 × 167열</text>
    <rect class="box" x="20" y="110" width="260" height="70" rx="8"/><text class="t" x="150" y="138">elliptic_txs_edgelist.csv</text><text class="m" x="150" y="160">234,355행 × 2열</text>
    <rect class="box" x="20" y="200" width="260" height="70" rx="8"/><text class="t" x="150" y="228">elliptic_txs_classes.csv</text><text class="m" x="150" y="250">203,769행 × 2열</text>
    <rect class="ten" x="360" y="20" width="270" height="70" rx="8"/><text class="t" x="495" y="48">node_features (float)</text><text class="m" x="495" y="70">[203769, 166]</text>
    <rect class="ten" x="360" y="110" width="270" height="70" rx="8"/><text class="t" x="495" y="138">edge_index (long)</text><text class="m" x="495" y="160">[2, 234355]</text>
    <rect class="ten" x="360" y="200" width="270" height="70" rx="8"/><text class="t" x="495" y="228">node_labels (long)</text><text class="m" x="495" y="250">[203769]</text>
    <rect class="out" x="720" y="20" width="220" height="250" rx="8"/><text class="w" x="830" y="130">PyG Data</text><text class="wm" x="830" y="155">x · edge_index · y</text>
    <path class="line" d="M280 55H360"/><path class="line" d="M280 145H360"/><path class="line" d="M280 235H360"/>
    <path class="line" d="M630 55H720"/><path class="line" d="M630 145H720"/><path class="line" d="M630 235H720"/>
  </g>
</svg>
