<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">사용자–영화 이질 그래프와 역방향 엣지</title>
  <desc id="desc">왼쪽의 사용자 노드 두 개에서 오른쪽의 영화 노드 네 개로 rates 엣지가 실선 화살표로 향하고, 같은 쌍을 영화에서 사용자로 되돌리는 rev_rates 엣지가 점선 화살표로 있다. 영화 노드에는 20차원 장르 특징이 있고 사용자 노드에는 초기 특징이 없다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#C2410C"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .user{fill:#D9E2EF;stroke:#0F2C59;stroke-width:2}
      .movie{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .fw{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow)}
      .rv{fill:none;stroke:#C2410C;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrowr)}
      .lg{fill:#fff;stroke:#6B6B72;stroke-width:1.5}
      .t{font-size:14px;font-weight:700;text-anchor:middle;fill:#1b1b1f}
      .m{font-size:12px;text-anchor:middle;fill:#6B6B72}
    </style>
  </defs>
  <rect width="900" height="380" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="user" x="60" y="40" width="160" height="64" rx="8"/><text class="t" x="140" y="68">user 0</text><text class="m" x="140" y="88">초기 특징 없음</text>
    <rect class="user" x="60" y="220" width="160" height="64" rx="8"/><text class="t" x="140" y="248">user 609</text><text class="m" x="140" y="268">초기 특징 없음</text>
    <rect class="movie" x="640" y="20" width="200" height="56" rx="8"/><text class="t" x="740" y="45">movie 0</text><text class="m" x="740" y="63">장르 20차원</text>
    <rect class="movie" x="640" y="95" width="200" height="56" rx="8"/><text class="t" x="740" y="120">movie 2</text><text class="m" x="740" y="138">장르 20차원</text>
    <rect class="movie" x="640" y="170" width="200" height="56" rx="8"/><text class="t" x="740" y="195">movie 5</text><text class="m" x="740" y="213">장르 20차원</text>
    <rect class="movie" x="640" y="245" width="200" height="56" rx="8"/><text class="t" x="740" y="270">movie 9462</text><text class="m" x="740" y="288">장르 20차원</text>
    <path class="fw" d="M220 62L640 42"/><path class="fw" d="M220 72L640 117"/><path class="fw" d="M220 82L640 192"/><path class="fw" d="M220 250L640 267"/>
    <path class="rv" d="M640 58L220 90"/><path class="rv" d="M640 133L220 96"/><path class="rv" d="M640 208L220 100"/><path class="rv" d="M640 283L220 270"/>
    <rect class="lg" x="60" y="328" width="380" height="36" rx="6"/><text class="m" x="250" y="351" style="fill:#0F2C59;font-weight:700">실선: (user, rates, movie)</text>
    <rect class="lg" x="480" y="328" width="360" height="36" rx="6"/><text class="m" x="660" y="351" style="fill:#C2410C;font-weight:700">점선: (movie, rev_rates, user)</text>
  </g>
</svg>
