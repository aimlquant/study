<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">거래 100건 예에서 정밀도, 재현율, F1, 정확도 계산</title>
  <desc id="desc">실제 불법 10건 중 6건은 불법으로 맞히고 4건은 합법으로 놓쳤으며, 실제 합법 90건 중 2건은 불법으로 잘못 판정하고 88건은 맞혔다. 이 값에서 정밀도 0.75, 재현율 0.60, F1 약 0.67, 정확도 94%가 계산된다.</desc>
  <defs>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .hd{fill:#D9E2EF;stroke:#0F2C59;stroke-width:1.5}
      .ok{fill:#DDF0E6;stroke:#1F7A5C;stroke-width:2}
      .bad{fill:#F9DAD6;stroke:#B42318;stroke-width:2}
      .f{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .fw{fill:#0F2C59}
      .t{font-size:22px;font-weight:800;text-anchor:middle;fill:#1b1b1f}
      .m{font-size:13px;font-weight:600;text-anchor:middle;fill:#1b1b1f}
      .fm{font-size:15px;font-weight:700;text-anchor:middle;fill:#1b1b1f}
      .fn{font-size:15px;font-weight:800;text-anchor:middle;fill:#fff}
    </style>
  </defs>
  <rect width="900" height="300" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="hd" x="140" y="20" width="140" height="40"/><text class="m" x="210" y="45">예측 불법</text>
    <rect class="hd" x="280" y="20" width="140" height="40"/><text class="m" x="350" y="45">예측 합법</text>
    <rect class="hd" x="20" y="60" width="120" height="100"/><text class="m" x="80" y="105">실제 불법</text><text class="m" x="80" y="125">10건</text>
    <rect class="hd" x="20" y="160" width="120" height="100"/><text class="m" x="80" y="205">실제 합법</text><text class="m" x="80" y="225">90건</text>
    <rect class="ok" x="140" y="60" width="140" height="100"/><text class="t" x="210" y="105">6</text><text class="m" x="210" y="130">제대로 찾음</text>
    <rect class="bad" x="280" y="60" width="140" height="100"/><text class="t" x="350" y="105">4</text><text class="m" x="350" y="130">놓침</text>
    <rect class="bad" x="140" y="160" width="140" height="100"/><text class="t" x="210" y="205">2</text><text class="m" x="210" y="230">오경보</text>
    <rect class="ok" x="280" y="160" width="140" height="100"/><text class="t" x="350" y="205">88</text><text class="m" x="350" y="230">제대로 통과</text>

    <rect class="f" x="480" y="20" width="400" height="50" rx="8"/><text class="fm" x="680" y="52">정밀도 = 6 ÷ (6 + 2) = 0.75</text>
    <rect class="f" x="480" y="85" width="400" height="50" rx="8"/><text class="fm" x="680" y="117">재현율 = 6 ÷ (6 + 4) = 0.60</text>
    <rect class="f" x="480" y="150" width="400" height="50" rx="8"/><text class="fm" x="680" y="182">F1 = 2 × 0.75 × 0.60 ÷ (0.75 + 0.60) ≈ 0.67</text>
    <rect class="fw" x="480" y="215" width="400" height="50" rx="8"/><text class="fn" x="680" y="247">정확도 = (6 + 88) ÷ 100 = 94%</text>
  </g>
</svg>
