<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .h{font-size:19px;font-weight:900}
    .m{font-size:15px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11.5px;font-weight:700}
    .edge{stroke:#94a3b8;stroke-width:2.5;fill:none}
    .hot{fill:#0f2c59;stroke:#0f2c59}
    .n{fill:#fff;stroke:#64748b;stroke-width:2}
    .panel{fill:#fff;stroke:#cbd5e1}
  </style>
  <title id="title">전역 특징: 근접 중심성 대 매개 중심성</title>
  <desc id="desc">근접 중심성은 모두에게 가까운 노드를, 매개 중심성은 두 집단을 잇는 다리 노드를 부각한다</desc>
  <rect width="960" height="540" fill="#fafaf9"/>
  <text class="t h" x="40" y="40" text-anchor="start" fill="#0f172a">전역 특징 — 네트워크 전체에서 노드의 역할</text>

  <!-- left: closeness -->
  <rect class="panel" x="40" y="70" width="420" height="430" rx="14"/>
  <text class="t m" x="60" y="102" text-anchor="start" fill="#0f2c59">근접 중심성 — 모두에게 &#39;가까운가&#39;</text>
  <circle class="hot" cx="250" cy="280" r="22"/><text class="t m" x="250" y="286" text-anchor="middle" fill="#fff">A</text>
  <g class="edge">
    <line x1="250" y1="280" x2="130" y2="200"/><line x1="250" y1="280" x2="250" y2="160"/>
    <line x1="250" y1="280" x2="370" y2="200"/><line x1="250" y1="280" x2="130" y2="360"/>
    <line x1="250" y1="280" x2="250" y2="400"/><line x1="250" y1="280" x2="370" y2="360"/>
  </g>
  <circle class="n" cx="130" cy="200" r="14"/><circle class="n" cx="250" cy="160" r="14"/><circle class="n" cx="370" cy="200" r="14"/>
  <circle class="n" cx="130" cy="360" r="14"/><circle class="n" cx="250" cy="400" r="14"/><circle class="n" cx="370" cy="360" r="14"/>
  <text class="t s" x="250" y="450" text-anchor="middle" fill="#334155">평균 최단거리가 짧다 → 값이 높다</text>
  <text class="t xs" x="250" y="474" text-anchor="middle" fill="#64748b">원거리도(평균거리)의 역수 · 사기 확산이 빠른 위치</text>

  <!-- right: betweenness -->
  <rect class="panel" x="500" y="70" width="420" height="430" rx="14"/>
  <text class="t m" x="520" y="102" text-anchor="start" fill="#0f2c59">매개 중심성 — 얼마나 자주 &#39;다리&#39;인가</text>
  <!-- two clusters joined by bridge -->
  <g class="edge">
    <line x1="580" y1="180" x2="620" y2="250"/><line x1="640" y1="160" x2="620" y2="250"/><line x1="580" y1="180" x2="640" y2="160"/>
    <line x1="620" y1="250" x2="710" y2="290"/>
    <line x1="710" y1="290" x2="800" y2="330"/>
    <line x1="800" y1="330" x2="840" y2="260"/><line x1="800" y1="330" x2="860" y2="400"/><line x1="840" y1="260" x2="860" y2="400"/>
  </g>
  <circle class="n" cx="580" cy="180" r="14"/><circle class="n" cx="640" cy="160" r="14"/><circle class="n" cx="620" cy="250" r="14"/>
  <circle class="hot" cx="710" cy="290" r="20"/><text class="t s" x="710" y="295" text-anchor="middle" fill="#fff">A</text>
  <circle class="n" cx="800" cy="330" r="14"/><circle class="n" cx="840" cy="260" r="14"/><circle class="n" cx="860" cy="400" r="14"/>
  <text class="t s" x="710" y="450" text-anchor="middle" fill="#334155">두 집단을 잇는 유일한 통로 → 값이 높다</text>
  <text class="t xs" x="710" y="474" text-anchor="middle" fill="#64748b">최단경로 위에 자주 등장 · 정보 흐름을 통제하는 병목</text>
</svg>
