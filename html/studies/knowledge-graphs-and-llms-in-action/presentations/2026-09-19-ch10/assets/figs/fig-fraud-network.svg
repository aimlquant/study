<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .h{font-size:19px;font-weight:900}
    .s{font-size:13px;font-weight:700}
    .xs{font-size:12px;font-weight:700}
    .lbl{font-size:14px;font-weight:800}
    .edge{stroke:#94a3b8;stroke-width:2;fill:none}
    .fraudn{fill:#0f2c59;stroke:#0f2c59}
    .plainn{fill:#fff;stroke:#64748b;stroke-width:2}
  </style>
  <title id="title">사기 탐지 예제 소셜 네트워크 (그림 10.1)</title>
  <desc id="desc">20개 노드(A~T)와 25개 무향 간선으로 이뤄진 네트워크. 검은 노드 D·E·F·I는 알려진 사기꾼, 흰 노드는 정상 또는 미확인.</desc>
  <rect width="960" height="540" fill="#fafaf9"/>
  <text class="t h" x="40" y="40" text-anchor="start" fill="#0f172a">사기 탐지 예제 네트워크</text>

  <!-- edges -->
  <g class="edge">
    <line x1="380" y1="260" x2="250" y2="320"/>
    <line x1="380" y1="260" x2="450" y2="360"/>
    <line x1="380" y1="260" x2="250" y2="180"/>
    <line x1="380" y1="260" x2="500" y2="250"/>
    <line x1="380" y1="260" x2="520" y2="380"/>
    <line x1="380" y1="260" x2="430" y2="170"/>
    <line x1="250" y1="320" x2="330" y2="390"/>
    <line x1="250" y1="320" x2="150" y2="360"/>
    <line x1="330" y1="390" x2="270" y2="460"/>
    <line x1="330" y1="390" x2="390" y2="450"/>
    <line x1="330" y1="390" x2="450" y2="360"/>
    <line x1="270" y1="460" x2="390" y2="450"/>
    <line x1="390" y1="450" x2="450" y2="360"/>
    <line x1="450" y1="360" x2="500" y2="250"/>
    <line x1="250" y1="180" x2="320" y2="130"/>
    <line x1="500" y1="250" x2="320" y2="130"/>
    <line x1="500" y1="250" x2="590" y2="180"/>
    <line x1="320" y1="130" x2="340" y2="70"/>
    <line x1="700" y1="130" x2="700" y2="250"/>
    <line x1="700" y1="130" x2="590" y2="180"/>
    <line x1="590" y1="180" x2="700" y2="250"/>
    <line x1="520" y1="380" x2="590" y2="460"/>
    <line x1="520" y1="380" x2="650" y2="400"/>
    <line x1="650" y1="400" x2="730" y2="460"/>
    <line x1="650" y1="400" x2="740" y2="350"/>
  </g>

  <!-- nodes: fraud D,E,F,I dark -->
  <g>
    <circle class="plainn" cx="380" cy="260" r="17"/><text class="t lbl" x="380" y="265" text-anchor="middle" fill="#0f172a">A</text>
    <circle class="plainn" cx="250" cy="320" r="17"/><text class="t lbl" x="250" y="325" text-anchor="middle" fill="#0f172a">B</text>
    <circle class="plainn" cx="150" cy="360" r="17"/><text class="t lbl" x="150" y="365" text-anchor="middle" fill="#0f172a">C</text>
    <circle class="fraudn" cx="330" cy="390" r="17"/><text class="t lbl" x="330" y="395" text-anchor="middle" fill="#fff">D</text>
    <circle class="fraudn" cx="270" cy="460" r="17"/><text class="t lbl" x="270" y="465" text-anchor="middle" fill="#fff">E</text>
    <circle class="fraudn" cx="390" cy="450" r="17"/><text class="t lbl" x="390" y="455" text-anchor="middle" fill="#fff">F</text>
    <circle class="plainn" cx="450" cy="360" r="17"/><text class="t lbl" x="450" y="365" text-anchor="middle" fill="#0f172a">G</text>
    <circle class="plainn" cx="250" cy="180" r="17"/><text class="t lbl" x="250" y="185" text-anchor="middle" fill="#0f172a">H</text>
    <circle class="fraudn" cx="500" cy="250" r="17"/><text class="t lbl" x="500" y="255" text-anchor="middle" fill="#fff">I</text>
    <circle class="plainn" cx="340" cy="70" r="17"/><text class="t lbl" x="340" y="75" text-anchor="middle" fill="#0f172a">J</text>
    <circle class="plainn" cx="320" cy="130" r="17"/><text class="t lbl" x="320" y="135" text-anchor="middle" fill="#0f172a">K</text>
    <circle class="plainn" cx="700" cy="130" r="17"/><text class="t lbl" x="700" y="135" text-anchor="middle" fill="#0f172a">L</text>
    <circle class="plainn" cx="700" cy="250" r="17"/><text class="t lbl" x="700" y="255" text-anchor="middle" fill="#0f172a">M</text>
    <circle class="plainn" cx="590" cy="180" r="17"/><text class="t lbl" x="590" y="185" text-anchor="middle" fill="#0f172a">N</text>
    <circle class="plainn" cx="520" cy="380" r="17"/><text class="t lbl" x="520" y="385" text-anchor="middle" fill="#0f172a">O</text>
    <circle class="plainn" cx="590" cy="460" r="17"/><text class="t lbl" x="590" y="465" text-anchor="middle" fill="#0f172a">P</text>
    <circle class="plainn" cx="650" cy="400" r="17"/><text class="t lbl" x="650" y="405" text-anchor="middle" fill="#0f172a">Q</text>
    <circle class="plainn" cx="730" cy="460" r="17"/><text class="t lbl" x="730" y="465" text-anchor="middle" fill="#0f172a">R</text>
    <circle class="plainn" cx="740" cy="350" r="17"/><text class="t lbl" x="740" y="355" text-anchor="middle" fill="#0f172a">S</text>
    <circle class="plainn" cx="430" cy="170" r="17"/><text class="t lbl" x="430" y="175" text-anchor="middle" fill="#0f172a">T</text>
  </g>

  <!-- legend -->
  <rect x="40" y="470" width="18" height="18" rx="4" class="fraudn"/><text class="t s" x="66" y="484" text-anchor="start" fill="#334155">알려진 사기꾼 (D·E·F·I)</text>
  <circle class="plainn" cx="330" cy="479" r="9"/><text class="t s" x="348" y="484" text-anchor="start" fill="#334155">정상 또는 미확인</text>
  <text class="t xs" x="620" y="484" text-anchor="start" fill="#64748b">무향 간선 25개 · 노드 20개(A~T)</text>
</svg>
