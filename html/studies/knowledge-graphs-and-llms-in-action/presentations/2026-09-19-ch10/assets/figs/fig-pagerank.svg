<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .h{font-size:19px;font-weight:900}
    .m{font-size:14px;font-weight:800}
    .s{font-size:13px;font-weight:700}
    .xs{font-size:11.5px;font-weight:700}
    .axis{stroke:#94a3b8;stroke-width:2}
    .base{fill:#b7c7e3}
    .fraud{fill:#0f2c59}
  </style>
  <title id="title">기본 페이지랭크와 사기 가중 페이지랭크의 차이</title>
  <desc id="desc">노드 A·G·D·F의 기본 대 사기 가중 페이지랭크 막대 비교. 노드 D는 기본은 평범하나 사기 가중에서 급등한다.</desc>
  <rect width="960" height="540" fill="#fafaf9"/>
  <text class="t h" x="40" y="40" text-anchor="start" fill="#0f172a">페이지랭크 — 연결의 양뿐 아니라 &#39;질&#39;까지</text>

  <!-- axis -->
  <line class="axis" x1="110" y1="430" x2="850" y2="430"/>
  <line class="axis" x1="110" y1="120" x2="110" y2="430"/>
  <text class="t xs" x="100" y="126" text-anchor="end" fill="#64748b">점수</text>

  <!-- legend -->
  <rect class="base" x="600" y="70" width="16" height="16" rx="3"/><text class="t s" x="624" y="83" text-anchor="start" fill="#334155">기본</text>
  <rect class="fraud" x="690" y="70" width="16" height="16" rx="3"/><text class="t s" x="714" y="83" text-anchor="start" fill="#334155">사기 가중</text>

  <!-- A: base .108->162, fraud .087->131 -->
  <rect class="base" x="166" y="268" width="40" height="162"/><rect class="fraud" x="214" y="299" width="40" height="131"/>
  <text class="t xs" x="186" y="262" text-anchor="middle" fill="#334155">.108</text><text class="t xs" x="234" y="293" text-anchor="middle" fill="#334155">.087</text>
  <text class="t m" x="210" y="452" text-anchor="middle" fill="#0f172a">A</text>

  <!-- G: base .067->100, fraud .109->164 -->
  <rect class="base" x="346" y="330" width="40" height="100"/><rect class="fraud" x="394" y="266" width="40" height="164"/>
  <text class="t xs" x="366" y="324" text-anchor="middle" fill="#334155">.067</text><text class="t xs" x="414" y="260" text-anchor="middle" fill="#334155">.109</text>
  <text class="t m" x="390" y="452" text-anchor="middle" fill="#0f172a">G</text>

  <!-- D: base .068->102, fraud .168->252 (standout) -->
  <rect class="base" x="526" y="328" width="40" height="102"/><rect class="fraud" x="574" y="178" width="40" height="252"/>
  <text class="t xs" x="546" y="322" text-anchor="middle" fill="#334155">.068</text><text class="t s" x="594" y="170" text-anchor="middle" fill="#b91c1c">.168</text>
  <text class="t m" x="570" y="452" text-anchor="middle" fill="#0f172a">D</text>

  <!-- F: base .051->77, fraud .145->218 -->
  <rect class="base" x="706" y="353" width="40" height="77"/><rect class="fraud" x="754" y="212" width="40" height="218"/>
  <text class="t xs" x="726" y="347" text-anchor="middle" fill="#334155">.051</text><text class="t xs" x="774" y="204" text-anchor="middle" fill="#334155">.145</text>
  <text class="t m" x="750" y="452" text-anchor="middle" fill="#0f172a">F</text>

  <text class="t s" x="480" y="510" text-anchor="middle" fill="#b91c1c">D 급등 → 조사 신호</text>
</svg>
