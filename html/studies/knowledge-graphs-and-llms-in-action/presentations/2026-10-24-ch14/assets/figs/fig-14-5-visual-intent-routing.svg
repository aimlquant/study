  <rect class="fill-navy" x="28" y="102" width="242" height="26" rx="7"/>
  <text class="t xs an-m" x="149" y="119" fill="#ffffff">2층 분류 확대 · 출력 형식 판정</text>
  <g transform="translate(0 120)">
  <rect class="fill-tint" x="36" y="158" width="150" height="84" rx="10"/>
  <text class="t m an-m" x="111.0" y="196.5" fill="#0f2c59">사용자 질문</text>
  <text class="t s an-m" x="111.0" y="213.5" fill="#0f2c59">자연어 한 문장</text>
  <rect class="fill-navy" x="216" y="140" width="166" height="120" rx="10"/>
  <text class="t m an-m" x="299.0" y="188.0" fill="#ffffff">분류 프롬프트</text>
  <text class="t s an-m" x="299.0" y="205.0" fill="#ffffff">작업 정의 · 퓨샷</text>
  <text class="t xs mono an-m" x="299.0" y="222.0" fill="#ffffff">JSON 한 줄 출력</text>
  <rect class="box" x="432" y="20" width="226" height="66" rx="10"/>
  <text class="t m mono an-m" x="545.0" y="49.5" fill="#0f172a">table</text>
  <text class="t xs an-m" x="545.0" y="66.5" fill="#0f172a">집계 · 정렬 · 통계를 물을 때</text>
  <rect class="box" x="432" y="106" width="226" height="66" rx="10"/>
  <text class="t m mono an-m" x="545.0" y="135.5" fill="#0f172a">chart</text>
  <text class="t xs an-m" x="545.0" y="152.5" fill="#0f172a">분포를 그려 달라고 할 때</text>
  <rect class="box" x="432" y="192" width="226" height="66" rx="10"/>
  <text class="t m mono an-m" x="545.0" y="221.5" fill="#0f172a">map</text>
  <text class="t xs an-m" x="545.0" y="238.5" fill="#0f172a">위치 · 장소를 보여 달라 할 때</text>
  <rect class="fill-ok" x="432" y="278" width="226" height="66" rx="10"/>
  <text class="t m mono an-m" x="545.0" y="307.5" fill="#0f172a">graph</text>
  <text class="t xs an-m" x="545.0" y="324.5" fill="#0f172a">노드 · 관계 · 경로를 물을 때</text>
  <rect class="fill-tint" x="704" y="124" width="220" height="116" rx="10"/>
  <text class="t m an-m" x="814.0" y="161.5" fill="#0f2c59">출력 형식</text>
  <text class="t xs mono an-m" x="814.0" y="178.5" fill="#0f2c59">{&quot;type&quot;: ..., &quot;reason&quot;: ...}</text>
  <text class="t xs an-m" x="814.0" y="195.5" fill="#0f2c59">네 형식 모두 같은 JSON</text>
  <text class="t xs an-m" x="814.0" y="212.5" fill="#0f2c59">뒤 프롬프트의 분기 조건</text>
  <rect class="fill-warn" x="432" y="364" width="226" height="40" rx="10"/>
  <text class="t xs an-m" x="545.0" y="389.0" fill="#b45309">조건이 걸리지 않으면 전부 graph (포괄 클래스)</text>
