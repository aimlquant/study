<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="figTitle figDesc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .h{font-size:17px;font-weight:900}
    .m{font-size:14.5px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11px;font-weight:700}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}
    .lane{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.4}
    .fill-navy{fill:#0f2c59;stroke:#0f2c59;stroke-width:1.6}
    .fill-tint{fill:#e8eef7;stroke:#0f2c59;stroke-width:1.6}
    .fill-warn{fill:#fef3e2;stroke:#b45309;stroke-width:1.6}
    .fill-bad{fill:#fdeceb;stroke:#b91c1c;stroke-width:1.6}
    .fill-ok{fill:#eaf5ec;stroke:#15803d;stroke-width:1.6}
    .fill-mute{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 4}
    .arw{stroke:#64748b;stroke-width:2.1;fill:none;marker-end:url(#ah)}
    .arw-navy{stroke:#0f2c59;stroke-width:2.6;fill:none;marker-end:url(#ahn)}
    .arw-bad{stroke:#b91c1c;stroke-width:2.2;fill:none;marker-end:url(#ahb);stroke-dasharray:6 4}
    .arw-warn{stroke:#b45309;stroke-width:2.2;fill:none;marker-end:url(#ahw);stroke-dasharray:6 4}
    .tick{stroke:#94a3b8;stroke-width:1.4;fill:none}
    .an-s{text-anchor:start}
    .an-m{text-anchor:middle}
    .an-e{text-anchor:end}
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f2c59"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>
  <title id="figTitle">자연어 요청을 제약 순회 Cypher로 옮기는 세 단계</title>
  <desc id="figDesc">위에서 아래로 읽는다. 1단계는 요청을 의미 조각으로 쪼개고, 2단계는 각 조각을 스키마의 라벨과 속성에 대응시키며, 3단계는 순회 패턴과 WHERE 제약으로 Cypher를 조립한다. 2단계의 속성 값 표기는 스키마만 읽어 얻은 형태다.</desc>
  <rect width="960" height="540" fill="#fafaf9"/>
  <rect class="fill-tint" x="40" y="30" width="880" height="78" rx="10"/>
  <text class="t h an-s" x="52" y="68" fill="#0f2c59">“이 지역에서 그 시간에 목격된 빨간 카마로를 보여 줘”</text>
  <rect class="fill-navy" x="52" y="74" width="118" height="26" rx="7"/>
  <text class="t xs an-m" x="111.0" y="91.0" fill="#ffffff">1단계 · 의미 분해</text>
  <rect class="box" x="60" y="140" width="196" height="54" rx="10"/>
  <text class="t m an-m" x="158.0" y="163.5" fill="#0f172a">색</text>
  <text class="t s an-m" x="158.0" y="180.5" fill="#0f172a">빨강</text>
  <path class="arw" d="M158 112L158 136"/>
  <rect class="box" x="278" y="140" width="196" height="54" rx="10"/>
  <text class="t m an-m" x="376.0" y="163.5" fill="#0f172a">모델</text>
  <text class="t s an-m" x="376.0" y="180.5" fill="#0f172a">카마로</text>
  <path class="arw" d="M376 112L376 136"/>
  <rect class="box" x="496" y="140" width="196" height="54" rx="10"/>
  <text class="t m an-m" x="594.0" y="163.5" fill="#0f172a">장소</text>
  <text class="t s an-m" x="594.0" y="180.5" fill="#0f172a">이 지역</text>
  <path class="arw" d="M594 112L594 136"/>
  <rect class="box" x="714" y="140" width="196" height="54" rx="10"/>
  <text class="t m an-m" x="812.0" y="163.5" fill="#0f172a">시각</text>
  <text class="t s an-m" x="812.0" y="180.5" fill="#0f172a">그 시간</text>
  <path class="arw" d="M812 112L812 136"/>
  <rect class="fill-navy" x="170" y="208" width="128" height="26" rx="7"/>
  <text class="t xs an-m" x="234.0" y="225.0" fill="#ffffff">2단계 · 스키마 매핑</text>
  <rect class="fill-tint" x="60" y="244" width="196" height="54" rx="10"/>
  <text class="t s mono an-m" x="158.0" y="267.5" fill="#0f2c59">Vehicle.color</text>
  <text class="t xs mono an-m" x="158.0" y="284.5" fill="#0f2c59">= &#x27;RED&#x27;</text>
  <path class="arw" d="M158 198L158 240"/>
  <path class="arw" d="M158 302L158 340"/>
  <rect class="fill-warn" x="278" y="244" width="196" height="54" rx="10"/>
  <text class="t s mono an-m" x="376.0" y="267.5" fill="#b45309">Vehicle.model</text>
  <text class="t xs mono an-m" x="376.0" y="284.5" fill="#b45309">= &#x27;CAMARO&#x27;</text>
  <path class="arw" d="M376 198L376 240"/>
  <path class="arw" d="M376 302L376 340"/>
  <rect class="fill-tint" x="496" y="244" width="196" height="54" rx="10"/>
  <text class="t s mono an-m" x="594.0" y="267.5" fill="#0f2c59">ANPRCamera</text>
  <text class="t xs mono an-m" x="594.0" y="284.5" fill="#0f2c59">위치 속성 비교</text>
  <path class="arw" d="M594 198L594 240"/>
  <path class="arw" d="M594 302L594 340"/>
  <rect class="fill-tint" x="714" y="244" width="196" height="54" rx="10"/>
  <text class="t s mono an-m" x="812.0" y="267.5" fill="#0f2c59">event.timestamp</text>
  <text class="t xs mono an-m" x="812.0" y="284.5" fill="#0f2c59">STARTS WITH 날짜</text>
  <path class="arw" d="M812 198L812 240"/>
  <path class="arw" d="M812 302L812 340"/>
  <rect class="fill-warn" x="388" y="312" width="194" height="26" rx="7"/>
  <text class="t xs an-m" x="485.0" y="329.0" fill="#b45309">값 표기는 §14.6.2에서 교정한다</text>
  <rect class="fill-navy" x="170" y="312" width="148" height="26" rx="7"/>
  <text class="t xs an-m" x="244.0" y="329.0" fill="#ffffff">3단계 · 제약 순회 조립</text>
  <rect class="box" x="60" y="346" width="840" height="162" rx="10"/>
  <text class="t s mono an-s" x="72" y="384" fill="#0f2c59">MATCH path = (v:Vehicle)&lt;-[read:PLATE_READ_EVENT]-(e:ANPRCameraEvent)</text>
  <text class="t s mono an-s" x="72" y="406" fill="#0f2c59">              &lt;-[has:HAS_EVENT]-(cam:ANPRCamera)</text>
  <text class="t s mono an-s" x="72" y="428" fill="#0f2c59">WHERE v.color = &#x27;RED&#x27; AND v.model = &#x27;CAMARO&#x27;</text>
  <text class="t s mono an-s" x="72" y="450" fill="#0f2c59">  AND e.timestamp STARTS WITH &#x27;2025-03-14&#x27;</text>
  <text class="t s mono an-s" x="72" y="472" fill="#0f2c59">  AND point.distance(cam.position, $center) &lt; 500</text>
  <text class="t s mono an-s" x="72" y="494" fill="#0f2c59">RETURN path</text>
</svg>
