  <title id="figTitle">시스템 관련 질문이 문서와 스키마로 갈라지는 경로</title>
  <desc id="figDesc">위쪽 띠는 그림 4의 의도 탐지 흐름이고, 강조된 1층 분류가 아래 상자로 확대된다. 데이터 질문만 지식 그래프로 가고, 시스템 질문은 문서 관련과 스키마 관련으로 한 번 더 갈라진다. 피드백과 불평은 어느 질의 경로도 타지 않고 별도 범주로 남는다.</desc>
