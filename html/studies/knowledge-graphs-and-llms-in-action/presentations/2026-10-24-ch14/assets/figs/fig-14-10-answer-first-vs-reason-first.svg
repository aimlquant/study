  <title id="figTitle">JSON 필드 순서를 뒤집으면 추론의 성격이 바뀐다</title>
  <desc id="figDesc">두 패널은 같은 작업에 같은 모델을 쓰고 출력 필드 순서만 다르다. 왼쪽은 결론을 먼저 생성해 뒤 문장이 그 결론을 뒷받침하는 쪽으로 쏠리고, 오른쪽은 근거를 먼저 생성해 결론이 마지막에 나온다.</desc>
