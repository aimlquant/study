  <rect class="fill-mute" x="36" y="430" width="888" height="40" rx="7"/>
  <text class="t m an-m" x="480.0" y="454.0" fill="#475569">스키마가 틀리면 뒤의 모든 단계가 같은 방향으로 틀린다</text>
