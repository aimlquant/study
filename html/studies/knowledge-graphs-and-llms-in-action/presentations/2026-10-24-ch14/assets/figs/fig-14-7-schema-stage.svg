  <text class="t xs an-m" x="133.0" y="230.0" fill="#0f2c59">실제 데이터는 읽지 않는다</text>
  <rect class="box" x="258" y="162" width="194" height="92" rx="10"/>
  <text class="t m an-m" x="355.0" y="196.0" fill="#0f172a">구조 조회</text>
  <text class="t s mono an-m" x="355.0" y="213.0" fill="#0f172a">apoc.meta.schema</text>
  <text class="t xs an-m" x="355.0" y="230.0" fill="#0f172a">sample: -1 · 전수 조사</text>
  <rect class="box" x="480" y="162" width="194" height="92" rx="10"/>
  <text class="t m an-m" x="577.0" y="196.0" fill="#0f172a">정제와 주석</text>
  <text class="t s mono an-m" x="577.0" y="213.0" fill="#0f172a">skip · descriptions</text>
  <text class="t xs an-m" x="577.0" y="230.0" fill="#0f172a">YAML 설정 한 곳에서</text>
  <rect class="fill-ok" x="702" y="162" width="222" height="92" rx="10"/>
  <text class="t m an-m" x="813.0" y="196.0" fill="#0f172a">스키마 텍스트</text>
  <text class="t s an-m" x="813.0" y="213.0" fill="#0f172a">LLM이 읽을 한 덩어리</text>
  <text class="t xs an-m" x="813.0" y="230.0" fill="#0f172a">질의 생성 프롬프트로</text>
  <path class="arw-navy" d="M230 208L254 208"/>
  <path class="arw-navy" d="M452 208L476 208"/>
