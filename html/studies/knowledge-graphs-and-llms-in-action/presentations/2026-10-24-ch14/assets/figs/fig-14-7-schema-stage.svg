  <title id="figTitle">스키마 추출 단계만 그래프의 구조를 읽는다</title>
  <desc id="figDesc">위 띠는 여섯 단계 중 이번 절이 다루는 스키마 추출을 진청으로 표시한다. 아래는 그 단계의 내부로, 그래프에서 구조만 뽑아 텍스트 한 덩어리로 만들어 질의 생성 프롬프트에 끼운다.</desc>
