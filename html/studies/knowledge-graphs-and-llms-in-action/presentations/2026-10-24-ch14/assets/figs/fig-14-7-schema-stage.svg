  <text class="t s an-m" x="245.0" y="358.0" fill="#0f172a">라벨 이름 · 속성 타입 · 관계 방향</text>
  <text class="t s an-m" x="245.0" y="375.0" fill="#0f172a">노드 개수나 속성 값은 필요하지 않다</text>
  <rect class="fill-warn" x="480" y="300" width="444" height="106" rx="10"/>
  <text class="t m an-m" x="702.0" y="341.0" fill="#b45309">데이터를 읽는 단계는 뒤의 둘뿐</text>
  <text class="t s an-m" x="702.0" y="358.0" fill="#b45309">질의 실행이 레코드를 가져오고</text>
  <text class="t s an-m" x="702.0" y="375.0" fill="#b45309">요약 생성이 그 레코드를 처음 본다</text>
