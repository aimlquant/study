    .fill-mute{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 4}
    .arw{stroke:#64748b;stroke-width:2.1;fill:none;marker-end:url(#ah)}
    .arw-navy{stroke:#0f2c59;stroke-width:2.6;fill:none;marker-end:url(#ahn)}
    .arw-bad{stroke:#b91c1c;stroke-width:2.2;fill:none;marker-end:url(#ahb);stroke-dasharray:6 4}
    .arw-warn{stroke:#b45309;stroke-width:2.2;fill:none;marker-end:url(#ahw);stroke-dasharray:6 4}
    .tick{stroke:#94a3b8;stroke-width:1.4;fill:none}
    .an-s{text-anchor:start}
    .an-m{text-anchor:middle}
    .an-e{text-anchor:end}
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f2c59"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>
  <title id="figTitle">텍스트를 Cypher로 옮기는 프롬프트의 아홉 블록 조립 순서</title>
  <desc id="figDesc">위에서 아래로 한 프롬프트가 조립된다. 입력 처리에서 질문을 태그로 감싸고, 맥락 구축에서 스키마와 의도별 조건과 예시와 선택 상태와 그래프 주석을 쌓고, 최종 지침에서 질문과 요구 사항을 되풀이한 뒤 출력 형식을 못박는다.</desc>
  <rect width="960" height="540" fill="#fafaf9"/>
  <rect class="lane" x="34" y="30" width="890" height="86" rx="10"/>
  <rect class="fill-navy" x="48" y="56" width="122" height="34" rx="7"/>
  <text class="t s an-m" x="109.0" y="77.0" fill="#ffffff">입력 처리</text>
  <rect class="box" x="188" y="44" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="200" y="68" fill="#0f172a">① 작업 서술 + 질문 태그</text>
  <text class="t xs mono an-s" x="200" y="88" fill="#0f172a">&lt;QUESTION&gt;</text>
  <rect class="lane" x="34" y="132" width="890" height="150" rx="10"/>
  <rect class="fill-navy" x="48" y="158" width="122" height="34" rx="7"/>
  <text class="t s an-m" x="109.0" y="179.0" fill="#ffffff">맥락 구축</text>
  <rect class="box" x="188" y="146" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="200" y="170" fill="#0f172a">② 스키마 + 주석 규약</text>
  <text class="t xs mono an-s" x="200" y="190" fill="#0f172a">&lt;SCHEMA&gt;</text>
  <rect class="box" x="433" y="146" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="445" y="170" fill="#0f172a">③ 의도별 요구 사항</text>
  <text class="t xs mono an-s" x="445" y="190" fill="#0f172a">output_type 분기</text>
  <rect class="box" x="678" y="146" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="690" y="170" fill="#0f172a">④ 예시 (퓨샷)</text>
  <text class="t xs mono an-s" x="690" y="190" fill="#0f172a">examples 매크로</text>
  <rect class="box" x="188" y="212" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="200" y="236" fill="#0f172a">⑤ 현재 선택 상태</text>
  <text class="t xs mono an-s" x="200" y="256" fill="#0f172a">selection 분기</text>
  <rect class="box" x="433" y="212" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="445" y="236" fill="#0f172a">⑥ 그래프 특화 주석</text>
  <text class="t xs mono an-s" x="445" y="256" fill="#0f172a">annotations.notes</text>
  <rect class="lane" x="34" y="298" width="890" height="86" rx="10"/>
  <rect class="fill-navy" x="48" y="324" width="122" height="34" rx="7"/>
  <text class="t s an-m" x="109.0" y="345.0" fill="#ffffff">최종 지침</text>
  <rect class="box" x="188" y="312" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="200" y="336" fill="#0f172a">⑦ 질문 재환기</text>
  <text class="t xs mono an-s" x="200" y="356" fill="#0f172a">+ information</text>
  <rect class="box" x="433" y="312" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="445" y="336" fill="#0f172a">⑧ 요구 사항 재환기</text>
  <text class="t xs mono an-s" x="445" y="356" fill="#0f172a">익명 관계 금지</text>
  <rect class="box" x="678" y="312" width="232" height="56" rx="10"/>
  <text class="t s an-s" x="690" y="336" fill="#0f172a">⑨ 출력 형식 명세</text>
  <text class="t xs mono an-s" x="690" y="356" fill="#0f172a">JSON 네 필드</text>
  <path class="arw-navy" d="M479 118L479 128"/>
  <path class="arw-navy" d="M479 284L479 294"/>
  <path class="arw-navy" d="M479 386L479 410"/>
  <rect class="fill-tint" x="34" y="414" width="452" height="76" rx="10"/>
  <text class="t m an-m" x="260.0" y="448.5" fill="#0f2c59">프롬프트 한 번 호출</text>
  <text class="t s an-m" x="260.0" y="465.5" fill="#0f2c59">아홉 블록을 이어 붙인 단일 메시지</text>
  <rect class="fill-ok" x="504" y="414" width="420" height="76" rx="10"/>
  <text class="t m an-m" x="714.0" y="440.0" fill="#0f172a">출력 JSON 네 필드</text>
  <text class="t xs mono an-m" x="714.0" y="457.0" fill="#0f172a">relationships · reasoning</text>
  <text class="t xs mono an-m" x="714.0" y="474.0" fill="#0f172a">query · success</text>
  <path class="arw-navy" d="M486 452L500 452"/>
</svg>
