  <title id="figTitle">질의 응답 시스템의 여섯 구성 요소와 오류 피드백</title>
  <desc id="figDesc">사용자 질문은 의도 탐지로, 현재 선택과 스키마 추출 결과는 질의 생성으로 들어간다. 질의 생성이 만든 질의를 질의 실행이 돌리고, 실패하면 오류가 점선을 따라 질의 생성으로 되돌아간다. 성공한 결과는 시각화와 요약 생성으로 갈라져 분석가 화면에서 합쳐진다.</desc>
