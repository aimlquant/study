  <title id="figTitle">질의 결과가 캔버스와 텍스트 요약 두 갈래로 제시된다</title>
  <desc id="figDesc">실행 결과 레코드가 두 갈래로 갈린다. 위쪽은 그대로 캔버스에 그려지고, 아래쪽은 요약 프롬프트를 지나 세 필드 JSON이 되어 텍스트 요약으로 붙는다. 두 갈래가 같은 화면에 나란히 놓인다.</desc>
