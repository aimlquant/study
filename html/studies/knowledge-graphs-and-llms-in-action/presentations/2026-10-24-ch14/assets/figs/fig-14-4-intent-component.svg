  <title id="figTitle">의도 탐지가 두 층으로 질문을 분류해 라우팅한다</title>
  <desc id="figDesc">위쪽 띠는 그림 3의 여섯 구성 요소이고, 강조된 의도 탐지가 아래 상자로 확대된다. 첫 층은 질문을 데이터·시스템·피드백 범주로 나누고, 데이터 범주만 두 번째 층으로 내려가 출력 유형을 정한다. 오른쪽은 다음 단계로 넘기는 필드다.</desc>
