  <title id="figTitle">의도 탐지가 두 층으로 질문을 분류해 라우팅한다</title>
  <desc id="figDesc">위쪽 띠는 그림 3의 여섯 구성 요소이고, 강조된 의도 탐지가 아래 상자로 확대된다. 1층 분류가 질문을 데이터·시스템·피드백 세 범주로 나누고, 데이터 범주만 2층 분류로 출력 형식을 정하며, 시스템 범주는 하위 범주를 정한다. 세 갈래 모두 결과를 다음 단계로 넘기는 필드에 담는다. category와 reason은 모든 갈래에, subcategory는 시스템 갈래에, output_type은 데이터 갈래에만 채워진다.</desc>
