<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 960 380" role="img" aria-labelledby="title desc">
  <title id="title">얕은 임베딩의 룩업 테이블과 GNN의 공유 함수 비교</title>
  <desc id="desc">왼쪽 얕은 임베딩은 노드 0부터 33까지 행마다 벡터를 하나씩 저장하므로 새 노드 34를 조회하면 행이 없어 실패하고 재학습이 필요하다. 오른쪽 GNN은 모든 노드가 공유하는 함수 f에 이웃 0, 1, 2의 표현과 노드 특징을 넣어 새 노드 34의 벡터를 재학습 없이 만든다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#627084"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .title{font-size:22px;font-weight:900;fill:#0F0F10}
      .sub{font-size:13px;font-weight:600;fill:#596371}
      .label{font-size:16px;font-weight:900;fill:#0F0F10}
      .small{font-size:12.5px;font-weight:600;fill:#596371}
      .mono{font-family:Consolas,'D2Coding',monospace;font-size:13px;font-weight:700;fill:#0F0F10}
      .wl{font-size:15px;font-weight:900;fill:#FFFFFF}
      .ws{font-size:12.5px;font-weight:600;fill:#D9E2EF}
      .panel{fill:#FFFFFF;stroke:#BAC6D6;stroke-width:1.6}
      .dark{fill:#0F2C59}
      .row{fill:#EEF2F7;stroke:#BAC6D6;stroke-width:1}
      .miss{fill:#FDECEC;stroke:#B42318;stroke-width:1.6;stroke-dasharray:5 4}
      .node{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2}
      .new{fill:#D97706;stroke:#D97706;stroke-width:2}
      .edge{fill:none;stroke:#8EA0B6;stroke-width:2}
      .line{fill:none;stroke:#627084;stroke-width:2.4;marker-end:url(#arrow)}
      .bad{font-size:13px;font-weight:900;fill:#B42318}
      .good{font-size:13px;font-weight:900;fill:#0F6B3A}
    </style>
  </defs>
  <rect x="0" y="80" width="960" height="380" rx="18" fill="#FAFAF9"/>
  <g class="text">

    <rect class="panel" x="40" y="92" width="420" height="340" rx="14"/>
    <text class="label" x="60" y="120">얕은 임베딩 · ENC(v) = Z[v]</text>
    <text class="small" x="60" y="142">임베딩 행렬 Z ∈ ℝ^(|V|×d) — 노드마다 한 행</text>
    <rect class="row" x="60" y="158" width="380" height="30" rx="4"/><text class="mono" x="74" y="178">0   [ 0.42  -1.10  0.07 … ]</text>
    <rect class="row" x="60" y="192" width="380" height="30" rx="4"/><text class="mono" x="74" y="212">1   [ 0.39  -0.98  0.11 … ]</text>
    <rect class="row" x="60" y="226" width="380" height="30" rx="4"/><text class="mono" x="74" y="246">⋮</text>
    <rect class="row" x="60" y="260" width="380" height="30" rx="4"/><text class="mono" x="74" y="280">33  [-0.51   0.84  0.30 … ]</text>
    <rect class="miss" x="60" y="300" width="380" height="30" rx="4"/><text class="mono" x="74" y="320">34  ?  — 행이 없다 (KeyError)</text>
    <text class="bad" x="60" y="362">✗ 새 노드는 전체 재학습 전까지 벡터가 없다</text>
    <text class="small" x="60" y="386">파라미터 수 = 노드 수 × d → 노드에 비례해 증가</text>
    <text class="small" x="60" y="408">노드 특징(나이·관심사)을 넣을 칸이 없다</text>

    <rect class="panel" x="500" y="92" width="420" height="340" rx="14"/>
    <text class="label" x="520" y="120">GNN · ENC(v) = f(이웃 표현, 특징; W)</text>
    <text class="small" x="520" y="142">가중치 W를 모든 노드가 공유</text>
    <path class="edge" d="M570 200L600 248M630 190L600 248M690 205L600 248"/>
    <circle class="node" cx="570" cy="200" r="15"/><text class="mono" x="570" y="205" text-anchor="middle">0</text>
    <circle class="node" cx="630" cy="190" r="15"/><text class="mono" x="630" y="195" text-anchor="middle">1</text>
    <circle class="node" cx="690" cy="205" r="15"/><text class="mono" x="690" y="210" text-anchor="middle">2</text>
    <circle class="new" cx="600" cy="252" r="17"/><text class="wl" x="600" y="258" text-anchor="middle">34</text>
    <path class="line" d="M720 252H748"/>
    <rect class="dark" x="750" y="212" width="150" height="80" rx="12"/>
    <text class="wl" x="825" y="246" text-anchor="middle">공유 함수 f</text>
    <text class="ws" x="825" y="270" text-anchor="middle">집계 → 갱신</text>
    <path class="line" d="M825 292V318"/>
    <rect class="row" x="700" y="320" width="200" height="30" rx="4"/><text class="mono" x="714" y="340">z₃₄ [ 0.40 -1.02 … ]</text>
    <text class="good" x="520" y="362">✓ 재학습 없이 이웃·특징으로 즉시 계산(귀납적)</text>
    <text class="small" x="520" y="386">파라미터 수 = W의 크기 → 노드 수와 무관</text>
    <text class="small" x="520" y="408">같은 패턴을 여러 위치에서 공유해 재사용</text>
  </g>
</svg>
