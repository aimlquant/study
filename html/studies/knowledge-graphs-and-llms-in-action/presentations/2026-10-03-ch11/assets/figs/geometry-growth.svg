    <text class="small" x="520" y="304">깊이 r의 노드 수 = 3ʳ → 지수 증가</text>

    <line class="grid" x1="40" y1="340" x2="920" y2="340"/>
    <text class="label" x="40" y="368">깊이(반지름) r</text>
    <text class="num" x="330" y="368" text-anchor="middle">1</text>
    <text class="num" x="470" y="368" text-anchor="middle">2</text>
    <text class="num" x="610" y="368" text-anchor="middle">3</text>
    <text class="num" x="750" y="368" text-anchor="middle">5</text>
    <text class="num" x="880" y="368" text-anchor="middle">10</text>
    <line class="grid" x1="40" y1="380" x2="920" y2="380"/>
    <text class="label" x="40" y="406">평면 원둘레 2πr</text>
    <text class="num" x="330" y="406" text-anchor="middle">6.3</text>
    <text class="num" x="470" y="406" text-anchor="middle">12.6</text>
    <text class="num" x="610" y="406" text-anchor="middle">18.8</text>
    <text class="num" x="750" y="406" text-anchor="middle">31.4</text>
    <text class="num" x="880" y="406" text-anchor="middle">62.8</text>
    <text class="label" x="40" y="436">트리 노드 수 3ʳ</text>
    <text class="num" x="330" y="436" text-anchor="middle">3</text>
    <text class="num" x="470" y="436" text-anchor="middle">9</text>
    <text class="num" x="610" y="436" text-anchor="middle">27</text>
    <text class="num hl" x="750" y="436" text-anchor="middle">243</text>
