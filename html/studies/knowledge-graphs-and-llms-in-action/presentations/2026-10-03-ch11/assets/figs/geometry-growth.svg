<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 76 960 386" role="img" aria-labelledby="title desc">
  <title id="title">유클리드 공간의 다항식 증가와 트리의 지수 증가</title>
  <desc id="desc">왼쪽은 유클리드 평면에서 반지름이 1, 2, 3으로 커질 때 원둘레가 선형으로만 늘어나는 모습이고, 오른쪽은 가지가 3개씩 갈라지는 트리에서 깊이 1, 2, 3의 노드 수가 3, 9, 27로 지수적으로 늘어나는 모습이다. 아래 표는 두 증가율을 깊이별로 비교한다.</desc>
  <defs>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .title{font-size:22px;font-weight:900;fill:#0F0F10}
      .sub{font-size:13px;font-weight:600;fill:#596371}
      .label{font-size:15px;font-weight:800;fill:#0F0F10}
      .small{font-size:12.5px;font-weight:600;fill:#596371}
      .num{font-size:13px;font-weight:800;fill:#0F0F10}
      .panel{fill:#FFFFFF;stroke:#BAC6D6;stroke-width:1.6}
      .ring{fill:none;stroke:#0F2C59;stroke-width:2}
      .ring2{fill:none;stroke:#0F2C59;stroke-width:2;stroke-dasharray:5 5}
      .edge{fill:none;stroke:#8EA0B6;stroke-width:1.8}
      .thin{stroke-width:1}
      .node{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2}
      .root{fill:#0F2C59}
      .tiny{fill:#0F2C59;stroke:none}
      .hl{fill:#D97706}
      .warn{font-size:12.5px;font-weight:800;fill:#B45309}
      .grid{stroke:#DCE3EC;stroke-width:1}
    </style>
  </defs>
  <rect x="0" y="76" width="960" height="386" rx="18" fill="#FAFAF9"/>
  <g class="text">

    <rect class="panel" x="40" y="88" width="420" height="232" rx="14"/>
    <text class="label" x="60" y="114">유클리드 평면</text>
    <circle class="ring" cx="250" cy="196" r="26"/>
    <circle class="ring" cx="250" cy="196" r="52"/>
    <circle class="ring" cx="250" cy="196" r="78"/>
    <circle class="root" cx="250" cy="196" r="5"/>
    <text class="small" x="279" y="192">r=1</text>
    <text class="small" x="305" y="192">r=2</text>
    <text class="small" x="331" y="192">r=3</text>
    <text class="small" x="60" y="304">반지름 r의 원둘레 = 2πr → r에 비례해 선형 증가</text>

    <rect class="panel" x="500" y="88" width="420" height="232" rx="14"/>
    <text class="label" x="520" y="114">분기 수 3인 트리</text>
