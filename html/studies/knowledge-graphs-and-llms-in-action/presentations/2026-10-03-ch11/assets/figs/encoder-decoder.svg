<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 88 960 472" role="img" aria-labelledby="title desc">
  <title id="title">인코더–디코더 틀: 벡터로 바꾸고 다시 그래프 성질을 복원한다</title>
  <desc id="desc">노드 c가 포함된 그래프가 인코더를 거쳐 d차원 벡터 z_c가 되고, 디코더는 그 벡터로 연결 여부, 이웃 겹침, 레이블 같은 그래프 성질을 복원한다. 복원값과 실제 그래프의 차이인 손실이 점선 화살표로 인코더에 되돌아가 학습 신호가 된다. 아래 표는 Node2Vec, KG 임베딩, GNN이 각각 인코더와 디코더 칸을 어떻게 채우는지 보여 준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#627084"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B45309"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .title{font-size:22px;font-weight:900;fill:#0F0F10}
      .sub{font-size:13px;font-weight:600;fill:#596371}
      .label{font-size:15px;font-weight:800;fill:#0F0F10}
      .small{font-size:12.5px;font-weight:600;fill:#596371}
      .mono{font-family:Consolas,'D2Coding',monospace;font-size:13px;font-weight:700;fill:#0F0F10}
      .wl{font-size:16px;font-weight:900;fill:#FFFFFF}
      .ws{font-size:12.5px;font-weight:600;fill:#D9E2EF}
      .panel{fill:#FFFFFF;stroke:#BAC6D6;stroke-width:1.6}
      .dark{fill:#0F2C59}
      .cell{fill:#EEF2F7;stroke:#BAC6D6;stroke-width:1.2}
      .node{fill:#FFFFFF;stroke:#0F2C59;stroke-width:2}
      .focus{fill:#D97706;stroke:#D97706;stroke-width:2}
      .edge{fill:none;stroke:#8EA0B6;stroke-width:2}
      .line{fill:none;stroke:#627084;stroke-width:2.4;marker-end:url(#arrow)}
      .loss{fill:none;stroke:#B45309;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrowW)}
      .warn{font-size:13px;font-weight:800;fill:#B45309}
      .grid{stroke:#DCE3EC;stroke-width:1}
      .th{font-size:13px;font-weight:900;fill:#0F2C59}
    </style>
  </defs>
  <rect x="0" y="88" width="960" height="472" rx="18" fill="#FAFAF9"/>
  <g class="text">

    <rect class="panel" x="40" y="100" width="220" height="230" rx="14"/>
    <text class="label" x="60" y="126">원래 그래프</text>
    <path class="edge" d="M150 215L90 160M150 215L210 160M150 215L95 280M150 215L210 280M90 160L210 160M210 280L240 220"/>
    <circle class="node" cx="90" cy="160" r="13"/>
    <circle class="node" cx="210" cy="160" r="13"/>
    <circle class="node" cx="95" cy="280" r="13"/>
    <circle class="node" cx="210" cy="280" r="13"/>
    <circle class="node" cx="240" cy="220" r="10"/>
    <circle class="focus" cx="150" cy="215" r="16"/>
    <text class="wl" x="150" y="221" text-anchor="middle">c</text>
    <text class="small" x="60" y="318">구조(인접 행렬) + 노드 특징</text>

    <path class="line" d="M260 215H298"/>
    <rect class="dark" x="300" y="175" width="140" height="80" rx="12"/>
    <text class="wl" x="370" y="209" text-anchor="middle">인코더 ENC</text>
    <text class="ws" x="370" y="232" text-anchor="middle">노드 → 벡터</text>
    <path class="line" d="M440 215H478"/>

    <rect class="panel" x="480" y="100" width="100" height="230" rx="14"/>
    <text class="label" x="530" y="126" text-anchor="middle">z_c</text>
    <rect class="cell" x="500" y="140" width="60" height="30" rx="4"/><text class="mono" x="530" y="160" text-anchor="middle">0.42</text>
    <rect class="cell" x="500" y="174" width="60" height="30" rx="4"/><text class="mono" x="530" y="194" text-anchor="middle">-1.10</text>
    <rect class="cell" x="500" y="208" width="60" height="30" rx="4"/><text class="mono" x="530" y="228" text-anchor="middle">0.07</text>
    <rect class="cell" x="500" y="242" width="60" height="30" rx="4"/><text class="mono" x="530" y="262" text-anchor="middle">⋮</text>
    <text class="small" x="530" y="300" text-anchor="middle">d차원</text>
    <text class="small" x="530" y="318" text-anchor="middle">연속 벡터</text>

    <path class="line" d="M580 215H618"/>
    <rect class="dark" x="620" y="175" width="140" height="80" rx="12"/>
    <text class="wl" x="690" y="209" text-anchor="middle">디코더 DEC</text>
    <text class="ws" x="690" y="232" text-anchor="middle">벡터 → 그래프 성질</text>
    <path class="line" d="M760 215H798"/>

    <rect class="panel" x="800" y="100" width="120" height="230" rx="14"/>
    <text class="label" x="860" y="126" text-anchor="middle">복원 대상</text>
    <text class="small" x="860" y="166" text-anchor="middle">u–v 연결 여부</text>
    <text class="small" x="860" y="206" text-anchor="middle">이웃 겹침 정도</text>
    <text class="small" x="860" y="246" text-anchor="middle">노드 레이블</text>
    <text class="small" x="860" y="264" text-anchor="middle">(지도 학습 시)</text>

    <path class="loss" d="M860 330V368H370V259"/>
    <text class="warn" x="400" y="390">손실 → 인코더·디코더 갱신</text>

    <line class="grid" x1="40" y1="414" x2="920" y2="414"/>
    <text class="th" x="40" y="436">방법</text>
    <text class="th" x="220" y="436">인코더 칸</text>
    <text class="th" x="580" y="436">디코더 칸</text>
    <line class="grid" x1="40" y1="446" x2="920" y2="446"/>
    <text class="label" x="40" y="470">Node2Vec</text>
    <text class="small" x="220" y="470">룩업 테이블 — 랜덤 워크 동시 등장으로 학습</text>
    <text class="small" x="580" y="470">소프트맥스: j가 i 주변 워크에 나올 확률</text>
    <text class="label" x="40" y="500">KG 임베딩</text>
    <text class="small" x="220" y="500">엔티티 벡터 + 관계 벡터·행렬</text>
    <text class="small" x="580" y="500">관계별 점수 함수(TransE 등)</text>
    <text class="label" x="40" y="530">GNN</text>
    <text class="small" x="220" y="530">이웃을 집계하는 공유 함수(메시지 전달)</text>
    <text class="small" x="580" y="530">과제별 헤드: 노드 분류 · 링크 점수</text>
    <line class="grid" x1="40" y1="544" x2="920" y2="544"/>
  </g>
</svg>
