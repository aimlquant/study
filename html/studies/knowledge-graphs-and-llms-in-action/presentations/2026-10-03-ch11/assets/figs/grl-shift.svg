<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 84 960 386" role="img" aria-labelledby="title desc">
  <title id="title">수작업 특징 공학에서 그래프 표현 학습으로의 전환</title>
  <desc id="desc">위 줄은 사람이 설계한 특징을 모델에 넣는 9–10장의 흐름, 아래 줄은 학습된 인코더가 그래프 구조와 노드 특징에서 임베딩을 만드는 11장의 흐름이다. 맨 아래 띠는 전통 임베딩, word2vec 계열, GNN의 세 세대를 순서대로 보여 준다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#627084"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .title{font-size:22px;font-weight:900;fill:#0F0F10}
      .sub{font-size:13px;font-weight:600;fill:#596371}
      .row{font-size:14px;font-weight:900;fill:#0F2C59}
      .label{font-size:15px;font-weight:800;fill:#0F0F10}
      .small{font-size:12.5px;font-weight:600;fill:#596371}
      .wl{font-size:15px;font-weight:800;fill:#FFFFFF}
      .ws{font-size:12.5px;font-weight:600;fill:#D9E2EF}
      .panel{fill:#FFFFFF;stroke:#BAC6D6;stroke-width:1.6}
      .hand{fill:#FCE7C2;stroke:#D97706;stroke-width:1.8}
      .dark{fill:#0F2C59}
      .line{fill:none;stroke:#627084;stroke-width:2.4;marker-end:url(#arrow)}
      .warn{font-size:12.5px;font-weight:800;fill:#B45309}
      .gen{fill:#EEF2F7;stroke:#BAC6D6;stroke-width:1.4}
    </style>
  </defs>
  <rect x="0" y="84" width="960" height="386" rx="18" fill="#FAFAF9"/>
  <g class="text">

    <text class="row" x="40" y="106">9–10장 · 수작업 특징 공학</text>
    <rect class="panel" x="40" y="118" width="190" height="80" rx="12"/>
    <text class="label" x="135" y="152" text-anchor="middle">그래프</text>
    <text class="small" x="135" y="174" text-anchor="middle">노드 · 관계 · 속성</text>
    <path class="line" d="M230 158H268"/>
    <rect class="hand" x="270" y="118" width="190" height="80" rx="12"/>
    <text class="label" x="365" y="152" text-anchor="middle">사람이 설계한 특징</text>
    <text class="small" x="365" y="174" text-anchor="middle">차수 · PageRank · 공통 이웃</text>
    <path class="line" d="M460 158H498"/>
    <rect class="panel" x="500" y="118" width="190" height="80" rx="12"/>
    <text class="label" x="595" y="152" text-anchor="middle">ML 모델</text>
    <text class="small" x="595" y="174" text-anchor="middle">분류 · 회귀 · 군집</text>
    <path class="line" d="M690 158H728"/>
    <rect class="panel" x="730" y="118" width="190" height="80" rx="12"/>
    <text class="label" x="825" y="152" text-anchor="middle">과제 결과</text>
    <text class="small" x="825" y="174" text-anchor="middle">노드 분류 · 링크 예측</text>
    <text class="warn" x="270" y="218">과제마다 재설계 · 확장 어려움</text>

    <text class="row" x="40" y="258">11장 · 그래프 표현 학습(GRL)</text>
    <rect class="panel" x="40" y="270" width="190" height="80" rx="12"/>
    <text class="label" x="135" y="304" text-anchor="middle">그래프 + 노드 특징</text>
    <text class="small" x="135" y="326" text-anchor="middle">인접 행렬 · 속성 벡터</text>
    <path class="line" d="M230 310H268"/>
    <rect class="dark" x="270" y="270" width="190" height="80" rx="12"/>
    <text class="wl" x="365" y="304" text-anchor="middle">학습되는 인코더</text>
    <text class="ws" x="365" y="326" text-anchor="middle">룩업 테이블 또는 GNN</text>
    <path class="line" d="M460 310H498"/>
    <rect class="panel" x="500" y="270" width="190" height="80" rx="12"/>
    <text class="label" x="595" y="304" text-anchor="middle">임베딩 z ∈ ℝᵈ</text>
    <text class="small" x="595" y="326" text-anchor="middle">밀집 연속 벡터</text>
    <path class="line" d="M690 310H728"/>
    <rect class="panel" x="730" y="270" width="190" height="80" rx="12"/>
    <text class="label" x="825" y="304" text-anchor="middle">과제 결과</text>
    <text class="small" x="825" y="326" text-anchor="middle">같은 과제, 다른 입력</text>
    <text class="small" x="270" y="370">자동 학습 · 차원의 뜻은 별도 해석</text>

    <rect class="gen" x="40" y="392" width="270" height="56" rx="10"/>
    <text class="label" x="175" y="416" text-anchor="middle">1세대 · 전통 임베딩</text>
    <text class="small" x="175" y="436" text-anchor="middle">차원 축소 · 행렬 분해</text>
    <path class="line" d="M310 420H343"/>
    <rect class="gen" x="345" y="392" width="270" height="56" rx="10"/>
    <text class="label" x="480" y="416" text-anchor="middle">2세대 · word2vec 계열</text>
    <text class="small" x="480" y="436" text-anchor="middle">랜덤 워크 · Node2Vec</text>
    <path class="line" d="M615 420H648"/>
    <rect class="gen" x="650" y="392" width="270" height="56" rx="10"/>
    <text class="label" x="785" y="416" text-anchor="middle">3세대 · 딥러닝</text>
    <text class="small" x="785" y="436" text-anchor="middle">메시지 전달 GNN</text>
  </g>
</svg>
