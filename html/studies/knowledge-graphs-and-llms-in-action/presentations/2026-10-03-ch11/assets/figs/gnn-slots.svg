<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 86 960 424" role="img" aria-labelledby="title desc">
  <title id="title">GNN 한 층의 두 슬롯: AGGREGATE와 UPDATE에 끼울 수 있는 부품</title>
  <desc id="desc">위쪽 흐름에서 이웃 표현이 AGGREGATE 슬롯을 거쳐 메시지가 되고, 메시지와 자기 표현이 UPDATE 슬롯을 거쳐 새 표현이 된다. 아래 왼쪽은 AGGREGATE에 넣을 수 있는 합, 평균, 대칭 정규화, 어텐션, 멀티헤드 어텐션을, 아래 오른쪽은 UPDATE에 넣을 수 있는 기본 갱신, 자기 루프, 연결 스킵, 게이트 갱신, 점핑 놀리지를 각각의 역할과 함께 나열한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#627084"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .title{font-size:22px;font-weight:900;fill:#0F0F10}
      .sub{font-size:13px;font-weight:600;fill:#596371}
      .label{font-size:15px;font-weight:900;fill:#0F0F10}
      .ol{font-size:13.5px;font-weight:850;fill:#0F0F10}
      .small{font-size:12.5px;font-weight:600;fill:#596371}
      .wl{font-size:15px;font-weight:900;fill:#FFFFFF}
      .ws{font-size:12px;font-weight:600;fill:#D9E2EF}
      .panel{fill:#FFFFFF;stroke:#BAC6D6;stroke-width:1.6}
      .opt{fill:#F4F6F9;stroke:#DCE3EC;stroke-width:1}
      .dark{fill:#0F2C59}
      .line{fill:none;stroke:#627084;stroke-width:2.4;marker-end:url(#arrow)}
      .warn{font-size:12.5px;font-weight:800;fill:#B45309}
    </style>
  </defs>
  <rect x="0" y="86" width="960" height="424" rx="18" fill="#FAFAF9"/>
  <g class="text">

    <rect class="panel" x="40" y="98" width="150" height="64" rx="10"/>
    <text class="label" x="115" y="126" text-anchor="middle">이웃 표현</text>
    <text class="small" x="115" y="148" text-anchor="middle">{h_v : v ∈ N(u)}</text>
    <path class="line" d="M190 130H228"/>
    <rect class="dark" x="230" y="98" width="170" height="64" rx="10"/>
    <text class="wl" x="315" y="126" text-anchor="middle">AGGREGATE 슬롯</text>
    <text class="ws" x="315" y="148" text-anchor="middle">가변 개수 → 고정 크기</text>
    <path class="line" d="M400 130H438"/>
    <rect class="panel" x="440" y="98" width="130" height="64" rx="10"/>
    <text class="label" x="505" y="126" text-anchor="middle">메시지</text>
    <text class="small" x="505" y="148" text-anchor="middle">m_N(u)</text>
    <path class="line" d="M570 130H608"/>
    <rect class="dark" x="610" y="98" width="170" height="64" rx="10"/>
    <text class="wl" x="695" y="126" text-anchor="middle">UPDATE 슬롯</text>
    <text class="ws" x="695" y="148" text-anchor="middle">자기 + 메시지 결합</text>
    <path class="line" d="M780 130H818"/>
    <rect class="panel" x="820" y="98" width="100" height="64" rx="10"/>
    <text class="label" x="870" y="126" text-anchor="middle">새 표현</text>
    <text class="small" x="870" y="148" text-anchor="middle">h_u(k)</text>
    <rect class="panel" x="440" y="186" width="130" height="44" rx="10"/>
    <text class="small" x="505" y="213" text-anchor="middle">자기 표현 h_u(k−1)</text>
    <path class="line" d="M570 208H590V150H608"/>

    <rect class="panel" x="40" y="246" width="420" height="250" rx="14"/>
    <text class="label" x="56" y="274">AGGREGATE에 끼우는 부품 — 무엇을 얼마나 모을까</text>
    <rect class="panel" x="500" y="246" width="420" height="250" rx="14"/>
    <text class="label" x="516" y="274">UPDATE에 끼우는 부품 — 무엇을 얼마나 바꿀까</text>
    <rect class="opt" x="56" y="292" width="388" height="32" rx="6"/><text class="ol" x="70" y="313">합 Σ h_v</text><text class="small" x="220" y="313">기본 · 이웃 많을수록 커짐</text>
    <rect class="opt" x="56" y="330" width="388" height="32" rx="6"/><text class="ol" x="70" y="351">평균 ÷|N(u)|</text><text class="small" x="220" y="351">차수 다른 노드를 같은 척도로</text>
    <rect class="opt" x="56" y="368" width="388" height="32" rx="6"/><text class="ol" x="70" y="389">대칭 정규화</text><text class="small" x="220" y="389">GCN · 허브 영향 완화</text>
    <rect class="opt" x="56" y="406" width="388" height="32" rx="6"/><text class="ol" x="70" y="427">어텐션 α_uv</text><text class="small" x="220" y="427">GAT · 이웃별 학습 가중치</text>
    <rect class="opt" x="56" y="444" width="388" height="32" rx="6"/><text class="ol" x="70" y="465">멀티헤드</text><text class="small" x="220" y="465">여러 관점 병렬 · 트랜스포머</text>
    <rect class="opt" x="516" y="292" width="388" height="32" rx="6"/><text class="ol" x="530" y="313">기본 갱신</text><text class="small" x="670" y="313">σ(W_self·h_u + W_neigh·m)</text>
    <rect class="opt" x="516" y="330" width="388" height="32" rx="6"/><text class="ol" x="530" y="351">자기 루프</text><text class="small" x="670" y="351">자신도 이웃처럼 집계 · 유연성↓</text>
    <rect class="opt" x="516" y="368" width="388" height="32" rx="6"/><text class="ol" x="530" y="389">연결(concat) 스킵</text><text class="small" x="670" y="389">[h_u ‖ m] · 원 특징 보존</text>
    <rect class="opt" x="516" y="406" width="388" height="32" rx="6"/><text class="ol" x="530" y="427">게이트 갱신</text><text class="small" x="670" y="427">(1−g)·h_u + g·후보</text>
    <rect class="opt" x="516" y="444" width="388" height="32" rx="6"/><text class="ol" x="530" y="465">점핑 놀리지</text><text class="small" x="670" y="465">여러 층 결합 · 노드별 반경</text>
  </g>
</svg>
