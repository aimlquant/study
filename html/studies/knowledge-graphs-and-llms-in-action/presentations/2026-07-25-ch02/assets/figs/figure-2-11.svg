<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">연역적 추론기</title><desc id="desc">전제와 규칙이 완전하고 참일 때 결론을 논리적으로 보장한다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f2c59"/></marker></defs>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:800}.sub{font-size:17px;fill:#475569}.box{fill:#fff;stroke:#9aa9bd;stroke-width:2}.focus{fill:#0f2c59;stroke:#0f2c59;stroke-width:2}.soft{fill:#e9f0fa;stroke:#6f89ad;stroke-width:2}.label{font-size:20px;font-weight:750}.small{font-size:15px}.white{fill:#fff}.arrow{fill:none;stroke:#0f2c59;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <rect width="1200" height="620" rx="24" fill="#f7f8fa"/>
  <text class="t title" x="54" y="58">연역적 추론기</text><text class="t sub" x="54" y="88">전제와 규칙이 완전하고 참일 때 결론을 논리적으로 보장한다</text>
  <rect class="soft" x="55" y="210" width="190" height="120" rx="18"/><text class="t label" x="150.0" y="247" text-anchor="middle">데이터 소스</text><text class="t small" x="150.0" y="275" text-anchor="middle">사실·비용·규칙</text><path class="arrow" d="M245 270 L335 270"/><rect class="box" x="335" y="175" width="245" height="190" rx="18"/><text class="t label" x="457.5" y="212" text-anchor="middle">완전한 지식 베이스</text><text class="t small" x="457.5" y="240" text-anchor="middle">모든 관련 전제와 규칙</text><path class="arrow" d="M580 270 L675 270"/><rect class="focus" x="675" y="175" width="225" height="190" rx="18"/><text class="t label white" x="787.5" y="212" text-anchor="middle">연역적 추론기</text><text class="t small white" x="787.5" y="240" text-anchor="middle">논리 규칙 적용</text><path class="arrow" d="M900 270 L985 270"/><rect class="soft" x="985" y="210" width="165" height="120" rx="18"/><text class="t label" x="1067.5" y="247" text-anchor="middle">행동·제안</text><text class="t small" x="1067.5" y="275" text-anchor="middle">전제 안에서 보장</text>
</svg>
