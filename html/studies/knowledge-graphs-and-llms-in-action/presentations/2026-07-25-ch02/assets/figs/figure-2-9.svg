<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 140 1110 340" role="img" aria-labelledby="title desc">
  <title id="title">익숙한 패턴이 실제 조건을 덮어쓴 사례</title><desc id="desc">단순 문제와 당시 모델 응답의 의미 차이를 재구성했다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f2c59"/></marker></defs>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:800}.sub{font-size:17px;fill:#475569}.box{fill:#fff;stroke:#9aa9bd;stroke-width:2}.focus{fill:#0f2c59;stroke:#0f2c59;stroke-width:2}.soft{fill:#e9f0fa;stroke:#6f89ad;stroke-width:2}.label{font-size:20px;font-weight:750}.small{font-size:15px}.white{fill:#fff}.arrow{fill:none;stroke:#0f2c59;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <rect width="1200" height="620" rx="24" fill="#f7f8fa"/>
  <rect class="soft" x="65" y="160" width="430" height="300" rx="18"/><text class="t label" x="280" y="200" text-anchor="middle">실제 문제</text><text class="t small" x="280" y="230" text-anchor="middle">농부 + 양 + 배 · 한 번에 함께 건너기</text><path class="arrow" d="M495 310 L570 310"/><rect class="box" x="570" y="160" width="565" height="300" rx="18"/><text class="t label" x="852.5" y="200" text-anchor="middle">Claude 3.5 Sonnet 당시 응답</text><text class="t small" x="852.5" y="230" text-anchor="middle">익숙한 늑대·양·양배추 절차를 끌어와 불필요한 왕복 생성</text><text class="t label" x="280" y="335" text-anchor="middle">정답: 한 번의 이동</text><text class="t label" x="852" y="335" text-anchor="middle">스냅숏: 이미 끝난 뒤에도 왕복</text>
</svg>
