<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">여러 추론 엔진과 피드백 루프</title><desc id="desc">제안·행동이 환경 관찰을 만들고 다음 지식으로 되돌아온다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f2c59"/></marker></defs>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:800}.sub{font-size:17px;fill:#475569}.box{fill:#fff;stroke:#9aa9bd;stroke-width:2}.focus{fill:#0f2c59;stroke:#0f2c59;stroke-width:2}.soft{fill:#e9f0fa;stroke:#6f89ad;stroke-width:2}.label{font-size:20px;font-weight:750}.small{font-size:15px}.white{fill:#fff}.arrow{fill:none;stroke:#0f2c59;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <rect width="1200" height="620" rx="24" fill="#f7f8fa"/>
  <text class="t title" x="54" y="58">여러 추론 엔진과 피드백 루프</text><text class="t sub" x="54" y="88">제안·행동이 환경 관찰을 만들고 다음 지식으로 되돌아온다</text>
  <rect class="soft" x="35" y="235" width="155" height="96" rx="18"/><text class="t label" x="112.5" y="272" text-anchor="middle">데이터·환경</text><text class="t small" x="112.5" y="300" text-anchor="middle">관찰과 원천</text><path class="arrow" d="M190 283 L255 283"/><rect class="box" x="255" y="235" width="175" height="96" rx="18"/><text class="t label" x="342.5" y="272" text-anchor="middle">지식 습득</text><text class="t small" x="342.5" y="300" text-anchor="middle">변환·평가</text><path class="arrow" d="M430 283 L490 180"/><path class="arrow" d="M430 283 L490 386"/><rect class="box" x="490" y="130" width="185" height="100" rx="18"/><text class="t label" x="582.5" y="167" text-anchor="middle">지식 베이스 1</text><text class="t small" x="582.5" y="195" text-anchor="middle">명시적·암묵적</text><rect class="box" x="490" y="336" width="185" height="100" rx="18"/><text class="t label" x="582.5" y="373" text-anchor="middle">지식 베이스 N</text><text class="t small" x="582.5" y="401" text-anchor="middle">과제별 표현</text><path class="arrow" d="M675 180 L745 235"/><path class="arrow" d="M675 386 L745 331"/><rect class="box" x="745" y="185" width="185" height="96" rx="18"/><text class="t label" x="837.5" y="222" text-anchor="middle">추론 엔진 1</text><text class="t small" x="837.5" y="250" text-anchor="middle">규칙·예측</text><rect class="box" x="745" y="301" width="185" height="96" rx="18"/><text class="t label" x="837.5" y="338" text-anchor="middle">추론 엔진 N</text><text class="t small" x="837.5" y="366" text-anchor="middle">순차·병렬</text><path class="arrow" d="M930 291 L995 291"/><rect class="focus" x="995" y="243" width="165" height="96" rx="18"/><text class="t label white" x="1077.5" y="280" text-anchor="middle">최종 사용자</text><text class="t small white" x="1077.5" y="308" text-anchor="middle">질문·판단</text><path class="dash" d="M1078 339 C1078 540 350 548 350 331"/><text class="t small" x="700" y="570" text-anchor="middle">결과와 환경 관찰이 다음 지식 습득으로 돌아간다</text>
</svg>
