<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">귀납적 추론기</title><desc id="desc">관찰에서 패턴을 추상화해 보지 못한 사례까지 일반화한다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f2c59"/></marker></defs>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:800}.sub{font-size:17px;fill:#475569}.box{fill:#fff;stroke:#9aa9bd;stroke-width:2}.focus{fill:#0f2c59;stroke:#0f2c59;stroke-width:2}.soft{fill:#e9f0fa;stroke:#6f89ad;stroke-width:2}.label{font-size:20px;font-weight:750}.small{font-size:15px}.white{fill:#fff}.arrow{fill:none;stroke:#0f2c59;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <rect width="1200" height="620" rx="24" fill="#f7f8fa"/>
  <text class="t title" x="54" y="58">귀납적 추론기</text><text class="t sub" x="54" y="88">관찰에서 패턴을 추상화해 보지 못한 사례까지 일반화한다</text>
  <rect class="soft" x="45" y="205" width="185" height="130" rx="18"/><text class="t label" x="137.5" y="242" text-anchor="middle">원시 데이터</text><text class="t small" x="137.5" y="270" text-anchor="middle">관찰·텍스트</text><path class="arrow" d="M230 270 L315 270"/><rect class="focus" x="315" y="170" width="235" height="200" rx="18"/><text class="t label white" x="432.5" y="207" text-anchor="middle">학습·추상화</text><text class="t small white" x="432.5" y="235" text-anchor="middle">NLP · 특징 · 모델</text><path class="arrow" d="M550 270 L640 270"/><rect class="box" x="640" y="170" width="230" height="200" rx="18"/><text class="t label" x="755.0" y="207" text-anchor="middle">학습된 지식</text><text class="t small" x="755.0" y="235" text-anchor="middle">패턴과 예측 모델</text><path class="arrow" d="M870 270 L955 270"/><rect class="soft" x="955" y="205" width="195" height="130" rx="18"/><text class="t label" x="1052.5" y="242" text-anchor="middle">예측·제안</text><text class="t small" x="1052.5" y="270" text-anchor="middle">불확실성 포함</text>
</svg>
