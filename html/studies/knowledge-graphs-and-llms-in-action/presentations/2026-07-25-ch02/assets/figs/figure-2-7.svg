<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 120 1145 310" role="img" aria-labelledby="title desc">
  <title id="title">LLM을 위한 지식 습득</title><desc id="desc">텍스트 패턴이 매개변수에 분산되어 저장되고 부분 수정은 어렵다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f2c59"/></marker></defs>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:800}.sub{font-size:17px;fill:#475569}.box{fill:#fff;stroke:#9aa9bd;stroke-width:2}.focus{fill:#0f2c59;stroke:#0f2c59;stroke-width:2}.soft{fill:#e9f0fa;stroke:#6f89ad;stroke-width:2}.label{font-size:20px;font-weight:750}.small{font-size:15px}.white{fill:#fff}.arrow{fill:none;stroke:#0f2c59;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <rect width="1200" height="620" rx="24" fill="#f7f8fa"/>
  <rect class="soft" x="45" y="205" width="180" height="120" rx="18"/><text class="t label" x="135.0" y="242" text-anchor="middle">대규모 텍스트</text><text class="t small" x="135.0" y="270" text-anchor="middle">선택·정제</text><path class="arrow" d="M225 265 L315 265"/><rect class="focus" x="315" y="180" width="235" height="170" rx="18"/><text class="t label white" x="432.5" y="217" text-anchor="middle">자기지도 학습</text><text class="t small white" x="432.5" y="245" text-anchor="middle">다음 토큰 예측</text><path class="arrow" d="M550 265 L640 265"/><rect class="box" x="640" y="180" width="230" height="170" rx="18"/><text class="t label" x="755.0" y="217" text-anchor="middle">통계적 매개변수</text><text class="t small" x="755.0" y="245" text-anchor="middle">고차원 벡터 공간</text><path class="arrow" d="M870 265 L960 265"/><rect class="soft" x="960" y="205" width="190" height="120" rx="18"/><text class="t label" x="1055.0" y="242" text-anchor="middle">암묵적 지식</text><text class="t small" x="1055.0" y="270" text-anchor="middle">유연하지만 불투명</text>
</svg>
