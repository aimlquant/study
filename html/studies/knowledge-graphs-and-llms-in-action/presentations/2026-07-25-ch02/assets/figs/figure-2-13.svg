<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">KG 생성의 상향식 접근법</title><desc id="desc">기능적 과제보다 모든 데이터 수집과 통합에서 시작한다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f2c59"/></marker></defs>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:800}.sub{font-size:17px;fill:#475569}.box{fill:#fff;stroke:#9aa9bd;stroke-width:2}.focus{fill:#0f2c59;stroke:#0f2c59;stroke-width:2}.soft{fill:#e9f0fa;stroke:#6f89ad;stroke-width:2}.label{font-size:20px;font-weight:750}.small{font-size:15px}.white{fill:#fff}.arrow{fill:none;stroke:#0f2c59;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <rect width="1200" height="620" rx="24" fill="#f7f8fa"/>
  <text class="t title" x="54" y="58">KG 생성의 상향식 접근법</text><text class="t sub" x="54" y="88">기능적 과제보다 모든 데이터 수집과 통합에서 시작한다</text>
  <rect class="soft" x="40" y="155" width="190" height="90" rx="18"/><text class="t label" x="135.0" y="192" text-anchor="middle">데이터 소스 A</text><text class="t small" x="135.0" y="220" text-anchor="middle">서로 다른 구조</text><rect class="soft" x="40" y="270" width="190" height="90" rx="18"/><text class="t label" x="135.0" y="307" text-anchor="middle">데이터 소스 B</text><text class="t small" x="135.0" y="335" text-anchor="middle">서로 다른 ID</text><rect class="soft" x="40" y="385" width="190" height="90" rx="18"/><text class="t label" x="135.0" y="422" text-anchor="middle">데이터 소스 N</text><text class="t small" x="135.0" y="450" text-anchor="middle">과제 무관 데이터</text><path class="arrow" d="M230 200 L370 290"/><path class="arrow" d="M230 315 L370 315"/><path class="arrow" d="M230 430 L370 340"/><rect class="focus" x="370" y="200" width="300" height="230" rx="18"/><text class="t label white" x="520.0" y="237" text-anchor="middle">모든 데이터 통합</text><text class="t small white" x="520.0" y="265" text-anchor="middle">정규화 비용부터 지불</text><path class="arrow" d="M670 315 L785 315"/><rect class="box" x="785" y="225" width="360" height="180" rx="18"/><text class="t label" x="965.0" y="262" text-anchor="middle">나중에 쓸모 찾기</text><text class="t small" x="965.0" y="290" text-anchor="middle">사용자 과제와 평가 기준이 뒤늦게 등장</text>
</svg>
