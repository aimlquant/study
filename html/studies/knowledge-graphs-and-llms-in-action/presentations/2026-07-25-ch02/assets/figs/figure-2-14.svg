  <text class="t title" x="54" y="58">KG 플랫폼에 맞춘 목적 주도 CRISP-DM</text><text class="t sub" x="54" y="88">비즈니스 목표가 필요한 데이터·모델·평가를 이끌고 KG는 반복의 중심에 놓인다</text>
