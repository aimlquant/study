<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">지능형 시스템과 바깥 세계의 상호작용</title><desc id="desc">시스템은 데이터를 받아 결과를 내고 사용자 피드백으로 진화한다</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f2c59"/></marker></defs>
  <style>.t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#0f172a}.title{font-size:30px;font-weight:800}.sub{font-size:17px;fill:#475569}.box{fill:#fff;stroke:#9aa9bd;stroke-width:2}.focus{fill:#0f2c59;stroke:#0f2c59;stroke-width:2}.soft{fill:#e9f0fa;stroke:#6f89ad;stroke-width:2}.label{font-size:20px;font-weight:750}.small{font-size:15px}.white{fill:#fff}.arrow{fill:none;stroke:#0f2c59;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#arrow)}</style>
  <rect width="1200" height="620" rx="24" fill="#f7f8fa"/>
  <text class="t title" x="54" y="58">지능형 시스템과 바깥 세계의 상호작용</text><text class="t sub" x="54" y="88">시스템은 데이터를 받아 결과를 내고 사용자 피드백으로 진화한다</text>
  <rect class="soft" x="50" y="210" width="190" height="110" rx="18"/><text class="t label" x="145.0" y="247" text-anchor="middle">환경·기존 소스</text><text class="t small" x="145.0" y="275" text-anchor="middle">관찰과 데이터</text><path class="arrow" d="M240 265 L335 265"/><rect class="focus" x="335" y="190" width="260" height="150" rx="18"/><text class="t label white" x="465.0" y="227" text-anchor="middle">지능형 시스템</text><text class="t small white" x="465.0" y="255" text-anchor="middle">습득 · 추론 · 제안</text><path class="arrow" d="M595 265 L705 265"/><rect class="box" x="705" y="190" width="205" height="150" rx="18"/><text class="t label" x="807.5" y="227" text-anchor="middle">최종 사용자</text><text class="t small" x="807.5" y="255" text-anchor="middle">질문 · 판단</text><path class="arrow" d="M805 340 L805 445"/><rect class="soft" x="680" y="445" width="250" height="92" rx="18"/><text class="t label" x="805.0" y="482" text-anchor="middle">피드백</text><text class="t small" x="805.0" y="510" text-anchor="middle">결과와 명시적 평가</text><path class="dash" d="M680 491 C460 535 360 490 425 340"/>
</svg>
