<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-labelledby="t d">
  <title id="t">"Zika" 언급의 단계별 상태 변화 — 기록된 실행</title>
  <desc id="d">NER 출력의 Organism 라벨이 후보 선택, 경로 증거, 최종 명확화를 거쳐 Congenital Zika virus infection으로 정정되는 과정.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B6B72"/></marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .box{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .final{fill:#0F2C59}
      .line{fill:none;stroke:#6B6B72;stroke-width:2.5;marker-end:url(#arrow)}
      .h{font-size:15px;font-weight:800;text-anchor:middle;fill:#0F2C59}
      .src{font-size:11.5px;fill:#6B6B72;text-anchor:middle}
      .mono{font-size:12px;fill:#0F0F10;text-anchor:middle;font-family:Consolas,'Courier New',monospace}
      .warn{font-size:12px;fill:#B3261E;text-anchor:middle;font-weight:700;font-family:Consolas,'Courier New',monospace}
      .m{font-size:12px;fill:#3A3A40;text-anchor:middle}
      .w{font-size:12.5px;fill:#fff;text-anchor:middle;font-weight:700}
    </style>
  </defs>
  <rect width="1160" height="440" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="box" x="30" y="80" width="250" height="290" rx="10"/>
    <text class="h" x="155" y="112">NER 출력</text>
    <text class="src" x="155" y="132">Listing 8.11</text>
    <text class="mono" x="155" y="176">mention: "Zika"</text>
    <text class="warn" x="155" y="204">label: Organism</text>
    <text class="mono" x="155" y="232">start 19 · end 22</text>
    <text class="m" x="155" y="290">질병 문맥인데 생물체 라벨 —</text>
    <text class="m" x="155" y="312">위치는 파이썬 후처리로 계산</text>
    <path class="line" d="M280 225H320"/>

    <rect class="box" x="320" y="80" width="250" height="290" rx="10"/>
    <text class="h" x="445" y="112">CS 출력</text>
    <text class="src" x="445" y="132">Listing 8.14</text>
    <text class="mono" x="445" y="176">50471002 Zika virus</text>
    <text class="mono" x="445" y="204">3928002 Zika virus disease</text>
    <text class="mono" x="445" y="238">762725007 Congenital</text>
    <text class="mono" x="445" y="258">Zika virus infection</text>
    <text class="m" x="445" y="312">전문 검색 후보 3개 — LLM 미사용</text>
    <path class="line" d="M570 225H610"/>

    <rect class="box" x="610" y="80" width="250" height="290" rx="10"/>
    <text class="h" x="735" y="112">경로 증거</text>
    <text class="src" x="735" y="132">Listing 8.16 · 8.20</text>
    <text class="mono" x="735" y="172">(Congenital Zika virus</text>
    <text class="mono" x="735" y="192">infection)-[:OCCURRENCE]-&gt;</text>
    <text class="mono" x="735" y="212">(Congenital)</text>
    <text class="mono" x="735" y="232">&lt;-[:OCCURRENCE]-</text>
    <text class="mono" x="735" y="252">(Micrencephaly)</text>
    <text class="m" x="735" y="296">요약: 선천성 기형들과</text>
    <text class="m" x="735" y="316">공통 노드로 연결됨</text>
    <path class="line" d="M860 225H900"/>

    <rect class="box" x="900" y="80" width="230" height="290" rx="10"/>
    <text class="h" x="1015" y="112">CD 출력</text>
    <text class="src" x="1015" y="132">Listing 8.22</text>
    <rect class="final" x="920" y="160" width="190" height="94" rx="8"/>
    <text class="w" x="1015" y="190">762725007</text>
    <text class="w" x="1015" y="214">Congenital Zika</text>
    <text class="w" x="1015" y="236">virus infection</text>
    <text class="m" x="1015" y="290">Organism 라벨이 문맥 증거로</text>
    <text class="m" x="1015" y="312">감염 개체로 정정됨</text>
  </g>
</svg>
