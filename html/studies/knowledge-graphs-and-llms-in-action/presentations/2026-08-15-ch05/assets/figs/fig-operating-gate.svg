<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .h{font-size:19px;font-weight:900}
    .m{font-size:14.5px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11px;font-weight:700}
    .plain{fill:#fff;stroke:#cbd5e1}
    .soft{fill:#e8eef8;stroke:#b7c7e3}
    .cand{fill:#fff7ed;stroke:#fdba74}
    .gate{fill:#eef2fb;stroke:#0f2c59}
    .accent{fill:#0f2c59;stroke:#0f2c59}
    .line{stroke:#0f2c59;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .dash{stroke:#b45309;stroke-width:2.5;fill:none;stroke-dasharray:7 6;stroke-linecap:round}
  </style>
  <title id="title">후보를 검증된 지식으로 바꾸는 운영 게이트</title>
  <desc id="desc">LLM이 만든 개체·관계 후보가 정량 평가와 안정성 검사, 환각 통제를 거쳐야 검증된 지식 그래프가 되는 흐름</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f2c59"/></marker>
    <marker id="warra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="960" height="540" fill="#fafaf9"/>
  <text class="t h" x="40" y="46" text-anchor="start" fill="#0f172a">LLM 출력은 &#39;후보&#39;다 — 검증 게이트를 통과해야 지식이 된다</text>
  <text class="t s" x="40" y="70" text-anchor="start" fill="#64748b">AIML Quant 보충 · 교재의 평가·안정성·환각 논의를 운영 흐름으로 재구성</text>

  <!-- observation -->
  <rect class="soft" x="40" y="150" width="150" height="90" rx="12"/>
  <text class="t m" x="115" y="188" text-anchor="middle" fill="#0f172a">관찰</text>
  <text class="t xs" x="115" y="212" text-anchor="middle" fill="#475569">비정형 텍스트</text>

  <!-- candidate -->
  <rect class="cand" x="250" y="150" width="180" height="90" rx="12"/>
  <text class="t m" x="340" y="182" text-anchor="middle" fill="#7c2d12">후보 생성</text>
  <text class="t xs" x="340" y="204" text-anchor="middle" fill="#9a3412">LLM: 개체 · 관계 추출</text>
  <text class="t xs" x="340" y="222" text-anchor="middle" fill="#9a3412">확정된 사실 아님</text>

  <!-- gate -->
  <rect class="gate" x="490" y="128" width="240" height="284" rx="14" stroke-width="2.5"/>
  <text class="t m" x="610" y="158" text-anchor="middle" fill="#0f2c59">검증 게이트</text>
  <rect class="plain" x="510" y="176" width="200" height="46" rx="8"/>
  <text class="t s" x="524" y="204" text-anchor="start" fill="#334155">정량 평가 · 정밀도/재현율/F1</text>
  <rect class="plain" x="510" y="230" width="200" height="46" rx="8"/>
  <text class="t s" x="524" y="258" text-anchor="start" fill="#334155">QA 관리자 · LLM 심판</text>
  <rect class="plain" x="510" y="284" width="200" height="46" rx="8"/>
  <text class="t s" x="524" y="312" text-anchor="start" fill="#334155">예측 안정성 · 온도 0</text>
  <rect class="plain" x="510" y="338" width="200" height="46" rx="8"/>
  <text class="t s" x="524" y="366" text-anchor="start" fill="#334155">환각 통제 · 근거 확인</text>

  <!-- verified KG -->
  <rect class="accent" x="790" y="150" width="140" height="90" rx="12"/>
  <text class="t m" x="860" y="188" text-anchor="middle" fill="#fff">검증된</text>
  <text class="t m" x="860" y="210" text-anchor="middle" fill="#fff">지식 그래프</text>

  <path class="line" d="M190 195 L246 195" marker-end="url(#arrow)"/>
  <path class="line" d="M430 195 L486 195" marker-end="url(#arrow)"/>
  <path class="line" d="M730 195 L786 195" marker-end="url(#arrow)"/>

  <!-- feedback loop -->
  <path class="dash" d="M610 412 L610 460 L340 460 L340 244" marker-end="url(#warra)"/>
  <text class="t xs" x="475" y="482" text-anchor="middle" fill="#b45309">실패 사례 · 체계적 오류 → 프롬프트 개선 (이정표마다 미니 KG 확인)</text>

  <text class="t xs" x="860" y="266" text-anchor="middle" fill="#64748b">모델 드리프트 감시 기준</text>
</svg>
