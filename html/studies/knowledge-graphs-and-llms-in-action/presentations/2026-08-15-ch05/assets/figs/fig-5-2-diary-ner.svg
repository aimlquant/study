<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .h{font-size:19px;font-weight:900}
    .m{font-size:15px;font-weight:800}
    .s{font-size:13px;font-weight:700}
    .xs{font-size:11.5px;font-weight:700}
    .chip{font-size:13px;font-weight:800}
    .plain{fill:#fff;stroke:#cbd5e1}
  </style>
  <title id="title">개체명이 강조된 워런 위버의 일지 항목</title>
  <desc id="desc">일지 문장에서 사람, 조직, 주제(직무) 개체를 색으로 구분해 강조한 개체명 인식 예시</desc>
  <rect width="960" height="540" fill="#fafaf9"/>
  <text class="t h" x="40" y="52" text-anchor="start" fill="#0f172a">일지 한 토막에서 개체명을 찾아내기</text>
  <text class="t s" x="40" y="76" text-anchor="start" fill="#64748b">사람·조직만이 아니라 &#39;주제&#39;도 인식해야 한다</text>

  <!-- diary card -->
  <rect class="plain" x="40" y="100" width="600" height="360" rx="14"/>
  <text class="t xs" x="64" y="132" text-anchor="start" fill="#94a3b8">Warren Weaver Diary · 발췌 재구성</text>

  <!-- line 1 -->
  <text class="t s" x="64" y="176" text-anchor="start" fill="#334155">R. 은</text>
  <rect x="108" y="160" width="150" height="24" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="t chip" x="183" y="177" text-anchor="middle" fill="#1e40af">Vilhelm Bjerknes</text>
  <text class="t s" x="268" y="176" text-anchor="start" fill="#334155">의 옛 제자이며,</text>

  <!-- line 2 -->
  <rect x="64" y="200" width="132" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text class="t chip" x="130" y="217" text-anchor="middle" fill="#166534">오슬로 대학교</text>
  <text class="t s" x="206" y="216" text-anchor="start" fill="#334155">교수의 지도를 받았다.</text>

  <!-- line 3 -->
  <rect x="64" y="240" width="54" height="24" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text class="t chip" x="91" y="257" text-anchor="middle" fill="#166534">MIT</text>
  <text class="t s" x="126" y="256" text-anchor="start" fill="#334155">대기 관측 연구의 자료는</text>
  <rect x="330" y="240" width="132" height="24" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="t chip" x="396" y="257" text-anchor="middle" fill="#1e40af">K. T. Compton</text>
  <text class="t s" x="472" y="256" text-anchor="start" fill="#334155">메모에 있다.</text>

  <!-- line 4 -->
  <text class="t s" x="64" y="296" text-anchor="start" fill="#334155">R.은 이를</text>
  <rect x="132" y="280" width="108" height="24" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="t chip" x="186" y="297" text-anchor="middle" fill="#92400e">기상 연구</text>
  <text class="t s" x="248" y="296" text-anchor="start" fill="#334155">프로그램의 필수 부분으로 본다.</text>

  <!-- line 5 -->
  <rect x="64" y="332" width="108" height="24" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="t chip" x="118" y="349" text-anchor="middle" fill="#92400e">북극 기단</text>
  <text class="t s" x="180" y="348" text-anchor="start" fill="#334155">과</text>
  <rect x="206" y="332" width="108" height="24" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="t chip" x="260" y="349" text-anchor="middle" fill="#92400e">온대 기단</text>
  <text class="t s" x="322" y="348" text-anchor="start" fill="#334155">의 충돌 이론을</text>
  <text class="t s" x="64" y="384" text-anchor="start" fill="#334155">이 대륙에서 검증할 전략적 지점이다.</text>

  <text class="t xs" x="64" y="432" text-anchor="start" fill="#b45309">주제 개체는 사전에 없어 단순 사전 기반 NER로는 잡히지 않는다</text>

  <!-- legend / types -->
  <rect x="668" y="100" width="252" height="360" rx="14" fill="#eef2fb" stroke="#c7d3ea"/>
  <text class="t m" x="692" y="134" text-anchor="start" fill="#0f172a">개체 유형</text>

  <rect x="692" y="152" width="18" height="18" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="t s" x="720" y="166" text-anchor="start" fill="#1e40af">사람 (Person)</text>

  <rect x="692" y="184" width="18" height="18" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text class="t s" x="720" y="198" text-anchor="start" fill="#166534">조직 (Organization)</text>

  <rect x="692" y="216" width="18" height="18" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="t s" x="720" y="230" text-anchor="start" fill="#92400e">주제 (Topic)</text>

  <text class="t xs" x="692" y="266" text-anchor="start" fill="#475569">Topic 은 다시 세 하위 유형으로:</text>
  <text class="t xs" x="704" y="292" text-anchor="start" fill="#334155">· 연구 분야 (discipline)</text>
  <text class="t xs" x="704" y="314" text-anchor="start" fill="#334155">· 기술 (technology)</text>
  <text class="t xs" x="704" y="336" text-anchor="start" fill="#334155">· 질병 (disease)</text>

  <rect x="692" y="364" width="204" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text class="t xs" x="704" y="390" text-anchor="start" fill="#0f2c59">맞춤형 개체 추출이 필요</text>
  <text class="t xs" x="704" y="412" text-anchor="start" fill="#475569">① 맞춤 NER 모델 학습</text>
  <text class="t xs" x="704" y="432" text-anchor="start" fill="#475569">② LLM의 힘을 빌리기</text>
</svg>
