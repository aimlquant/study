    <title id="title">환자 여정 지도</title><desc id="desc">임상 사건은 시간, 경험, 표준 진료 경로 속에서 해석된다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">환자 여정 지도</text><text class="t sub" x="48" y="86">임상 사건은 시간, 경험, 표준 진료 경로 속에서 해석된다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="78" y="168" fill="#0f172a">Symptoms</text><text class="t body" x="78" y="200" fill="#334155">첫 방문</text><text class="t body" x="78" y="224" fill="#334155">증상 기록</text><text class="t body" x="78" y="248" fill="#334155">주관성</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="388" y="168" fill="#0f172a">Diagnosis</text><text class="t body" x="388" y="200" fill="#334155">검사·판독</text><text class="t body" x="388" y="224" fill="#334155">질병 코드</text><text class="t body" x="388" y="248" fill="#334155">불확실성</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="698" y="168" fill="#0f172a">Treatment</text><text class="t body" x="698" y="200" fill="#334155">약물·시술</text><text class="t body" x="698" y="224" fill="#334155">반응</text><text class="t body" x="698" y="248" fill="#334155">부작용</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="78" y="368" fill="#0f172a">Monitoring</text><text class="t body" x="78" y="400" fill="#334155">추적 검사</text><text class="t body" x="78" y="424" fill="#334155">재발·진행</text><text class="t body" x="78" y="448" fill="#334155">결과 기록</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="388" y="368" fill="#0f172a">Privacy</text><text class="t body" x="388" y="400" fill="#334155">식별정보 제거</text><text class="t body" x="388" y="424" fill="#334155">통계만 저장</text><text class="t body" x="388" y="448" fill="#334155">동의 관리</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="698" y="368" fill="#ffffff">Clinical KG</text><text class="t body" x="698" y="400" fill="#ffffff">환자 맥락</text><text class="t body" x="698" y="424" fill="#ffffff">오믹스·EHR</text><text class="t body" x="698" y="448" fill="#ffffff">질의 가능</text><path class="line" d="M280 195 C 325 195, 325 195, 358 195"/><polygon points="358,188 370,195 358,202" fill="#0f2c59"/><path class="line" d="M590 195 C 635 195, 635 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M790 260 C 480 260, 480 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M280 195 C 325 195, 325 395, 358 395"/><polygon points="358,388 370,395 358,402" fill="#0f2c59"/><path class="line" d="M590 395 C 635 395, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/><path class="line" d="M280 395 C 480 395, 480 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>