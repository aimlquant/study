    <title id="title">셀리악병 GO 경로</title><desc id="desc">집계 점수 뒤의 실제 질병-유전자-과정 경로를 확인한다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">셀리악병 GO 경로</text><text class="t sub" x="48" y="86">집계 점수 뒤의 실제 질병-유전자-과정 경로를 확인한다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="78" y="168" fill="#ffffff">Celiac disease</text><text class="t body" x="78" y="200" fill="#ffffff">질병</text><text class="t body" x="78" y="224" fill="#ffffff">출발 노드</text><text class="t body" x="78" y="248" fill="#ffffff">조건 고정</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="388" y="168" fill="#0f172a">GWAS gene</text><text class="t body" x="388" y="200" fill="#334155">질병-유전자</text><text class="t body" x="388" y="224" fill="#334155">덜 편향된 근거</text><text class="t body" x="388" y="248" fill="#334155">연관 출처</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="698" y="168" fill="#0f172a">Interacting gene</text><text class="t body" x="698" y="200" fill="#334155">PPI 이웃</text><text class="t body" x="698" y="224" fill="#334155">상호작용</text><text class="t body" x="698" y="248" fill="#334155">조직 조건</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="78" y="368" fill="#0f172a">GO process</text><text class="t body" x="78" y="400" fill="#334155">당단백질 생합성</text><text class="t body" x="78" y="424" fill="#334155">양성 조절</text><text class="t body" x="78" y="448" fill="#334155">목표 과정</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="388" y="368" fill="#0f172a">Returned path</text><text class="t body" x="388" y="400" fill="#334155">집계 아님</text><text class="t body" x="388" y="424" fill="#334155">실제 경로</text><text class="t body" x="388" y="448" fill="#334155">검증 재료</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="698" y="368" fill="#0f172a">Research question</text><text class="t body" x="698" y="400" fill="#334155">왜 이 경로인가</text><text class="t body" x="698" y="424" fill="#334155">어떤 실험인가</text><text class="t body" x="698" y="448" fill="#334155">누가 검토하나</text><path class="line" d="M280 195 C 325 195, 325 195, 358 195"/><polygon points="358,188 370,195 358,202" fill="#0f2c59"/><path class="line" d="M590 195 C 635 195, 635 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M790 260 C 480 260, 480 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M280 395 C 325 395, 325 395, 358 395"/><polygon points="358,388 370,395 358,402" fill="#0f2c59"/><path class="line" d="M590 395 C 635 395, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>