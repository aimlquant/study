    <title id="title">단백질 발견 과정</title><desc id="desc">알려진 경로에서 후보 단백질과 관련 경로를 예측해 보고한다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">단백질 발견 과정</text><text class="t sub" x="48" y="86">알려진 경로에서 후보 단백질과 관련 경로를 예측해 보고한다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="78" y="168" fill="#0f172a">Known pathway</text><text class="t body" x="78" y="200" fill="#334155">검증된 질병 단백질</text><text class="t body" x="78" y="224" fill="#334155">기존 경로</text><text class="t body" x="78" y="248" fill="#334155">출발 지식</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="388" y="168" fill="#ffffff">Graph analysis</text><text class="t body" x="388" y="200" fill="#ffffff">PPI 구조</text><text class="t body" x="388" y="224" fill="#ffffff">질병 연관</text><text class="t body" x="388" y="248" fill="#ffffff">경로 탐색</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="698" y="168" fill="#0f172a">Predicted proteins</text><text class="t body" x="698" y="200" fill="#334155">관련 가능성</text><text class="t body" x="698" y="224" fill="#334155">후보 목록</text><text class="t body" x="698" y="248" fill="#334155">점수</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="78" y="368" fill="#0f172a">Related pathways</text><text class="t body" x="78" y="400" fill="#334155">기존 또는 새 경로</text><text class="t body" x="78" y="424" fill="#334155">설명 후보</text><text class="t body" x="78" y="448" fill="#334155">근거 경로</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="388" y="368" fill="#0f172a">Human review</text><text class="t body" x="388" y="400" fill="#334155">전문가 검토</text><text class="t body" x="388" y="424" fill="#334155">실험 설계</text><text class="t body" x="388" y="448" fill="#334155">승인·보류</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="698" y="368" fill="#0f172a">Updated KG</text><text class="t body" x="698" y="400" fill="#334155">검증된 사실만</text><text class="t body" x="698" y="424" fill="#334155">상태 분리</text><text class="t body" x="698" y="448" fill="#334155">이력 보존</text><path class="line" d="M280 195 C 325 195, 325 195, 358 195"/><polygon points="358,188 370,195 358,202" fill="#0f2c59"/><path class="line" d="M590 195 C 635 195, 635 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M480 260 C 325 260, 325 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M790 260 C 635 260, 635 330, 468 330"/><polygon points="468,323 480,330 468,337" fill="#0f2c59"/><path class="line" d="M280 395 C 325 395, 325 395, 358 395"/><polygon points="358,388 370,395 358,402" fill="#0f2c59"/><path class="line" d="M590 395 C 635 395, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>