<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
    <style>
      .t{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', NanumGothic, Inter, system-ui, sans-serif}
      .h{font-size:20px;font-weight:900}
      .m{font-size:15px;font-weight:800}
      .s{font-size:12px;font-weight:700}
      .xs{font-size:10px;font-weight:700}
      .dark{fill:#0f2c59;stroke:#0f2c59}
      .soft{fill:#e8eef8;stroke:#b7c7e3}
      .plain{fill:#fff;stroke:#cbd5e1}
      .green{fill:#e7f7ef;stroke:#99d8b6}
      .warn{fill:#fff7ed;stroke:#fdba74}
      .line{stroke:#0f2c59;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:7 7;stroke-linecap:round}
      .thin{stroke:#94a3b8;stroke-width:2;fill:none}
      .axis{stroke:#64748b;stroke-width:2;fill:none}
      .bar{fill:#0f2c59}
      .bar2{fill:#89a7d8}
      .badge{fill:#0f2c59}
      .badgeText{fill:#fff;font-size:12px;font-weight:900}
    </style>
    <title id="title">단백질 발견 과정</title><desc id="desc">알려진 경로에서 후보 단백질과 관련 경로를 예측해 보고한다</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f2c59"/></marker></defs><rect width="960" height="540" fill="#fafaf9"/><rect class="soft" x="55" y="165" width="185" height="126" rx="12"/><text class="t h" x="73" y="199" text-anchor="start" fill="#0f172a">Known pathway</text><text class="t s" x="73" y="227" text-anchor="start" fill="#475569">검증된 질병 단백질</text><text class="t s" x="73" y="247" text-anchor="start" fill="#475569">기존 경로</text><text class="t s" x="73" y="267" text-anchor="start" fill="#475569">출발 지식</text><rect class="dark" x="270" y="165" width="185" height="126" rx="12"/><text class="t h" x="288" y="199" text-anchor="start" fill="#fff">Graph analysis</text><text class="t s" x="288" y="227" text-anchor="start" fill="#e2e8f0">PPI 구조</text><text class="t s" x="288" y="247" text-anchor="start" fill="#e2e8f0">질병 연관</text><text class="t s" x="288" y="267" text-anchor="start" fill="#e2e8f0">경로 탐색</text><rect class="warn" x="485" y="165" width="185" height="126" rx="12"/><text class="t m" x="503" y="199" text-anchor="start" fill="#0f172a">Predicted proteins</text><text class="t s" x="503" y="227" text-anchor="start" fill="#475569">관련 가능성</text><text class="t s" x="503" y="247" text-anchor="start" fill="#475569">후보 목록</text><text class="t s" x="503" y="267" text-anchor="start" fill="#475569">점수</text><rect class="green" x="700" y="165" width="185" height="126" rx="12"/><text class="t h" x="718" y="199" text-anchor="start" fill="#0f172a">Human review</text><text class="t s" x="718" y="227" text-anchor="start" fill="#475569">전문가 검토</text><text class="t s" x="718" y="247" text-anchor="start" fill="#475569">실험 설계</text><text class="t s" x="718" y="267" text-anchor="start" fill="#475569">승인·보류</text><path class="line" d="M240 228 L270 228" marker-end="url(#arrow)"/><path class="line" d="M455 228 L485 228" marker-end="url(#arrow)"/><path class="line" d="M670 228 L700 228" marker-end="url(#arrow)"/><rect class="plain" x="485" y="345" width="185" height="108" rx="12"/><text class="t h" x="503" y="379" text-anchor="start" fill="#0f172a">Related pathways</text><text class="t s" x="503" y="407" text-anchor="start" fill="#475569">기존 또는 새 경로</text><text class="t s" x="503" y="427" text-anchor="start" fill="#475569">설명 후보</text><text class="t s" x="503" y="447" text-anchor="start" fill="#475569">근거 경로</text><path class="line" d="M578 291 L578 345" marker-end="url(#arrow)"/><rect class="soft" x="700" y="345" width="185" height="108" rx="12"/><text class="t h" x="718" y="379" text-anchor="start" fill="#0f172a">Updated KG</text><text class="t s" x="718" y="407" text-anchor="start" fill="#475569">검증된 사실만</text><text class="t s" x="718" y="427" text-anchor="start" fill="#475569">상태 분리</text><text class="t s" x="718" y="447" text-anchor="start" fill="#475569">이력 보존</text><path class="line" d="M792 291 L792 345" marker-end="url(#arrow)"/><text class="t m" x="588" y="492" text-anchor="middle" fill="#0f172a">후보와 사실을 분리하고, 전문가 검토를 통과한 정보만 KG에 업데이트한다</text></svg>