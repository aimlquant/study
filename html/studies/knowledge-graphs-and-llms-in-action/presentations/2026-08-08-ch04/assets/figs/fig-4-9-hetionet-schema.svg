    <title id="title">Hetionet 스키마</title><desc id="desc">이질적 노드와 관계가 약물 재활용 경로 질의를 가능하게 한다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">Hetionet 스키마</text><text class="t sub" x="48" y="86">이질적 노드와 관계가 약물 재활용 경로 질의를 가능하게 한다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="78" y="168" fill="#0f172a">Compound</text><text class="t body" x="78" y="200" fill="#334155">약물·화합물</text><text class="t body" x="78" y="224" fill="#334155">binds</text><text class="t body" x="78" y="248" fill="#334155">treats 후보</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="388" y="168" fill="#0f172a">Disease</text><text class="t body" x="388" y="200" fill="#334155">복합 질병</text><text class="t body" x="388" y="224" fill="#334155">증상</text><text class="t body" x="388" y="248" fill="#334155">분류</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="698" y="168" fill="#0f172a">Gene</text><text class="t body" x="698" y="200" fill="#334155">유전자</text><text class="t body" x="698" y="224" fill="#334155">단백질</text><text class="t body" x="698" y="248" fill="#334155">상호작용</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="78" y="368" fill="#0f172a">Anatomy</text><text class="t body" x="78" y="400" fill="#334155">조직 위치</text><text class="t body" x="78" y="424" fill="#334155">발현 맥락</text><text class="t body" x="78" y="448" fill="#334155">localizes</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="388" y="368" fill="#0f172a">GO Process</text><text class="t body" x="388" y="400" fill="#334155">생물학 과정</text><text class="t body" x="388" y="424" fill="#334155">기능·세포 구성</text><text class="t body" x="388" y="448" fill="#334155">pathway</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="698" y="368" fill="#ffffff">Metapath</text><text class="t body" x="698" y="400" fill="#ffffff">유형 시퀀스</text><text class="t body" x="698" y="424" fill="#ffffff">가능한 경로</text><text class="t body" x="698" y="448" fill="#ffffff">DWPC 계산</text><path class="line" d="M280 195 C 480 195, 480 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M790 260 C 635 260, 635 130, 468 130"/><polygon points="468,123 480,130 468,137" fill="#0f2c59"/><path class="line" d="M790 260 C 635 260, 635 330, 468 330"/><polygon points="468,323 480,330 468,337" fill="#0f2c59"/><path class="line" d="M280 395 C 480 395, 480 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M590 395 C 635 395, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/><path class="line" d="M590 195 C 635 195, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>