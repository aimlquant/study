      .badgeText{fill:#fff;font-size:12px;font-weight:900}
    </style>
    <title id="title">질병 경로 지표</title><desc id="desc">질병 경로는 내부 연결이 약하고 외부와 강하게 연결되는 경향을 보인다</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f2c59"/></marker></defs><rect width="960" height="540" fill="#fafaf9"/><rect class="plain" x="90" y="75" width="225" height="270" rx="14"/><text class="t h" x="202" y="132" text-anchor="middle" fill="#0f172a">Largest CC</text><path class="axis" d="M128 295 L280 295 M128 160 L128 295"/><rect class="bar2" x="144" y="280" width="18" height="15" rx="3"/><rect class="bar2" x="170" y="268" width="18" height="27" rx="3"/><rect class="bar" x="196" y="269" width="18" height="26" rx="3"/><rect class="bar2" x="222" y="273" width="18" height="22" rx="3"/><rect class="bar2" x="248" y="283" width="18" height="12" rx="3"/><text class="t m" x="202" y="325" text-anchor="middle" fill="#0f172a">median 21%</text><rect class="plain" x="380" y="75" width="225" height="270" rx="14"/><text class="t h" x="492" y="132" text-anchor="middle" fill="#0f172a">Density</text><path class="axis" d="M418 295 L570 295 M418 160 L418 295"/><rect class="bar2" x="434" y="280" width="18" height="15" rx="3"/><rect class="bar2" x="460" y="268" width="18" height="27" rx="3"/><rect class="bar" x="486" y="287" width="18" height="8" rx="3"/><rect class="bar2" x="512" y="273" width="18" height="22" rx="3"/><rect class="bar2" x="538" y="283" width="18" height="12" rx="3"/><text class="t m" x="492" y="325" text-anchor="middle" fill="#0f172a">median 0.07</text><rect class="plain" x="670" y="75" width="225" height="270" rx="14"/><text class="t h" x="782" y="132" text-anchor="middle" fill="#0f172a">Conductance</text><path class="axis" d="M708 295 L860 295 M708 160 L708 295"/><rect class="bar2" x="724" y="280" width="18" height="15" rx="3"/><rect class="bar2" x="750" y="268" width="18" height="27" rx="3"/><rect class="bar" x="776" y="175" width="18" height="120" rx="3"/><rect class="bar2" x="802" y="273" width="18" height="22" rx="3"/><rect class="bar2" x="828" y="283" width="18" height="12" rx="3"/><text class="t m" x="782" y="325" text-anchor="middle" fill="#0f172a">median 0.96</text><rect class="soft" x="70" y="375" width="250" height="96" rx="12"/><text class="t m" x="88" y="402" text-anchor="start" fill="#0f172a">Largest CC</text><text class="t xs" x="88" y="424" text-anchor="start" fill="#475569">가장 큰 내부 연결 덩어리</text><text class="t xs" x="88" y="441" text-anchor="start" fill="#475569">낮으면 경로가 여러 조각</text><rect class="soft" x="355" y="375" width="250" height="96" rx="12"/><text class="t m" x="373" y="402" text-anchor="start" fill="#0f172a">Density</text><text class="t xs" x="373" y="424" text-anchor="start" fill="#475569">가능한 내부 엣지 중</text><text class="t xs" x="373" y="441" text-anchor="start" fill="#475569">실제 PPI 엣지의 비율</text><rect class="soft" x="640" y="375" width="250" height="96" rx="12"/><text class="t m" x="658" y="402" text-anchor="start" fill="#0f172a">Conductance</text><text class="t xs" x="658" y="424" text-anchor="start" fill="#475569">바깥으로 나가는 경계 엣지</text><text class="t xs" x="658" y="441" text-anchor="start" fill="#475569">높으면 독립 커뮤니티가 아님</text></svg>