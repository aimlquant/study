<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
    <style>
      .t{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', NanumGothic, Inter, system-ui, sans-serif;fill:#0f172a}
      .title{font-size:30px;font-weight:900}
      .sub{font-size:15px;fill:#475569;font-weight:700}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .accent{fill:#0f2c59}
      .soft{fill:#e8eef8}
      .muted{fill:#f8fafc}
      .label{font-size:19px;font-weight:900}
      .body{font-size:14px;fill:#334155;font-weight:700}
      .small{font-size:12px;fill:#475569;font-weight:700}
      .line{stroke:#0f2c59;stroke-width:3;fill:none}
    </style>
    <title id="title">질병 경로 지표</title><desc id="desc">질병 경로는 내부 연결이 약하고 외부와 강하게 연결되는 경향을 보인다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">질병 경로 지표</text><text class="t sub" x="48" y="86">질병 경로는 내부 연결이 약하고 외부와 강하게 연결되는 경향을 보인다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="78" y="168" fill="#0f172a">Largest CC</text><text class="t body" x="78" y="200" fill="#334155">중앙값 21%</text><text class="t body" x="78" y="224" fill="#334155">조각난 경로</text><text class="t body" x="78" y="248" fill="#334155">한 덩어리 아님</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="388" y="168" fill="#0f172a">Density</text><text class="t body" x="388" y="200" fill="#334155">중앙값 0.07</text><text class="t body" x="388" y="224" fill="#334155">내부 엣지 적음</text><text class="t body" x="388" y="248" fill="#334155">PPI 전체보다 높음</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="698" y="168" fill="#0f172a">Conductance</text><text class="t body" x="698" y="200" fill="#334155">중앙값 0.96</text><text class="t body" x="698" y="224" fill="#334155">바깥 연결 많음</text><text class="t body" x="698" y="248" fill="#334155">독립성 낮음</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="78" y="368" fill="#ffffff">Interpretation</text><text class="t body" x="78" y="400" fill="#ffffff">질병 단백질은</text><text class="t body" x="78" y="424" fill="#ffffff">여러 기능 모듈에</text><text class="t body" x="78" y="448" fill="#ffffff">흩어질 수 있음</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="388" y="368" fill="#0f172a">Question</text><text class="t body" x="388" y="400" fill="#334155">커뮤니티인가?</text><text class="t body" x="388" y="424" fill="#334155">경로인가?</text><text class="t body" x="388" y="448" fill="#334155">대상 정의 확인</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="698" y="368" fill="#0f172a">Next</text><text class="t body" x="698" y="400" fill="#334155">Louvain과 비교</text><text class="t body" x="698" y="424" fill="#334155">같은 지표 적용</text><text class="t body" x="698" y="448" fill="#334155">의미 차이 확인</text><path class="line" d="M170 260 C 170 260, 170 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M480 260 C 325 260, 325 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M790 260 C 480 260, 480 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M280 395 C 325 395, 325 395, 358 395"/><polygon points="358,388 370,395 358,402" fill="#0f2c59"/><path class="line" d="M590 395 C 635 395, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>