    </style>
    <title id="title">오믹스 세 층위</title><desc id="desc">유전체에서 전사체를 거쳐 단백질체로 이어지는 데이터 층위</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f2c59"/></marker></defs><rect width="960" height="540" fill="#fafaf9"/><circle class="soft" cx="130" cy="190" r="74"/><text class="t h" x="130" y="184" text-anchor="middle" fill="#0f172a">Genome</text><text class="t s" x="130" y="210" text-anchor="middle" fill="#64748b">DNA 전체</text><circle class="plain" cx="430" cy="190" r="74"/><text class="t h" x="430" y="184" text-anchor="middle" fill="#0f172a">Transcriptome</text><text class="t s" x="430" y="210" text-anchor="middle" fill="#64748b">RNA 발현</text><circle class="plain" cx="730" cy="190" r="74"/><text class="t h" x="730" y="184" text-anchor="middle" fill="#0f172a">Proteome</text><text class="t s" x="730" y="210" text-anchor="middle" fill="#64748b">기능 단백질</text><path class="line" d="M205 190 L355 190" marker-end="url(#arrow)"/><path class="line" d="M505 190 L655 190" marker-end="url(#arrow)"/><text class="t s" x="280" y="170" text-anchor="middle" fill="#64748b">전사</text><text class="t s" x="580" y="170" text-anchor="middle" fill="#64748b">번역</text><path class="dash" d="M130 268 C230 380, 650 380, 730 268"/><text class="t m" x="430" y="382" text-anchor="middle" fill="#0f172a">데이터 파일은 층위별로 분리된다</text><rect class="dark" x="250" y="414" width="360" height="98" rx="12"/><text class="t m" x="268" y="441" text-anchor="start" fill="#fff">KG 통합</text><text class="t xs" x="268" y="463" text-anchor="start" fill="#e2e8f0">식별자 조정</text><text class="t xs" x="268" y="480" text-anchor="start" fill="#e2e8f0">조건·출처 보존</text><text class="t xs" x="268" y="497" text-anchor="start" fill="#e2e8f0">층위 간 관계</text></svg>