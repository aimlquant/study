<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
    <style>
      .t{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', NanumGothic, Inter, system-ui, sans-serif;fill:#0f172a}
      .title{font-size:30px;font-weight:900}
      .sub{font-size:15px;fill:#475569;font-weight:700}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .accent{fill:#0f2c59}
      .soft{fill:#e8eef8}
      .muted{fill:#f8fafc}
      .label{font-size:19px;font-weight:900}
      .body{font-size:14px;fill:#334155;font-weight:700}
      .small{font-size:12px;fill:#475569;font-weight:700}
      .line{stroke:#0f2c59;stroke-width:3;fill:none}
    </style>
    <title id="title">오믹스 세 층위</title><desc id="desc">유전체에서 전사체를 거쳐 단백질체로 이어지는 데이터 층위</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">오믹스 세 층위</text><text class="t sub" x="48" y="86">유전체에서 전사체를 거쳐 단백질체로 이어지는 데이터 층위</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="78" y="168" fill="#0f172a">Genome</text><text class="t body" x="78" y="200" fill="#334155">DNA 전체</text><text class="t body" x="78" y="224" fill="#334155">변이·유전자</text><text class="t body" x="78" y="248" fill="#334155">상대적으로 안정</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="388" y="168" fill="#0f172a">Transcriptome</text><text class="t body" x="388" y="200" fill="#334155">RNA 발현</text><text class="t body" x="388" y="224" fill="#334155">상황 의존</text><text class="t body" x="388" y="248" fill="#334155">조직·시간 맥락</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="698" y="168" fill="#0f172a">Proteome</text><text class="t body" x="698" y="200" fill="#334155">기능 단백질</text><text class="t body" x="698" y="224" fill="#334155">상호작용</text><text class="t body" x="698" y="248" fill="#334155">세포 활동</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="78" y="368" fill="#0f172a">전사</text><text class="t body" x="78" y="400" fill="#334155">DNA → RNA</text><text class="t body" x="78" y="424" fill="#334155">발현량 관찰</text><text class="t body" x="78" y="448" fill="#334155">조건 필요</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="388" y="368" fill="#0f172a">번역</text><text class="t body" x="388" y="400" fill="#334155">RNA → Protein</text><text class="t body" x="388" y="424" fill="#334155">기능 단위 생성</text><text class="t body" x="388" y="448" fill="#334155">PPI로 확장</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="698" y="368" fill="#ffffff">KG 통합</text><text class="t body" x="698" y="400" fill="#ffffff">식별자 조정</text><text class="t body" x="698" y="424" fill="#ffffff">층위 간 관계</text><text class="t body" x="698" y="448" fill="#ffffff">질문별 부분 그래프</text><path class="line" d="M280 195 C 325 195, 325 195, 358 195"/><polygon points="358,188 370,195 358,202" fill="#0f2c59"/><path class="line" d="M590 195 C 635 195, 635 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M170 260 C 170 260, 170 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M480 260 C 480 260, 480 330, 468 330"/><polygon points="468,323 480,330 468,337" fill="#0f2c59"/><path class="line" d="M790 260 C 790 260, 790 330, 778 330"/><polygon points="778,323 790,330 778,337" fill="#0f2c59"/></svg>