    <title id="title">셀리악병 주변 그래프</title><desc id="desc">한 질병에서 관련 유전자와 PPI 이웃으로 확장되는 탐색 장면</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">셀리악병 주변 그래프</text><text class="t sub" x="48" y="86">한 질병에서 관련 유전자와 PPI 이웃으로 확장되는 탐색 장면</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="78" y="168" fill="#ffffff">Celiac disease</text><text class="t body" x="78" y="200" fill="#ffffff">질병 노드</text><text class="t body" x="78" y="224" fill="#ffffff">예시 질병</text><text class="t body" x="78" y="248" fill="#ffffff">연관 출발점</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="388" y="168" fill="#0f172a">Known genes</text><text class="t body" x="388" y="200" fill="#334155">관련 유전자</text><text class="t body" x="388" y="224" fill="#334155">48개 후보</text><text class="t body" x="388" y="248" fill="#334155">근거 출처</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="698" y="168" fill="#0f172a">PPI neighbors</text><text class="t body" x="698" y="200" fill="#334155">상호작용 이웃</text><text class="t body" x="698" y="224" fill="#334155">주변 단백질</text><text class="t body" x="698" y="248" fill="#334155">확장 후보</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="78" y="368" fill="#0f172a">Pathway view</text><text class="t body" x="78" y="400" fill="#334155">부분 그래프</text><text class="t body" x="78" y="424" fill="#334155">연결·단절</text><text class="t body" x="78" y="448" fill="#334155">구조 확인</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="388" y="368" fill="#0f172a">Candidate</text><text class="t body" x="388" y="400" fill="#334155">새 관련 단백질</text><text class="t body" x="388" y="424" fill="#334155">가설 상태</text><text class="t body" x="388" y="448" fill="#334155">검증 필요</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="698" y="368" fill="#0f172a">Evidence trail</text><text class="t body" x="698" y="400" fill="#334155">원 질의</text><text class="t body" x="698" y="424" fill="#334155">경로</text><text class="t body" x="698" y="448" fill="#334155">출처</text><path class="line" d="M280 195 C 325 195, 325 195, 358 195"/><polygon points="358,188 370,195 358,202" fill="#0f2c59"/><path class="line" d="M590 195 C 635 195, 635 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M480 260 C 325 260, 325 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M790 260 C 635 260, 635 330, 468 330"/><polygon points="468,323 480,330 468,337" fill="#0f2c59"/><path class="line" d="M590 395 C 635 395, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>