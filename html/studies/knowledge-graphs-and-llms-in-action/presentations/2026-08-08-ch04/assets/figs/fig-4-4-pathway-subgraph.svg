    <title id="title">질병 경로 부분 그래프</title><desc id="desc">질병 관련 단백질 집합 V_d가 PPI 네트워크 안에서 H_d를 이룬다</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f2c59"/></marker></defs><rect width="960" height="540" fill="#fafaf9"/><rect class="plain" x="70" y="75" width="820" height="390" rx="18"/><text class="t h" x="95" y="110" text-anchor="start" fill="#0f172a">PPI network G = (V, E)</text><path d="M245 125 C380 82, 560 110, 590 250 C560 382, 350 385, 245 320 C165 270, 170 165, 245 125Z" fill="#e8eef8" stroke="#0f2c59" stroke-width="3"/><path class="thin" d="M300 170 L430 155"/><path class="thin" d="M430 155 L540 220"/><path class="thin" d="M300 170 L335 310"/><path class="thin" d="M335 310 L500 320"/><path class="thin" d="M540 220 L500 320"/><path class="thin" d="M500 320 L690 230"/><path class="thin" d="M690 230 L720 345"/><path class="thin" d="M540 220 L690 230"/><circle class="dark" cx="300" cy="170" r="20"/><circle class="dark" cx="430" cy="155" r="20"/><circle class="dark" cx="540" cy="220" r="20"/><circle class="dark" cx="335" cy="310" r="20"/><circle class="dark" cx="500" cy="320" r="20"/><circle class="plain" cx="690" cy="230" r="20"/><circle class="plain" cx="720" cy="345" r="20"/><rect class="warn" x="82" y="215" width="150" height="96" rx="12"/><text class="t m" x="100" y="242" text-anchor="start" fill="#0f172a">Disease d</text><text class="t xs" x="100" y="264" text-anchor="start" fill="#475569">ASSOCIATES</text><text class="t xs" x="100" y="281" text-anchor="start" fill="#475569">WITH proteins</text><path class="line" d="M232 250 L282 175" marker-end="url(#arrow)"/><path class="line" d="M232 276 L315 310" marker-end="url(#arrow)"/><rect class="green" x="275" y="382" width="330" height="78" rx="12"/><text class="t m" x="293" y="409" text-anchor="start" fill="#0f172a">H_d</text><text class="t xs" x="293" y="431" text-anchor="start" fill="#475569">질