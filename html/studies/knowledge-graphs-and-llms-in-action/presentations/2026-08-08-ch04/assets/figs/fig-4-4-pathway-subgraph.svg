    <title id="title">질병 경로 부분 그래프</title><desc id="desc">질병 관련 단백질 집합 V_d가 PPI 네트워크 안에서 H_d를 이룬다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">질병 경로 부분 그래프</text><text class="t sub" x="48" y="86">질병 관련 단백질 집합 V_d가 PPI 네트워크 안에서 H_d를 이룬다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="78" y="168" fill="#ffffff">Disease d</text><text class="t body" x="78" y="200" fill="#ffffff">질병 노드</text><text class="t body" x="78" y="224" fill="#ffffff">ASSOCIATED_WITH</text><text class="t body" x="78" y="248" fill="#ffffff">출발 집합</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="388" y="168" fill="#0f172a">V_d</text><text class="t body" x="388" y="200" fill="#334155">관련 단백질</text><text class="t body" x="388" y="224" fill="#334155">질병 단백질</text><text class="t body" x="388" y="248" fill="#334155">노드 집합</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="698" y="168" fill="#0f172a">E_d</text><text class="t body" x="698" y="200" fill="#334155">집합 내부 PPI</text><text class="t body" x="698" y="224" fill="#334155">단백질-단백질</text><text class="t body" x="698" y="248" fill="#334155">부분 그래프</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="78" y="368" fill="#0f172a">PPI G</text><text class="t body" x="78" y="400" fill="#334155">전체 단백질</text><text class="t body" x="78" y="424" fill="#334155">전체 상호작용</text><text class="t body" x="78" y="448" fill="#334155">배경 그래프</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="388" y="368" fill="#0f172a">Boundary B_d</text><text class="t body" x="388" y="400" fill="#334155">밖으로 나가는 엣지</text><text class="t body" x="388" y="424" fill="#334155">전도도 재료</text><text class="t body" x="388" y="448" fill="#334155">독립성 판단</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="698" y="368" fill="#0f172a">H_d</text><text class="t body" x="698" y="400" fill="#334155">질병 경로</text><text class="t body" x="698" y="424" fill="#334155">분석 대상</text><text class="t body" x="698" y="448" fill="#334155">지표 계산</text><path class="line" d="M280 195 C 325 195, 325 195, 358 195"/><polygon points="358,188 370,195 358,202" fill="#0f2c59"/><path class="line" d="M590 195 C 635 195, 635 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M280 395 C 480 395, 480 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M790 260 C 790 260, 790 330, 778 330"/><polygon points="778,323 790,330 778,337" fill="#0f2c59"/><path class="line" d="M480 260 C 480 260, 480 330, 468 330"/><polygon points="468,323 480,330 468,337" fill="#0f2c59"/></svg>