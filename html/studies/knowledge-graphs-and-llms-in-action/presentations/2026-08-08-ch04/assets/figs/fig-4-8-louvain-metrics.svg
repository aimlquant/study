    <title id="title">Louvain 클러스터 지표</title><desc id="desc">커뮤니티 탐지 결과는 질병 경로보다 내부 연결이 강한 대상으로 읽힌다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">Louvain 클러스터 지표</text><text class="t sub" x="48" y="86">커뮤니티 탐지 결과는 질병 경로보다 내부 연결이 강한 대상으로 읽힌다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="78" y="168" fill="#0f172a">Largest CC</text><text class="t body" x="78" y="200" fill="#334155">대부분 한 덩어리</text><text class="t body" x="78" y="224" fill="#334155">커뮤니티 내부</text><text class="t body" x="78" y="248" fill="#334155">연결성 높음</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="388" y="168" fill="#0f172a">Density</text><text class="t body" x="388" y="200" fill="#334155">구조 차이에 좌우</text><text class="t body" x="388" y="224" fill="#334155">클러스터별 변동</text><text class="t body" x="388" y="248" fill="#334155">내부 비교</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="698" y="168" fill="#0f172a">Conductance</text><text class="t body" x="698" y="200" fill="#334155">더 낮아짐</text><text class="t body" x="698" y="224" fill="#334155">외부와 분리</text><text class="t body" x="698" y="248" fill="#334155">커뮤니티 신호</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="78" y="368" fill="#ffffff">Contrast</text><text class="t body" x="78" y="400" fill="#ffffff">질병 경로와</text><text class="t body" x="78" y="424" fill="#ffffff">같은 대상 아님</text><text class="t body" x="78" y="448" fill="#ffffff">해석 분리</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="388" y="368" fill="#0f172a">Risk</text><text class="t body" x="388" y="400" fill="#334155">군집 이름을</text><text class="t body" x="388" y="424" fill="#334155">질병 원인처럼</text><text class="t body" x="388" y="448" fill="#334155">과잉 해석 금지</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="698" y="368" fill="#0f172a">Use</text><text class="t body" x="698" y="400" fill="#334155">전체 구조 점검</text><text class="t body" x="698" y="424" fill="#334155">대표 단백질 탐색</text><text class="t body" x="698" y="448" fill="#334155">도메인 검토</text><path class="line" d="M170 260 C 170 260, 170 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M480 260 C 325 260, 325 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M790 260 C 480 260, 480 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M280 395 C 325 395, 325 395, 358 395"/><polygon points="358,388 370,395 358,402" fill="#0f2c59"/><path class="line" d="M280 395 C 480 395, 480 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>