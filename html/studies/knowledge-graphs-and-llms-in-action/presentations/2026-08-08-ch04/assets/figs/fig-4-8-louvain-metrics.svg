<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
    <style>
      .t{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', NanumGothic, Inter, system-ui, sans-serif;fill:#0f172a}
      .title{font-size:30px;font-weight:900}
      .sub{font-size:15px;fill:#475569;font-weight:700}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .accent{fill:#0f2c59}
      .soft{fill:#e8eef8}
      .muted{fill:#f8fafc}
      .label{font-size:19px;font-weight:900}
