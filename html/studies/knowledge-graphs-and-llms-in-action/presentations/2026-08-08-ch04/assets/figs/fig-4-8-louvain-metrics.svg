    <title id="title">Louvain 클러스터 지표</title><desc id="desc">커뮤니티 탐지 결과는 질병 경로보다 내부 연결이 강한 대상으로 읽힌다</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f2c59"/></marker></defs><rect width="960" height="540" fill="#fafaf9"/><rect class="plain" x="90" y="75" width="225" height="270" rx="14"/><text class="t h" x="202" y="132" text-anchor="middle" fill="#0f172a">Largest CC</text><path class="axis" d="M128 295 L280 295 M128 160 L128 295"/><rect class="bar2" x="144" y="285" width="18" height="10" rx="3"/><rect class="bar2" x="170" y="270" width="18" height="25" rx="3"/><rect class="bar" x="196" y="185" width="18" height="110" rx="3"/><rect class="bar2" x="222" y="240" width="18" height="55" rx="3"/><rect class="bar2" x="248" y="258" width="18" height="37" rx="3"/><text class="t m" x="202" y="325" text-anchor="middle" fill="#0f172a">mostly connected</text><rect class="plain" x="380" y="75" width="225" height="270" rx="14"/><text class="t h" x="492" y="132" text-anchor="middle" fill="#0f172a">Density</text><path class="axis" d="M418 295 L570 295 M418 160 L418 295"/><rect class="bar2" x="434" y="285" width="18" height="10" rx="3"/><rect class="bar2" x="460" y="270" width="18" height="25" rx="3"/><rect class="bar" x="486" y="253" width="18" height="42" rx="3"/><rect class="bar2" x="512" y="240" width="18" height="55" rx="3"/><rect class="bar2" x="538" y="258" width="18" height="37" rx="3"/><text class="t m" x="492" y="325" text-anchor="middle" fill="#0f172a">cluster-specific</text><rect class="plain" x="670" y="75" width="225" height="270" rx="14"/><text class="t h" x="782" y="132" text-anchor="middle" fill="#0f172a">Conductance</text><path class="axis" d="M708 295 L860 295 M708 160 L708 295"/><rect class="bar2" x="724" y="285" width="18" height="10" rx="3"/><rect class="bar2" x="750" y="270" width="18" height="25" rx="3"/><rect class="bar" x="776" y="260" width="18" height="35" rx="3"/><rect class="bar2" x="802" y="240" width="18" height="55" rx="3"/><rect class="bar2" x="828" y="258" width="18" height="37" rx="3"/><text class="t m" x="782" y="325" text-anchor="middle" fill="#0f172a">lower outside links</text><rect class="dark" x="290" y="390" width="380" height="80" rx="12"/><text class="t m" x="308" y="417" text-anchor="start" fill="#fff">해석 경계</text><text class="t xs" x="308" y="439" text-anchor="start" fill="#e2e8f0">질병 경로와 Louvain 커뮤니티는 대상 정의가 다르다</text></svg>