    <title id="title">생명의학 KG 응용 지도</title><desc id="desc">목표는 다르지만 질병·유전자·단백질·약물 지식이 반복된다</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f2c59"/></marker></defs><rect width="960" height="540" fill="#fafaf9"/><circle class="dark" cx="480" cy="270" r="92"/><text class="t badgeText" x="480" y="250" text-anchor="middle" fill="#fff">공통</text><text class="t badgeText" x="480" y="275" text-anchor="middle" fill="#fff">Biomedical KG</text><text class="t badgeText" x="480" y="300" text-anchor="middle" fill="#fff">Disease · Gene · Protein · Drug</text><rect class="soft" x="120" y="80" width="220" height="112" rx="12"/><text class="t h" x="138" y="114" text-anchor="start" fill="#0f172a">약물 재활용</text><text class="t s" x="138" y="142" text-anchor="start" fill="#475569">기존 약물</text><text class="t s" x="138" y="162" text-anchor="start" fill="#475569">새 질병 후보</text><text class="t s" x="138" y="182" text-anchor="start" fill="#475569">비용·시간 절감</text><path class="line" d="M400 225 L340 136" marker-end="url(#arrow)"/><rect class="plain" x="620" y="80" width="220" height="112" rx="12"/><text class="t h" x="638" y="114" text-anchor="start" fill="#0f172a">진단 지원</text><text class="t s" x="638" y="142" text-anchor="start" fill="#475569">증상·질병</text><text class="t s" x="638" y="162" text-anchor="start" fill="#475569">환자 데이터</text><text class="t s" x="638" y="182" text-anchor="start" fill="#475569">후보 설명</text><path class="line" d="M560 225 L620 136" marker-end="url(#arrow)"/><rect class="soft" x="110" y="340" width="220" height="112" rx="12"/><text class="t h" x="128" y="374" text-anchor="start" fill="#0f172a">기능 규명</text><text class="t s" x="128" y="402" text-anchor="start" fill="#475569">단백질 역할</text><text class="t s" x="128" y="422" text-anchor="start" fill="#475569">경로 분석</text><text class="t s" x="128" y="442" text-anchor="start" fill="#475569">실험 후보</text><path class=