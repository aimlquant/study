    <title id="title">생명의학 KG 응용 지도</title><desc id="desc">목표는 다르지만 질병·유전자·단백질·약물 지식이 반복된다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">생명의학 KG 응용 지도</text><text class="t sub" x="48" y="86">목표는 다르지만 질병·유전자·단백질·약물 지식이 반복된다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="78" y="168" fill="#0f172a">약물 재활용</text><text class="t body" x="78" y="200" fill="#334155">기존 약물</text><text class="t body" x="78" y="224" fill="#334155">새 질병 후보</text><text class="t body" x="78" y="248" fill="#334155">비용·시간 절감</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="388" y="168" fill="#0f172a">진단 지원</text><text class="t body" x="388" y="200" fill="#334155">증상·질병</text><text class="t body" x="388" y="224" fill="#334155">환자 데이터</text><text class="t body" x="388" y="248" fill="#334155">후보 설명</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="698" y="168" fill="#0f172a">기능 규명</text><text class="t body" x="698" y="200" fill="#334155">단백질 역할</text><text class="t body" x="698" y="224" fill="#334155">경로 분석</text><text class="t body" x="698" y="248" fill="#334155">실험 후보</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="78" y="368" fill="#0f172a">안전 추천</text><text class="t body" x="78" y="400" fill="#334155">약물 상호작용</text><text class="t body" x="78" y="424" fill="#334155">부작용</text><text class="t body" x="78" y="448" fill="#334155">환자 위험</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="388" y="368" fill="#ffffff">공통 노드</text><text class="t body" x="388" y="400" fill="#ffffff">Disease</text><text class="t body" x="388" y="424" fill="#ffffff">Gene / Protein</text><text class="t body" x="388" y="448" fill="#ffffff">Drug</text><rect class=