    <title id="title">식별자 조정</title><desc id="desc">여러 데이터베이스의 질병 이름과 코드를 공통 UMLS 축으로 맞춘다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">식별자 조정</text><text class="t sub" x="48" y="86">여러 데이터베이스의 질병 이름과 코드를 공통 UMLS 축으로 맞춘다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="78" y="168" fill="#0f172a">Source A</text><text class="t body" x="78" y="200" fill="#334155">질병명</text><text class="t body" x="78" y="224" fill="#334155">로컬 코드</text><text class="t body" x="78" y="248" fill="#334155">부분 스키마</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="388" y="168" fill="#0f172a">Source B</text><text class="t body" x="388" y="200" fill="#334155">다른 명칭</text><text class="t body" x="388" y="224" fill="#334155">다른 ID</text><text class="t body" x="388" y="248" fill="#334155">다른 범주</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="698" y="168" fill="#ffffff">UMLS</text><text class="t body" x="698" y="200" fill="#ffffff">공통 개념</text><text class="t body" x="698" y="224" fill="#ffffff">동의어 연결</text><text class="t body" x="698" y="248" fill="#ffffff">통합 키</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="78" y="368" fill="#0f172a">Schema align</text><text class="t body" x="78" y="400" fill="#334155">노드 타입</text><text class="t body" x="78" y="424" fill="#334155">관계 타입</text><text class="t body" x="78" y="448" fill="#334155">속성 의미</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="388" y="368" fill="#0f172a">Quality check</text><text class="t body" x="388" y="400" fill="#334155">중복·누락</text><text class="t body" x="388" y="424" fill="#334155">충돌 해결</text><text class="t body" x="388" y="448" fill="#334155">출처 보존</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="698" y="368" fill="#0f172a">Holistic KG</text><text class="t body" x="698" y="400" fill="#334155">같은 질병</text><text class="t body" x="698" y="424" fill="#334155">같은 노드</text><text class="t body" x="698" y="448" fill="#334155">여러 근거</text><path class="line" d="M280 195 C 480 195, 480 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M590 195 C 635 195, 635 195, 668 195"/><polygon points="668,188 680,195 668,202" fill="#0f2c59"/><path class="line" d="M790 260 C 480 260, 480 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M280 395 C 325 395, 325 395, 358 395"/><polygon points="358,388 370,395 358,402" fill="#0f2c59"/><path class="line" d="M590 395 C 635 395, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>