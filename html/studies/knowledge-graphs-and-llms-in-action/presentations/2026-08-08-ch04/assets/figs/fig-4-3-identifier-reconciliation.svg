<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
    <style>
      .t{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', NanumGothic, Inter, system-ui, sans-serif}
      .h{font-size:20px;font-weight:900}
      .m{font-size:15px;font-weight:800}
      .s{font-size:12px;font-weight:700}
      .xs{font-size:10px;font-weight:700}
      .dark{fill:#0f2c59;stroke:#0f2c59}
      .soft{fill:#e8eef8;stroke:#b7c7e3}
      .plain{fill:#fff;stroke:#cbd5e1}
      .green{fill:#e7f7ef;stroke:#99d8b6}
      .warn{fill:#fff7ed;stroke:#fdba74}
      .line{stroke:#0f2c59;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:7 7;stroke-linecap:round}
      .thin{stroke:#94a3b8;stroke-width:2;fill:none}
      .axis{stroke:#64748b;stroke-width:2;fill:none}
      .bar{fill:#0f2c59}
      .bar2{fill:#89a7d8}
      .badge{fill:#0f2c59}
      .badgeText{fill:#fff;font-size:12px;font-weight:900}
    </style>
    <title id="title">식별자 조정</title><desc id="desc">여러 데이터베이스의 질병 이름과 코드를 공통 UMLS 축으로 맞춘다</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f2c59"/></marker></defs><rect width="960" height="540" fill="#fafaf9"/><rect class="plain" x="70" y="80" width="210" height="105" rx="12"/><text class="t m" x="88" y="107" text-anchor="start" fill="#0f172a">Source A</text><text class="t xs" x="88" y="129" text-anchor="start" fill="#475569">질병명</text><text class="t xs" x="88" y="146" text-anchor="start" fill="#475569">로컬 코드</text><text class="t xs" x="88" y="163" text-anchor="start" fill="#475569">부분 스키마</text><rect class="plain" x="70" y="355" width="210" height="105" rx="12"/><text class="t m" x="88" y="382" text-anchor="start" fill="#0f172a">Source B</text><text class="t xs" x="88" y="404" text-anchor="start" fill="#475569">다른 명칭</text><text class="t xs" x="88" y="421" text-anchor="start" fill="#475569">다른 ID</text><text class="t xs" x="88" y="438" text-anchor="start" fill="#475569">다른 범주</text><rect class="dark" x="375" y="205" width="210" height="120" rx="12"/><text class="t h" x="393" y="239" text-anchor="start" fill="#fff">UMLS</text><text class="t s" x="393" y="267" text-anchor="start" fill="#e2e8f0">공통 개념</text><text class="t s" x="393" y="287" text-anchor="start" fill="#e2e8f0">동의어 연결</text><text class="t s" x="393" y="307" text-anchor="start" fill="#e2e8f0">통합 키</text><rect class="soft" x="635" y="88" width="240" height="108" rx="12"/><text class="t h" x="653" y="122" text-anchor="start" fill="#0f172a">Schema align</text><text class="t s" x="653" y="150" text-anchor="start" fill="#475569">노드·관계</text><text class="t s" x="653" y="170" text-anchor="start" fill="#475569">속성 의미</text><text class="t s" x="653" y="190" text-anchor="start" fill="#475569">타입 계약</text><rect class="warn" x="635" y="230" width="240" height="116" rx="12"/><text class="t h" x="653" y="264" text-anchor="start" fill="#0f172a">품질 점검 게이트</text><text class="t s" x="653" y="292" text-anchor="start" fill="#475569">1질병=1노드 확인</text><text class="t s" x="653" y="312" text-anchor="start" fill="#475569">동명이의어 충돌 분리</text><text class="t s" x="653" y="332" text-anchor="start" fill="#475569">누락·출처 보존</text><rect class="green" x="635" y="382" width="240" height="105" rx="12"/><text class="t m" x="653" y="409" text-anchor="start" fill="#0f172a">Holistic KG</text><text class="t xs" x="653" y="431" text-anchor="start" fill="#475569">같은 질병</text><text class="t xs" x="653" y="448" text-anchor="start" fill="#475569">같은 노드</text><text class="t xs" x="653" y="465" text-anchor="start" fill="#475569">여러 근거</text><path class="line" d="M280 132 L375 245" marker-end="url(#arrow)"/><path class="line" d="M280 407 L375 285" marker-end="url(#arrow)"/><path class="line" d="M585 250 L635 142" marker-end="url(#arrow)"/><path class="line" d="M585 285 L635 288" marker-end="url(#arrow)"/><path class="line" d="M755 196 L755 230" marker-end="url(#arrow)"/><path class="line" d="M755 346 L755 382" marker-end="url(#arrow)"/><text class="t s" x="480" y="520" text-anchor="middle" fill="#64748b">품질 점검의 의미: 같은 질병이 쪼개지거나 서로 다른 질병이 합쳐지는 오류를 통합 전에 막는다</text></svg>