<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
    <style>
      .t{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', NanumGothic, Inter, system-ui, sans-serif}
      .h{font-size:20px;font-weight:900}
      .m{font-size:15px;font-weight:800}
      .s{font-size:12px;font-weight:700}
      .xs{font-size:10px;font-weight:700}
