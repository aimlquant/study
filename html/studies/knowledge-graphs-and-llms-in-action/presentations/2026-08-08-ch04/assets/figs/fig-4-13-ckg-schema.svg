    <title id="title">임상 지식 그래프</title><desc id="desc">CKG는 환자 맥락과 생명의학 지식을 통합해 질의 가능한 스키마를 만든다</desc><rect width="960" height="540" rx="18" fill="#fafaf9"/><text class="t title" x="48" y="58">임상 지식 그래프</text><text class="t sub" x="48" y="86">CKG는 환자 맥락과 생명의학 지식을 통합해 질의 가능한 스키마를 만든다</text><rect class="box" x="60" y="130" width="220" height="130" rx="10" fill="#fff7ed"/><text class="t label" x="78" y="168" fill="#0f172a">Patient context</text><text class="t body" x="78" y="200" fill="#334155">EHR</text><text class="t body" x="78" y="224" fill="#334155">진단·치료</text><text class="t body" x="78" y="248" fill="#334155">여정</text><rect class="box" x="370" y="130" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="388" y="168" fill="#0f172a">Omics</text><text class="t body" x="388" y="200" fill="#334155">단백질체</text><text class="t body" x="388" y="224" fill="#334155">유전체</text><text class="t body" x="388" y="248" fill="#334155">전사체</text><rect class="box" x="680" y="130" width="220" height="130" rx="10" fill="#ffffff"/><text class="t label" x="698" y="168" fill="#0f172a">Biomedical KG</text><text class="t body" x="698" y="200" fill="#334155">질병·유전자</text><text class="t body" x="698" y="224" fill="#334155">약물·경로</text><text class="t body" x="698" y="248" fill="#334155">문헌 지식</text><rect class="box" x="60" y="330" width="220" height="130" rx="10" fill="#0f2c59"/><text class="t label" x="78" y="368" fill="#ffffff">CKG schema</text><text class="t body" x="78" y="400" fill="#ffffff">33 labels</text><text class="t body" x="78" y="424" fill="#ffffff">51 relations</text><text class="t body" x="78" y="448" fill="#ffffff">조화·통합</text><rect class="box" x="370" y="330" width="220" height="130" rx="10" fill="#e7f7ef"/><text class="t label" x="388" y="368" fill="#0f172a">Query result</text><text class="t body" x="388" y="400" fill="#334155">단백질-질병</text><text class="t body" x="388" y="424" fill="#334155">score</text><text class="t body" x="388" y="448" fill="#334155">source</text><rect class="box" x="680" y="330" width="220" height="130" rx="10" fill="#e8eef8"/><text class="t label" x="698" y="368" fill="#0f172a">Decision support</text><text class="t body" x="698" y="400" fill="#334155">층화</text><text class="t body" x="698" y="424" fill="#334155">안전성</text><text class="t body" x="698" y="448" fill="#334155">전문가 승인</text><path class="line" d="M170 260 C 170 260, 170 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M480 260 C 325 260, 325 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M790 260 C 480 260, 480 330, 158 330"/><polygon points="158,323 170,330 158,337" fill="#0f2c59"/><path class="line" d="M280 395 C 325 395, 325 395, 358 395"/><polygon points="358,388 370,395 358,402" fill="#0f2c59"/><path class="line" d="M590 395 C 635 395, 635 395, 668 395"/><polygon points="668,388 680,395 668,402" fill="#0f2c59"/></svg>