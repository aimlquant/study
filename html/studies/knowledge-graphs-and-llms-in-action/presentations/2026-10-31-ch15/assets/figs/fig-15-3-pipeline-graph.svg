<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" role="img" aria-labelledby="figTitle figDesc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .m{font-size:14.5px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11px;font-weight:700}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}
    .fill-navy{fill:#0f2c59;stroke:#0f2c59;stroke-width:1.6}
    .fill-tint{fill:#e8eef7;stroke:#0f2c59;stroke-width:1.6}
    .fill-warn{fill:#fef3e2;stroke:#b45309;stroke-width:1.6}
    .fill-bad{fill:#fdeceb;stroke:#b91c1c;stroke-width:1.6}
    .fill-ok{fill:#eaf5ec;stroke:#15803d;stroke-width:1.6}
    .fill-mute{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 4}
    .arw{stroke:#64748b;stroke-width:2.1;fill:none;marker-end:url(#ah)}
    .arw-navy{stroke:#0f2c59;stroke-width:2.6;fill:none;marker-end:url(#ahn)}
    .arw-warn{stroke:#b45309;stroke-width:2.2;fill:none;marker-end:url(#ahw);stroke-dasharray:6 4}
    .edge-label{paint-order:stroke fill;stroke:#fafaf9;stroke-width:4px;stroke-linejoin:round}
    .an-s{text-anchor:start}
    .an-m{text-anchor:middle}
    .an-e{text-anchor:end}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f2c59"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>

  <title id="figTitle">전문가 모방 질의 파이프라인의 LangGraph 그래프</title>
  <desc id="figDesc">의도 감지, 스키마 추출, 텍스트-투-사이퍼, 질의 실행이 실선으로 이어진다. 질의 실행 뒤 라우팅 함수가 retry, summarize, END 중 하나를 골라 점선으로 분기한다.</desc>
  <rect width="940" height="370" fill="#fafaf9"/>
  <rect class="fill-tint" x="30" y="40" width="180" height="64" rx="10"/>
  <text class="t m an-m" x="120.0" y="67.5" fill="#0f2c59">의도 감지</text>
  <text class="mono xs an-m" x="120.0" y="86.5" fill="#0f2c59">intent_detection</text>
  <rect class="fill-tint" x="250" y="40" width="180" height="64" rx="10"/>
  <text class="t m an-m" x="340.0" y="67.5" fill="#0f2c59">스키마 추출</text>
  <text class="mono xs an-m" x="340.0" y="86.5" fill="#0f2c59">schema_extraction</text>
  <rect class="fill-tint" x="470" y="40" width="180" height="64" rx="10"/>
  <text class="t m an-m" x="560.0" y="67.5" fill="#0f2c59">텍스트-투-사이퍼</text>
  <text class="mono xs an-m" x="560.0" y="86.5" fill="#0f2c59">text_to_cypher</text>
  <rect class="fill-tint" x="690" y="40" width="180" height="64" rx="10"/>
  <text class="t m an-m" x="780.0" y="67.5" fill="#0f2c59">질의 실행</text>
  <text class="mono xs an-m" x="780.0" y="86.5" fill="#0f2c59">query_execution</text>
  <path class="arw-navy" d="M210 72L246 72"/>
  <path class="arw-navy" d="M430 72L466 72"/>
  <path class="arw-navy" d="M650 72L686 72"/>
  <rect class="fill-warn" x="690" y="160" width="180" height="50" rx="10"/>
  <text class="mono s an-m" x="780.0" y="190.0" fill="#7c2d12">post_query_execution</text>
  <path class="arw-warn" d="M780 104L780 156"/>
  <path class="arw-warn" d="M690 178L560 178L560 108"/>
  <text class="mono s edge-label an-m" x="625" y="170" fill="#b45309">retry</text>
  <path class="arw-warn" d="M690 196L340 196L340 286"/>
  <text class="mono s edge-label an-m" x="450" y="214" fill="#b45309">END</text>
  <path class="arw-warn" d="M780 210L780 286"/>
  <text class="mono s edge-label an-s" x="790" y="254" fill="#b45309">summarize</text>
  <rect class="fill-tint" x="690" y="290" width="180" height="50" rx="10"/>
  <text class="t m an-m" x="780.0" y="310.5" fill="#0f2c59">요약 생성</text>
  <text class="mono xs an-m" x="780.0" y="329.5" fill="#0f2c59">generate_summary</text>
  <rect class="fill-navy" x="250" y="290" width="180" height="50" rx="10"/>
  <text class="mono m an-m" x="340.0" y="320.0" fill="#ffffff">END</text>
  <path class="arw-navy" d="M690 315L434 315"/>
</svg>
