<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" role="img" aria-labelledby="figTitle figDesc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .m{font-size:14.5px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11px;font-weight:700}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}
