  <text class="t m an-m" x="714.0" y="57.5" fill="#0f2c59">질의 실행</text>
  <text class="mono xs an-m" x="714.0" y="76.5" fill="#0f2c59">query_execution</text>
  <rect class="box" x="632" y="140" width="164" height="120" rx="10"/>
  <text class="mono s an-m" x="714.0" y="186.0" fill="#0f172a">results_error</text>
