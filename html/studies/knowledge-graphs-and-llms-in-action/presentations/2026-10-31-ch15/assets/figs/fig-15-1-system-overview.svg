<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="figTitle figDesc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .m{font-size:14.5px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11px;font-weight:700}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}
    .fill-navy{fill:#0f2c59;stroke:#0f2c59;stroke-width:1.6}
    .fill-tint{fill:#e8eef7;stroke:#0f2c59;stroke-width:1.6}
    .fill-warn{fill:#fef3e2;stroke:#b45309;stroke-width:1.6}
    .fill-bad{fill:#fdeceb;stroke:#b91c1c;stroke-width:1.6}
    .fill-ok{fill:#eaf5ec;stroke:#15803d;stroke-width:1.6}
    .fill-mute{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 4}
    .arw{stroke:#64748b;stroke-width:2.1;fill:none;marker-end:url(#ah)}
    .arw-navy{stroke:#0f2c59;stroke-width:2.6;fill:none;marker-end:url(#ahn)}
    .arw-warn{stroke:#b45309;stroke-width:2.2;fill:none;marker-end:url(#ahw);stroke-dasharray:6 4}
    .edge-label{paint-order:stroke fill;stroke:#fafaf9;stroke-width:4px;stroke-linejoin:round}
    .an-s{text-anchor:start}
    .an-m{text-anchor:middle}
    .an-e{text-anchor:end}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f2c59"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>

  <title id="figTitle">Streamlit이 입력과 출력을, LangGraph가 그 사이의 파이프라인을 맡는 구조</title>
  <desc id="figDesc">왼쪽 Streamlit 입력 영역에 질문과 선택한 노드가 있고, 가운데 LangGraph 파이프라인 안에 의도 감지, 스키마 추출, 질의 생성, 질의 실행, 요약 생성 다섯 단계가 이어진다. 오른쪽 Streamlit 출력 영역에 시각화와 요약이 있다.</desc>
  <rect width="1100" height="300" fill="#fafaf9"/>
  <rect class="box" x="20" y="40" width="180" height="220" rx="10"/>
  <text class="t m an-m" x="110" y="72" fill="#0f172a">Streamlit 입력</text>
  <rect class="fill-tint" x="40" y="100" width="140" height="50" rx="10"/>
  <text class="t m an-m" x="110.0" y="130.0" fill="#0f2c59">질문</text>
  <rect class="fill-tint" x="40" y="180" width="140" height="50" rx="10"/>
  <text class="t m an-m" x="110.0" y="210.0" fill="#0f2c59">선택한 노드</text>
  <rect class="box" x="240" y="40" width="620" height="220" rx="10"/>
  <text class="t m an-m" x="550" y="72" fill="#0f172a">LangGraph 파이프라인</text>
  <rect class="fill-navy" x="252" y="120" width="96" height="70" rx="10"/>
  <text class="t m an-m" x="300.0" y="150.5" fill="#ffffff">의도</text>
  <text class="t m an-m" x="300.0" y="169.5" fill="#ffffff">감지</text>
  <path class="arw-navy" d="M348 155L370 155"/>
  <rect class="fill-navy" x="374" y="120" width="96" height="70" rx="10"/>
  <text class="t m an-m" x="422.0" y="150.5" fill="#ffffff">스키마</text>
  <text class="t m an-m" x="422.0" y="169.5" fill="#ffffff">추출</text>
  <path class="arw-navy" d="M470 155L492 155"/>
  <rect class="fill-navy" x="496" y="120" width="96" height="70" rx="10"/>
  <text class="t m an-m" x="544.0" y="150.5" fill="#ffffff">질의</text>
  <text class="t m an-m" x="544.0" y="169.5" fill="#ffffff">생성</text>
  <path class="arw-navy" d="M592 155L614 155"/>
  <rect class="fill-navy" x="618" y="120" width="96" height="70" rx="10"/>
  <text class="t m an-m" x="666.0" y="150.5" fill="#ffffff">질의</text>
  <text class="t m an-m" x="666.0" y="169.5" fill="#ffffff">실행</text>
  <path class="arw-navy" d="M714 155L736 155"/>
  <rect class="fill-navy" x="740" y="120" width="96" height="70" rx="10"/>
  <text class="t m an-m" x="788.0" y="150.5" fill="#ffffff">요약</text>
  <text class="t m an-m" x="788.0" y="169.5" fill="#ffffff">생성</text>
  <rect class="box" x="900" y="40" width="180" height="220" rx="10"/>
  <text class="t m an-m" x="990" y="72" fill="#0f172a">Streamlit 출력</text>
  <rect class="fill-ok" x="920" y="100" width="140" height="50" rx="10"/>
  <text class="t m an-m" x="990.0" y="130.0" fill="#14532d">시각화</text>
  <rect class="fill-ok" x="920" y="180" width="140" height="50" rx="10"/>
  <text class="t m an-m" x="990.0" y="210.0" fill="#14532d">요약</text>
  <path class="arw-navy" d="M200 155L236 155"/>
  <path class="arw-navy" d="M860 155L896 155"/>
</svg>
