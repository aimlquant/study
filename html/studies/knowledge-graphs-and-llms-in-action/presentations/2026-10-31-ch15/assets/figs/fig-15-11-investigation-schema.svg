<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 346" role="img" aria-labelledby="figTitle figDesc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .m{font-size:14.5px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11px;font-weight:700}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}
    .fill-navy{fill:#0f2c59;stroke:#0f2c59;stroke-width:1.6}
    .fill-tint{fill:#e8eef7;stroke:#0f2c59;stroke-width:1.6}
    .fill-warn{fill:#fef3e2;stroke:#b45309;stroke-width:1.6}
    .fill-bad{fill:#fdeceb;stroke:#b91c1c;stroke-width:1.6}
    .fill-ok{fill:#eaf5ec;stroke:#15803d;stroke-width:1.6}
    .fill-mute{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 4}
    .arw{stroke:#64748b;stroke-width:2.1;fill:none;marker-end:url(#ah)}
    .arw-navy{stroke:#0f2c59;stroke-width:2.6;fill:none;marker-end:url(#ahn)}
    .arw-warn{stroke:#b45309;stroke-width:2.2;fill:none;marker-end:url(#ahw);stroke-dasharray:6 4}
    .edge-label{paint-order:stroke fill;stroke:#fafaf9;stroke-width:4px;stroke-linejoin:round}
    .an-s{text-anchor:start}
    .an-m{text-anchor:middle}
    .an-e{text-anchor:end}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f2c59"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>

  <title id="figTitle">수사 질의에 쓰이는 다섯 노드 타입의 연결</title>
  <desc id="figDesc">Crime과 ANPRCamera는 위치로 가까움을 따진다. ANPRCamera는 HAS_EVENT로 ANPRCameraEvent에, ANPRCameraEvent는 PLATE_READ_EVENT로 Vehicle에 이어진다. Vehicle은 소유자 Person과 연결되고, Person은 COMMITTED로 Crime에 이어진다.</desc>
  <rect width="900" height="346" fill="#fafaf9"/>
  <rect class="fill-tint" x="40" y="30" width="180" height="56" rx="10"/>
  <text class="mono m an-m" x="130.0" y="53.5" fill="#0f2c59">Crime</text>
  <text class="t xs an-m" x="130.0" y="72.5" fill="#0f2c59">범죄</text>
  <rect class="fill-tint" x="680" y="30" width="180" height="56" rx="10"/>
  <text class="mono m an-m" x="770.0" y="53.5" fill="#0f2c59">ANPRCamera</text>
  <text class="t xs an-m" x="770.0" y="72.5" fill="#0f2c59">번호판 인식 카메라</text>
  <rect class="fill-tint" x="680" y="150" width="180" height="56" rx="10"/>
  <text class="mono s an-m" x="770.0" y="173.5" fill="#0f2c59">ANPRCameraEvent</text>
  <text class="t xs an-m" x="770.0" y="192.5" fill="#0f2c59">감지 기록</text>
  <rect class="fill-tint" x="680" y="270" width="180" height="56" rx="10"/>
  <text class="mono m an-m" x="770.0" y="293.5" fill="#0f2c59">Vehicle</text>
  <text class="t xs an-m" x="770.0" y="312.5" fill="#0f2c59">차량</text>
  <rect class="fill-tint" x="40" y="270" width="180" height="56" rx="10"/>
  <text class="mono m an-m" x="130.0" y="293.5" fill="#0f2c59">Person</text>
  <text class="t xs an-m" x="130.0" y="312.5" fill="#0f2c59">사람</text>
  <path d="M220 58L680 58" fill="none" stroke="#64748b" stroke-width="2.1" stroke-dasharray="6 4"/>
  <text class="t s edge-label an-m" x="450" y="50" fill="#334155">위치로 계산한 근접</text>
  <path class="arw" d="M770 86L770 146"/>
  <text class="mono s edge-label an-e" x="760" y="121" fill="#334155">HAS_EVENT</text>
  <path class="arw" d="M770 206L770 266"/>
  <text class="mono s edge-label an-e" x="760" y="241" fill="#334155">PLATE_READ_EVENT</text>
  <path d="M680 298L220 298" fill="none" stroke="#64748b" stroke-width="2.1"/>
  <text class="t s edge-label an-m" x="450" y="290" fill="#334155">소유자</text>
  <path class="arw" d="M130 270L130 90"/>
  <text class="mono s edge-label an-s" x="140" y="184" fill="#334155">COMMITTED</text>
</svg>
