<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 290" role="img" aria-labelledby="figTitle figDesc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .m{font-size:14.5px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11px;font-weight:700}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}
    .fill-navy{fill:#0f2c59;stroke:#0f2c59;stroke-width:1.6}
    .fill-tint{fill:#e8eef7;stroke:#0f2c59;stroke-width:1.6}
    .fill-warn{fill:#fef3e2;stroke:#b45309;stroke-width:1.6}
    .fill-bad{fill:#fdeceb;stroke:#b91c1c;stroke-width:1.6}
    .fill-ok{fill:#eaf5ec;stroke:#15803d;stroke-width:1.6}
    .fill-mute{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 4}
    .arw{stroke:#64748b;stroke-width:2.1;fill:none;marker-end:url(#ah)}
    .arw-navy{stroke:#0f2c59;stroke-width:2.6;fill:none;marker-end:url(#ahn)}
    .arw-warn{stroke:#b45309;stroke-width:2.2;fill:none;marker-end:url(#ahw);stroke-dasharray:6 4}
    .edge-label{paint-order:stroke fill;stroke:#fafaf9;stroke-width:4px;stroke-linejoin:round}
    .an-s{text-anchor:start}
    .an-m{text-anchor:middle}
    .an-e{text-anchor:end}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f2c59"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>

  <title id="figTitle">다섯 번의 질문이 선택을 이어 받으며 사건을 좁혀 간다</title>
  <desc id="figDesc">다섯 열이 수사 단계다. 각 열은 위에서부터 단계 이름, 그 질문에 함께 넘긴 선택, 원서가 보고한 결과를 보여 준다. 첫 질문은 선택 없이, 둘째는 범죄를, 셋째부터는 범죄와 카메라를 선택한 채로 묻는다.</desc>
  <rect width="1084" height="290" fill="#fafaf9"/>
  <rect class="fill-navy" x="20" y="30" width="180" height="56" rx="10"/>
  <text class="t m an-m" x="110.0" y="63.0" fill="#ffffff">① 사건 식별</text>
  <rect class="box" x="20" y="110" width="180" height="56" rx="10"/>
  <text class="t xs an-m" x="110.0" y="133.5" fill="#0f172a">선택</text>
  <text class="t s an-m" x="110.0" y="152.5" fill="#0f172a">없음</text>
  <rect class="fill-ok" x="20" y="190" width="180" height="70" rx="10"/>
  <text class="t s an-m" x="110.0" y="220.5" fill="#14532d">수사 중 범죄 1건</text>
  <text class="t xs an-m" x="110.0" y="239.5" fill="#14532d">그래프 · 요약</text>
  <path class="arw-navy" d="M200 58L232 58"/>
  <rect class="fill-navy" x="236" y="30" width="180" height="56" rx="10"/>
  <text class="t m an-m" x="326.0" y="63.0" fill="#ffffff">② 공간 분석</text>
  <rect class="box" x="236" y="110" width="180" height="56" rx="10"/>
  <text class="t xs an-m" x="326.0" y="133.5" fill="#0f172a">선택</text>
  <text class="t s an-m" x="326.0" y="152.5" fill="#0f172a">범죄</text>
  <rect class="fill-ok" x="236" y="190" width="180" height="70" rx="10"/>
  <text class="t s an-m" x="326.0" y="220.5" fill="#14532d">1 km 안 카메라</text>
  <text class="t xs an-m" x="326.0" y="239.5" fill="#14532d">그래프 · 지도</text>
  <path class="arw-navy" d="M416 58L448 58"/>
  <rect class="fill-navy" x="452" y="30" width="180" height="56" rx="10"/>
  <text class="t m an-m" x="542.0" y="63.0" fill="#ffffff">③ 차량 패턴</text>
  <rect class="box" x="452" y="110" width="180" height="56" rx="10"/>
  <text class="t xs an-m" x="542.0" y="133.5" fill="#0f172a">선택</text>
  <text class="t s an-m" x="542.0" y="152.5" fill="#0f172a">범죄 · 카메라</text>
  <rect class="fill-ok" x="452" y="190" width="180" height="70" rx="10"/>
  <text class="t s an-m" x="542.0" y="220.5" fill="#14532d">검은색 EB 차량</text>
  <text class="t xs an-m" x="542.0" y="239.5" fill="#14532d">그래프 · 요약</text>
  <path class="arw-navy" d="M632 58L664 58"/>
  <rect class="fill-navy" x="668" y="30" width="180" height="56" rx="10"/>
  <text class="t m an-m" x="758.0" y="63.0" fill="#ffffff">④ 맥락 정제</text>
  <rect class="box" x="668" y="110" width="180" height="56" rx="10"/>
  <text class="t xs an-m" x="758.0" y="133.5" fill="#0f172a">선택</text>
  <text class="t s an-m" x="758.0" y="152.5" fill="#0f172a">범죄 · 카메라</text>
  <rect class="fill-ok" x="668" y="190" width="180" height="70" rx="10"/>
  <text class="t s an-m" x="758.0" y="220.5" fill="#14532d">같은 차량</text>
  <text class="t xs an-m" x="758.0" y="239.5" fill="#14532d">요약에 분석 추가</text>
  <path class="arw-navy" d="M848 58L880 58"/>
  <rect class="fill-navy" x="884" y="30" width="180" height="56" rx="10"/>
  <text class="t m an-m" x="974.0" y="63.0" fill="#ffffff">⑤ 과거 기록</text>
  <rect class="box" x="884" y="110" width="180" height="56" rx="10"/>
  <text class="t xs an-m" x="974.0" y="133.5" fill="#0f172a">선택</text>
  <text class="t s an-m" x="974.0" y="152.5" fill="#0f172a">범죄 · 카메라</text>
  <rect class="fill-ok" x="884" y="190" width="180" height="70" rx="10"/>
  <text class="t s an-m" x="974.0" y="220.5" fill="#14532d">소유자의 전과</text>
  <text class="t xs an-m" x="974.0" y="239.5" fill="#14532d">무단침입 전과</text>
</svg>
