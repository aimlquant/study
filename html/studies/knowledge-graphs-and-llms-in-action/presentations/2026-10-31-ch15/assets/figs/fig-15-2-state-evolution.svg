<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 250" role="img" aria-labelledby="figTitle figDesc">
  <style>
    .t{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .m{font-size:14.5px;font-weight:800}
    .s{font-size:12.5px;font-weight:700}
    .xs{font-size:11px;font-weight:700}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}
    .fill-navy{fill:#0f2c59;stroke:#0f2c59;stroke-width:1.6}
    .fill-tint{fill:#e8eef7;stroke:#0f2c59;stroke-width:1.6}
    .fill-warn{fill:#fef3e2;stroke:#b45309;stroke-width:1.6}
    .fill-bad{fill:#fdeceb;stroke:#b91c1c;stroke-width:1.6}
    .fill-ok{fill:#eaf5ec;stroke:#15803d;stroke-width:1.6}
    .fill-mute{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4;stroke-dasharray:5 4}
    .arw{stroke:#64748b;stroke-width:2.1;fill:none;marker-end:url(#ah)}
    .arw-navy{stroke:#0f2c59;stroke-width:2.6;fill:none;marker-end:url(#ahn)}
    .arw-warn{stroke:#b45309;stroke-width:2.2;fill:none;marker-end:url(#ahw);stroke-dasharray:6 4}
    .edge-label{paint-order:stroke fill;stroke:#fafaf9;stroke-width:4px;stroke-linejoin:round}
    .an-s{text-anchor:start}
    .an-m{text-anchor:middle}
    .an-e{text-anchor:end}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f2c59"/></marker>
    <marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
  </defs>

  <title id="figTitle">공유 상태가 단계마다 자라는 RAG 예</title>
  <desc id="figDesc">상태는 question 하나로 시작한다. 문서 검색 에이전트가 documents를 더하고, 답변 생성 에이전트가 answer를 더한다. 두 에이전트는 서로를 호출하지 않고 상태만 읽고 쓴다.</desc>
  <rect width="1070" height="250" fill="#fafaf9"/>
  <rect class="box" x="20" y="40" width="190" height="170" rx="10"/>
  <text class="t m an-m" x="115" y="70" fill="#0f172a">상태 · 시작</text>
  <rect class="fill-tint" x="40" y="88" width="150" height="28" rx="10"/>
  <text class="mono s an-m" x="115.0" y="107.0" fill="#0f2c59">question</text>
  <rect class="fill-mute" x="40" y="126" width="150" height="28" rx="10"/>
  <text class="t s an-m" x="115.0" y="145.0" fill="#475569">비어 있음</text>
  <rect class="fill-mute" x="40" y="164" width="150" height="28" rx="10"/>
  <text class="t s an-m" x="115.0" y="183.0" fill="#475569">비어 있음</text>
  <rect class="box" x="440" y="40" width="190" height="170" rx="10"/>
  <text class="t m an-m" x="535" y="70" fill="#0f172a">상태 · 검색 후</text>
  <rect class="fill-tint" x="460" y="88" width="150" height="28" rx="10"/>
  <text class="mono s an-m" x="535.0" y="107.0" fill="#0f2c59">question</text>
  <rect class="fill-navy" x="460" y="126" width="150" height="28" rx="10"/>
  <text class="mono s an-m" x="535.0" y="145.0" fill="#ffffff">documents</text>
  <rect class="fill-mute" x="460" y="164" width="150" height="28" rx="10"/>
  <text class="t s an-m" x="535.0" y="183.0" fill="#475569">비어 있음</text>
  <rect class="box" x="860" y="40" width="190" height="170" rx="10"/>
  <text class="t m an-m" x="955" y="70" fill="#0f172a">상태 · 생성 후</text>
  <rect class="fill-tint" x="880" y="88" width="150" height="28" rx="10"/>
  <text class="mono s an-m" x="955.0" y="107.0" fill="#0f2c59">question</text>
  <rect class="fill-tint" x="880" y="126" width="150" height="28" rx="10"/>
  <text class="mono s an-m" x="955.0" y="145.0" fill="#0f2c59">documents</text>
  <rect class="fill-navy" x="880" y="164" width="150" height="28" rx="10"/>
  <text class="mono s an-m" x="955.0" y="183.0" fill="#ffffff">answer</text>
  <rect class="fill-tint" x="260" y="95" width="130" height="60" rx="10"/>
  <text class="t m an-m" x="325.0" y="120.5" fill="#0f2c59">문서 검색</text>
  <text class="mono xs an-m" x="325.0" y="139.5" fill="#0f2c59">retrieve</text>
  <rect class="fill-tint" x="680" y="95" width="130" height="60" rx="10"/>
  <text class="t m an-m" x="745.0" y="120.5" fill="#0f2c59">답변 생성</text>
  <text class="mono xs an-m" x="745.0" y="139.5" fill="#0f2c59">generate</text>
  <path class="arw-navy" d="M210 125L256 125"/>
  <path class="arw-navy" d="M390 125L436 125"/>
  <path class="arw-navy" d="M630 125L676 125"/>
  <path class="arw-navy" d="M810 125L856 125"/>
</svg>
