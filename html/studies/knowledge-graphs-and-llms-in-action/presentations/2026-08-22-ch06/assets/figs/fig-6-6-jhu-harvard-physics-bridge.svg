  <title id="f66title">존스홉킨스와 하버드를 잇는 물리학 연구 영향력 네트워크</title>
  <desc id="f66desc">두 대학 소속 인물과 그들을 세 홉 이내로 잇는 중간 인물들. 긍정·부정 감정이 붙은 TALKED_ABOUT 관계와, 같은 과학자가 서로 다른 두 노드로 남아 있는 미해소 언급이 함께 표시된다.</desc>
