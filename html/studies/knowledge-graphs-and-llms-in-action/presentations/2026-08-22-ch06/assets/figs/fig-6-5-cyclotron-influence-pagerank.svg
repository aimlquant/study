  <title id="f65title">사이클로트론 연구를 둘러싼 두 홉 이내 영향력 네트워크</title>
  <desc id="f65desc">사이클로트론 관련 직업을 중심으로 두 홉 이내에 놓인 인물, 기관, 직업 노드. Person 노드는 전역 페이지랭크 중심성에 따라 크기가 조절되며, 관계 추출 실패로 잘못 포함된 인물 노드가 함께 표시된다.</desc>
