  <title id="f62title">록펠러 아카이브 센터 지식 그래프의 세 층 스키마</title>
  <desc id="f62desc">문서 수준 층의 File과 Page, 메타그래프 층의 병합되지 않은 Entity와 유사도 관계, 지식 그래프 층의 Person, Organization, Title, Occupation과 그 사이의 의미 관계, 그리고 두 층을 잇는 MAPPED_TO 관계</desc>
  <rect width="960" height="540" rx="18" fill="#fafaf9"/>

  <rect class="zone" x="28" y="40" width="372" height="146" rx="14"/>
  <text class="t band" x="46" y="70">문서 수준 층</text>
  <text class="t bandsub" x="152" y="70">수집 결과</text>

  <rect class="zone" x="28" y="206" width="372" height="298" rx="14"/>
