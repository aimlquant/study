<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="f62title f62desc">
  <style>
    .t{font-family:'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', NanumGothic, Inter, system-ui, sans-serif;fill:#0f172a}
    .band{font-size:17px;font-weight:900;fill:#0f2c59}
    .bandsub{font-size:13px;font-weight:700;fill:#475569}
    .node{font-size:15px;font-weight:900}
    .prop{font-size:13px;font-weight:700;fill:#475569}
    .rel{font-size:13px;font-weight:800;fill:#334155}
    .zone{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
