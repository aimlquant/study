  <title id="f64title">매개 중심성으로 크기를 조절한 지적 영향력 네트워크</title>
  <desc id="f64desc">TALKED_ABOUT, TALKED_WITH, WORKS_WITH, STUDENT_OF 관계로 이루어진 과학자 네트워크의 가장 큰 연결 요소. 최단 경로가 많이 지나는 인물일수록 원이 크게 그려져 서로 다른 연구자 집단을 잇는 교량 역할이 드러난다.</desc>
