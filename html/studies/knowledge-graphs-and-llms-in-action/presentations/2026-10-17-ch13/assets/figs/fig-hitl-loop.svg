<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362" role="img" aria-labelledby="title desc">
  <title id="title">근거를 기록하고 사람이 검토하는 운영 고리</title>
  <desc id="desc">왼쪽에서 오른쪽으로 질문, 에이전트 실행, 근거 기록, 사람 검토가 이어진다. 사람 검토에서 어긋남을 발견하면 고칠 곳 찾기로 내려간다. 도구 설명과 스키마 그리고 지식 그래프에서 원인을 찾은 뒤 같은 질문 반복 단계로 돌아가 단계 수와 도구 조합을 비교하고 다시 실행한다. 이 고리는 책의 서술을 이해하기 쉽게 재구성한 것이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .box{fill:#D9E2EF;stroke:#0F2C59;stroke-width:2}
      .store{fill:#DDF0E6;stroke:#1F7A5C;stroke-width:2}
      .tool{fill:#FBE3D4;stroke:#C2410C;stroke-width:2}
      .agent{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .weak{fill:#F1F1F3;stroke:#6B6B72;stroke-width:2;stroke-dasharray:8 6}
      .zone{fill:none;stroke:#6B6B72;stroke-width:2;stroke-dasharray:8 6}
      .edge{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow)}
      .edge2{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow);marker-start:url(#arrow)}
      .dash{fill:none;stroke:#C2410C;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .t{font-size:16px;font-weight:800;text-anchor:middle;fill:#1b1b1f}
      .m{font-size:13px;font-weight:600;text-anchor:middle;fill:#1b1b1f}
      .s{font-size:12.5px;font-weight:700;text-anchor:middle;fill:#0F2C59}
      .l{font-size:13px;font-weight:700;text-anchor:start;fill:#4a4a52}
      .r{font-size:12.5px;font-weight:700;text-anchor:end;fill:#0F2C59}
    </style>
  </defs>
  <rect width="900" height="362" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="box" x="30" y="40" width="190" height="64" rx="8"/><text class="t" x="125" y="68">질문</text><text class="m" x="125" y="90">사용자 또는 평가 질문</text>
    <path class="edge" d="M222 72H262"/>
    <rect class="tool" x="264" y="40" width="190" height="64" rx="8"/><text class="t" x="359" y="68">에이전트 실행</text><text class="m" x="359" y="90">도구 선택 · 답 생성</text>
    <path class="edge" d="M456 72H496"/>
    <rect class="store" x="498" y="40" width="190" height="64" rx="8"/><text class="t" x="593" y="68">근거 기록</text><text class="m" x="593" y="90">Cypher · 문서 · 단계 수</text>
    <path class="edge" d="M690 72H730"/>
    <rect class="agent" x="732" y="40" width="140" height="64" rx="8"/><text class="t" x="802" y="68">사람 검토</text><text class="m" x="802" y="90">근거와 답 대조</text>
    <path class="edge" d="M802 106V176H593V206" style="stroke:#C2410C"/>
    <text class="r" x="790" y="150" style="fill:#C2410C">어긋남 발견</text>
    <rect class="weak" x="30" y="208" width="190" height="64" rx="8"/><text class="t" x="125" y="236">같은 질문 반복</text><text class="m" x="125" y="258">steps · 도구 조합 비교</text>
    <rect class="tool" x="498" y="208" width="190" height="64" rx="8"/><text class="t" x="593" y="236">고칠 곳 찾기</text><text class="m" x="593" y="258">도구 설명 · 스키마 · KG</text>
    <path class="edge" d="M496 240H222" />
    <path class="dash" d="M125 206V106"/><text class="l" x="136" y="160" style="fill:#C2410C">다시 실행</text>
    <rect class="zone" x="30" y="300" width="842" height="44" rx="10"/><text class="m" x="451" y="328">AIML Quant 이해용 재구성 — 책의 human in the loop와 반복 테스트 권고를 한 고리로 묶었다</text>
  </g>
</svg>
