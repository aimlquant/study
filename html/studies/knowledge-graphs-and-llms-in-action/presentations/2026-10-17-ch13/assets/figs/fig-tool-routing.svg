<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" role="img" aria-labelledby="title desc">
  <title id="title">질문 유형에 따라 갈리는 세 도구</title>
  <desc id="desc">세 줄로 이루어진 표다. 첫 줄은 두 대상이 정해진 질문이 KG 강화 문서 검색기로 가서 관계를 언급한 원문을 얻는 경로다. 둘째 줄은 KG만으로 답이 되는 질문이 KG 리더로 가서 Cypher 결과를 얻는 경로이고, KG 리더의 이름 목록이 문서 검색기로 넘어가는 점선이 있다. 셋째 줄은 앞의 둘이 빈손일 때만 쓰는 백업 벡터 검색이 비슷한 문서 조각을 돌려주는 경로다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .box{fill:#D9E2EF;stroke:#0F2C59;stroke-width:2}
      .store{fill:#DDF0E6;stroke:#1F7A5C;stroke-width:2}
      .tool{fill:#FBE3D4;stroke:#C2410C;stroke-width:2}
      .agent{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .weak{fill:#F1F1F3;stroke:#6B6B72;stroke-width:2;stroke-dasharray:8 6}
      .zone{fill:none;stroke:#6B6B72;stroke-width:2;stroke-dasharray:8 6}
      .edge{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow)}
      .edge2{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow);marker-start:url(#arrow)}
      .dash{fill:none;stroke:#C2410C;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .t{font-size:16px;font-weight:800;text-anchor:middle;fill:#1b1b1f}
      .m{font-size:13px;font-weight:600;text-anchor:middle;fill:#1b1b1f}
      .s{font-size:12.5px;font-weight:700;text-anchor:middle;fill:#0F2C59}
      .l{font-size:13px;font-weight:700;text-anchor:start;fill:#4a4a52}
      .r{font-size:12.5px;font-weight:700;text-anchor:end;fill:#0F2C59}
    </style>
  </defs>
  <rect width="900" height="372" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <text class="s" x="180" y="22">질문의 성격</text><text class="s" x="490" y="22">도구 (설명이 라우팅 규칙)</text><text class="s" x="775" y="22">돌려주는 맥락</text>
    <rect class="box" x="30" y="40" width="300" height="70" rx="8"/><text class="t" x="180" y="68">두 대상이 정해진 질문</text><text class="m" x="180" y="92">X는 Y에 대해 뭐라고 했나</text>
    <rect class="tool" x="380" y="40" width="220" height="70" rx="8"/><text class="t" x="490" y="68">문서 선택기</text><text class="m" x="490" y="92">KG-based-document-selector</text>
    <rect class="store" x="650" y="40" width="220" height="70" rx="8"/><text class="t" x="760" y="68">관계를 언급한 문서</text><text class="m" x="760" y="92">원문 최대 3건</text>
    <path class="edge" d="M332 75H378"/><path class="edge" d="M602 75H648"/>
    <rect class="box" x="30" y="160" width="300" height="70" rx="8"/><text class="t" x="180" y="188">KG만으로 답이 되는 질문</text><text class="m" x="180" y="212">관계 · 집계 · 이름 목록</text>
    <rect class="tool" x="380" y="160" width="220" height="70" rx="8"/><text class="t" x="490" y="188">KG 리더</text><text class="m" x="490" y="212">KnowledgeGraph-reader</text>
    <rect class="store" x="650" y="160" width="220" height="70" rx="8"/><text class="t" x="760" y="188">Cypher 결과</text><text class="m" x="760" y="212">질의문과 조회된 행</text>
    <path class="edge" d="M332 195H378"/><path class="edge" d="M602 195H648"/>
    <path class="dash" d="M490 160V114"/><text class="l" x="502" y="142" style="fill:#C2410C">이름 목록을 넘긴다</text>
    <rect class="weak" x="30" y="280" width="300" height="70" rx="8"/><text class="t" x="180" y="308">위 둘이 빈손일 때</text><text class="m" x="180" y="332">너무 세밀한 내용</text>
    <rect class="weak" x="380" y="280" width="220" height="70" rx="8"/><text class="t" x="490" y="308">벡터 검색 (백업)</text><text class="m" x="490" y="332">Diaries-vector-search</text>
    <rect class="weak" x="650" y="280" width="220" height="70" rx="8"/><text class="t" x="760" y="308">비슷한 문서 조각</text><text class="m" x="760" y="332">상위 3건 (k=3)</text>
    <path class="edge" d="M332 315H378"/><path class="edge" d="M602 315H648"/>
  </g>
</svg>
