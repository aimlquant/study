<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">문서 선택기 질의가 그래프에서 따라가는 경로</title>
  <desc id="desc">위에 하나의 Page 노드가 있고 거기서 MENTIONS_ENTITY 관계가 두 Entity 노드로 나간다. 두 Entity는 RELATED_TO_ENTITY 관계로 이어지며 이 관계의 type이 요청한 관계 클래스와 같아야 한다. 각 Entity는 아래쪽의 실제 인물과 대상 노드에 이어지고 그 두 노드가 요청한 관계로 연결되어 있어야 한다. 이 조건을 모두 만족하는 쪽의 id와 본문만 한 번씩 반환한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .box{fill:#D9E2EF;stroke:#0F2C59;stroke-width:2}
      .store{fill:#DDF0E6;stroke:#1F7A5C;stroke-width:2}
      .tool{fill:#FBE3D4;stroke:#C2410C;stroke-width:2}
      .agent{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .weak{fill:#F1F1F3;stroke:#6B6B72;stroke-width:2;stroke-dasharray:8 6}
      .zone{fill:none;stroke:#6B6B72;stroke-width:2;stroke-dasharray:8 6}
      .edge{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow)}
      .edge2{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow);marker-start:url(#arrow)}
      .dash{fill:none;stroke:#C2410C;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .t{font-size:16px;font-weight:800;text-anchor:middle;fill:#1b1b1f}
      .m{font-size:13px;font-weight:600;text-anchor:middle;fill:#1b1b1f}
      .s{font-size:12.5px;font-weight:700;text-anchor:middle;fill:#0F2C59}
      .l{font-size:13px;font-weight:700;text-anchor:start;fill:#4a4a52}
      .r{font-size:12.5px;font-weight:700;text-anchor:end;fill:#0F2C59}
    </style>
  </defs>
  <rect width="900" height="430" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="box" x="330" y="20" width="240" height="56" rx="8"/><text class="t" x="450" y="46">(p:Page)</text><text class="m" x="450" y="65">같은 쪽 p 하나로 묶는다</text>
    <path class="edge" d="M390 78V118H210V148"/><path class="edge" d="M510 78V118H690V148"/>
    <text class="r" x="196" y="112">MENTIONS_ENTITY</text><text class="l" x="704" y="112" style="fill:#0F2C59">MENTIONS_ENTITY</text>
    <rect class="store" x="90" y="150" width="240" height="56" rx="8"/><text class="t" x="210" y="176">(m1:Entity)</text><text class="m" x="210" y="195">쪽 안의 언급 1</text>
    <rect class="store" x="570" y="150" width="240" height="56" rx="8"/><text class="t" x="690" y="176">(m2:Entity)</text><text class="m" x="690" y="195">쪽 안의 언급 2</text>
    <path class="edge2" d="M332 178H568"/><text class="s" x="450" y="170">RELATED_TO_ENTITY</text><text class="m" x="450" y="196">r.type = 관계 클래스</text>
    <path class="edge" d="M210 208V268"/><path class="edge" d="M690 208V268"/>
    <rect class="tool" x="90" y="270" width="240" height="56" rx="8"/><text class="t" x="210" y="296">(e1:Person)</text><text class="m" x="210" y="315">name = 첫째 인물</text>
    <rect class="tool" x="570" y="270" width="240" height="56" rx="8"/><text class="t" x="690" y="296">(e2:대상 클래스)</text><text class="m" x="690" y="315">name = 둘째 대상</text>
    <path class="edge2" d="M332 298H568"/><text class="s" x="450" y="290">[:관계 클래스]</text><text class="m" x="450" y="316">예: TALKED_ABOUT</text>
    <rect class="agent" x="270" y="358" width="360" height="52" rx="8"/><text class="t" x="450" y="382">RETURN DISTINCT p.id, p.text</text><text class="m" x="450" y="400">본문은 쪽마다 한 번만 돌려준다</text>
  </g>
</svg>
