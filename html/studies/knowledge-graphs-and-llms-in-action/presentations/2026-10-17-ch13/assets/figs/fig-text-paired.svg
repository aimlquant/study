<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" role="img" aria-labelledby="title desc">
  <title id="title">텍스트 짝지음과 텍스트 속성 그래프가 겹친 두 층</title>
  <desc id="desc">맨 위에 일기 한 쪽을 뜻하는 Page 노드가 있고 텍스트 속성에 전문이 들어 있다. Page에서 MENTIONS_ENTITY 관계가 두 Entity 노드로 나가고 두 Entity는 RELATED_TO_ENTITY로 이어진다. 각 Entity는 MAPPED_TO_PERSON 관계로 KG 층의 Person 노드에 이어지고 두 Person은 TALKED_ABOUT 관계를 가진다. 그래서 KG 층의 관계 하나를 따라 올라가면 그것이 추출된 문서에 닿는다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0F2C59"/>
    </marker>
    <style>
      .text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif}
      .box{fill:#D9E2EF;stroke:#0F2C59;stroke-width:2}
      .store{fill:#DDF0E6;stroke:#1F7A5C;stroke-width:2}
      .tool{fill:#FBE3D4;stroke:#C2410C;stroke-width:2}
      .agent{fill:#fff;stroke:#0F2C59;stroke-width:2}
      .weak{fill:#F1F1F3;stroke:#6B6B72;stroke-width:2;stroke-dasharray:8 6}
      .zone{fill:none;stroke:#6B6B72;stroke-width:2;stroke-dasharray:8 6}
      .edge{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow)}
      .edge2{fill:none;stroke:#0F2C59;stroke-width:2.5;marker-end:url(#arrow);marker-start:url(#arrow)}
      .dash{fill:none;stroke:#C2410C;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .t{font-size:16px;font-weight:800;text-anchor:middle;fill:#1b1b1f}
      .m{font-size:13px;font-weight:600;text-anchor:middle;fill:#1b1b1f}
      .s{font-size:12.5px;font-weight:700;text-anchor:middle;fill:#0F2C59}
      .l{font-size:13px;font-weight:700;text-anchor:start;fill:#4a4a52}
      .r{font-size:12.5px;font-weight:700;text-anchor:end;fill:#0F2C59}
    </style>
  </defs>
  <rect width="900" height="396" rx="12" fill="#FAFAF9"/>
  <g class="text">
    <rect class="zone" x="24" y="14" width="852" height="90" rx="14"/><text class="l" x="44" y="62">문서 층</text>
    <rect class="box" x="300" y="30" width="300" height="58" rx="8"/><text class="t" x="450" y="56">Page · 일기 한 쪽</text><text class="m" x="450" y="76">text 속성에 전문이 들어 있다</text>
    <path class="edge" d="M400 90V120H365V168"/>
    <path class="edge" d="M500 90V120H680V168"/>
    <text class="r" x="352" y="148">MENTIONS_ENTITY</text><text class="s" style="text-anchor:start" x="690" y="148">MENTIONS_ENTITY</text>
    <rect class="store" x="270" y="170" width="190" height="56" rx="8"/><text class="t" x="365" y="204">Entity · WW</text>
    <rect class="store" x="560" y="170" width="240" height="56" rx="8"/><text class="t" x="680" y="204">Entity · Dorothy M. Wrinch</text>
    <path class="edge2" d="M462 198H558"/><path d="M510 202V230" style="fill:none;stroke:#6B6B72;stroke-width:1.5;stroke-dasharray:3 3"/><text class="s" x="510" y="243">RELATED_TO_ENTITY</text>
    <text class="l" x="44" y="204">추출 근거 층</text>
    <path class="edge" d="M365 228V306"/><text class="l" x="374" y="272" style="fill:#0F2C59">MAPPED_TO_PERSON</text>
    <path class="edge" d="M680 228V306"/><text class="l" x="689" y="272" style="fill:#0F2C59">MAPPED_TO_PERSON</text>
    <rect class="zone" x="24" y="282" width="852" height="96" rx="14"/><text class="l" x="44" y="338">KG 층</text>
    <rect class="tool" x="270" y="306" width="190" height="56" rx="8"/><text class="t" x="365" y="340">Person · WW</text>
    <rect class="tool" x="560" y="306" width="240" height="56" rx="8"/><text class="t" x="680" y="340">Person · Dorothy M. Wrinch</text>
    <path class="edge" d="M462 334H558"/><text class="s" x="510" y="324" style="font-size:11px">TALKED_ABOUT</text>
  </g>
</svg>
