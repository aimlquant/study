<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="title desc">
  <title id="title">HPOA 표의 한 행을 질병과 표현형 사이의 속성 있는 관계로 변환하기</title>
  <desc id="desc">표의 질병 ID는 질병 노드로, 표현형 ID는 표현형 노드로 이동하고 작성자, 생성일, 출처는 두 노드를 잇는 HAS PHENOTYPIC FEATURE 관계의 속성으로 이동한다.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 14" refX="17.5" refY="7" markerWidth="18" markerHeight="14" orient="auto"><path d="M.5.5 17.5 7 .5 13.5Z" fill="#0f2c59"/></marker>
    <marker id="map-arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 14" refX="17.5" refY="7" markerWidth="16" markerHeight="12" orient="auto"><path d="M.5.5 17.5 7 .5 13.5Z" fill="#8090a6"/></marker>
    <style>text{font-family:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;fill:#172033}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;fill:#52647d}.head{font-size:18px;font-weight:800}.small{font-size:13px;fill:#56657a}.cell{stroke-width:2}.disease-cell{fill:#e5ecf6;stroke:#0f2c59}.feature-cell{fill:#fff;stroke:#8191a8}.meta-cell{fill:#eef1f5;stroke:#8191a8}.node{fill:#e5ecf6;stroke:#0f2c59;stroke-width:2}.map{fill:none;stroke:#8090a6;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#map-arrow)}.edge{fill:none;stroke:#0f2c59;stroke-width:4;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="445" rx="20" fill="#f7f8fa"/>
  <text x="480" y="38" class="eyebrow" text-anchor="middle">ONE HPOA ROW → TWO NODES + ONE AUDITABLE RELATIONSHIP</text>
  <g>
    <rect class="cell disease-cell" x="40" y="62" width="176" height="104" rx="10"/><text x="58" y="88" class="eyebrow">질병 · NODE</text><text x="58" y="122" class="head">OMIM:222100</text>
    <rect class="cell feature-cell" x="216" y="62" width="176" height="104" rx="10"/><text x="234" y="88" class="eyebrow">표현형 특징 · NODE</text><text x="234" y="122" class="head">HP:0410050</text>
    <rect class="cell meta-cell" x="392" y="62" width="176" height="104" rx="10"/><text x="410" y="88" class="eyebrow">작성자 · REL PROPERTY</text><text x="410" y="116" class="small">Nicole</text><text x="410" y="139" class="small">Vasilevsky</text>
    <rect class="cell meta-cell" x="568" y="62" width="176" height="104" rx="10"/><text x="586" y="88" class="eyebrow">생성일 · REL PROPERTY</text><text x="586" y="122" class="head">2018-02-23</text>
    <rect class="cell meta-cell" x="744" y="62" width="176" height="104" rx="10"/><text x="762" y="88" class="eyebrow">출처 · REL PROPERTY</text><text x="762" y="122" class="head">PMID:9357814</text>
  </g>
  <path class="map" d="M480 176V233"/><text x="505" y="210" class="small">열 역할에 따라 배치</text>
  <rect x="348" y="233" width="264" height="78" rx="14" fill="#0f2c59"/>
  <text x="480" y="259" class="eyebrow" text-anchor="middle" style="fill:#c8d6e8">RELATIONSHIP PROPERTIES</text><text x="480" y="284" class="small" text-anchor="middle" style="fill:#fff">source · createdBy · creationDate</text><text x="480" y="302" class="small" text-anchor="middle" style="fill:#dce6f2">각 주석의 근거를 관계 단위로 보존</text>
  <rect class="node" x="58" y="282" width="220" height="108" rx="18"/><text x="168" y="320" class="eyebrow" text-anchor="middle">HpoDisease</text><text x="168" y="350" class="head" text-anchor="middle">OMIM:222100</text><text x="168" y="375" class="small" text-anchor="middle">질병 노드</text>
  <rect class="node" x="682" y="282" width="220" height="108" rx="18"/><text x="792" y="320" class="eyebrow" text-anchor="middle">HpoPhenotype</text><text x="792" y="350" class="head" text-anchor="middle">HP:0410050</text><text x="792" y="375" class="small" text-anchor="middle">표현형 노드</text>
  <path class="edge" d="M278 355H682"/><rect x="350" y="330" width="260" height="50" rx="11" fill="#fff" stroke="#0f2c59" stroke-width="2"/><text x="480" y="351" class="small" text-anchor="middle">HAS_PHENOTYPIC_FEATURE</text><text x="480" y="371" class="small" text-anchor="middle">관계 한 건 = 주석 한 건</text>
  <text x="480" y="423" class="small" text-anchor="middle">열의 값이 노드 식별자와 관계 속성으로 나뉘어도 한 행의 출처 단위는 유지한다</text>
</svg>
