<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 65 940 200" role="img" aria-labelledby="title desc">
  <title id="title">환자 관찰을 HPO 식별자로 바꾸어 생성된 지식 그래프에 질의하는 단계</title>
  <desc id="desc">전자 건강 기록의 관찰 표현형을 HPO 식별자로 정규화하고 생성된 지식 그래프에서 공유 표현형과 근거를 조회한 뒤 질병 후보와 출처를 임상의 검토 화면에 제공하며 결과는 진단 자체가 아니다.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 14" refX="17.5" refY="7" markerWidth="18" markerHeight="14" orient="auto"><path d="M.5.5 17.5 7 .5 13.5Z" fill="#63728a"/></marker><style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#172033}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;fill:#52647d}.head{font-size:17px;font-weight:800}.small{font-size:12.5px;fill:#56657a}.box{fill:#fff;stroke:#b6c2d1;stroke-width:2}.focus{fill:#0f2c59;stroke:#0f2c59}.line{fill:none;stroke:#63728a;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="960" height="350" rx="20" fill="#f7f8fa"/>
  <rect class="box" x="27" y="84" width="190" height="160" rx="16"/><text x="49" y="116" class="eyebrow">01 · OBSERVE</text><text x="49" y="147" class="head">환자 EHR</text><text x="49" y="178" class="small">제1형 당뇨병</text><text x="49" y="200" class="small">성장 지연 · 큰 무릎 …</text><text x="49" y="226" class="small">임상 관찰</text>
  <rect class="box" x="265" y="84" width="190" height="160" rx="16"/><text x="287" y="116" class="eyebrow">02 · NORMALIZE</text><text x="287" y="147" class="head">HPO·OMIM ID</text><text x="287" y="178" class="small">HP:0100651</text><text x="287" y="200" class="small">OMIM:222100</text><text x="287" y="226" class="small">문맥별 식별자</text>
  <rect class="focus" x="503" y="84" width="190" height="160" rx="16"/><text x="525" y="116" class="eyebrow" style="fill:#c8d6e8">03 · QUERY KG</text><text x="525" y="147" class="head" style="fill:#fff">연결과 근거 탐색</text><text x="525" y="178" class="small" style="fill:#dce6f2">공유 표현형 수</text><text x="525" y="200" class="small" style="fill:#dce6f2">source · evidence</text><text x="525" y="226" class="small" style="fill:#dce6f2">계층 경로</text>
  <rect class="box" x="741" y="84" width="190" height="160" rx="16"/><text x="763" y="116" class="eyebrow">04 · REVIEW</text><text x="763" y="147" class="head">후보 + 근거</text><text x="763" y="178" class="small">순위와 일치 특징</text><text x="763" y="200" class="small">논문·큐레이터</text><text x="763" y="226" class="small">임상의 검토</text>
  <path class="line" d="M217 164H265"/><path class="line" d="M455 164H503"/><path class="line" d="M693 164H741"/>
</svg>
