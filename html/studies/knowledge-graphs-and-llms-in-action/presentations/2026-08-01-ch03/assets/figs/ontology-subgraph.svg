  <rect class="domain" x="706" y="205" width="202" height="70" rx="14"/><text x="807" y="233" class="head" text-anchor="middle">당뇨병</text><text x="807" y="257" class="small" text-anchor="middle">HP:0000819</text>
  <rect class="domain" x="560" y="342" width="170" height="70" rx="14"/><text x="645" y="370" class="head" text-anchor="middle">제2형 당뇨병</text><text x="645" y="394" class="small" text-anchor="middle">하위 표현형</text>
  <rect class="domain" x="752" y="342" width="170" height="70" rx="14"/><text x="837" y="370" class="head" text-anchor="middle">당뇨병성 케톤산증</text><text x="837" y="394" class="small" text-anchor="middle">하위 표현형</text>
  <path class="domain-edge" d="M626 226H706"/><path class="domain-edge" d="M807 205V158"/><path class="domain-edge" d="M645 342V304C645 291 768 291 768 275"/><path class="domain-edge" d="M837 342V275"/>
