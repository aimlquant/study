<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 60 900 420" role="img" aria-labelledby="title desc">
  <title id="title">제1형 인슐린 의존성 당뇨병에 직접 연결된 표현형 특징</title>
  <desc id="desc">가운데 OMIM 222100 질병 노드에서 당뇨병, 다뇨증, 자가면역, 다음증, 혈청 1,5 안하이드로글루시톨 감소, 케톤산증, 고혈당, 다갈증 표현형 노드로 HAS PHENOTYPIC FEATURE 관계가 뻗는다.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 18 14" refX="17.5" refY="7" markerWidth="16" markerHeight="12" orient="auto"><path d="M.5.5 17.5 7 .5 13.5Z" fill="#63728a"/></marker><style>text{font-family:'Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',NanumGothic,Inter,system-ui,sans-serif;fill:#172033}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;fill:#52647d}.head{font-size:18px;font-weight:800}.small{font-size:12.5px;fill:#56657a}.feature{fill:#fff;stroke:#8191a8;stroke-width:2}.edge{fill:none;stroke:#63728a;stroke-width:2.6;marker-end:url(#arrow)}</style></defs>
