[[sessions]]
id = "2026-09-12-machine-trading-next-study-discussion"
study_id = "machine-learning-for-trading-3e-2026"
date = "2026-09-12"
title = "다음 교재·스터디 운영 논의"
presenters = ["참석자 전원"]
chapters = []
status = "video-public"
meeting_status = "ended"
youtube_video_id = "SgWvSZfn65Y"
summary = "이 논의는 9월 5일 오리엔테이션 회차에서 진행해 A안을 채택했습니다. 자료를 준비한 시점의 예정일이 9월 12일이어서 회차 주소는 그대로 두고, 9월 12일에는 Chapter 1 발표가 진행됩니다. Machine Learning for Trading 3판의 27개 장을 어떻게 공부할지 비교합니다. 전권을 읽는 A안 29회, 핵심 장을 고르는 B 수정안 22회, 공동 전략 실습을 하는 C안 16회의 장별 학습 범위와 회차 계획을 확인할 수 있습니다. 공식 코드·연구 사례·보충자료의 쓰임을 살펴보고, 공통 실습 수준과 첫 세 회차의 진행 방법을 함께 논의합니다. 세 계획은 토론용 제안이며 확정된 진도가 아닙니다."
discussion_points = [
  "전권 27장을 모두 공통 진도로 읽는 A안, 핵심 20장을 고르는 B안, 하나의 전략 흐름을 14개 장으로 잇는 C안 중 우선 경로와 예비 경로를 정합니다.",
  "각 회차의 중심 장, 다른 회차에서 함께 읽을 관련 절, 선택 읽기 장을 구분합니다. B 수정안은 Ch9·Ch20을 중심 장에 포함합니다.",
  "교재·해설·가이드 노트북을 함께 읽고, 공식 예제와 사례를 언제 추가할지 정합니다. 프라이머·스킬은 회차당 합계 0~1편을 권합니다.",
  "설명 L1, 부분 재현 L2, 확장 실험 L3 중 공통 실습 수준을 정합니다. 첫 세 회차를 배정하고, 3회 말에 준비 부담을 확인해 잠정 계획을 확정하거나 기존 계획을 조정합니다.",
]
